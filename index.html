  const [members, setMembers] = useState([]);
  const [att, setAtt] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [err, setErr] = useState("");
  /* 시작 화면 → 들어가기. 새로고침해도 유지되고, 앱을 닫으면 다시 대문부터 */
  const [entered, setEntered] = useState(()=>{
    try{ return sessionStorage.getItem("entered") === "1"; }catch(_){ return false; }
  });
  const enterApp = ()=>{
    try{ sessionStorage.setItem("entered", "1"); }catch(_){}
    setEntered(true);
  };
  const [view, setView] = useState("home");
  const [memView, setMemView] = useState({mode:"list"});
  const fileRef = useRef(null);
  const [leaders, setLeaders] = useState({});   /* {사용자ID: "여3"} 담당 속 */
  /* 교회학교 반: {부서키: {classes:[{id,name}], of:{교인ID:반ID}}} */
  const [schoolClasses, setSchoolClasses] = useState({});
  const [memberOrder, setMemberOrder] = useState([]);   /* 교인 배치 순서 (선임 먼저) */
  const [events, setEvents] = useState([]);   /* 교회 행사 [{id,date,endDate,title,place,note,kind}] */
  const [specials, setSpecials] = useState([]);  /* 특별예배 [{key,label,from,to}] */
  const [joinCode, setJoinCode] = useState("");
  const [cfgVer, setCfgVer] = useState(0);       /* 설정이 바뀌면 화면 다시 그리기 */
  const isAdmin = profile.role === "admin";
  const myEnts = scopesOf(leaders, profile.id);                 /* ["ELDER:r","여3:w"] 같은 목록 */
  const oldRole = profile.role;                                 /* 예전 자료를 읽을 때만 씁니다 */
  const isW = e => entIsW(e, oldRole);

  /* 사람 범위로 쓰는 담당만 (보기 표시는 뺀다) */
  const rangeEnts = myEnts.filter(e => VIEW_FLAGS.indexOf(entKey(e)) < 0);
  const listEnts  = rangeEnts.filter(e => entKey(e) !== ATT_ONLY);
  const wideEnts  = rangeEnts.filter(e => entKey(e) === PASTOR || entKey(e) === ELDER);

  /* 교역자 담당을 받은 사람 (새 글 알림 대상) */
  const isPastorNow = myEnts.some(e => entKey(e) === PASTOR);
  /* 심방 기록 전체 보기 / 긴밀 기도 보기 — 따로 정합니다 */
  const canSeeVisits = isAdmin || myEnts.some(e => entKey(e) === VISIT_ALL || entKey(e) === CARE_ALL);
  const canSeeSecret = isAdmin || myEnts.some(e => entKey(e) === SECRET_ALL || entKey(e) === CARE_ALL);
  /* 성도·교회학교 전체를 보는 사람 */
  const fullView = isAdmin || wideEnts.length > 0;
  /* 담당이 하나도 없는 사람 — 달력과 일반 중보기도만 */
  const noScope = !fullView && rangeEnts.length === 0;
  /* 명단 없이 출석만 맡은 분 */
  const attOnly = !isAdmin && !fullView && rangeEnts.length > 0 && listEnts.length === 0;
  /* 담당이 있어 범위가 좁은 사람 */
  const isLeader = !isAdmin && !fullView && rangeEnts.length > 0;

  /* 이 교인을 볼 수 있는가 / 고칠 수 있는가 */
  const canViewM = m => isAdmin || listEnts.some(e => inScope(m, entKey(e)));
  const canWriteM = m => isAdmin || listEnts.some(e => isW(e) && inScope(m, entKey(e)));
  /* 출석 체크는 '수정'으로 준 담당 안에서만 (출석 체크만 담당 포함) */
  const canCheckMember = m => isAdmin || rangeEnts.some(e => isW(e) && inScope(m, entKey(e)));

  /* 화면 전체에 쓰는 큰 스위치 — 교역자에게 수정으로 준 경우 전체 편집 */
  const canEdit = isAdmin || wideEnts.some(e => entKey(e) === PASTOR && isW(e));
  const canCheckAtt = isAdmin || rangeEnts.some(isW);
  const isSchoolTeacher = listEnts.some(e => { const k = entKey(e); return k === "S_ALL" || k.indexOf("S_") === 0; });

  /* 장기결석자는 관리자·교역자에게만 보입니다 */
  const canSeeAbsent = isAdmin || isPastorNow;
  const seeable = canSeeAbsent ? members : members.filter(m => !isLongAbsent(m));
  /* 재적 교인 — 교인 수·출석·생일에 쓰는 명단 (장기결석자 제외) */
  const activeMembers = members.filter(m => !isLongAbsent(m));

  /* 속장은 자기 담당만, 전체 담당이면 모두 */
  const myMembers = fullView ? seeable : seeable.filter(canViewM);
  const attMembers = fullView ? activeMembers
    : activeMembers.filter(m => rangeEnts.some(e => inScope(m, entKey(e))));

  /* 이 사람의 정보를 고칠 수 있는가 — 교사는 자기 담당 학생만 */
  const canEditMember = (m) => {
    if(canEdit) return true;
    return !!m && canWriteM(m);        /* '수정'으로 받은 담당 범위 안이면 고칠 수 있습니다 */
  };
  /* 속장·교사가 담당 범위 밖이라도 볼 수 있는 사람: 담당 교인과 가족으로 이어진 분 (한 다리까지) */
  const viewMembers = useMemo(()=>{
    if(!isLeader) return seeable;
    const mine = myMembers;
    const mineIds = new Set(mine.map(x=>x.id));
    const nm = s => (s||"").trim();
    const famNames = new Set();
    mine.forEach(x => (x.family||[]).forEach(f => { if(nm(f.name)) famNames.add(nm(f.name)); }));
    const myNames = new Set(mine.map(x=>nm(x.name)).filter(Boolean));
    const extra = seeable.filter(x =>
      !mineIds.has(x.id) && (
        famNames.has(nm(x.name)) ||                                   /* 담당 교인의 가족란에 있는 분 */
        (x.family||[]).some(f => myNames.has(nm(f.name)))             /* 그분의 가족란에 담당 교인이 있는 경우 */
      ));
    return [...mine, ...extra];
  }, [isLeader, members, myMembers]);

  const fail = e => setErr("저장/불러오기에 실패했습니다 — 원인: " + errMsg(e) + " · 이 문구를 Claude에게 보여주시면 해결할 수 있습니다.");

  const loadAll = useCallback(async ()=>{
    setErr(""); setCfgNotice(""); setHomePhotoReady(false);
    const ch = await sb.from("churches").select("name,join_code").eq("id", churchId).maybeSingle();
    if(ch.data){ setChurchName(ch.data.name || "우리교회"); setJoinCode(ch.data.join_code || ""); }
    const [m, a, s] = await Promise.all([
      sb.from("members").select("id,data").eq("church_id", churchId),
      sb.from("attendance").select("date,service,ids").eq("church_id", churchId),
      sb.from("settings").select("key,value").eq("church_id", churchId),
    ]);
    if(m.error) return fail(m.error);
    if(a.error) return fail(a.error);
    setMembers((m.data||[]).map(r=>r.data));
    const na = {};
    (a.data||[]).forEach(r=>{ na[r.date] = na[r.date]||{}; na[r.date][r.service] = r.ids||[]; });
    setAtt(na);
    if(s.error) fail(s.error);
    if(!s.error){
      try{
        setHomePhoto(parseChurchHomePhoto(s.data)); setHomePhotoReady(true);
      }catch(photoError){
        setErr("홈 사진을 불러오지 못했습니다. 다시 불러오기를 눌러 주세요. " + errMsg(photoError));
      }
      const cc = (s.data||[]).find(r=>r.key==="churchConfig");
      if(cc && cc.value){ try{ applyChurchConfig(JSON.parse(cc.value)); setCfgVer(v=>v+1); }catch(_){} }
      const sp = (s.data||[]).find(r=>r.key==="specialServices");
      if(sp && sp.value){ try{ setSpecials(JSON.parse(sp.value)||[]); }catch(_){ setSpecials([]); } }
      else setSpecials([]);
      const ev = (s.data||[]).find(r=>r.key==="events");
      if(ev && ev.value){ try{ setEvents(JSON.parse(ev.value)||[]); }catch(_){ setEvents([]); } }
      else setEvents([]);
      const mo = (s.data||[]).find(r=>r.key==="memberOrder");
      { let arr = []; if(mo && mo.value){ try{ const v = JSON.parse(mo.value); if(Array.isArray(v)) arr = v; }catch(_){} }
        setMemberRank(arr); setMemberOrder(arr); }
      const sc = (s.data||[]).find(r=>r.key==="schoolClasses");
      if(sc && sc.value){ try{ setSchoolClasses(JSON.parse(sc.value)||{}); }catch(_){ setSchoolClasses({}); } }
      const ld = (s.data||[]).find(r=>r.key==="leaders");
      if(ld && ld.value){ try{ setLeaders(JSON.parse(ld.value)||{}); }catch(_){ setLeaders({}); } }
      else setLeaders({});
    }
    setLoaded(true);
  }, [sb, churchId]);

  useEffect(()=>{ if(churchId) loadAll(); }, [loadAll, churchId]);

  /* ── 서버 쓰기 ── */
  const saveMemberRow = async (m0) => {
    const m = cleanText(m0);
    setMembers(ms => ms.some(x=>x.id===m.id) ? ms.map(x=>x.id===m.id?m:x) : [...ms, m]);
    const {error} = await sb.from("members")
      .upsert({church_id:churchId, id:m.id, data:m});
    if(error){ fail(error); loadAll(); }
  };
  const updateMember = (id, fn) => {
    const cur = members.find(x=>x.id===id); if(!cur) return;
    saveMemberRow(fn(cur));
  };
  /* 여러 명 고치기 — 서버의 bulk_save_members 가 관리자인지 다시 확인합니다 */
  const bulkSaveMembers = async (rows) => {
    const {data, error} = await sb.rpc("bulk_save_members", {c: churchId, rows});
    if(error){
      const msg = String(error.message || "");
      if(/function|does not exist|찾을 수 없/i.test(msg))
        alert("서버에 '단체수정' 기능이 아직 없습니다.\n교회이음에 문의해 주세요. (bulk_save_members)");
      else alert("바꾸지 못했습니다. " + errMsg(error));
      loadAll();
      throw error;
    }
    setMembers(ms => ms.map(x => { const n = rows.find(r=>r.id===x.id); return n ? n : x; }));
    return data;
  };

  const removeMember = async (id) => {
    setMembers(ms=>ms.filter(x=>x.id!==id));
    const {error} = await sb.from("members").delete().eq("church_id", churchId).eq("id", id);
    if(error){ fail(error); loadAll(); return; }
    // 출석 기록에서도 제거
    const updates = [];
    const na = {};
    for(const d in att){
      na[d] = {};
      for(const s in att[d]){
        const ids = att[d][s];
        if(ids.includes(id)){
          const nids = ids.filter(x=>x!==id);
          na[d][s] = nids;
          updates.push({church_id:churchId, date:d, service:s, ids:nids});
        }else na[d][s] = ids;
      }
    }
    setAtt(na);
    if(updates.length){
      const {error:e2} = await sb.from("attendance").upsert(updates);
      if(e2){ fail(e2); loadAll(); }
    }
  };
  /* 출석 — 서버에서 최신 명단을 읽어 누른 사람만 더하거나 뺍니다.
     예전처럼 명단 전체를 덮어쓰지 않으므로, 여러 속장이 동시에 체크해도 서로 지워지지 않습니다. */
  const markAtt = async (date, service, ids, on) => {
    const list = (Array.isArray(ids) ? ids : [ids]).filter(Boolean);
    if(!list.length) return;
    setAtt(a => {
      const cur = (a[date] && a[date][service]) || [];
      const next = on ? [...cur, ...list.filter(id => !cur.includes(id))] : cur.filter(id => !list.includes(id));
      return {...a, [date]: {...(a[date] || {}), [service]: next}};
    });
    const {data, error} = await sb.rpc("att_mark", {c: churchId, p_date: date, p_service: service, p_ids: list, p_on: !!on});
    if(error){
      const msg = String(error.message || "");
      if(/function|does not exist|찾을 수 없/i.test(msg)) return markAttFallback(date, service, list, on);
      fail(error); return refreshAtt();
    }
    if(Array.isArray(data)) setAtt(a => ({...a, [date]: {...(a[date] || {}), [service]: data}}));
  };

  /* 서버에 att_mark 기능이 아직 없을 때 — 최신 명단을 읽어 합친 뒤 저장합니다 */
  const markAttFallback = async (date, service, list, on) => {
    const {data, error} = await sb.from("attendance").select("ids")
      .eq("church_id", churchId).eq("date", date).eq("service", service).maybeSingle();
    if(error){ fail(error); return refreshAtt(); }
    const cur = (data && Array.isArray(data.ids)) ? data.ids : [];
    const next = on ? [...cur, ...list.filter(id => !cur.includes(id))] : cur.filter(id => !list.includes(id));
    const {error: e2} = await sb.from("attendance").upsert({church_id: churchId, date, service, ids: next});
    if(e2){ fail(e2); return refreshAtt(); }
    setAtt(a => ({...a, [date]: {...(a[date] || {}), [service]: next}}));
  };

  /* 출석 기록만 다시 불러오기 (다른 분이 체크한 것을 받아 옵니다) */
  const refreshAtt = async () => {
    const {data, error} = await sb.from("attendance").select("date,service,ids").eq("church_id", churchId);
    if(error || !Array.isArray(data)) return;
    const na = {};
    data.forEach(r => { if(!r) return; na[r.date] = {...(na[r.date] || {}), [r.service]: Array.isArray(r.ids) ? r.ids : []}; });
    setAtt(na);
  };

  const saveAtt = async (date, service, ids) => {
    setAtt(a=>({...a, [date]:{...(a[date]||{}), [service]:ids}}));
    const {error} = await sb.from("attendance")
      .upsert({church_id:churchId, date, service, ids});
    if(error){ fail(error); loadAll(); }
  };
  const renameChurch = async () => {
    const n = prompt("교회 이름을 입력하세요", churchName);
    if(!n || !n.trim()) return;
    setChurchName(n.trim());
    const {error} = await sb.from("churches").update({name:n.trim()}).eq("id", churchId);
    if(error) fail(error);
  };

  /* ── 백업 ── */
  const doExport = () => {
    const blob = new Blob([JSON.stringify({version:1, exportedAt:new Date().toISOString(), churchName, members, att}, null, 2)],
      {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `교인관리_백업_${todayStr()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  const [pendingImport, setPendingImport] = useState(null);
  const doImport = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.members)) throw new Error("형식 오류");
        setPendingImport(d);
      }catch(e){ alert("백업 파일을 읽지 못했습니다. 이 프로그램에서 내보낸 JSON 파일인지 확인해 주세요."); }
    };
    r.readAsText(file);
  };
  const runImport = async (mode) => {
    const d = pendingImport;
    setPendingImport(null);
    setErr("");
    let e;
    if(mode === "replace"){
      ({error:e} = await sb.from("members").delete().eq("church_id", churchId)); if(e) return fail(e);
      ({error:e} = await sb.from("attendance").delete().eq("church_id", churchId)); if(e) return fail(e);
    }
    const curById = {};
    if(mode === "merge") members.forEach(x=>{ curById[x.id] = x; });
    const rows = (d.members||[]).map(cleanText).map(im=>{
      const data = (mode === "merge" && im.id && curById[im.id]) ? mergeMember(curById[im.id], im) : im;
      return {church_id:churchId, id:im.id||uid(), data};
    });
    for(let i=0;i<rows.length;i+=100){
      ({error:e} = await sb.from("members").upsert(rows.slice(i,i+100))); if(e) return fail(e);
    }
    const attIn = d.att||{};
    const arows = [];
    for(const dt in attIn) for(const s in attIn[dt]){
      let ids = attIn[dt][s]||[];
      if(mode === "merge"){
        const cur = (att[dt] && att[dt][s]) || [];
        ids = Array.from(new Set([...cur, ...ids]));
      }
      if(ids.length) arows.push({church_id:churchId, date:dt, service:s, ids});
    }
    for(let i=0;i<arows.length;i+=100){
      ({error:e} = await sb.from("attendance").upsert(arows.slice(i,i+100))); if(e) return fail(e);
    }
    /* 파일에 교회 설정(예배·직분·속회 편성 등)이 함께 담겨 있으면 넣습니다 */
    let cfgDone = false;
    if(d.config && typeof d.config === "object" && profile.role === "admin"){
      const ok = confirm(
        "이 파일에는 교회 설정(예배 종류 · 직분 · 속회 편성)도 들어 있습니다.\n\n" +
        "지금 설정을 이 파일의 내용으로 바꿀까요?\n" +
        "[취소]를 누르면 명단만 넣고 설정은 그대로 둡니다.");
      if(ok){
        ({error:e} = await sb.from("settings").upsert({church_id:churchId, key:"churchConfig", value:JSON.stringify(d.config)}));
        if(e) return fail(e);
        cfgDone = true;
      }
    }
    await loadAll();
    alert((mode === "merge" ? "명단을 합쳐 넣었습니다." : "가져오기(전체 교체)가 완료되었습니다.")
      + (cfgDone ? "\n교회 설정도 함께 바꿨습니다." : ""));
  };

  const saveConfig = async (next, nextPhoto) => {
    if(!homePhotoReady) throw new Error("설정을 먼저 다시 불러온 뒤 저장해 주세요.");
    const savedPhoto = await persistChurchSettings(sb, churchId, profile.role, next, nextPhoto);
    applyChurchConfig(next); setHomePhoto(savedPhoto);
    setCfgNotice("설정을 저장했습니다. 교회 사진이 홈 화면에 반영되었습니다.");
    setCfgVer(v=>v+1);
  };

  const saveSpecials = async (next) => {
    setSpecials(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"specialServices", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveEvents = async (next) => {
    setEvents(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"events", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveClasses = async (next) => {
    setSchoolClasses(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"schoolClasses", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveOrder = async (groupIds) => {
    const next = placeOrder(members, groupIds);
    setMemberRank(next); setMemberOrder(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"memberOrder", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); throw error; }
  };
  const canOrder = canEdit && !isLeader;   /* 순서는 교회 전체에 쓰이므로 관리자·교역자(수정)만 바꿉니다 */

  const saveLeaders = async (next) => {
    setLeaders(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"leaders", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const byId = id => members.find(m => m.id === id);
  
  /* 뒤로 가기: 지나온 화면을 쌓아 두었다가 한 걸음씩 되돌아감 */
  const histRef = useRef([]);
  const [histLen, setHistLen] = useState(0);
  const nowScreen = useRef({view:"home", memView:{mode:"list"}});
  nowScreen.current = {view, memView};

  const pushHistory = (from) => {
    const cur = from || nowScreen.current;
    const last = histRef.current[histRef.current.length-1];
    /* 같은 화면이면 쌓지 않음 */
    if(last && last.view===cur.view &&
       (last.memView||{}).mode===(cur.memView||{}).mode &&
       (last.memView||{}).id===(cur.memView||{}).id) return;
    histRef.current = [...histRef.current.slice(-29), cur];
    setHistLen(histRef.current.length);
  };
  const goBack = () => {
    if(!histRef.current.length) return;
    const prev = histRef.current[histRef.current.length-1];
    histRef.current = histRef.current.slice(0, -1);
    setHistLen(histRef.current.length);
    setView(prev.view);
    setMemView(prev.memView || {mode:"list"});
    window.scrollTo(0,0);
  };

  const go = v => {
    const allowed = navItems.some(x => x[0] === v);
    if(!allowed) return;
    if(v !== view) pushHistory();
    setView(v); if(v==="members") setMemView({mode:"list"}); window.scrollTo(0,0);
  };
  const openMember = id => {
    if(attOnly) return;
    if(isLeader && !viewMembers.some(m=>m.id===id)) return;
    pushHistory();
    setView("members"); setMemView({mode:"detail", id}); window.scrollTo(0,0);
  };

  let navItems;
  if(noScope){
    navItems = [["home","홈"],["cal","달력"],["pray","중보기도"]];
  } else if(attOnly){
    navItems = [["home","홈"],["att","예배 출석 체크"]];
  } else if(fullView && !isAdmin){
    navItems = [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["pray","중보기도"]];
  } else if(isLeader){
    const keys = listEnts.map(entKey);
    navItems = [["home","홈"],
      ["members", keys.every(k=>k.indexOf("S_")===0) ? "우리 부서"
                : keys.some(k=>k.indexOf("S_")===0) ? "담당 교인" : "우리 속 교인"],
      ["att", canCheckAtt ? "출석 체크" : "출석"],["cal","달력"],["pray","중보기도"]];
  } else {
    navItems = [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["pray","중보기도"]];
  }
  if(canSeeVisits && !noScope){
    const at = navItems.findIndex(x=>x[0]==="pray");
    navItems.splice(at >= 0 ? at : navItems.length, 0, ["visit","심방"]);
  }
  if(isAdmin){ navItems.push(["team","사용자"]); navItems.push(["cfg","설정"]); }

  if(!entered) return <Gate churchName={churchName} onEnter={enterApp} isAdmin={isAdmin} isPastor={isPastorNow}/>;

  return (
    <div>
      {pendingImport && (
        <div className="modal-back" onClick={()=>setPendingImport(null)}>
          <div className="panel" onClick={e=>e.stopPropagation()}>
            <h2>명단 가져오기</h2>
            <p className="small">파일에 교인 <b>{pendingImport.members.length}명</b>의 기록이 있습니다. 어떻게 넣을까요?</p>
            <button className="btn" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("merge")}>
              추가하기 — 기존 기록은 그대로 두고 합침 (권장)</button>
            <button className="btn danger" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("replace")}>
              전체 교체 — 기존 교인·출석 기록을 지우고 이 파일로 바꿈</button>
            <button className="btn ghost" style={{width:"100%"}} onClick={()=>setPendingImport(null)}>취소</button>
            <p className="muted small" style={{marginTop:10,marginBottom:0}}>
              추가하기를 누르면 새 교인은 추가되고, 같은 교인(같은 고유번호)은 파일 내용으로 갱신됩니다. 모든 사용자에게 함께 적용됩니다.</p>
          </div>
        </div>
      )}
      <header className="top">
        <div className="top-in">
          <div className="brand">
            <button className="logo-btn" onClick={()=>{ setEntered(false); window.scrollTo(0,0); }}
              title="시작 화면으로">
              <Logo/>
            </button>
            <button onClick={isAdmin ? renameChurch : undefined} title={isAdmin?"교회 이름 수정":""}>{churchName} 교인 관리</button>
          </div>
          <button className={"back-btn"+(histLen>0?"":" off")} onClick={goBack}
            title="이전 화면으로" aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>‹ 뒤로</button>
          <nav>
            {navItems.map(([k,l])=>(
              <button key={k} className={view===k?"on":""} onClick={()=>go(k)}>{l}</button>
            ))}
          </nav>
          <div className="top-right">
            <button className="backup-btn refresh-btn" title="새로 불러오기"
              onClick={()=>window.location.reload()} aria-label="새로 불러오기">⟳</button>
            {canEdit && !isLeader && <button className="backup-btn" onClick={doExport}>백업</button>}
            {isAdmin && <button className="backup-btn" onClick={()=>fileRef.current.click()}>가져오기</button>}
            {leaveChurch && <button className="backup-btn" onClick={leaveChurch} title="다른 교회로">
              교회<span className="me-name"> 바꾸기</span></button>}
            <button className="backup-btn" onClick={logout}>
              <span className="me-name">{profile.name || "나"} · </span>로그아웃</button>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
              onChange={e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=""; }}/>
          </div>
        </div>
      </header>

      {/* 휴대폰에서는 메뉴를 아래쪽 탭바로 */}
      <nav className="tabbar" aria-label="화면 이동">
        <button className={"tab"+(histLen>0?"":" off")} onClick={goBack}
          aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>
          <span className="tab-ico">‹</span><span className="tab-lab">뒤로</span></button>
        {navItems.map(([k,l])=>(
          <button key={k} className={"tab"+(view===k?" on":"")} onClick={()=>go(k)}>
            <span className="tab-ico">{TAB_ICON[k] || "•"}</span>
            <span className="tab-lab">{TAB_SHORT[l] || l}</span>
          </button>))}
      </nav>

      {profile.guestOwner && <div className="owner-bar">
        교회이음 운영자로 <b>{churchName}</b> 를 살펴보고 있습니다.
        이 교회의 구성원 목록에는 나타나지 않습니다.
        <button className="btn sm ghost" onClick={leaveChurch}>나가기</button>
      </div>}

      <div className="wrap">
        {err && <div className="err-banner">{err} <button className="btn sm ghost" onClick={loadAll}>다시 불러오기</button></div>}
        {!loaded ? <div className="panel empty">기록을 불러오는 중…</div> : <React.Fragment>
        {isLeader && <div className="panel" style={{padding:"12px 16px",marginBottom:12}}>
          <b>{myEnts.map(e => scopeLabel(entKey(e)) + (isW(e) ? " (수정)" : " (열람)")).join(" · ")}</b> 담당으로 접속 중입니다.
          <span className="muted small">
            {attOnly
              ? ` · 성도 ${attMembers.length}명의 예배 출석만 체크하실 수 있습니다. 교인 신상은 보이지 않습니다.`
              : myEnts.some(e => entKey(e) === ATT_ONLY)
              ? ` · 예배 출석은 ${attMembers.length}명 전체를 체크하시고, 교인 명단은 담당 ${myMembers.length}명만 보입니다.`
              : ` · ${myMembers.length}명의 신상을 보고 출석을 체크하실 수 있습니다.`}
            {isSchoolTeacher && " 담당 부서 학생의 정보는 직접 수정하실 수 있습니다."}</span>
        </div>}
        {view==="home" && <Home churchName={churchName} homePhoto={homePhoto} members={attOnly ? [] : myMembers.filter(m => !isLongAbsent(m))} att={att} go={go} openMember={openMember}
          showNew={isAdmin || isPastorNow} canSeeVisits={canSeeVisits} canSeeSecret={canSeeSecret} meId={profile.id}
          listOK={!noScope && !attOnly} attOK={!noScope} canAddMember={canEdit}/>}
        {view==="members" && attOnly &&
          <p className="empty">예배 출석 체크만 맡으셨습니다. 교인 명부는 볼 수 없습니다.</p>}
        {view==="members" && !attOnly && (
          memView.mode==="list" ? <MemberList members={myMembers}
            setMemView={v=>{ pushHistory({view:"members", memView:{mode:"list"}}); setMemView(v); }} canEdit={canEdit}
            schoolClasses={schoolClasses} saveClasses={saveClasses}
            canOrder={canOrder} saveOrder={saveOrder} orderVer={memberOrder.length}
            canFix={canEdit || listEnts.some(isW)}
            canBulk={isAdmin} bulkSave={bulkSaveMembers}
            canEditClass={(deptKey)=> canEdit ||
              listEnts.some(e => isW(e) && (entKey(e)==="S_ALL" || entKey(e)==="S_"+deptKey))}/> :
          memView.mode==="form" && memView.id && !canEditMember(byId(memView.id))
            ? <div className="panel empty">이 교인의 정보는 수정할 수 없습니다.
                <div style={{marginTop:10}}><button className="btn sm" onClick={()=>setMemView({mode:"detail", id:memView.id})}>돌아가기</button></div>
              </div> :
          memView.mode==="form" && !memView.id && !canEdit
            ? <div className="panel empty">새 교인 등록은 관리자와 수정 권한이 있는 분만 할 수 있습니다.
                <div style={{marginTop:10}}><button className="btn sm" onClick={()=>setMemView({mode:"list"})}>돌아가기</button></div>
              </div> :
          memView.mode==="form" ? <MemberForm init={memView.id ? byId(memView.id) : null} canAbsent={canEdit}
              onCancel={()=>setMemView(memView.id ? {mode:"detail", id:memView.id} : {mode:"list"})}
              onSave={(m)=>{ saveMemberRow(m); setMemView({mode:"detail", id:m.id}); }}/> :
          <MemberDetail m={viewMembers.find(x=>x.id===memView.id)} att={att} specials={specials}
            setMemView={v=>{ pushHistory({view:"members", memView}); setMemView(v); }}
            canEdit={canEdit || canEditMember(viewMembers.find(x=>x.id===memView.id))}
            canDelete={canEdit}
            allMembers={viewMembers} openMember={openMember}
            limited={!canSeeVisits} seeSecret={canSeeSecret} canAtt={canCheckAtt}
            canPray={!attOnly && (canEdit || canWriteM(memView && byId(memView.id)))}
            meName={profile.name || profile.email} meId={profile.id}
            outside={isLeader && !myMembers.some(x=>x.id===memView.id)}
            update={fn=>updateMember(memView.id, fn)}
            remove={()=>{
              const m = byId(memView.id);
              if(confirm(`'${m.name}' 님의 모든 기록(가족·심방·기도 포함)을 삭제할까요?\n모든 사용자에게 함께 적용되며, 되돌릴 수 없습니다.`)){
                removeMember(memView.id);
                setMemView({mode:"list"});
              }
            }}
            printChurch={churchName}/>
        )}
        {view==="att" && <Attendance members={attMembers} att={att} saveAtt={saveAtt} markAtt={markAtt} refreshAtt={refreshAtt}
          canEdit={canCheckAtt}
          canCheckMember={canCheckMember}
          schoolClasses={schoolClasses} specials={specials} saveSpecials={saveSpecials} isAdmin={isAdmin || canEdit}
          canOrder={canOrder} saveOrder={saveOrder} orderVer={memberOrder}/>}
        {view==="visit" && (!canSeeVisits
          ? <p className="empty">심방 기록은 목회자와 관리자만 볼 수 있습니다.</p>
          : <Visits members={seeable} update={updateMember} openMember={openMember} canEdit={canEdit}
              meName={profile.name || profile.email} meId={profile.id}/>)}
        {view==="cal" && <Calendar members={(noScope || attOnly) ? [] : myMembers.filter(m => !isLongAbsent(m))} events={events} saveEvents={saveEvents}
          canEdit={canEdit} openMember={openMember}
          openable={!noScope && !attOnly}/>}
        {view==="pray" &&
          <Prayers members={seeable} update={updateMember} openMember={openMember}
            canEdit={canEdit && !noScope} seeSecret={canSeeSecret}
            openable={!noScope && !attOnly}
            meName={profile.name || profile.email} meId={profile.id}/>}
        {view==="team" && isAdmin && <Team sb={sb} me={profile} leaders={leaders} saveLeaders={saveLeaders}
          churchId={churchId} joinCode={joinCode}/>}
        {view==="cfg" && isAdmin && <ChurchConfig key={cfgVer} saveConfig={saveConfig} churchName={churchName}
          homePhoto={homePhoto} homePhotoReady={homePhotoReady} initialMessage={cfgNotice}
          members={members} bulkSave={bulkSaveMembers}/>}
        </React.Fragment>}
      </div>

/* 담당 목록을 보고 '실제로 할 수 있는 일'을 한 줄로 풀어 줍니다 */
function abilityOf(role, ents){
  if(role === "admin") return {can:"모든 기능", cant:""};
  if(role === "pending") return {can:"", cant:"승인을 기다리는 중입니다"};
  const es = ents || [];
  const key = e => entKey(e);
  const w   = e => entIsW(e, role);
  const wide = es.filter(e => key(e) === PASTOR || key(e) === ELDER);
  const seeV = es.some(e => key(e) === VISIT_ALL || key(e) === CARE_ALL);
  const seeS = es.some(e => key(e) === SECRET_ALL || key(e) === CARE_ALL);
  const range = es.filter(e => VIEW_FLAGS.indexOf(key(e)) < 0);
  const list  = range.filter(e => key(e) !== ATT_ONLY && key(e) !== PASTOR && key(e) !== ELDER);
  const can = [], cant = [];

  if(!range.length){ 
    return {can:"달력·일반 중보기도 보기", cant:"교인 명부 못 봄"};
  }
  if(wide.length) can.push("성도·교회학교 전체 보기");
  if(list.length) can.push(list.map(e => scopeLabel(key(e))).join(", ") + " 보기");
  if(!wide.length && !list.length) can.push("출석 명단만 보기");

  const wr = range.filter(w);
  if(wr.some(e => key(e) === PASTOR)) can.push("교인 신상 수정(전체) · 출석 체크(전체)");
  else {
    const wl = wr.filter(e => key(e) !== ATT_ONLY);
    if(wl.length){
      const nm = wl.map(e => key(e) === ELDER ? "전체" : scopeLabel(key(e))).join(", ");
      can.push("교인 신상 수정(" + nm + ") · 출석 체크(" + nm + ")");
    }
    if(wr.some(e => key(e) === ATT_ONLY)) can.push("출석 체크(성도 전체)");
    if(!wr.length) cant.push("수정 안 됨 · 출석 체크 안 됨 (모두 열람으로 주셨습니다)");
  }
  if(seeV) can.push("심방 기록 전체 보기");
  if(seeS) can.push("긴밀 기도 보기");
  if(!seeV && (list.length || wide.length)) cant.push("남이 쓴 심방 기록 못 봄");
  return {can: can.join(" · "), cant: cant.join(" · ")};
}

function Team({sb, me, leaders, saveLeaders, churchId, joinCode}){
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");

  const load = useCallback(async ()=>{
    const {data, error} = await sb.from("church_users")
      .select("user_id,role,name,email,created_at").eq("church_id", churchId).order("created_at");
    if(!error) data.forEach(r=>{ r.id = r.user_id; });
    if(error) setErr(errMsg(error)); else { setRows(data||[]); setErr(""); }
  }, [sb, churchId]);
  useEffect(()=>{ load(); }, [load]);

  const setRole = async (id, role) => {
    const {error} = await sb.from("church_users").update({role})
      .eq("church_id", churchId).eq("user_id", id);
    if(error) setErr(errMsg(error)); else load();
  };
  const removeUser = async (r) => {
    if(!confirm(`${r.name || r.email} 님을 목록에서 지울까요?\n\n이 프로그램의 권한만 사라집니다. 그 사람이 다시 들어오면 승인 대기로 다시 올라옵니다.`)) return;
    const {error} = await sb.from("church_users").delete()
      .eq("church_id", churchId).eq("user_id", r.id);
    if(error) setErr(errMsg(error)); else load();
  };

  const pending = (rows||[]).filter(r=>r.role==="pending");
  const active = (rows||[]).filter(r=>r.role!=="pending");

  return (
    <div>
      <div className="panel">
        {joinCode && <div className="join-code">
          <div>
            <span className="muted small">우리 교회 가입 코드</span>
            <b>{joinCode}</b>
          </div>
          <span className="muted small" style={{flex:"1 1 220px"}}>
            교역자·속장님께 이 코드를 알려 주세요. 주소로 들어와 <b>가입 코드로 신청</b>에 넣으면 아래 승인 대기에 올라옵니다.</span>
          <button className="btn sm ghost" onClick={()=>{
            try{ navigator.clipboard.writeText(joinCode); alert("가입 코드를 복사했습니다."); }
            catch(_){ alert("가입 코드: " + joinCode); }
          }}>복사</button>
        </div>}
        <h2>승인 대기 <span className="muted small">{pending.length}명</span></h2>
        <p className="small muted"><b>우리 교회 가입 코드</b>를 넣고 신청한 분만 여기 올라옵니다.

                  <button className="btn sm danger" onClick={()=>removeUser(r)}>거절</button>

      </div>

      <div className="panel">
        <h2>사용 중인 구성원 <span className="muted small">{active.length}명</span></h2>
        <p className="small muted"><b>담당</b>을 하나씩 주고, 담당마다 <b>열람</b>인지 <b>수정</b>인지 정합니다.
          수정으로 주면 그 범위 교인의 신상을 고치고 출석도 체크할 수 있습니다.
          여러 담당을 함께 줄 수 있고, 겹치면 넓은 쪽을 따릅니다.<br/>

          · <b>교역자 / 장로</b> — 성도와 교회학교 전체가 범위입니다<br/>
          · <b>여선교회 전체 / 남선교회 전체</b> — 총여선교회장·총남선교회장께 드립니다<br/>
          · <b>속 하나 / 교회학교 부서</b> — 그 범위만 봅니다<br/>
          · <b>예배 출석 체크만</b> — 수정으로 주면 출석만 체크하고 교인 신상은 못 봅니다<br/>

            켜지 않아도 자기가 심방한 기록은 남기고 볼 수 있습니다<br/>
          · <b>긴밀 기도 보기</b> — 긴밀로 표시된 기도 제목을 볼 수 있습니다<br/>
          담당을 하나도 안 주면 <b>달력과 일반 중보기도</b>만 보게 됩니다.
          심방 보기와 긴밀 기도 보기는 따로 정할 수 있습니다.</p>
        {rows!==null &&
          <div className="tbl-wrap"><table>
            <thead><tr><th>이름</th><th>이메일</th><th>담당과 권한</th><th></th></tr></thead>

                        const setMode = (on)=>{
                          const cur = scopesOf(leaders, r.id);
                          saveLeaders({...(leaders||{}), [r.id]: cur.map(x => entKey(x)===k ? withMode(x, on) : x)});

                        return (
                        <span key={k} className="scope-row">
                          <span className="chip editor">{scopeLabel(k)}</span>
                          <span className="rw">

                              const next = {...(leaders||{})};

                      </select>

/* ───────── 대문 ───────── */
/* 마지막으로 확인한 시각 (이 기기에 기억해 둡니다) */
const SEEN_KEY = "churchSeenAt";
const readSeen = () => { try{ return localStorage.getItem(SEEN_KEY) || ""; }catch(_){ return ""; } };
const writeSeen = v => { try{ localStorage.setItem(SEEN_KEY, v); }catch(_){} };

/* 지난번 확인 뒤로 새로 올라온 중보기도·심방 */
function collectNew(members, since, seeSecret, seeVisits){
  const out = [];
  (members||[]).filter(Boolean).forEach(m => {
    (m.prayers||[]).forEach(p => {
      if(!seeSecret && p.secret) return;
      const when = p.date || "";
      if(when && when > since) out.push({kind:"기도", id:p.id, memId:m.id, memName:m.name,
        when, by:p.by || "", text:p.request || "", secret:!!p.secret});
    });
    if(seeVisits === false) return;   /* 남이 쓴 심방을 볼 수 없는 분에게는 심방을 알리지 않습니다 */
    (m.visits||[]).forEach(v => {
      const when = (v.when || "").slice(0,10);
      if(when && when > since) out.push({kind:"심방", id:v.id, memId:m.id, memName:m.name,
        when, by:v.by || "", text:(v.purpose ? v.purpose + " — " : "") + (v.note || "")});
    });
  });
  return out.sort((a,b)=> b.when.localeCompare(a.when));
}

function NewFeed({members, seeSecret, seeVisits, openMember}){
  const [since, setSince] = useState(readSeen);
  const [open, setOpen] = useState(false);
  const items = useMemo(()=> collectNew(members, since, seeSecret, seeVisits), [members, since, seeSecret, seeVisits]);
  if(!since){
    /* 처음 쓰는 기기 — 오늘까지는 본 것으로 두고 내일부터 모읍니다 */
    const today = new Date().toISOString().slice(0,10);
    writeSeen(today);
    return null;
  }
  if(!items.length) return null;
  const mark = () => {
    const today = new Date().toISOString().slice(0,10);
    writeSeen(today); setSince(today); setOpen(false);
  };
  const pray = items.filter(x=>x.kind==="기도").length;
  const visit = items.filter(x=>x.kind==="심방").length;
  return (
    <div className="newfeed">
      <div className="nf-head" onClick={()=>setOpen(o=>!o)}>
        <span className="nf-dot">{items.length}</span>
        <b>새로 올라온 것</b>
        <span className="muted small">
          {pray ? `중보기도 ${pray}건` : ""}{pray && visit ? " · " : ""}{visit ? `심방 ${visit}건` : ""}
        </span>
        <span className="nf-arrow">{open ? "▲" : "▼"}</span>
      </div>
      {open && <div className="nf-body">
        {items.slice(0,30).map(x=>(
          <button key={x.kind+x.id} className="nf-item" onClick={()=>openMember(x.memId)}>
            <span className={"nf-tag " + (x.kind==="기도" ? "t-pray" : "t-visit")}>{x.kind}</span>
            <span className="nf-name">{x.memName}</span>
            <span className="nf-text">{x.text.length > 46 ? x.text.slice(0,46) + "…" : x.text}</span>
            <span className="nf-when muted small">{x.when.slice(5)}{x.by ? " · " + x.by : ""}</span>
          </button>))}
        {items.length > 30 && <p className="muted small" style={{margin:"6px 2px 0"}}>… 그 밖에 {items.length-30}건</p>}
        <button className="btn sm" style={{marginTop:8}} onClick={mark}>모두 확인했습니다</button>
      </div>}
    </div>
  );
}

function Home({churchName, homePhoto, members, att, go, openMember,
               showNew, canSeeVisits, canSeeSecret, meId, listOK = true, attOK = true, canAddMember = false}){
  const thisMonth = new Date().getMonth()+1;
  /* 자료가 조금 어긋나 있어도 화면이 멈추지 않게 합니다 */
  const list0 = (members || []).filter(Boolean);
  const bd = m => { const b = m && m.birth; return typeof b === "string" ? b : (b ? String(b) : ""); };
  const birthdays = list0
    .filter(m => { const b = bd(m); return b.length >= 7 && Number(b.split("-")[1]) === thisMonth; })
    .sort((a,b)=> bd(a).slice(5).localeCompare(bd(b).slice(5)));

  const lastSunday = useMemo(()=>{
    const dates = Object.keys(att || {}).filter(d => ((att[d] && att[d].sun) || []).length).sort();
    return dates.length ? dates[dates.length-1] : null;
  }, [att]);
  const sunCount = lastSunday ? ((att[lastSunday] && att[lastSunday].sun) || []).length : 0;

  /* 볼 수 있는 것만 셉니다 */
  const openPray = list0.reduce((n,m)=> n + (m.prayers||[])
    .filter(p=>p.status==="open" && (canSeeSecret || !p.secret)).length, 0);
  const monthPrefix = `${new Date().getFullYear()}-${pad(thisMonth)}`;
  const visitsThisMonth = list0.reduce((n,m)=> n + (m.visits||[])
    .filter(v=>(v.when||"").startsWith(monthPrefix) && (canSeeVisits || v.byId === meId)).length, 0);

  return (
    <div>
      <ChurchHomeBanner churchName={churchName} photo={homePhoto}/>

      {showNew && <NewFeed members={list0} seeSecret={canSeeSecret} seeVisits={canSeeVisits} openMember={openMember}/>}

      {(listOK || attOK) && <div className="grid-stats">
        {listOK && <button className="stat" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("members")}>
          <div className="n">{list0.length}</div><div className="l">등록 교인</div>
        </button>}
        {attOK && <button className="stat" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("att")}>
          <div className="n">{sunCount}</div>
          <div className="l">{lastSunday ? `주일 출석 (${lastSunday.slice(5).replace("-","/")})` : "주일 출석 기록 없음"}</div>
        </button>}
        {listOK && <button className="stat clay" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("pray")}>
          <div className="n">{openPray}</div><div className="l">응답을 기다리는 기도</div>
        </button>}
        {listOK && canSeeVisits &&
          <button className="stat gold" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("visit")}>
            <div className="n">{visitsThisMonth}</div><div className="l">이번 달 심방</div>
          </button>}
      </div>}

      {listOK && <div className="panel bday-panel">
        <h2>이번 달 생일 <span className="muted small">({thisMonth}월)</span></h2>
        {birthdays.length===0 ? <p className="empty">이번 달에 생일인 교인이 없습니다.</p> :
          <div className="tbl-wrap"><table className="bday-tbl">
            <thead><tr><th>날짜</th><th>이름</th><th>직분</th><th>연락처</th></tr></thead>
            <tbody>{birthdays.map(m=>(
              <tr key={m.id}>
                {/* 날짜는 9.14 처럼 짧게 — 휴대폰에서 한 줄에 들어가도록 */}
                <td className="bd-date">{(() => { const p = bd(m).split("-"); const mo = Number(p[1]) || "", dy = Number(p[2]) || ""; return dy ? mo + "." + dy : mo + "월"; })()}</td>
                <td><button className="btn sm ghost" onClick={()=>openMember(m.id)}>{m.name}</button></td>
                <td>{m.position}</td><td>{m.phone}</td>
              </tr>))}
            </tbody></table></div>}
      </div>}

      {listOK && canAddMember && list0.length===0 &&
        <div className="notice">아직 등록된 교인이 없습니다. 상단의 <b>교인</b> 메뉴에서 첫 교인을 등록해 보세요.</div>}
    </div>
  );
}

/* ───────── 교인 목록 ───────── */
function MemberCard({m, onClick, lead, leadLabel}){
  /* 이름이 길어도 카드 크기가 그대로이도록, 한 줄에 들어갈 때까지 글자와 자간을 줄입니다 */
  const nameLen = String(m && m.name || "").replace(/\s/g, "").length;
  const nmStyle = nameLen >= 6 ? {fontSize:"12.8px", letterSpacing:"-0.6px"}
                : nameLen === 5 ? {fontSize:"13.6px", letterSpacing:"-0.5px"}
                : nameLen === 4 ? {fontSize:"14.3px", letterSpacing:"-0.3px"} : undefined;
  const nmRef = useRef(null);
  useEffect(() => {
    const el = nmRef.current;
    if(!el || nameLen < 4) return;                  /* 세 글자까지는 손대지 않습니다 */
    let size = parseFloat(getComputedStyle(el).fontSize) || 15.5;
    let guard = 0;
    const narrow = typeof window !== "undefined" && window.innerWidth <= 560;
    const minSize = nameLen >= 6 ? 10.5 : (narrow ? 11 : 12.2);   /* 좁은 화면·긴 이름은 조금 더 줄입니다 */
    while(el.scrollWidth > el.clientWidth + 0.5 && size > minSize && guard++ < 10){
      size -= 0.5;
      el.style.fontSize = size.toFixed(1) + "px";
      el.style.letterSpacing = (size < 13 ? "-0.7px" : "-0.4px");
    }
  }, [m && m.name, m && m.position]);
  return (
    <button className={"mem-card" + (lead ? " lead" : "")} onClick={onClick} title={lead && leadLabel ? leadLabel : undefined}>
      <div className="mc-top">
        {m.photo
          ? <img className="mem-avatar" src={m.photo} alt=""/>
          : <span className="mem-avatar ph">{(m.name||"?").slice(0,1)}</span>}
        <div style={{flex:"1 1 auto", minWidth:0}}>
          <div className="mc-name-row">
            <span className="nm" ref={nmRef} style={nmStyle}>{m.name}</span>
            <span className="chip pos">{m.position||"성도"}</span>
          </div>
          {/* 명부 첫 화면에는 이름과 직분만 — 나이·연락처·봉사는 이름을 눌러 기록에서 봅니다 */}
        </div>
      </div>
    </button>
  );
}

/* ── 교회학교 한 부서: 반 나누기 · 반 이름 고치기 · 아이 옮기기 ── */
function SchoolDept({g, canEdit, setMemView, data, saveDept, canOrder, saveOrder}){
  const [ordering, setOrdering] = useState(null);   /* 순서를 바꾸는 중인 반 */
  /* 자료가 조금 어긋나 있어도 멈추지 않게 — 목록이 비었거나 빈 칸이 섞인 경우 */
  g = {...(g || {}), items: ((g && Array.isArray(g.items)) ? g.items : []).filter(m => m && m.id != null)};
  const preset = DEFAULT_CLASSES[g.key] || [];
  const classes = (data && data.classes) ? data.classes
                : preset.map((n,i)=>({id:"c"+g.key+i, name:n}));
  const of = (data && data.of) || {};
  const [editing, setEditing] = useState(false);
  const save = (classes2, of2) => saveDept({classes:classes2, of: of2 || of});

  const bucket = {};
  classes.forEach(c => bucket[c.id] = []);
  const rest = [];
  (g.items || []).filter(m => m && m.id != null).forEach(m => {
    const cid = of[m.id];
    if(cid && bucket[cid]) bucket[cid].push(m); else rest.push(m);
  });
  const Row = ({rowKey, name, items, none}) => {
    const mayOrder = canOrder && saveOrder && items.length > 1;
    const isOrdering = ordering === rowKey;
    return (
    <div style={{marginBottom:14}}>
      <div className={"cls-head"+(none?" none":"")}>
        <span className="nm">{name}</span>
        <span className="ct">{items.length}명</span>
        {mayOrder && <button type="button" className="btn sm ghost ord-btn" style={{marginLeft:"auto",padding:"2px 10px"}} title="순서" aria-label="순서"
          onClick={()=>setOrdering(isOrdering ? null : rowKey)}>{isOrdering ? "순서 닫기" : <React.Fragment><span className="ord-ico" aria-hidden="true">⇅</span><span className="ord-t">순서</span></React.Fragment>}</button>}
      </div>
      {items.length===0
        ? <p className="muted small" style={{margin:"6px 0 0"}}>아직 배정된 학생이 없습니다.</p>
        : isOrdering
        ? <OrderEditor items={items} onSave={saveOrder} onClose={()=>setOrdering(null)} leadLabel={none ? null : "리더 자리"}/>
        : <div className="mem-list" style={{marginTop:8}}>
            {items.map((m, idx)=>(
              <div key={m.id}>
                <MemberCard m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}
                  lead={idx===0 && !none} leadLabel={canOrder && saveOrder ? "리더 자리" : null}/>
                {canEdit && classes.length>0 &&
                  <div className="row" style={{margin:"4px 0 10px"}}>
                    <span className="muted small">반</span>
                    <select value={of[m.id]||""} onChange={e=>{
                      const of2 = {...of};
                      if(e.target.value) of2[m.id]=e.target.value; else delete of2[m.id];
                      save(classes, of2);
                    }}>
                      <option value="">미배정</option>
                      {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>}
              </div>))}
          </div>}
    </div>
    );
  };

  return (
    <div style={{marginBottom:22}}>
      <DeptHead sKey={"S_"+g.key} name={g.label} count={g.items.length+"명"}
        right={canEdit && <button onClick={()=>setEditing(!editing)}>{editing ? "닫기" : "반 편집"}</button>}/>

      {editing && canEdit &&
        <div className="panel" style={{padding:"12px 16px", marginBottom:12}}>
          <p className="small muted" style={{marginTop:0}}>반 이름을 고치거나, 반을 더하고 뺄 수 있습니다.
            반을 지우면 그 반 학생들은 <b>미배정</b>으로 돌아갑니다.</p>
          {classes.map((c,i)=>(
            <div className="row" key={c.id} style={{marginBottom:6}}>
              <input value={c.name} onChange={e=>{
                const cs=[...classes]; cs[i]={...c, name:e.target.value}; save(cs);
              }} style={{flex:"1 1 160px"}}/>
              <button className="btn sm ghost" onClick={()=>{
                const of2={...of};
                Object.keys(of2).forEach(k=>{ if(of2[k]===c.id) delete of2[k]; });
                save(classes.filter(x=>x.id!==c.id), of2);
              }}>지우기</button>
            </div>))}
          <button className="btn sm" onClick={()=>save([...classes, {id:uid2(), name:"새 반"}])}>+ 반 추가</button>
        </div>}

      {g.items.length===0
        ? <p className="muted small" style={{margin:"0 0 8px"}}>해당 교인이 없습니다.</p>
        : classes.length===0
          ? <Row rowKey="all" name="전체" items={(g.items || []).filter(m => m && m.id != null)}/>
          : <React.Fragment>
              {classes.map(c=> <Row key={c.id} rowKey={c.id} name={c.name} items={bucket[c.id]}/>)}
              {rest.length>0 && <Row rowKey="none" name="미배정" items={rest} none/>}
            </React.Fragment>}
    </div>
  );
}

function MemberList({members: members0, setMemView, canEdit, schoolClasses, saveClasses, canEditClass, canOrder, saveOrder, canFix = false, canBulk = false, bulkSave}){
  const [bulk, setBulk] = useState(false);          /* 여러 명 고치기 중인가 */
  const [sel, setSel] = useState([]);               /* 고른 교인 id */
  const [bulkVal, setBulkVal] = useState("");       /* 새 직분 또는 새 속 */
  const [busy, setBusy] = useState(false);
  /* 자료가 조금 어긋나 있어도 화면이 멈추지 않게 합니다 — 빈 칸·숫자로 들어간 생년월일·이름 없는 교인 */
  const str = v => v == null ? "" : String(v);
  const members = useMemo(() => (Array.isArray(members0) ? members0 : [])
    .filter(m => m && typeof m === "object")
    .map(m => ["name","birth","position","phone","address"].every(k => m[k] == null || typeof m[k] === "string")
      && typeof m.name === "string" ? m
      : {...m, name:str(m.name), birth:str(m.birth), position:str(m.position), phone:str(m.phone), address:str(m.address)}), [members0]);
  const [ordering, setOrdering] = useState(null);   /* 순서를 바꾸는 중인 묶음 */
  const [book, setBook] = useState("all"); // all=교인 명부 | sok=속별 명부
  const [q, setQ] = useState("");
  const [pos, setPos] = useState("전체");
  const [mode, setMode] = useState("pos"); // pos=직분별 | name=가나다순
  const positions = ["전체", ...Array.from(new Set(members.map(m=>m.position).filter(Boolean)))
    .sort((a,b)=>{
      const ia = POSITIONS.indexOf(a), ib = POSITIONS.indexOf(b);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1; if(ib!==-1) return 1;
      return a.localeCompare(b,"ko");
    })];
  const list = members
    .filter(m => book!=="all" || mode==="order" || pos==="전체" || m.position===pos)
    .filter(m => (book==="all" && mode==="order") || !q || (m.name+m.phone+m.address).includes(q))
    .sort((book==="all" && mode==="name") ? koSort : orderSort);   /* 가나다순 보기만 가나다, 나머지는 교회가 정한 순서 */
  /* 여러 명 고치기 — 지금 화면이 무엇을 바꿀지 정합니다 */
  const bulkField = book==="sok" ? "sok" : "position";
  const bulkOpts  = bulkField==="position"
    ? POSITIONS.map(p=>({v:p, l:p}))
    : [...sokKeys().map(k=>({v:k, l:sokKeyLabel(k)})), {v:"__LONG", l:"장기결석자 (재적 제외)"}];
  const bulkLabel = (bulkOpts.find(o=>o.v===bulkVal)||{}).l || "";
  const shown = list.filter(m => m && m.id != null);
  const toggleOne = id => setSel(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  const allShown = shown.length>0 && shown.every(m=>sel.includes(m.id));
  const toggleAllShown = () => setSel(s => allShown ? s.filter(id=>!shown.some(m=>m.id===id)) : [...new Set([...s, ...shown.map(m=>m.id)])]);
  const applyBulk = async () => {
    if(!bulkVal || sel.length===0) return;
    const picked = shown.filter(m=>sel.includes(m.id));
    /* 속 편성에서 빠지는 분(교역자·사모·청년)은 제외합니다 */
    const skip = (bulkField==="sok" && bulkVal!=="__LONG") ? picked.filter(m=>isMinister(m)||isSamo(m)||isYoungAdult(m)) : [];
    const targets = picked.filter(m=>!skip.includes(m));
    if(targets.length===0){ alert("고르신 분들은 속 편성 대상이 아닙니다. (교역자·사모·청년)"); return; }
    const msg = bulkField==="position"
      ? `${targets.length}명을 ${bulkVal}로 바꿉니다.`
      : bulkVal==="__LONG"
        ? `${targets.length}명을 장기결석자로 옮깁니다.\n\n재적 교인 수와 출석 명단에서 빠지고, 관리자와 교역자만 보게 됩니다.`
        : `${targets.length}명을 ${bulkLabel}으로 옮깁니다.`;
    const extra = skip.length ? `\n\n교역자·사모·청년 ${skip.length}명은 속 편성에서 빠지므로 그대로 둡니다.` : "";
    const warn = (bulkField==="sok" && bulkVal!=="__LONG" && !(SOK_MODE==="manual" || SOK_MODE==="area"))
      ? "\n\n※ 이 교회는 나이로 자동 배정하는 방식입니다. 속을 직접 정하면 그분들은 자동 배정에서 빠져 이 속으로 고정됩니다." : "";
    if(!confirm(msg + extra + warn + "\n\n바뀐 내용은 각자 메모에 한 줄 남습니다.")) return;
    setBusy(true);
    try{
      await bulkSave(targets.map(m => bulkNewData(m, bulkField, bulkVal, bulkLabel)));
      setSel([]); setBulkVal(""); setBulk(false);
      alert(`${targets.length}명을 고쳤습니다.`);
    }catch(e){ /* 알림은 App 에서 */ }
    finally{ setBusy(false); }
  };

  const orderBtn = key => (canOrder && saveOrder && !q)
    ? <button type="button" className="btn sm ghost grp-order-btn" onClick={()=>setOrdering(ordering===key ? null : key)}>
        {ordering===key ? "순서 닫기" : "순서"}</button> : null;

  const groups = useMemo(()=>{
    const map = {};
    const absent = [];
    list.forEach(m=>{ if(isLongAbsent(m)){ absent.push(m); return; } const p = m.position || "성도"; (map[p]=map[p]||[]).push(m); });
    const known = POSITIONS.filter(p=>map[p]);
    const extra = Object.keys(map).filter(p=>!POSITIONS.includes(p)).sort((a,b)=>a.localeCompare(b,"ko"));
    const out = [...known, ...extra].map(p=>({pos:p, items:map[p]}));
    if(absent.length) out.push({pos:"장기결석자", items:absent, absent:true});   /* 재적 밖 — 맨 아래 */
    return out;
  }, [list]);

  const sokGroups = useMemo(()=>{
    const map = {};
    list.forEach(m=>{
      if(isLongAbsent(m)){                                 /* 장기결석자는 속에서 빠져 따로 */
        if(!map["LONG"]) map["LONG"] = {s:null, items:[]};
        map["LONG"].items.push(m); return;
      }
      if(isMinister(m)){                                   /* 교역자는 따로 묶음 */
        if(!map["MIN"]) map["MIN"] = {s:null, items:[]};
        map["MIN"].items.push(m); return;
      }
      if(isSamo(m)){                                       /* 사모도 별도 항목 */
        if(!map["SAMO"]) map["SAMO"] = {s:null, items:[]};
        map["SAMO"].items.push(m); return;
      }
      const s = sokOf(m);
      /* 교회학교(유치부~청년부) 대상은 속별 명부에 나오지 않음 */
      if(!s && schoolDeptOf(m)) return;
      const key = s ? (s.id ? s.id : s.g + s.n) : "zz";
      if(!map[key]) map[key] = {s:s, items:[]};
      map[key].items.push(m);
    });
    const order = ["MIN","SAMO",...sokKeys(),"zz","LONG"];   /* 설정된 속 순서대로, 장기결석자는 맨 끝 */
    return order.filter(k=>map[k]).map(k=>({
      key:k,
      label: k==="MIN" ? "교역자" : k==="SAMO" ? "사모" : k==="zz" ? "속 미지정" : k==="LONG" ? "장기결석자 (재적 제외)" : sokLabel(map[k].s),
      items: map[k].items
    }));
  }, [list]);

  const SCHOOL = SCHOOL_DEPTS;
  const schoolGroups = useMemo(()=>{
    return SCHOOL.map(s=>({
      key:s.key, label:s.label,
      items: list.filter(m=>{
        const d = schoolDeptOf(m);                          /* 청년 표시·교역자·사모까지 함께 판정 */
        return d && d.key === s.key;
      })
    }));
  }, [list]);

  const gTitle = {margin:"0 0 8px", fontSize:"17px", color:"var(--pine-deep)",
    borderBottom:"2px solid var(--gold)", display:"inline-block", paddingBottom:"2px"};

  return (
    <div>
      <div className="panel">
        <div className="row" style={{justifyContent:"space-between"}}>
          <h2 style={{margin:0}}>교인 <span className="muted small">{members.filter(m=>!isLongAbsent(m)).length}명
            {members.some(isLongAbsent) && ` · 장기결석 ${members.filter(isLongAbsent).length}명`}</span></h2>
          {canEdit && <button className="btn gold" onClick={()=>setMemView({mode:"form"})}>+ 새 교인 등록</button>}
        </div>
        <div className="svc-tabs" style={{marginTop:14, marginBottom:0}}>
          <button className={book==="all"?"on":""} onClick={()=>setBook("all")}>교인 명부</button>
          <button className={book==="sok"?"on":""} onClick={()=>setBook("sok")}>속별 명부</button>
          <button className={book==="school"?"on":""} onClick={()=>setBook("school")}>교회학교</button>
        </div>
        <div className="row" style={{marginTop:12}}>
          {!(book==="all" && mode==="order") &&
          <input placeholder="이름·연락처·주소 검색" value={q} onChange={e=>setQ(e.target.value)} style={{flex:"1 1 200px"}}/>}
          {book==="all" && mode!=="order" && <select value={pos} onChange={e=>setPos(e.target.value)}>
            {positions.map(p=><option key={p}>{p}</option>)}
          </select>}
          {book==="all" && <div className="svc-tabs" style={{margin:0}}>
            <button className={mode==="pos"?"on":""} onClick={()=>setMode("pos")}>직분별</button>
            <button className={mode==="name"?"on":""} onClick={()=>setMode("name")}>가나다순</button>
            {canOrder && saveOrder &&
              <button className={mode==="order"?"on":""} onClick={()=>{ setOrdering(null); setMode("order"); }}>순서</button>}
          </div>}
          {canBulk && bulkSave && book!=="school" && mode!=="order" &&
            <button className={"btn sm ghost" + (bulk ? " on" : "")} style={{marginLeft:8}}
              onClick={()=>{ setBulk(!bulk); setSel([]); setBulkVal(""); }}>
              {bulk ? "단체수정 끝내기" : "단체수정"}</button>}
        </div>
        {(book==="sok" || book==="school") && canOrder && saveOrder &&   /* 안내글은 고칠 수 있는 분에게만 */
          <p className="lead-note"><i></i>{book==="sok" ? "속마다" : "반마다"} 첫 칸(금색 테두리)은 {book==="sok" ? "속장" : "리더"} 자리입니다.
            {" "}순서는 머리표의 [순서] 단추로 수정합니다.</p>}
      </div>

        {bulk && canBulk && bulkSave &&
          <div className="bulk-bar">
            <span className="cnt">{sel.length}명 선택</span>
            <button className="btn sm ghost" onClick={toggleAllShown} disabled={busy}>
              {allShown ? "보이는 사람 모두 해제" : "보이는 사람 모두 선택"}</button>
            <select value={bulkVal} onChange={e=>setBulkVal(e.target.value)} disabled={busy} style={{minWidth:140}}>
              <option value="">{bulkField==="position" ? "새 직분 고르기…" : "옮길 속 고르기…"}</option>
              {bulkOpts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
            </select>
            <button className="btn" onClick={applyBulk} disabled={busy || !bulkVal || sel.length===0}>
              {busy ? "바꾸는 중…" : (bulkField==="position" ? "직분 바꾸기" : "속 옮기기")}</button>
            <button className="btn ghost" onClick={()=>{ setBulk(false); setSel([]); setBulkVal(""); }} disabled={busy}>취소</button>
            <span className="muted small" style={{flexBasis:"100%"}}>
              {bulkField==="position"
                ? "고른 분은 원래 직분과 상관없이 모두 새 직분이 됩니다."
                : (SOK_MODE==="manual" || SOK_MODE==="area")
                  ? "고른 분의 속을 직접 지정합니다. 주소 방식이면 주소보다 이 지정이 우선합니다."
                  : "이 교회는 나이로 자동 배정합니다. 직접 지정하면 그분들은 자동 배정에서 빠져 고정됩니다."}</span>
          </div>}
      {list.length===0 ? <div className="panel empty">조건에 맞는 교인이 없습니다.</div> :
       book==="school" ?
        <div>
          {schoolGroups.every(g=>g.items.length===0) ?
            <div className="panel empty">교회학교(5~29세)에 해당하는 교인이 없습니다.<br/>
              {canEdit && "자녀·학생도 '새 교인 등록'에서 생년월일과 함께 등록하면 나이에 따라 자동으로 분류됩니다."}</div> :
            schoolGroups.map(g=>(
              <SchoolDept key={g.key} g={g} canEdit={canEditClass ? canEditClass(g.key) : canEdit} setMemView={setMemView}
                canOrder={canOrder} saveOrder={saveOrder}
                data={(schoolClasses||{})[g.key]} saveDept={(d)=>saveClasses({...(schoolClasses||{}), [g.key]: d})}/>
            ))}
        </div>
       : book==="sok" ?
        <div>
          {sokGroups.map(g=>(
            <div key={g.key} style={{marginBottom:18}}>
              <DeptHead sKey={g.key==="zz" ? "" : g.key} name={g.label} count={g.items.length+"명"}
                right={canOrder && saveOrder && !q && <button type="button" className="ord-btn" title="순서" aria-label="순서" onClick={()=>setOrdering(ordering==="sok:"+g.key ? null : "sok:"+g.key)}>
                  {ordering==="sok:"+g.key ? "순서 닫기" : <React.Fragment><span className="ord-ico" aria-hidden="true">⇅</span><span className="ord-t">순서</span></React.Fragment>}</button>}/>
              {g.key==="zz" && canFix && <p className="muted small" style={{margin:"0 0 8px"}}>
                성별·생년월일이 없어 속을 정하지 못했습니다. '정보 수정'에서 성별과 생년월일을 넣으면 자동 배정됩니다.</p>}
              {ordering==="sok:"+g.key
                ? <OrderEditor items={g.items} onSave={saveOrder} onClose={()=>setOrdering(null)}
                    leadLabel={isSokLeadKey(g.key) ? "속장 자리" : null}/>
                : <div className="mem-list">
                {g.items.map((m, idx)=>(
                  <BulkWrap key={m.id} on={bulk} checked={sel.includes(m.id)} toggle={()=>toggleOne(m.id)}>
                  <MemberCard m={m} onClick={()=>{ if(bulk) toggleOne(m.id); else setMemView({mode:"detail", id:m.id}); }}
                    lead={idx===0 && isSokLeadKey(g.key)} leadLabel={canOrder && saveOrder ? "속장 자리" : null}/>
                  </BulkWrap>
                ))}
              </div>}
            </div>
          ))}
        </div>
       : (mode==="order" && canOrder && saveOrder) ?
        <MultiOrderEditor key={"ord"+list.length} groups={groups.map(g=>({key:g.pos, label:g.pos, items:g.items}))}
          onSave={saveOrder} onClose={()=>setMode("pos")}/>
       : mode==="name" ?
        <div className="mem-list">
          {list.map(m=>(
            <BulkWrap key={m.id} on={bulk} checked={sel.includes(m.id)} toggle={()=>toggleOne(m.id)}>
            <MemberCard m={m} onClick={()=>{ if(bulk) toggleOne(m.id); else setMemView({mode:"detail", id:m.id}); }}/>
            </BulkWrap>
          ))}
        </div>
       :
        <div>
          {groups.map(g=>(
            <div key={g.pos} style={{marginBottom:18}}>
              <h3 style={gTitle}>{g.pos} <span className="muted small">{g.items.length}명</span></h3>
              {ordering==="pos:"+g.pos
                ? <OrderEditor items={g.items} onSave={saveOrder} onClose={()=>setOrdering(null)}/>
                : <div className="mem-list">
                {g.items.map(m=>(
                  <BulkWrap key={m.id} on={bulk} checked={sel.includes(m.id)} toggle={()=>toggleOne(m.id)}>
                  <MemberCard m={m} onClick={()=>{ if(bulk) toggleOne(m.id); else setMemView({mode:"detail", id:m.id}); }}/>
                  </BulkWrap>
                ))}
              </div>}
            </div>
          ))}
        </div>}
    </div>
  );
}

/* ───────── 교인 등록/수정 ───────── */
function MemberForm({init, onSave, onCancel, canAbsent = false}){
  /* 자료가 어긋나도 멈추지 않게 — 가족·봉사 칸이 없는 교인도 열립니다 */
  const [m, setM] = useState(() => {
    const o = init ? JSON.parse(JSON.stringify(init)) : emptyMember();
    ["family","depts","visits","prayers"].forEach(k => { if(!Array.isArray(o[k])) o[k] = []; });
    ["name","position","gender","birth","phone","address","memo"].forEach(k => { if(o[k] == null) o[k] = ""; else if(typeof o[k] !== "string") o[k] = String(o[k]); });
    return o;
  });
  const set = (k,v)=>setM(o=>({...o,[k]:v}));
  const setArr = (k, i, f, v)=>setM(o=>{ const a=[...o[k]]; a[i]={...a[i],[f]:v}; return {...o,[k]:a}; });
  const addRow = (k, row)=>setM(o=>({...o,[k]:[...o[k], row]}));
  const delRow = (k, i)=>setM(o=>({...o,[k]:o[k].filter((_,j)=>j!==i)}));

  return (
    <div className="panel">
      <h2>{init ? "교인 정보 수정" : "새 교인 등록"}</h2>

      <div className="photo-row">
        <div className={"photo-box" + (m.photo ? " has-photo" : "")}>
          {m.photo
            ? <img src={m.photo} alt="교인 사진"/>
            : <span className="photo-ph">사진 없음</span>}
        </div>
        <div className="col" style={{gap:6}}>
          <label className="btn sm ghost photo-pick">
            {m.photo ? "사진 변경" : "사진 선택"}
            <input type="file" accept="image/*" style={{display:"none"}}
              onChange={async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
                try{ set("photo", await readPhoto(f)); }
                catch(_){ alert("사진을 불러오지 못했습니다. 다른 사진으로 다시 시도해 주세요."); } }}/>
          </label>
          {m.photo && <button className="btn sm danger" onClick={()=>set("photo","")}>사진 삭제</button>}
          <span className="muted small">휴대폰·아이패드에서는 앨범이나 카메라를 선택할 수 있습니다. 사진은 자동으로 작게 저장됩니다.</span>
        </div>
      </div>

      <div className="form-grid">
        <div className="field"><label>이름 *</label>
          <input value={m.name} onChange={e=>set("name",e.target.value)} placeholder="홍길동"/></div>
        <div className="field"><label>생년월일</label>
          <input type="date" value={m.birth} onChange={e=>set("birth",e.target.value)}/></div>
        <div className="field"><label>성별 <span className="muted small">(속 자동 배정에 사용)</span></label>
          <select value={m.gender||""} onChange={e=>set("gender",e.target.value)}>
            <option value="">선택 안 함</option>
            <option value="여">여</option>
            <option value="남">남</option>
          </select></div>
        <div className="field"><label>연락처</label>
          <input value={m.phone} onChange={e=>set("phone",e.target.value)} placeholder="010-0000-0000"/></div>
        <div className="field"><label>직분</label>
          <input list="pos-list" value={m.position} onChange={e=>set("position",e.target.value)}/>
          <datalist id="pos-list">{POSITIONS.map(p=><option key={p} value={p}/>)}</datalist></div>
        {(SOK_MODE==="manual" || SOK_MODE==="area") &&
          <div className="field"><label>속회</label>
            <select value={m.sok||""} onChange={e=>set("sok",e.target.value)}>
              <option value="">{SOK_MODE==="area" ? "주소로 자동 배정" : "속 미지정"}</option>
              {SOK_LIST.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {SOK_MODE==="area" &&
              <span className="muted small">비워 두면 주소를 보고 자동으로 배정됩니다.</span>}
          </div>}
      </div>
      {canAbsent &&
        <label className="row small" style={{gap:8, alignItems:"center", margin:"4px 0 10px"}}>
          <input type="checkbox" checked={!!m.longAbsent} onChange={e=>{
            const on = e.target.checked;
            const line = `${todayStr()} ${on ? "장기결석으로 옮김" : "장기결석에서 돌아옴"}`;
            setM(o=>({...o, longAbsent:on, memo:[String(o.memo||"").trim(), line].filter(Boolean).join("\n")}));
          }}/>
          <b>장기결석자</b>
          <span className="muted">— 재적 교인 수·출석 명단·생일에서 빠지고, 속에서 나와 "장기결석자"로 모입니다. 관리자와 교역자만 봅니다.</span>
        </label>}
      <div className="field"><label>주소</label>
        <input value={m.address} onChange={e=>set("address",e.target.value)} placeholder="시/구/동 상세주소"/></div>
      <div className="field"><label>메모</label>
        <textarea rows="2" value={m.memo} onChange={e=>set("memo",e.target.value)} placeholder="특이사항, 신앙 배경 등"/></div>

      <h3>가족</h3>
      <p className="muted small" style={{margin:"-4px 0 8px"}}>교인으로 등록된 가족은 나이·직분을 그분 기록에서 가져옵니다. 나이·직업 칸은 교인이 아닌 가족만 적으시면 됩니다.</p>
      {m.family.length===0 && <p className="muted small">등록된 가족이 없습니다.</p>}
      {m.family.map((f,i)=>(
        <div className="row" key={f.id} style={{marginBottom:8}}>
          <select value={f.relation} onChange={e=>setArr("family",i,"relation",e.target.value)} style={{width:95}}>
            {RELATIONS.map(r=><option key={r}>{r}</option>)}
          </select>
          <input placeholder="이름" value={f.name} onChange={e=>setArr("family",i,"name",e.target.value)} style={{width:110}}/>
          <input placeholder="나이" type="number" min="0" value={f.age} onChange={e=>setArr("family",i,"age",e.target.value)} style={{width:75}}/>
          <input placeholder="직업 / 학교" value={f.job} onChange={e=>setArr("family",i,"job",e.target.value)} style={{flex:"1 1 140px"}}/>
          <button className="btn sm danger" onClick={()=>delRow("family",i)}>삭제</button>
        </div>
      ))}
      <button className="btn sm ghost" onClick={()=>addRow("family",{id:uid(),relation:"배우자",name:"",age:"",job:""})}>+ 가족 추가</button>

      <h3>봉사 부서 <span className="muted small">(과거 이력도 함께 기록)</span></h3>
      {m.depts.length===0 && <p className="muted small">등록된 봉사 부서가 없습니다.</p>}
      {m.depts.map((d,i)=>(
        <div className="row" key={d.id} style={{marginBottom:8}}>
          <input placeholder="부서명 (예: 찬양대)" value={d.name} onChange={e=>setArr("depts",i,"name",e.target.value)} style={{flex:"1 1 140px"}}/>
          <input placeholder="시작 (예: 2020)" value={d.from} onChange={e=>setArr("depts",i,"from",e.target.value)} style={{width:110}}/>
          <input placeholder="종료" value={d.to} disabled={d.current} onChange={e=>setArr("depts",i,"to",e.target.value)} style={{width:110}}/>
          <label className="row small" style={{gap:5}}>
            <input type="checkbox" checked={!!d.current}
              onChange={e=>{ setArr("depts",i,"current",e.target.checked); if(e.target.checked) setArr("depts",i,"to",""); }}/>
            현재 봉사 중
          </label>
          <button className="btn sm danger" onClick={()=>delRow("depts",i)}>삭제</button>
        </div>
      ))}
      <button className="btn sm ghost" onClick={()=>addRow("depts",{id:uid(),name:"",from:"",to:"",current:true})}>+ 부서 추가</button>

      <hr className="divider"/>
      <div className="row">
        <button className="btn" disabled={!m.name.trim()} onClick={()=>onSave({...m, name:m.name.trim()})}>저장</button>
        <button className="btn ghost" onClick={onCancel}>취소</button>
        {!m.name.trim() && <span className="muted small">이름을 입력하면 저장할 수 있습니다.</span>}
      </div>
    </div>
  );
}

/* ───────── 교인 상세 ───────── */
function MemberDetail({m, att, setMemView, update, remove, canEdit, canDelete, allMembers, openMember, limited, seeSecret, outside, canPray, meName, meId, canAtt = true, specials, printChurch}){
  const [pSecret, setPSecret] = useState(false);
  const visiblePrayers = (m && m.prayers ? m.prayers : []).filter(p => seeSecret || !p.secret);
  /* 속장·교사는 자기가 남긴 심방 기록만 봅니다 */
  const visibleVisits = (m && m.visits ? m.visits : []).filter(v => !limited || v.byId === meId);
  const [vWhen, setVWhen] = useState(nowLocal());
  const [vPurpose, setVPurpose] = useState("정기심방");
  const [vNote, setVNote] = useState("");
  const [pReq, setPReq] = useState("");
  const [tab, setTab] = useState("fam");            /* 열려 있는 폴더 */
  const [memoOpen, setMemoOpen] = useState(false);

  if(!m) return <div className="panel empty">교인 정보를 찾을 수 없습니다.</div>;
  const age = calcAge(m.birth);
  const year = String(new Date().getFullYear());

  /* 기본 예배 + 특별예배. 출석 기록에만 남아 있는 예배(목록에서 뺀 것)도 함께 찾아 준다 */
  const attStat = (()=>{
    const known = [...SERVICES, ...(specials||[])];
    const knownKeys = new Set(known.map(s=>s.key));
    const extraKeys = new Set();
    Object.keys(att).forEach(d=>{
      Object.keys(att[d]||{}).forEach(k=>{
        if(!knownKeys.has(k) && (att[d][k]||[]).includes(m.id)) extraKeys.add(k);
      });
    });
    const rows = [...known, ...[...extraKeys].map(k=>({key:k, label:"지난 특별예배", from:""}))];
    return rows.map(s=>{
      const dates = Object.keys(att).filter(d => (att[d][s.key]||[]).includes(m.id)).sort();
      return {key:s.key, label:s.label, from:s.from||"",
        special:!SERVICES.some(x=>x.key===s.key),
        total:dates.length,
        year:dates.filter(d=>d.startsWith(year)).length,
        last:dates.length ? dates[dates.length-1] : null};
    }).filter(s => !s.special || s.total > 0 || String(s.from||"").startsWith(year));
       /* 특별예배: 올해 것은 0회라도 표시, 지난 해 것은 참석 기록이 있을 때만 */
  })();

  const curDepts = (m.depts||[]).filter(d=>d.current);
  const pastDepts = (m.depts||[]).filter(d=>!d.current);

  return (
    <div>
      <div className="back-line">
        <button className="btn sm ghost" onClick={()=>setMemView({mode:"list"})}>← 명부로</button>
        <button className="btn sm ghost no-print" style={{marginLeft:"auto"}}
          onClick={()=>window.print()}>인쇄</button>
      </div>

      <div className="print-head">
        <span className="ph-church">{printChurch || "교적 카드"}</span>
        <span className="ph-date">출력일 {new Date().toISOString().slice(0,10)}</span>
      </div>

      <div className="panel id-card">
        <div className="mem-detail-head">
          {m.photo && <img className="mem-photo-lg" src={m.photo} alt={m.name+" 사진"}/>}
          <div className="row" style={{justifyContent:"space-between", flex:"1 1 auto"}}>
            <h2 style={{margin:0}}>{m.name} <span className="chip pos">{m.position||"성도"}</span></h2>
            {canEdit && <div className="row" style={{gap:6}}>
              <button className="btn sm" onClick={()=>setMemView({mode:"form", id:m.id})}>정보 수정</button>
              {canDelete!==false && <button className="btn sm danger" onClick={remove}>삭제</button>}
            </div>}
          </div>
        </div>
        <div className="tbl-wrap" style={{marginTop:12}}><table>
          <tbody>
            <tr><th style={{width:90}}>생년월일</th><td>{m.birth ? `${m.birth} (${age}세)` : <span className="muted">미입력</span>}</td></tr>
            <tr><th>속회</th><td>{
              /* 교역자·사모·청년은 속회 편성 대상이 아니라 안내를 띄우지 않습니다 */
              isLongAbsent(m) ? <span className="chip secret">장기결석자 · 재적 제외</span>
              : sokOf(m) ? sokLabel(sokOf(m))
              : (isMinister(m) || isSamo(m)) ? <span className="muted">해당 없음</span>
              : isYoungAdult(m) ? <span className="muted">청년부</span>
              : !canEdit ? <span className="muted">미지정</span>
              : <span className="muted">{SOK_MODE==="manual"
                ? "미지정 — '정보 수정'에서 속회를 골라 주세요"
                : SOK_MODE==="area"
                ? "미지정 — 주소에 맞는 속이 없습니다. 주소를 확인하거나 '정보 수정'에서 속회를 골라 주세요"
                : "미지정 — 성별과 생년월일을 입력하면 자동 배정됩니다"}</span>}{m.gender && <span className="muted small"> · 성별: {m.gender}</span>}</td></tr>
            <tr><th>연락처</th><td>{m.phone ? <a href={"tel:"+m.phone.replace(/[^0-9+]/g,"")}>{m.phone}</a> : <span className="muted">미입력</span>}</td></tr>
            <tr><th>주소</th><td>{m.address || <span className="muted">미입력</span>}</td></tr>
            {m.memo && <tr><th>메모</th><td>
              <div className={"memo-box" + (memoOpen ? " open" : "")} style={{whiteSpace:"pre-wrap"}}>{m.memo}</div>
              {String(m.memo).split("\n").length > 3 || String(m.memo).length > 120
                ? <button type="button" className="memo-more no-print" onClick={()=>setMemoOpen(!memoOpen)}>{memoOpen ? "접기" : "메모 더 보기"}</button> : null}
            </td></tr>}
          </tbody></table></div>
      </div>

      {outside && <div className="panel" style={{padding:"12px 16px"}}>
        <span className="muted small">담당 범위 밖의 교인입니다 — <b>가족으로 이어져</b> 열람 중입니다.</span>
      </div>}

      {(() => {
        const showCare = !limited || canPray;
        const tabs = [
          {k:"fam",   l:"가족",     n:(m.family||[]).length},
          {k:"dept",  l:"봉사",     n:(m.depts||[]).length},
          {k:"att",   l:"예배출석", n:null},
          ...(showCare ? [{k:"visit", l:"심방", n:visibleVisits.length},
                          {k:"pray",  l:"중보기도", n:visiblePrayers.length}] : []),
        ];
        const cur = tabs.some(x=>x.k===tab) ? tab : "fam";
        if(cur !== tab) setTimeout(()=>setTab(cur), 0);
        return (
          <div className="folder-tabs no-print" role="tablist">
            {tabs.map(x => (
              <button key={x.k} type="button" role="tab" aria-selected={cur===x.k}
                className={"folder-tab f-" + x.k + (cur===x.k ? " on" : "")} onClick={()=>setTab(x.k)}>
                {x.l}{x.n ? <span className="ft-n">{x.n}</span> : null}
              </button>))}
          </div>);
      })()}

      <div className={"panel folder-panel f-fam" + ((tab==="fam" || (tab!=="fam" && tab!=="dept" && tab!=="att" && tab!=="visit" && tab!=="pray" && "fam"==="fam")) ? " on" : "")}>
        <h2>가족</h2>
        {(m.family||[]).length===0 ? <p className="empty">등록된 가족이 없습니다.{canEdit ? " '정보 수정'에서 추가할 수 있습니다." : ""}</p> :
          <div className="tbl-wrap"><table>
            <thead><tr><th>관계</th><th>이름</th><th>나이</th><th>직업 / 학교</th></tr></thead>
            <tbody>{m.family.map(f=>{
              const nm = (f.name||"").trim();
              const link = nm && (allMembers||[]).find(x => x.id!==m.id && (x.name||"").trim()===nm);
              return (
                <tr key={f.id}>
                  <td>{f.relation}</td>
                  <td>{link
                    ? <button className="btn sm ghost" style={{padding:"2px 8px"}}
                        title={nm + " 님의 교인 기록으로 이동"}
                        onClick={()=>openMember(link.id)}>{nm} ↗</button>
                    : nm}</td>
                  <td>{(()=>{
                    /* 교인으로 등록된 가족이면 그분 기록의 나이를 씁니다.
                       기록 맨 위·교인 카드와 같은 만 나이로 셉니다 — 어느 화면에서 봐도 같은 나이 */
                    if(link){
                      const b = typeof link.birth === "string" ? link.birth : (link.birth == null ? "" : String(link.birth));
                      const a = /^\d{4}-\d{2}-\d{2}$/.test(b) ? calcAge(b) : null;
                      if(a !== null && a !== undefined && !isNaN(a)) return a + "세";
                    }
                    return f.age && (/^\d{1,3}$/.test(String(f.age)) ? f.age + "세" : f.age);
                  })()}</td>
                  <td>{(()=>{
                    /* 교인으로 등록된 가족이면 손으로 적은 값 대신 그분 기록(직분 · 지금 봉사 중인 부서)을 씁니다.
                       그래야 부모·자녀 누구의 기록에서 봐도 같게 나옵니다. 기록에 아무것도 없을 때만 적어 둔 값을 씁니다 */
                    if(link){
                      const now = (Array.isArray(link.depts) ? link.depts : []).filter(d=>d && d.current).map(d=>d.name);
                      const auto = [link.position, ...now].filter(Boolean).join(" · ");
                      if(auto) return auto;
                    }
                    return f.job || "";
                  })()}</td>
                </tr>);
            })}
            </tbody></table></div>}
        {(m.family||[]).length>0 &&
          <p className="muted small" style={{marginBottom:0}}>이름 옆에 ↗ 표시가 있는 분은 교인으로 등록되어 있습니다. 눌러서 그분 기록으로 바로 넘어갈 수 있습니다.</p>}
      </div>

      <div className={"panel folder-panel f-dept" + ((tab==="dept" || (tab!=="fam" && tab!=="dept" && tab!=="att" && tab!=="visit" && tab!=="pray" && "dept"==="fam")) ? " on" : "")}>
        <h2>봉사 부서</h2>
        {(m.depts||[]).length===0 ? <p className="empty">등록된 봉사 이력이 없습니다.</p> : (
          /* 가족 표와 같은 모양 — 부서 · 기간 · 상태 */
          <div className="tbl-wrap"><table className="list-tbl">
            <thead><tr><th>부서</th><th>기간</th><th>상태</th></tr></thead>
            <tbody>{[...curDepts, ...pastDepts].map(d=>(
              <tr key={d.id}>
                <td className="c-name">{d.name}</td>
                <td className="c-date">{(d.from || d.to)
                  ? `${d.from || "?"} ~ ${d.current ? "현재" : (d.to || "?")}`
                  : <span className="muted">기간 없음</span>}</td>
                <td className="c-state">{d.current
                  ? <span className="chip now">섬기는 중</span>
                  : <span className="chip past">지난 봉사</span>}</td>
              </tr>))}
            </tbody></table></div>)}
      </div>

      <div className={"panel folder-panel f-att" + ((tab==="att" || (tab!=="fam" && tab!=="dept" && tab!=="att" && tab!=="visit" && tab!=="pray" && "att"==="fam")) ? " on" : "")}>
        <h2>예배 출석 현황</h2>
        <div className="tbl-wrap"><table>
          <thead><tr><th>예배</th><th>올해 출석</th><th>누적</th><th>최근 출석일</th></tr></thead>
          <tbody>{attStat.map(s=>(
            <tr key={s.key}><td>{s.special && "✦ "}{s.label}</td>
              <td><b style={{color:"var(--pine)"}}>{s.year}</b>회</td>
              <td>{s.total}회</td>
              <td>{s.last ? `${s.last} (${weekdayOf(s.last)})` : <span className="muted">기록 없음</span>}</td></tr>))}
          </tbody></table></div>
        {canAtt && <p className="muted small" style={{marginBottom:0}}>출석 체크는 상단 <b>출석</b> 메뉴에서 예배별로 진행합니다.</p>}
      </div>

      {(!limited || canPray) && <div className={"panel folder-panel f-visit" + (tab==="visit" ? " on" : "")}>
        <h2>심방 기록 <span className="muted small">{visibleVisits.length}건</span></h2>
        {visibleVisits.length>0 &&
          <div className="tbl-wrap"><table className="list-tbl">
            <thead><tr><th>일시</th><th>목적</th><th>내용</th><th></th></tr></thead>
            <tbody>{[...visibleVisits].sort((a,b)=>(b.when||"").localeCompare(a.when||"")).map(v=>(
              <tr key={v.id}>
                <td className="c-date" style={{whiteSpace:"nowrap"}}>{fmtDT(v.when)}
                  {v.by && <div className="muted small">{v.by}</div>}</td>
                <td className="c-name"><span className="chip pos">{v.purpose}</span></td>
                <td className="c-text" style={{whiteSpace:"pre-wrap"}}>{v.note}</td>
                <td className="c-act">{(canEdit || (limited && v.byId === meId)) && <button className="btn sm danger" onClick={()=>{
                  if(confirm("이 심방 기록을 삭제할까요?")) update(o=>({...o, visits:o.visits.filter(x=>x.id!==v.id)}));
                }}>삭제</button>}</td>
              </tr>))}
            </tbody></table></div>}
        {(canEdit || canPray) && <React.Fragment>
        <h3>새 심방 기록</h3>
        <div className="row">
          <input type="datetime-local" value={vWhen} onChange={e=>setVWhen(e.target.value)}/>
          <select value={vPurpose} onChange={e=>setVPurpose(e.target.value)}>
            {PURPOSES.map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
        <div className="row" style={{marginTop:8}}>
          <input placeholder="내용 (선택)" value={vNote} onChange={e=>setVNote(e.target.value)} style={{flex:"1 1 220px"}}/>
          <button className="btn" disabled={!vWhen} onClick={()=>{
            update(o=>({...o, visits:[...(o.visits||[]),
              {id:uid(), when:vWhen, purpose:vPurpose, note:vNote.trim(), by: meName, byId: meId}]}));
            setVNote(""); setVWhen(nowLocal());
          }}>기록 추가</button>
        </div>
        {limited && <p className="muted small" style={{marginTop:8, marginBottom:0}}>
          여기에 남긴 심방 기록은 목회자와 함께 보게 됩니다.</p>}
        </React.Fragment>}
      </div>}

      {(!limited || canPray) && <div className={"panel folder-panel f-pray" + (tab==="pray" ? " on" : "")}>
        <h2>중보기도 <span className="muted small">{visiblePrayers.length}건</span></h2>
        {visiblePrayers.length>0 &&
          <div className="tbl-wrap"><table className="list-tbl">
            <thead><tr><th>요청일</th><th>기도 제목</th><th>상태</th><th></th></tr></thead>
            <tbody>{[...visiblePrayers].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(p=>(
              <tr key={p.id}>
                <td className="c-date" style={{whiteSpace:"nowrap"}}>{p.date}
                  {p.by && <div className="muted small">{p.by}</div>}</td>
                <td className="c-text" style={{whiteSpace:"pre-wrap"}}>
