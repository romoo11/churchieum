/* ───────── 계정 지우기 ─────────
   혼자 쓰던 교회는 교회 이름을 적으면 계정과 함께 지웁니다.
   다른 분이 함께 쓰는 교회의 유일한 관리자라면, 먼저 관리자를 세우도록 막습니다.
   실제 판정은 서버(my_account_check, delete_my_account)가 다시 한 번 합니다. */
function DeleteAccount({sb, session, onClose, onDone}){
  const [info, setInfo] = useState(null);
  const [err, setErr] = useState("");
  const [names, setNames] = useState({});
  const [word, setWord] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(()=>{
    let alive = true;
    (async ()=>{
      const {data, error} = await sb.rpc("my_account_check");
      if(!alive) return;
      if(error){ setErr(errMsg(error)); setInfo({failed:true}); return; }
      setInfo(data && typeof data === "object" ? data : {});
    })();
    return ()=>{ alive = false; };
  }, [sb]);

  if(info === null)
    return <div className="center-box"><div className="panel empty">계정 정보를 확인하는 중…</div></div>;

  const list = v => (Array.isArray(v) ? v : []).filter(c => c && c.id);
  const solo = list(info.solo);
  const blocked = list(info.blocked);
  const owner = info.owner === true;
  const joined = Number(info.joined) || 0;
  const email = (session && session.user && session.user.email) || "";
  const nameOk = solo.every(c => (names[c.id] || "").trim() === String(c.name || ""));
  const wordOk = solo.length > 0 || word.trim() === "지웁니다";
  const canGo = !info.failed && !owner && blocked.length === 0 && nameOk && wordOk && !busy;

  const go = async ()=>{
    if(!canGo) return;
    if(!confirm("정말 계정을 지우시겠습니까? 되돌릴 수 없습니다.")) return;
    setBusy(true); setErr("");
    const {data, error} = await sb.rpc("delete_my_account",
      {p_names: solo.map(c => (names[c.id] || "").trim())});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    alert(data === "kept"
      ? "교회이음 목양수첩 기록을 지웠습니다.\n같은 계정을 회계 프로그램에서도 쓰고 계셔서, 로그인 정보는 그쪽을 위해 남겨 두었습니다."
      : "계정을 지웠습니다. 그동안 교회이음 목양수첩을 써 주셔서 감사합니다.");
    onDone();
  };

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교회이음 목양수첩</div>
        <h2>계정 지우기</h2>
        <p className="small" style={{marginTop:0}}>
          <b>{email}</b> 계정을 지웁니다. 지우면 이 계정으로 다시 로그인할 수 없고,
          다시 쓰시려면 새로 가입하셔야 합니다.</p>

        <div className="small muted" style={{background:"#F3F5F9",border:"1px solid #DCE2EC",
            borderRadius:10,padding:"10px 12px",margin:"10px 0 14px"}}>
          <b>새로 시작하시려는 거라면</b> 계정은 두고 교회만 지우셔도 됩니다.
          교회 고르기 화면에서 교회 옆 [지우기]를 누른 뒤, 같은 계정으로 교회를 새로 만들 수 있습니다.
        </div>

        {info.failed && <p style={{color:"var(--clay)"}}>
          계정 정보를 확인하지 못했습니다. 잠시 뒤 다시 시도해 주세요.</p>}

        {owner && <p style={{color:"var(--clay)"}}>
          교회이음 운영자 계정은 여기서 지울 수 없습니다.</p>}

        {!owner && blocked.length > 0 && <div style={{marginBottom:12}}>
          <p style={{color:"var(--clay)",marginBottom:6}}><b>아직 지울 수 없습니다.</b></p>
          <p className="small" style={{marginTop:0}}>
            아래 교회는 다른 분들이 함께 쓰고 계신데, 관리자가 선생님 한 분뿐입니다.
            계정을 지우면 그분들이 교회를 관리할 수 없게 됩니다.</p>
          {blocked.map(c => <div className="ch-row" key={c.id}><b>{c.name || "이름 없는 교회"}</b></div>)}
          <p className="small muted">
            그 교회에 들어가 <b>사용자</b> 화면에서 다른 분을 <b>[관리자로]</b> 세우신 뒤 다시 와 주세요.</p>
        </div>}

        {!owner && !info.failed && blocked.length === 0 && <React.Fragment>
          {solo.length > 0 && <div style={{marginBottom:6}}>
            <p className="small" style={{marginTop:0}}>
              아래 교회는 <b>혼자 쓰고 계신 교회</b>라 계정과 함께 모두 지워집니다.
              교인·출석·심방·중보기도 기록이 전부 사라지고 되돌릴 수 없으니,
              필요하면 먼저 <b>백업</b>을 받아 두세요.</p>
            {solo.map(c => (
              <div className="field" key={c.id}>
                <label>{c.name || "이름 없는 교회"}
                  {Number(c.members) > 0 && <span className="muted"> · 교인 {Number(c.members)}명</span>}
                  {" "}— 확인을 위해 교회 이름을 그대로 적어 주세요</label>
                <input value={names[c.id] || ""} placeholder="교회 이름"
                  onChange={e => setNames(n => ({...n, [c.id]: e.target.value}))}/>
              </div>))}
          </div>}

          {joined > solo.length && <p className="small muted">
            함께 쓰던 교회에서는 빠지게 됩니다. 남기신 심방·기도 기록은 교회의 기록이라 그대로 남습니다.</p>}

          {solo.length === 0 && <div className="field">
            <label>확인을 위해 <b>지웁니다</b> 라고 적어 주세요</label>
            <input value={word} onChange={e=>setWord(e.target.value)} placeholder="지웁니다"/>
          </div>}
        </React.Fragment>}

        {err && <p style={{color:"var(--clay)"}}>{err}</p>}

        <div className="row" style={{marginTop:14}}>
          <button className="btn danger" disabled={!canGo} onClick={go}>
            {busy ? "지우는 중…" : "계정 지우기"}</button>
          <button className="btn ghost" onClick={onClose}>돌아가기</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ 백업 — 한 교회의 모든 기록을 서버에서 새로 읽어 한 덩어리로 묶습니다 ═══
   교인·출석·설정(예배·직분·속회 편성·담당 지정·행사·교회학교 반·홈 사진)을 모두 담습니다.
   서버는 한 번에 1,000줄까지만 주므로 나눠서 받습니다. */
async function fetchAllRows(sb, table, cols, churchId){
  const out = []; const step = 1000;
  for(let from = 0; from < 200000; from += step){
    const {data, error} = await sb.from(table).select(cols).eq("church_id", churchId).range(from, from + step - 1);
    if(error) throw error;
    const list = Array.isArray(data) ? data : [];
    out.push(...list);
    if(list.length < step) break;
  }
  return out;
}
async function buildChurchBackup(sb, churchId, churchName){
  const [m, a, st] = await Promise.all([
    fetchAllRows(sb, "members", "id,data", churchId),
    fetchAllRows(sb, "attendance", "date,service,ids", churchId),
    fetchAllRows(sb, "settings", "key,value", churchId),
  ]);
  const members = m.filter(r => r && r.data && typeof r.data === "object").map(r => r.data);
  const att = {};
  a.filter(r => r && r.date && r.service).forEach(r => {
    att[r.date] = att[r.date] || {}; att[r.date][r.service] = Array.isArray(r.ids) ? r.ids : [];
  });
  const settings = st.filter(r => r && r.key).map(r => ({key:r.key, value:r.value}));
  let config = null;
  const cc = settings.find(r => r.key === "churchConfig");
  if(cc && cc.value){ try{ config = typeof cc.value === "string" ? JSON.parse(cc.value) : cc.value; }catch(_){} }
  return {kind:"church", version:2, exportedAt:new Date().toISOString(),
          churchId, churchName, members, att, config, settings};
}
function saveJson(name, obj){
  const blob = new Blob([JSON.stringify(obj)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return blob.size;
}
const ALL_BACKUP_KEY = "churchAllBackupAt";   /* 이 기기에서 마지막으로 전체 백업을 받은 때 */

/* ───────── 운영자 현황 (교회이음 운영자만) ───────── */
function OwnerBoard({sb, onClose, onPick}){
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState("");

  const [bak, setBak] = useState("");            /* 전체 백업 진행 글 */
  const [lastBak, setLastBak] = useState(() => { try{ return localStorage.getItem(ALL_BACKUP_KEY) || ""; }catch(_){ return ""; } });
  const backupAll = async () => {
    const list = (rows || []).filter(r => r && r.id);
    if(!list.length) return;
    if(!confirm(`교회 ${list.length}곳의 교인·출석·설정을 모두 한 파일로 받습니다.\n\n` +
      `이 파일에는 모든 교회의 개인정보가 들어 있습니다.\n` +
      `GitHub에 올리거나 다른 사람에게 보내지 말고, 안전한 곳(개인 저장공간·USB)에 두세요.`)) return;
    setErr(""); const out = []; const failed = [];
    for(let i = 0; i < list.length; i++){
      const r = list[i];
      setBak(`백업 중 ${i + 1} / ${list.length} · ${r.name}`);
      try{
        const b = await buildChurchBackup(sb, r.id, r.name);
        out.push({...b, joinCode:r.join_code || "", adminEmail:r.admin_email || ""});
      }catch(e){ failed.push(`${r.name}: ${errMsg(e)}`); }
    }
    if(!out.length){ setBak(""); setErr("백업하지 못했습니다. " + failed.join(" / ")); return; }
    const now = new Date();
    const stamp = `${todayStr()}_${pad(now.getHours())}${pad(now.getMinutes())}`;
    const size = saveJson(`교회이음_전체백업_${stamp}.json`,
      {kind:"all", version:2, exportedAt:now.toISOString(), churches:out});
    try{ localStorage.setItem(ALL_BACKUP_KEY, now.toISOString()); }catch(_){}
    setLastBak(now.toISOString());
    const mem = out.reduce((a, c) => a + c.members.length, 0);
    setBak(`받았습니다 · 교회 ${out.length}곳 · 교인 ${mem}명 · ${kb(size)}` + (failed.length ? ` · 실패 ${failed.length}곳` : ""));
    if(failed.length) setErr("일부 교회를 백업하지 못했습니다: " + failed.join(" / "));
  };

  const load = useCallback(async ()=>{
    setErr("");
    const {data, error} = await sb.rpc("owner_overview");
    if(error){ setErr(errMsg(error)); setRows([]); return; }
    setRows(data || []);
  }, [sb]);
  useEffect(()=>{ load(); }, [load]);

  const daysAgo = t => {
    if(!t) return null;
    const d = Math.floor((Date.now() - new Date(t).getTime()) / 86400000);
    return d;
  };
  const agoText = t => {
    const d = daysAgo(t);
    if(d === null) return "-";
    if(d === 0) return "오늘";
    if(d === 1) return "어제";
    if(d < 30) return d + "일 전";
    return Math.floor(d/30) + "달 전";
  };
  /* 쓰고 있나 판단: 출석 기록이 최근 14일 안에 있으면 쓰는 중 */
  const state = r => {
    if(!r.members_total) return {t:"시작 안 함", c:"st-none"};
    const d = daysAgo(r.last_att ? r.last_att + "T12:00:00" : null);
    if(d === null) return {t:"교인만 넣음", c:"st-part"};
    if(d <= 14) return {t:"쓰는 중", c:"st-live"};
    if(d <= 45) return {t:"멈춘 듯", c:"st-part"};
    return {t:"안 쓰는 듯", c:"st-none"};
  };
  const kb = n => n < 1024 ? n + "B" : (n/1024 < 1024 ? Math.round(n/1024) + "KB" : (n/1048576).toFixed(1) + "MB");

  const dropChurch = async (r)=>{
    const typed = prompt(
      `[운영자] ${r.name} 를 지웁니다.\n\n` +
      `교인 ${r.members_total}명, 출석 ${r.att_days}일치 기록이 모두 사라집니다.\n` +
      `관리자: ${r.admin_email || "없음"}\n` +
      `되돌릴 수 없습니다.\n\n` +
      `정말 지우시려면 교회 이름을 그대로 적어 주세요.`, "");
    if(typed === null) return;
    if(typed.trim() !== r.name){ alert("교회 이름이 달라 지우지 않았습니다."); return; }
    setBusy(r.id); setErr("");
    const {error} = await sb.rpc("delete_church", {p_id: r.id, p_name: r.name});
    setBusy("");
    if(error){ setErr(errMsg(error)); return; }
    try{ if(localStorage.getItem(PICK_KEY) === r.id) localStorage.removeItem(PICK_KEY); }catch(_){}
    load();
  };

  if(rows === null)
    return <div className="center-box"><div className="panel empty">현황을 불러오는 중…</div></div>;

  const live = rows.filter(r=>state(r).t === "쓰는 중").length;
  const totalMembers = rows.reduce((a,r)=>a + (r.members_total||0), 0);

  return (
    <div className="wrap">
      <div className="panel">
        <div className="row" style={{alignItems:"center"}}>
          <h2 style={{border:"none",margin:0}}>교회 사용 현황
            <span className="muted small"> 교회 {rows.length}곳 · 쓰는 중 {live}곳 · 교인 합계 {totalMembers}명</span></h2>
          <button className="btn sm ghost" style={{marginLeft:"auto"}} onClick={load}>새로 보기</button>
          <button className="btn sm" onClick={onClose}>닫기</button>
        </div>
        <div className="own-backup">
          <div>
            <b>전체 백업</b>
            <span className="muted small"> · 모든 교회의 교인·출석·설정을 한 파일로 받습니다.
              {(() => { const d = daysAgo(lastBak); return d === null ? " 이 기기에서 받은 적 없음"
                : ` 마지막: ${d === 0 ? "오늘" : d + "일 전"}`; })()}</span>
            {(() => { const d = daysAgo(lastBak); return (d === null || d >= 7) &&
              <div className="own-backup-warn">일주일에 한 번은 받아 두시길 권합니다.</div>; })()}
          </div>
          <button className="btn sm" disabled={!!bak && bak.startsWith("백업 중")} onClick={backupAll}>
            {bak && bak.startsWith("백업 중") ? "받는 중…" : "전체 백업 받기"}</button>
        </div>
        {bak && <p className="small" style={{margin:"6px 0 0",color:"#1E5B3A"}}>{bak}</p>}
        {err && <p style={{color:"var(--clay)"}}>{err}</p>}

        {rows.length === 0 && <p className="empty">아직 만들어진 교회가 없습니다.</p>}

        {rows.map(r=>{
          const st = state(r);
          return (
            <div className="own-row" key={r.id}>
              <div className="own-main">
                <div className="own-name">
                  {r.name}
                  <span className={"own-st " + st.c}>{st.t}</span>
                </div>
                <div className="muted small">{r.admin_email || "관리자 없음"} · 가입코드 {r.join_code}</div>
              </div>
              <div className="own-nums">
                <div><b>{r.members_total}</b><span>교인</span></div>
                <div><b>{r.users_total}</b><span>사용자{r.users_pending ? ` (대기 ${r.users_pending})` : ""}</span></div>
                <div><b>{r.att_days}</b><span>출석 날수</span></div>
                <div><b>{r.last_att ? agoText(r.last_att + "T12:00:00") : "-"}</b><span>마지막 출석</span></div>
                <div><b>{agoText(r.last_sign_in)}</b><span>마지막 접속</span></div>
                <div><b>{kb(Number(r.photo_bytes || 0))}</b><span>자료 크기</span></div>
              </div>
              <div className="own-act">
                <button className="btn sm ghost" onClick={()=>onPick(r.id)}>들어가 보기</button>
                <button className="btn sm danger" disabled={busy === r.id}
                  onClick={()=>dropChurch(r)}>{busy === r.id ? "지우는 중…" : "지우기"}</button>
              </div>
            </div>);
        })}

        <p className="small muted" style={{marginTop:14}}>
          <b>쓰는 중</b>은 최근 2주 안에 출석을 체크한 교회입니다.
          <b>멈춘 듯</b>은 한 달 반 안, 그보다 오래되면 <b>안 쓰는 듯</b>으로 봅니다.
          교인을 한 명도 넣지 않았으면 <b>시작 안 함</b>입니다.
        </p>
      </div>
    </div>
  );
}

/* ───────── 교회 고르기 · 만들기 · 가입 신청 ───────── */
function ChurchPicker({sb, session, logout, onPick, wipe}){
  const [rows, setRows] = useState(null);      /* 내가 속한/신청한 교회들 */
  const [canMake, setCanMake] = useState(true); /* 교회를 더 만들 수 있는지 */
  const [isOwner, setIsOwner] = useState(false); /* 교회이음 운영자인지 */
  const [board, setBoard] = useState(false);     /* 현황 화면 보기 */
  const [mode, setMode] = useState("");        /* "" | "new" | "join" */
  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const pickRef = useRef(onPick); pickRef.current = onPick;   /* 바로 들어가기에 쓰는 값 */

  const load = useCallback(async ()=>{
    setErr("");
    const {data, error} = await sb.from("church_users")
      .select("church_id, role, churches(name, join_code)")
      .eq("user_id", session.user.id);
    if(error){ setErr(errMsg(error)); setRows([]); return; }
    const list = (Array.isArray(data) ? data : []).filter(r => r && r.church_id).map(r=>({
      id: r.church_id, role: r.role,
      name: (r.churches && r.churches.name) || "이름 없는 교회",
      code: (r.churches && r.churches.join_code) || "",
    }));
    const ow = await sb.rpc("is_app_owner");
    const owner = !ow.error && ow.data === true;
    setIsOwner(owner);
    /* 속한 교회가 하나뿐이고 승인까지 되었으면 목록을 건너뛰고 바로 들어갑니다.
       운영자이거나, 이번 창에서 [교회 바꾸기]로 스스로 나온 경우는 목록을 보여 줍니다. */
    let left = false;
    try{ left = sessionStorage.getItem(LEFT_KEY) === "1"; }catch(_){}
    if(!owner && !left && list.length === 1 && list[0].role && list[0].role !== "pending"){
      pickRef.current(list[0].id);
      return;
    }
    setRows(list);
    const can = await sb.rpc("can_create_church");
    if(!can.error) setCanMake(can.data !== false);
  }, [sb, session]);
  useEffect(()=>{ load(); }, [load]);

  const makeChurch = async ()=>{
    if(!name.trim()) return;
    setBusy(true); setErr("");
    const {data, error} = await sb.rpc("create_church", {p_name: name.trim()});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    onPick(data);
  };
  const dropChurch = async (r)=>{
    const typed = prompt(
      `${r.name} 를 지우면 그 교회의 교인·출석·심방·중보기도 기록이 모두 사라집니다.\n` +
      `되돌릴 수 없습니다. 먼저 백업을 받아 두셨는지 확인해 주세요.\n\n` +
      `정말 지우시려면 아래에 교회 이름을 그대로 적어 주세요.`, "");
    if(typed === null) return;
    if(typed.trim() !== r.name){ alert("교회 이름이 달라 지우지 않았습니다."); return; }
    setBusy(true); setErr("");
    const {error} = await sb.rpc("delete_church", {p_id: r.id, p_name: r.name});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    try{ if(localStorage.getItem(PICK_KEY) === r.id) localStorage.removeItem(PICK_KEY); }catch(_){}
    load();
  };

  const joinChurch = async ()=>{
    if(!code.trim()) return;
    setBusy(true); setErr("");
    const {error} = await sb.rpc("join_church", {p_code: code.trim().toUpperCase()});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    setMode(""); setCode(""); load();
  };

  if(rows === null)
    return <div className="center-box"><div className="panel empty">교회를 확인하는 중…</div></div>;

  if(board) return <OwnerBoard sb={sb} onClose={()=>setBoard(false)} onPick={onPick}/>;

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교회이음 목양수첩</div>
        <p className="small muted" style={{marginTop:0}}>
          {session.user.email} 님으로 접속했습니다.</p>
        {err && <p style={{color:"var(--clay)"}}>{err}</p>}

        {rows.length > 0 && <React.Fragment>
          <h2>내 교회</h2>
          {rows.map(r=>(
            <div className="ch-row" key={r.id}>
              <div style={{flex:1}}>
                <b>{r.name}</b>
                {r.role === "pending"
                  ? <div className="muted small">승인을 기다리는 중입니다</div>
                  : <div className="muted small">{ROLE_LABEL[r.role] || r.role}
                      {r.role==="admin" && r.code && ` · 가입 코드 ${r.code}`}</div>}
              </div>
              {r.role === "pending"
                ? <button className="btn sm ghost" onClick={load}>승인 확인</button>
                : <React.Fragment>
                    <button className="btn sm" onClick={()=>onPick(r.id)}>들어가기</button>{" "}
                    {r.role === "admin" &&
                      <button className="btn sm danger" disabled={busy}
                        onClick={()=>dropChurch(r)}>지우기</button>}
                  </React.Fragment>}
            </div>))}
        </React.Fragment>}

        {mode === "" && <React.Fragment>
          <div className="row" style={{marginTop:16}}>
            {canMake && <button className="btn" onClick={()=>setMode("new")}>+ 우리 교회 만들기</button>}
            <button className="btn ghost" onClick={()=>setMode("join")}>가입 코드로 신청</button>
            {isOwner && <button className="btn ghost" onClick={()=>setBoard(true)}>사용 현황</button>}
            <button className="btn ghost" style={{marginLeft:"auto"}} onClick={logout}>로그아웃</button>
          </div>
          {!canMake && <p className="small muted" style={{marginTop:10,marginBottom:0}}>
            한 계정으로는 교회를 하나만 만들 수 있습니다.
            다른 교회에 들어가시려면 그 교회의 <b>가입 코드</b>로 신청해 주세요.</p>}
          <p style={{margin:"18px 0 0",display:"flex",gap:14,justifyContent:"flex-end"}}>
            <a className="privacy-link" style={{fontSize:13}} href="privacy.html" target="_blank" rel="noopener">개인정보 처리방침</a>
            {wipe && <button className="text-link" onClick={wipe}>계정 지우기</button>}</p>
        </React.Fragment>}

        {mode === "new" && <div style={{marginTop:16}}>
          <h2>우리 교회 만들기</h2>
          <p className="small muted" style={{marginTop:0}}>
            교회를 만든 분이 <b>관리자</b>가 됩니다. 만들고 나면 <b>가입 코드</b>가 생기는데,
            그 코드를 교역자·속장님께 알려 주면 각자 가입 신청을 할 수 있습니다.</p>
          <div className="field"><label>교회 이름</label>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="예) 한빛교회" onKeyDown={e=>e.key==="Enter"&&makeChurch()}/></div>
          <div className="row">
            <button className="btn" disabled={busy || !name.trim()} onClick={makeChurch}>
              {busy ? "만드는 중…" : "만들기"}</button>
            <button className="btn ghost" onClick={()=>setMode("")}>취소</button>
          </div>
        </div>}

        {mode === "join" && <div style={{marginTop:16}}>
          <h2>가입 코드로 신청</h2>
          <p className="small muted" style={{marginTop:0}}>
            교회 관리자에게 받은 <b>6자리 코드</b>를 넣어 주세요. 신청 뒤 관리자가 승인하면 들어갈 수 있습니다.</p>
          <div className="field"><label>가입 코드</label>
            <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())}
              placeholder="ABC123" maxLength={6}
              style={{letterSpacing:"4px", fontSize:"18px", fontWeight:700, textAlign:"center"}}
              onKeyDown={e=>e.key==="Enter"&&joinChurch()}/></div>
          <div className="row">
            <button className="btn" disabled={busy || code.length<4} onClick={joinChurch}>
              {busy ? "신청 중…" : "신청하기"}</button>
            <button className="btn ghost" onClick={()=>setMode("")}>취소</button>
          </div>
        </div>}
      </div>
    </div>
  );
}

/* ───────── 최상위 ───────── */
/* 메일의 재설정 링크로 들어왔는지 — 화면이 그려지기 전에 먼저 봐 둡니다 */
const RECOVERY_AT_START = (() => {
  try{
    const h = String(location.hash || "") + String(location.search || "");
    return /type=recovery/.test(h) || /[?&]code=/.test(h);
  }catch(_){ return false; }
})();

function Root(){
  const embedded = !!(EMBED_URL && EMBED_KEY);
  const [cfg, setCfg] = useState(()=>{
    if(EMBED_URL && EMBED_KEY) return {url:EMBED_URL, key:EMBED_KEY};
    try{ const c = JSON.parse(localStorage.getItem(CFG_KEY)); if(c && c.url && c.key) return c; }catch(e){}
    return null;
  });
  const sb = useMemo(()=> cfg ? supabase.createClient(cfg.url, cfg.key) : null, [cfg]);
  const [session, setSession] = useState(undefined); // undefined=확인 중
  const [needPw, setNeedPw] = useState(RECOVERY_AT_START);  // 새 비밀번호를 정해야 하는 상태
  const [profile, setProfile] = useState(undefined);

  useEffect(()=>{
    if(!sb){ setSession(null); return; }
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((e, s)=>{
      setSession(s||null);
      /* 메일의 '비밀번호 재설정' 링크로 들어온 경우 */
      if(e === "PASSWORD_RECOVERY") setNeedPw(true);
    });
    /* 새로고침 등으로 이벤트를 놓쳤을 때를 위해 주소도 함께 봅니다 */
    if(RECOVERY_AT_START) setNeedPw(true);
    return ()=>sub.subscription.unsubscribe();
  }, [sb]);

  /* 고른 교회 */
  const [churchId, setChurchId] = useState(()=>{
    try{ return localStorage.getItem(PICK_KEY) || ""; }catch(_){ return ""; }
  });
  const pickChurch = id => { try{ localStorage.setItem(PICK_KEY, id); }catch(_){} setChurchId(id); };
  const leaveChurch = () => { try{ localStorage.removeItem(PICK_KEY); sessionStorage.setItem(LEFT_KEY, "1"); }catch(_){} setChurchId(""); setProfile(undefined); };

  const loadProfile = useCallback(async ()=>{
    if(!sb || !session || !churchId){ setProfile(undefined); return; }
    const {data, error} = await sb.from("church_users")
      .select("role,name,email").eq("church_id", churchId).eq("user_id", session.user.id).maybeSingle();
    if(!error && data){
      setProfile({id:session.user.id, email:data.email || session.user.email,
                  name:data.name || "", role:data.role, guestOwner:false});
      return;
    }
    /* 그 교회 소속이 아님 — 교회이음 운영자면 살펴보기로 들어갑니다 */
    const ow = await sb.rpc("is_app_owner");
    if(!ow.error && ow.data === true){
      setProfile({id:session.user.id, email:session.user.email,
                  name:"교회이음 운영자", role:"admin", guestOwner:true});
      return;
    }
    setProfile(null);
  }, [sb, session, churchId]);

  useEffect(()=>{ if(session && churchId) loadProfile(); }, [session, churchId, loadProfile]);

  const [lastCfg, setLastCfg] = useState(null);
  const saveCfg = c => { localStorage.setItem(CFG_KEY, JSON.stringify(c)); setCfg(c); };
  const resetServer = () => { setLastCfg(cfg); localStorage.removeItem(CFG_KEY); setCfg(null); };
  const logout = async () => { await sb.auth.signOut(); setProfile(undefined); };
  const [wipe, setWipe] = useState(false);   /* 계정 지우기 화면을 보는 중 */
  const wipeDone = async () => {
    try{ [PICK_KEY, LEFT_KEY, "churchSeenAt"].forEach(k => localStorage.removeItem(k));
         sessionStorage.removeItem(LEFT_KEY); }catch(_){}
    try{ await sb.auth.signOut(); }catch(_){}
    setWipe(false); setChurchId(""); setProfile(undefined);
  };

  if(!cfg) return <Setup onSave={saveCfg} initial={lastCfg}/>;
  if(session === undefined) return <div className="center-box"><div className="panel empty">서버에 연결하는 중…</div></div>;
  if(!session) return <Auth sb={sb} resetServer={resetServer} embedded={embedded}
      recoveryFailed={needPw}/>;
  if(needPw) return <NewPassword sb={sb} done={()=>{
      setNeedPw(false);
      try{ history.replaceState(null, "", location.pathname + location.search); }catch(_){}
    }}/>;
  if(wipe) return <DeleteAccount sb={sb} session={session} onClose={()=>setWipe(false)} onDone={wipeDone}/>;
  if(!churchId) return <ChurchPicker sb={sb} session={session} logout={logout} onPick={pickChurch}
      wipe={()=>setWipe(true)}/>;
  if(profile === undefined) return <div className="center-box"><div className="panel empty">사용자 정보를 확인하는 중…</div></div>;
  if(profile === null){ leaveChurch(); return <div className="center-box"><div className="panel empty">교회를 다시 고르는 중…</div></div>; }
  if(profile.role === "pending") return <Pending profile={profile} logout={logout} refresh={loadProfile} back={leaveChurch}
      wipe={()=>setWipe(true)}/>;
  return <App key={churchId} sb={sb} profile={profile} logout={logout} churchId={churchId} leaveChurch={leaveChurch}/>;
}

/* ───────── 앱 본체 ───────── */
function App({sb, profile, logout, churchId, leaveChurch}){
  const [churchName, setChurchName] = useState("우리교회");
  const [homePhoto, setHomePhoto] = useState(null);
  const [homePhotoReady, setHomePhotoReady] = useState(false);
  const [cfgNotice, setCfgNotice] = useState("");
  const [members, setMembers] = useState([]);
  const [att, setAtt] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [err, setErr] = useState("");
  /* 시작 화면 → 들어가기. 새로고침해도 유지되고, 앱을 닫으면 다시 대문부터 */
  const [entered, setEntered] = useState(()=>{
    try{ return sessionStorage.getItem("entered") === "1"; }catch(_){ return false; }
  });
  const enterApp = ()=>{
    try{ sessionStorage.setItem("entered", "1"); }catch(_){}
    setEntered(true);
  };
  const [view, setView] = useState("home");
  const [memView, setMemView] = useState({mode:"list"});
  const fileRef = useRef(null);
  const [leaders, setLeaders] = useState({});   /* {사용자ID: "여3"} 담당 속 */
  /* 교회학교 반: {부서키: {classes:[{id,name}], of:{교인ID:반ID}}} */
  const [schoolClasses, setSchoolClasses] = useState({});
  const [memberOrder, setMemberOrder] = useState([]);   /* 교인 배치 순서 (선임 먼저) */
  const [events, setEvents] = useState([]);   /* 교회 행사 [{id,date,endDate,title,place,note,kind}] */
  const [specials, setSpecials] = useState([]);  /* 특별예배 [{key,label,from,to}] */
  const [joinCode, setJoinCode] = useState("");
  const [cfgVer, setCfgVer] = useState(0);       /* 설정이 바뀌면 화면 다시 그리기 */
  const [helpUntil, setHelpUntil] = useState(null);   /* 교회가 열어 준 지원 마감 시각 */
  const [handover, setHandover] = useState(false);    /* 넘기기 전(관리자 첫 로그인 전) */
  /* 교회이음 운영자로 들어온 경우 — 지원이 열려 있을 때만 고칠 수 있습니다 */
  const guestOwner = !!profile.guestOwner;
  const helpOpen = !!helpUntil || handover;
  const ownerRead = guestOwner && !helpOpen;          /* 살펴보기만 */
  const isAdmin = profile.role === "admin" && !ownerRead;
  const myEnts = scopesOf(leaders, profile.id);                 /* ["ELDER:r","여3:w"] 같은 목록 */
  const oldRole = profile.role;                                 /* 예전 자료를 읽을 때만 씁니다 */
  const isW = e => entIsW(e, oldRole);

  /* 사람 범위로 쓰는 담당만 (보기 표시는 뺀다) */
  const rangeEnts = myEnts.filter(e => VIEW_FLAGS.indexOf(entKey(e)) < 0);
  const listEnts  = rangeEnts.filter(e => entKey(e) !== ATT_ONLY);
  const wideEnts  = rangeEnts.filter(e => entKey(e) === PASTOR || entKey(e) === ELDER);

  /* 교역자 담당을 받은 사람 (새 글 알림 대상) */
  const isPastorNow = myEnts.some(e => entKey(e) === PASTOR);
  /* 심방 기록 전체 보기 / 긴밀 기도 보기 — 따로 정합니다 */
  const canSeeVisits = isAdmin || ownerRead || myEnts.some(e => entKey(e) === VISIT_ALL || entKey(e) === CARE_ALL);
  const canSeeSecret = isAdmin || myEnts.some(e => entKey(e) === SECRET_ALL || entKey(e) === CARE_ALL);
  /* 성도·교회학교 전체를 보는 사람 */
  const fullView = isAdmin || wideEnts.length > 0 || ownerRead;   /* 운영자는 보기만 전체 */
  /* 담당이 하나도 없는 사람 — 달력과 일반 중보기도만 */
  const noScope = !fullView && rangeEnts.length === 0;
  /* 명단 없이 출석만 맡은 분 */
  const attOnly = !isAdmin && !fullView && rangeEnts.length > 0 && listEnts.length === 0;
  /* 담당이 있어 범위가 좁은 사람 */
  const isLeader = !isAdmin && !fullView && rangeEnts.length > 0;

  /* 이 교인을 볼 수 있는가 / 고칠 수 있는가 */
  const canViewM = m => isAdmin || listEnts.some(e => inScope(m, entKey(e)));
  const canWriteM = m => isAdmin || listEnts.some(e => isW(e) && inScope(m, entKey(e)));
  /* 출석 체크는 '수정'으로 준 담당 안에서만 (출석 체크만 담당 포함) */
  const canCheckMember = m => isAdmin || rangeEnts.some(e => isW(e) && inScope(m, entKey(e)));

  /* 화면 전체에 쓰는 큰 스위치 — 교역자에게 수정으로 준 경우 전체 편집 */
  const canEdit = isAdmin || wideEnts.some(e => entKey(e) === PASTOR && isW(e));
  const canCheckAtt = isAdmin || rangeEnts.some(isW);
  const isSchoolTeacher = listEnts.some(e => { const k = entKey(e); return k === "S_ALL" || k.indexOf("S_") === 0; });

  /* 장기결석자는 관리자·교역자에게만 보입니다 */
  const canSeeAbsent = isAdmin || isPastorNow;
  const seeable = canSeeAbsent ? members : members.filter(m => !isLongAbsent(m));
  /* 재적 교인 — 교인 수·출석·생일에 쓰는 명단 (장기결석자 제외) */
  const activeMembers = members.filter(m => !isLongAbsent(m));

  /* 속장은 자기 담당만, 전체 담당이면 모두 */
  const myMembers = fullView ? seeable : seeable.filter(canViewM);
  const attMembers = fullView ? activeMembers
    : activeMembers.filter(m => rangeEnts.some(e => inScope(m, entKey(e))));

  /* 이 사람의 정보를 고칠 수 있는가 — 교사는 자기 담당 학생만 */
  const canEditMember = (m) => {
    if(canEdit) return true;
    return !!m && canWriteM(m);        /* '수정'으로 받은 담당 범위 안이면 고칠 수 있습니다 */
  };
  /* 속장·교사가 담당 범위 밖이라도 볼 수 있는 사람: 담당 교인과 가족으로 이어진 분 (한 다리까지) */
  const viewMembers = useMemo(()=>{
    if(!isLeader) return seeable;
    const mine = myMembers;
    const mineIds = new Set(mine.map(x=>x.id));
    const nm = s => (s||"").trim();
    const famNames = new Set();
    mine.forEach(x => (x.family||[]).forEach(f => { if(nm(f.name)) famNames.add(nm(f.name)); }));
    const myNames = new Set(mine.map(x=>nm(x.name)).filter(Boolean));
    const extra = seeable.filter(x =>
      !mineIds.has(x.id) && (
        famNames.has(nm(x.name)) ||                                   /* 담당 교인의 가족란에 있는 분 */
        (x.family||[]).some(f => myNames.has(nm(f.name)))             /* 그분의 가족란에 담당 교인이 있는 경우 */
      ));
    return [...mine, ...extra];
  }, [isLeader, members, myMembers]);

  const fail = e => setErr("저장/불러오기에 실패했습니다 — 원인: " + errMsg(e) + " · 이 문구를 Claude에게 보여주시면 해결할 수 있습니다.");

  const loadAll = useCallback(async ()=>{
    setErr(""); setCfgNotice(""); setHomePhotoReady(false);
    const ch = await sb.from("churches").select("name,join_code,help_until,handover_open").eq("id", churchId).maybeSingle();
    if(ch && ch.data){
      const hu = ch.data.help_until ? new Date(ch.data.help_until) : null;
      setHelpUntil((hu && hu > new Date()) ? hu : null);
      setHandover(!!ch.data.handover_open);
    }
    if(ch.data){ setChurchName(ch.data.name || "우리교회"); setJoinCode(ch.data.join_code || ""); }
    const [m, a, s] = await Promise.all([
      sb.from("members").select("id,data").eq("church_id", churchId),
      sb.from("attendance").select("date,service,ids").eq("church_id", churchId),
      sb.from("settings").select("key,value").eq("church_id", churchId),
    ]);
    if(m.error) return fail(m.error);
    if(a.error) return fail(a.error);
    setMembers((m.data||[]).filter(r=>r && r.data).map(r=>cleanMember(r.data)).filter(Boolean));
    const na = {};
    (a.data||[]).filter(r=>r && r.date && r.service).forEach(r=>{ na[r.date] = na[r.date]||{}; na[r.date][r.service] = r.ids||[]; });
    setAtt(na);
    if(s.error) fail(s.error);
    if(!s.error){
      try{
        setHomePhoto(parseChurchHomePhoto(s.data)); setHomePhotoReady(true);
      }catch(photoError){
        setErr("홈 사진을 불러오지 못했습니다. 다시 불러오기를 눌러 주세요. " + errMsg(photoError));
      }
      CHURCH_MOTTO = null;   /* 다른 교회 표어가 남지 않게 */
      const cc = (s.data||[]).find(r=>r && r.key==="churchConfig");
      if(cc && cc.value){ try{ applyChurchConfig(JSON.parse(cc.value)); setCfgVer(v=>v+1); }catch(_){} }
      const sp = (s.data||[]).find(r=>r.key==="specialServices");
      if(sp && sp.value){ try{ setSpecials(JSON.parse(sp.value)||[]); }catch(_){ setSpecials([]); } }
      else setSpecials([]);
      const ev = (s.data||[]).find(r=>r.key==="events");
      if(ev && ev.value){ try{ setEvents(JSON.parse(ev.value)||[]); }catch(_){ setEvents([]); } }
      else setEvents([]);
      const mo = (s.data||[]).find(r=>r.key==="memberOrder");
      { let arr = []; if(mo && mo.value){ try{ const v = JSON.parse(mo.value); if(Array.isArray(v)) arr = v; }catch(_){} }
        setMemberRank(arr); setMemberOrder(arr); }
      const sc = (s.data||[]).find(r=>r.key==="schoolClasses");
      if(sc && sc.value){ try{ setSchoolClasses(JSON.parse(sc.value)||{}); }catch(_){ setSchoolClasses({}); } }
      const ld = (s.data||[]).find(r=>r.key==="leaders");
      if(ld && ld.value){ try{ setLeaders(JSON.parse(ld.value)||{}); }catch(_){ setLeaders({}); } }
      else setLeaders({});
    }
    setLoaded(true);
  }, [sb, churchId]);

  useEffect(()=>{ if(churchId) loadAll(); }, [loadAll, churchId]);

  /* ── 서버 쓰기 ── */
  const saveMemberRow = async (m0) => {
    const m = cleanText(m0);
    /* 큰 사진은 저절로 줄여서 저장합니다 */
    if(typeof m.photo === "string" && m.photo.startsWith("data:image") && photoKB(m.photo) > 12){
      const small = await shrinkPhoto(m.photo);
      if(small && small.length < m.photo.length) m.photo = small;
    }
    setMembers(ms => ms.some(x=>x.id===m.id) ? ms.map(x=>x.id===m.id?m:x) : [...ms, m]);
    const {error} = await sb.from("members")
      .upsert({church_id:churchId, id:m.id, data:m});
    if(error){ fail(error); loadAll(); }
  };
  const updateMember = (id, fn) => {
    const cur = members.find(x=>x.id===id); if(!cur) return;
    saveMemberRow(fn(cur));
  };
  /* 여러 명 고치기 — 서버의 bulk_save_members 가 관리자인지 다시 확인합니다 */
  const bulkSaveMembers = async (rows) => {
    const {data, error} = await sb.rpc("bulk_save_members", {c: churchId, rows});
    if(error){
      const msg = String(error.message || "");
      if(/function|does not exist|찾을 수 없/i.test(msg))
        alert("서버에 '단체수정' 기능이 아직 없습니다.\n교회이음에 문의해 주세요. (bulk_save_members)");
      else alert("바꾸지 못했습니다. " + errMsg(error));
      loadAll();
      throw error;
    }
    /* 저장한 사람을 정리해서 화면에 넣습니다. 엑셀로 새로 등록한 분도 새로고침 없이 바로 보이게 덧붙입니다 */
    const clean = (rows||[]).map(cleanMember).filter(r=>r && r.id);
    setMembers(ms => {
      const byId = new Map(clean.map(r=>[r.id, r]));
      const next = ms.map(x => (x && byId.has(x.id)) ? byId.get(x.id) : x);
      const have = new Set(ms.filter(Boolean).map(x=>x.id));
      clean.forEach(r => { if(!have.has(r.id)) next.push(r); });
      return next;
    });
    return data;
  };

  /* 예전에 넣어 둔 큰 사진은 관리자가 들어올 때 저절로 줄입니다 (진행 상황을 위 띠에 보여 줍니다) */
  const shrunkRef = useRef(false);
  const [photoJob, setPhotoJob] = useState("");
  useEffect(() => {
    if(!isAdmin || shrunkRef.current || !members.length) return;
    const big = members.filter(m => m && typeof m.photo === "string"
      && m.photo.startsWith("data:image") && photoKB(m.photo) > 12);
    if(!big.length) return;
    shrunkRef.current = true;
    (async () => {
      const out = []; let before = 0, after = 0;
      for(let i = 0; i < big.length; i++){
        const m = big[i];
        setPhotoJob(`사진 정리 중 ${i + 1}/${big.length}`);
        const p = await shrinkPhoto(m.photo);
        if(p && p.length < m.photo.length){ before += photoKB(m.photo); after += photoKB(p); out.push({...m, photo:p}); }
        if(i % 5 === 0) await new Promise(r => setTimeout(r, 0));   /* 화면이 멈추지 않게 */
      }
      if(!out.length){ setPhotoJob(""); return; }
      try{
        for(let i = 0; i < out.length; i += 40){
          setPhotoJob(`사진 저장 중 ${Math.min(i + 40, out.length)}/${out.length}`);
          await bulkSaveMembers(out.slice(i, i + 40));
        }
        setPhotoJob(`사진 ${out.length}장 정리 완료 (${before}KB → ${after}KB)`);
        setTimeout(() => setPhotoJob(""), 8000);
      }catch(e){
        shrunkRef.current = false;
        setPhotoJob("사진 정리 실패 — " + errMsg(e));
      }
    })();
  }, [isAdmin, members.length]);

  /* 운영자가 들어오면 기록을 남기고, 교회 관리자가 처음 들어오면 넘기기를 닫습니다 */
  const notedRef = useRef("");
  useEffect(() => {
    if(!sb || !churchId || !profile) return;
    if(notedRef.current === churchId) return;
    notedRef.current = churchId;
    (async () => {
      try{
        if(guestOwner) await sb.rpc("owner_note", {c: churchId, p_action: "view", p_detail: "살펴보기로 접속"});
        else if(profile.role === "admin") await sb.rpc("claim_admin", {c: churchId});
      }catch(_){}
    })();
  }, [sb, churchId, profile && profile.role, guestOwner]);

  const [logs, setLogs] = useState(null);
  const loadLogs = async () => {
    const {data, error} = await sb.from("owner_log")
      .select("id,at,who_email,action,detail").eq("church_id", churchId)
      .order("at", {ascending:false}).limit(50);
    if(error){ fail(error); return; }
    setLogs(Array.isArray(data) ? data : []);
  };

  /* 교회 관리자가 지원을 열고 닫습니다 */
  const setHelp = async (hours) => {
    const {data, error} = await sb.rpc("set_help", {c: churchId, hours});
    if(error){ fail(error); return; }
    setHelpUntil(data ? new Date(data) : null);
    if(!hours) setHandover(false);
  };

  const removeMember = async (id) => {
    setMembers(ms=>ms.filter(x=>x.id!==id));
    const {error} = await sb.from("members").delete().eq("church_id", churchId).eq("id", id);
    if(error){ fail(error); loadAll(); return; }
    // 출석 기록에서도 제거
    const updates = [];
    const na = {};
    for(const d in att){
      na[d] = {};
      for(const s in att[d]){
        const ids = att[d][s];
        if(ids.includes(id)){
          const nids = ids.filter(x=>x!==id);
          na[d][s] = nids;
          updates.push({church_id:churchId, date:d, service:s, ids:nids});
        }else na[d][s] = ids;
      }
    }
    setAtt(na);
    if(updates.length){
      const {error:e2} = await sb.from("attendance").upsert(updates);
      if(e2){ fail(e2); loadAll(); }
    }
  };
  /* 출석 — 서버에서 최신 명단을 읽어 누른 사람만 더하거나 뺍니다.
     예전처럼 명단 전체를 덮어쓰지 않으므로, 여러 속장이 동시에 체크해도 서로 지워지지 않습니다. */
  const markAtt = async (date, service, ids, on) => {
    const list = (Array.isArray(ids) ? ids : [ids]).filter(Boolean);
    if(!list.length) return;
    setAtt(a => {
      const cur = (a[date] && a[date][service]) || [];
      const next = on ? [...cur, ...list.filter(id => !cur.includes(id))] : cur.filter(id => !list.includes(id));
      return {...a, [date]: {...(a[date] || {}), [service]: next}};
    });
    const {data, error} = await sb.rpc("att_mark", {c: churchId, p_date: date, p_service: service, p_ids: list, p_on: !!on});
    if(error){
      const msg = String(error.message || "");
      if(/function|does not exist|찾을 수 없/i.test(msg)) return markAttFallback(date, service, list, on);
      if(/권한이 없습니다/.test(msg)){
        alert("출석을 저장하지 못했습니다.\n\n이 계정은 서버에서 '보기 전용'으로 되어 있습니다.\n교회 관리자께 알려 주시면 사용자 화면에서 다시 승인해 바로잡을 수 있습니다.");
        return refreshAtt();
      }
      fail(error); return refreshAtt();
    }
    if(Array.isArray(data)) setAtt(a => ({...a, [date]: {...(a[date] || {}), [service]: data}}));
  };

  /* 서버에 att_mark 기능이 아직 없을 때 — 최신 명단을 읽어 합친 뒤 저장합니다 */
  const markAttFallback = async (date, service, list, on) => {
    const {data, error} = await sb.from("attendance").select("ids")
      .eq("church_id", churchId).eq("date", date).eq("service", service).maybeSingle();
    if(error){ fail(error); return refreshAtt(); }
    const cur = (data && Array.isArray(data.ids)) ? data.ids : [];
    const next = on ? [...cur, ...list.filter(id => !cur.includes(id))] : cur.filter(id => !list.includes(id));
    const {error: e2} = await sb.from("attendance").upsert({church_id: churchId, date, service, ids: next});
    if(e2){ fail(e2); return refreshAtt(); }
    setAtt(a => ({...a, [date]: {...(a[date] || {}), [service]: next}}));
  };

  /* 출석 기록만 다시 불러오기 (다른 분이 체크한 것을 받아 옵니다) */
  const refreshAtt = async () => {
    const {data, error} = await sb.from("attendance").select("date,service,ids").eq("church_id", churchId);
    if(error || !Array.isArray(data)) return;
    const na = {};
    data.forEach(r => { if(!r) return; na[r.date] = {...(na[r.date] || {}), [r.service]: Array.isArray(r.ids) ? r.ids : []}; });
    setAtt(na);
  };

  const saveAtt = async (date, service, ids) => {
    setAtt(a=>({...a, [date]:{...(a[date]||{}), [service]:ids}}));
    const {error} = await sb.from("attendance")
      .upsert({church_id:churchId, date, service, ids});
    if(error){ fail(error); loadAll(); }
  };
  const renameChurch = async () => {
    const n = prompt("교회 이름을 입력하세요", churchName);
    if(!n || !n.trim()) return;
    setChurchName(n.trim());
    const {error} = await sb.from("churches").update({name:n.trim()}).eq("id", churchId);
    if(error) fail(error);
  };

  /* ── 백업 ── */
  const doExport = async () => {
    try{
      const b = await buildChurchBackup(sb, churchId, churchName);
      saveJson(`${(churchName || "교회").replace(/[\\/:*?"<>|]/g, "")}_백업_${todayStr()}.json`, b);
    }catch(e){ fail(e); }
  };
  const [pendingImport, setPendingImport] = useState(null);
  const doImport = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try{
        let d = JSON.parse(r.result);
        if(d && d.kind === "all" && Array.isArray(d.churches)){
          const list = d.churches.filter(c => c && Array.isArray(c.members));
          let pick = list.find(c => c.churchId === churchId);
          if(!pick){
            const names = list.map((c, i) => `${i + 1}. ${c.churchName || "이름 없음"} (교인 ${c.members.length}명)`).join("\n");
            const n = prompt(`전체 백업 파일입니다. 이 교회의 기록이 들어 있지 않습니다.\n어느 교회 기록을 넣을지 번호를 적어 주세요.\n\n${names}`, "");
            if(n === null) return;
            pick = list[Number(n) - 1];
            if(!pick){ alert("번호가 맞지 않아 넣지 않았습니다."); return; }
          }
          d = pick;
        }
        if(!d || !Array.isArray(d.members)) throw new Error("형식 오류");
        setPendingImport(d);
      }catch(e){ alert("백업 파일을 읽지 못했습니다. 이 프로그램에서 내보낸 JSON 파일인지 확인해 주세요."); }
    };
    r.readAsText(file);
  };
  const runImport = async (mode) => {
    const d = pendingImport;
    setPendingImport(null);
    setErr("");
    let e;
    if(mode === "replace"){
      ({error:e} = await sb.from("members").delete().eq("church_id", churchId)); if(e) return fail(e);
      ({error:e} = await sb.from("attendance").delete().eq("church_id", churchId)); if(e) return fail(e);
    }
    const curById = {};
    if(mode === "merge") members.forEach(x=>{ curById[x.id] = x; });
    const rows = (d.members||[]).map(cleanText).map(im=>{
      const data = (mode === "merge" && im.id && curById[im.id]) ? mergeMember(curById[im.id], im) : im;
      return {church_id:churchId, id:im.id||uid(), data};
    });
    for(let i=0;i<rows.length;i+=100){
      ({error:e} = await sb.from("members").upsert(rows.slice(i,i+100))); if(e) return fail(e);
    }
    const attIn = d.att||{};
    const arows = [];
    for(const dt in attIn) for(const s in attIn[dt]){
      let ids = attIn[dt][s]||[];
      if(mode === "merge"){
        const cur = (att[dt] && att[dt][s]) || [];
        ids = Array.from(new Set([...cur, ...ids]));
      }
      if(ids.length) arows.push({church_id:churchId, date:dt, service:s, ids});
    }
    for(let i=0;i<arows.length;i+=100){
      ({error:e} = await sb.from("attendance").upsert(arows.slice(i,i+100))); if(e) return fail(e);
    }
    /* 파일에 교회 설정(예배·직분·속회 편성 등)이 함께 담겨 있으면 넣습니다 */
    let cfgDone = false;
    const sameChurch = d.churchId && d.churchId === churchId;
    const extra = Array.isArray(d.settings) ? d.settings.filter(x => x && x.key && x.key !== "churchConfig") : [];
    if(sameChurch && extra.length && profile.role === "admin"){
      const ok = confirm(
        "이 파일에는 교회 설정(예배 종류 · 직분 · 속회 편성 · 담당 지정 · 행사 · 교회학교 반 · 홈 사진)이 함께 들어 있습니다.\n\n" +
        "설정도 이 파일의 내용으로 되돌릴까요?\n[취소]를 누르면 명단과 출석만 넣고 설정은 그대로 둡니다.");
      if(ok){
        const srows = (d.settings || []).filter(x => x && x.key).map(x => ({church_id:churchId, key:x.key, value:x.value}));
        for(let i=0;i<srows.length;i+=50){
          ({error:e} = await sb.from("settings").upsert(srows.slice(i,i+50))); if(e) return fail(e);
        }
        cfgDone = true;
      }
    }
    else if(d.config && typeof d.config === "object" && profile.role === "admin"){
      const ok = confirm(
        "이 파일에는 교회 설정(예배 종류 · 직분 · 속회 편성)도 들어 있습니다.\n\n" +
        "지금 설정을 이 파일의 내용으로 바꿀까요?\n" +
        "[취소]를 누르면 명단만 넣고 설정은 그대로 둡니다.");
      if(ok){
        ({error:e} = await sb.from("settings").upsert({church_id:churchId, key:"churchConfig", value:JSON.stringify(d.config)}));
        if(e) return fail(e);
        cfgDone = true;
      }
    }
    await loadAll();
    alert((mode === "merge" ? "명단을 합쳐 넣었습니다." : "가져오기(전체 교체)가 완료되었습니다.")
      + (cfgDone ? "\n교회 설정도 함께 바꿨습니다." : ""));
  };

  const saveConfig = async (next, nextPhoto) => {
    if(!homePhotoReady) throw new Error("설정을 먼저 다시 불러온 뒤 저장해 주세요.");
    const savedPhoto = await persistChurchSettings(sb, churchId, profile.role, next, nextPhoto);
    applyChurchConfig(next); setHomePhoto(savedPhoto);
    setCfgNotice("설정을 저장했습니다. 교회 사진이 홈 화면에 반영되었습니다.");
    setCfgVer(v=>v+1);
  };

  const saveSpecials = async (next) => {
    setSpecials(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"specialServices", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveEvents = async (next) => {
    setEvents(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"events", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveClasses = async (next) => {
    setSchoolClasses(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"schoolClasses", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveOrder = async (groupIds) => {
    const next = placeOrder(members, groupIds);
    setMemberRank(next); setMemberOrder(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"memberOrder", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); throw error; }
  };
  const canOrder = canEdit && !isLeader;   /* 순서는 교회 전체에 쓰이므로 관리자·교역자(수정)만 바꿉니다 */

  const saveLeaders = async (next) => {
    setLeaders(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"leaders", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const byId = id => members.find(m => m.id === id);
  
  /* 뒤로 가기: 지나온 화면을 쌓아 두었다가 한 걸음씩 되돌아감 */
  const histRef = useRef([]);
  const [histLen, setHistLen] = useState(0);
  const nowScreen = useRef({view:"home", memView:{mode:"list"}});
  nowScreen.current = {view, memView};

  const pushHistory = (from) => {
    const cur = from || nowScreen.current;
    const last = histRef.current[histRef.current.length-1];
    /* 같은 화면이면 쌓지 않음 */
    if(last && last.view===cur.view &&
       (last.memView||{}).mode===(cur.memView||{}).mode &&
       (last.memView||{}).id===(cur.memView||{}).id) return;
    histRef.current = [...histRef.current.slice(-29), cur];
    setHistLen(histRef.current.length);
  };
  const goBack = () => {
    if(!histRef.current.length) return;
    const prev = histRef.current[histRef.current.length-1];
    histRef.current = histRef.current.slice(0, -1);
    setHistLen(histRef.current.length);
    setView(prev.view);
    setMemView(prev.memView || {mode:"list"});
    window.scrollTo(0,0);
  };

  const go = v => {
    const allowed = navItems.some(x => x[0] === v);
    if(!allowed) return;
    if(v !== view) pushHistory();
    setView(v); if(v==="members") setMemView({mode:"list"}); window.scrollTo(0,0);
  };
  const openMember = id => {
    if(attOnly) return;
    if(isLeader && !viewMembers.some(m=>m.id===id)) return;
    pushHistory();
    setView("members"); setMemView({mode:"detail", id}); window.scrollTo(0,0);
  };

  let navItems;
  if(noScope){
    navItems = [["home","홈"],["cal","달력"],["pray","중보기도"]];
  } else if(attOnly){
    navItems = [["home","홈"],["att","예배 출석 체크"]];
  } else if(fullView && !isAdmin){
    navItems = [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["pray","중보기도"]];
  } else if(isLeader){
    const keys = listEnts.map(entKey);
    navItems = [["home","홈"],
      ["members", keys.every(k=>k.indexOf("S_")===0) ? "우리 부서"
                : keys.some(k=>k.indexOf("S_")===0) ? "담당 교인" : "우리 속 교인"],
      ["att", canCheckAtt ? "출석 체크" : "출석"],["cal","달력"],["pray","중보기도"]];
  } else {
    navItems = [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["pray","중보기도"]];
  }
  if(canSeeVisits && !noScope){
    const at = navItems.findIndex(x=>x[0]==="pray");
    navItems.splice(at >= 0 ? at : navItems.length, 0, ["visit","심방"]);
  }
  if(isAdmin){ navItems.push(["team","사용자"]); navItems.push(["cfg","설정"]); }

  if(!entered) return <Gate churchName={churchName} onEnter={enterApp} isAdmin={isAdmin} isPastor={isPastorNow}
      userName={profile.name || profile.email} onLogout={logout}/>;

  return (
    <div>
      {pendingImport && (
        <div className="modal-back" onClick={()=>setPendingImport(null)}>
          <div className="panel" onClick={e=>e.stopPropagation()}>
            <h2>명단 가져오기</h2>
            <p className="small">파일에 교인 <b>{pendingImport.members.length}명</b>의 기록이 있습니다. 어떻게 넣을까요?</p>
            <button className="btn" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("merge")}>
              추가하기 — 기존 기록은 그대로 두고 합침 (권장)</button>
            <button className="btn danger" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("replace")}>
              전체 교체 — 기존 교인·출석 기록을 지우고 이 파일로 바꿈</button>
            <button className="btn ghost" style={{width:"100%"}} onClick={()=>setPendingImport(null)}>취소</button>
            <p className="muted small" style={{marginTop:10,marginBottom:0}}>
              추가하기를 누르면 새 교인은 추가되고, 같은 교인(같은 고유번호)은 파일 내용으로 갱신됩니다. 모든 사용자에게 함께 적용됩니다.</p>
          </div>
        </div>
      )}
      <header className="top">
        <div className="top-in">
          <div className="brand">
            <button className="logo-btn" onClick={()=>{ setEntered(false); window.scrollTo(0,0); }}
              title="시작 화면으로">
              <Logo/>
            </button>
            <button onClick={isAdmin ? renameChurch : undefined} title={isAdmin?"교회 이름 수정":""}>{churchName} 교인 관리</button>
          </div>
          <button className={"back-btn"+(histLen>0?"":" off")} onClick={goBack}
            title="이전 화면으로" aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>‹ 뒤로</button>
          <nav>
            {navItems.map(([k,l])=>(
              <button key={k} className={view===k?"on":""} onClick={()=>go(k)}>
                <span className="nv-long">{l}</span>
                <span className="nv-short">{TAB_SHORT[l] || l}</span></button>
            ))}
          </nav>
          <div className="top-right">
            <button className="backup-btn refresh-btn" title="새로 불러오기"
              onClick={()=>window.location.reload()} aria-label="새로 불러오기">⟳</button>
            {guestOwner && <span className={"owner-flag" + (helpOpen ? " open" : "")}
              title={helpOpen
                ? (helpUntil ? `교회이음 운영자 · 지원 허용 중 (${helpUntil.toLocaleString("ko-KR")} 까지)` : "교회이음 운영자 · 넘기기 전이라 고칠 수 있습니다")
                : "교회이음 운영자 · 살펴보기만 할 수 있습니다"}>
              <span className="of-long">교회이음 운영자 · {helpOpen
                ? (helpUntil ? `지원 허용 중 (${helpUntil.toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"numeric"})}까지)` : "넘기기 전 — 고칠 수 있음")
                : "살펴보기만"}</span>
              <span className="of-short">운영자 · {helpOpen ? "지원 중" : "보기만"}</span></span>}
            {photoJob && <span className="photo-job" title="예전에 넣은 큰 사진을 작게 줄이는 중입니다">{photoJob}</span>}
            {leaveChurch && <button className="backup-btn" onClick={leaveChurch} title="다른 교회로">
              교회<span className="me-name"> 바꾸기</span></button>}
            <button className="backup-btn" onClick={logout}>
              <span className="me-name">{profile.name || "나"} · </span>로그아웃</button>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
              onChange={e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=""; }}/>
          </div>
        </div>
      </header>

      {/* 휴대폰에서는 메뉴를 아래쪽 탭바로 */}
      <nav className="tabbar" aria-label="화면 이동">
        <button className={"tab"+(histLen>0?"":" off")} onClick={goBack}
          aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>
          <span className="tab-ico">‹</span><span className="tab-lab">뒤로</span></button>
        {navItems.map(([k,l])=>(
          <button key={k} className={"tab"+(view===k?" on":"")} onClick={()=>go(k)}>
            <span className="tab-ico">{TAB_ICON[k] || "•"}</span>
            <span className="tab-lab">{TAB_SHORT[l] || l}</span>
          </button>))}
      </nav>

      {profile.guestOwner && <div className="owner-bar">
        교회이음 운영자로 <b>{churchName}</b> 를 살펴보고 있습니다.
        이 교회의 구성원 목록에는 나타나지 않습니다.
        <button className="btn sm ghost" onClick={leaveChurch}>나가기</button>
      </div>}

      <div className="wrap">
        {err && <div className="err-banner">{err} <button className="btn sm ghost" onClick={loadAll}>다시 불러오기</button></div>}
        {!loaded ? <div className="panel empty">기록을 불러오는 중…</div> : <React.Fragment>
        {isLeader && <div className="panel" style={{padding:"12px 16px",marginBottom:12}}>
          <b>{myEnts.map(e => scopeLabel(entKey(e)) + (isW(e) ? " (수정)" : " (열람)")).join(" · ")}</b> 담당으로 접속 중입니다.
          <span className="muted small">
            {attOnly
              ? ` · 성도 ${attMembers.length}명의 예배 출석만 체크하실 수 있습니다. 교인 신상은 보이지 않습니다.`
              : myEnts.some(e => entKey(e) === ATT_ONLY)
              ? ` · 예배 출석은 ${attMembers.length}명 전체를 체크하시고, 교인 명단은 담당 ${myMembers.length}명만 보입니다.`
              : ` · ${myMembers.length}명의 신상을 보고 출석을 체크하실 수 있습니다.`}
            {isSchoolTeacher && " 담당 부서 학생의 정보는 직접 수정하실 수 있습니다."}</span>
        </div>}
        {view==="home" && <Home churchName={churchName} homePhoto={homePhoto} members={attOnly ? [] : myMembers.filter(m => !isLongAbsent(m))} att={att} go={go} openMember={openMember}
          showNew={isAdmin || isPastorNow} canSeeVisits={canSeeVisits} canSeeSecret={canSeeSecret} meId={profile.id}
          listOK={!noScope && !attOnly} attOK={!noScope} canAddMember={canEdit}/>}
        {view==="members" && attOnly &&
          <p className="empty">예배 출석 체크만 맡으셨습니다. 교인 명부는 볼 수 없습니다.</p>}
        {view==="members" && !attOnly && (
          memView.mode==="list" ? <MemberList members={myMembers}
            setMemView={v=>{ pushHistory({view:"members", memView:{mode:"list"}}); setMemView(v); }} canEdit={canEdit}
            schoolClasses={schoolClasses} saveClasses={saveClasses}
            canOrder={canOrder} saveOrder={saveOrder} orderVer={memberOrder.length}

        {view==="team" && isAdmin && <Team sb={sb} me={profile} leaders={leaders} saveLeaders={saveLeaders}

        </React.Fragment>}

/* 담당 목록을 보고 '실제로 할 수 있는 일'을 한 줄로 풀어 줍니다 */
function abilityOf(role, ents){
  if(role === "admin") return {can:"모든 기능", cant:""};
  if(role === "pending") return {can:"", cant:"승인을 기다리는 중입니다"};
  const es = ents || [];
  const key = e => entKey(e);
  const w   = e => entIsW(e, role);
  const wide = es.filter(e => key(e) === PASTOR || key(e) === ELDER);
  const seeV = es.some(e => key(e) === VISIT_ALL || key(e) === CARE_ALL);
  const seeS = es.some(e => key(e) === SECRET_ALL || key(e) === CARE_ALL);
  const range = es.filter(e => VIEW_FLAGS.indexOf(key(e)) < 0);
  const list  = range.filter(e => key(e) !== ATT_ONLY && key(e) !== PASTOR && key(e) !== ELDER);
  const can = [], cant = [];

  if(!range.length){ 
    return {can:"달력·일반 중보기도 보기", cant:"교인 명부 못 봄"};
  }
  if(wide.length) can.push("성도·교회학교 전체 보기");
  if(list.length) can.push(list.map(e => scopeLabel(key(e))).join(", ") + " 보기");
  if(!wide.length && !list.length) can.push("출석 명단만 보기");

  const wr = range.filter(w);
  if(wr.some(e => key(e) === PASTOR)) can.push("교인 신상 수정(전체) · 출석 체크(전체)");
  else {
    const wl = wr.filter(e => key(e) !== ATT_ONLY);
    if(wl.length){
      const nm = wl.map(e => key(e) === ELDER ? "전체" : scopeLabel(key(e))).join(", ");
      can.push("교인 신상 수정(" + nm + ") · 출석 체크(" + nm + ")");
    }
    if(wr.some(e => key(e) === ATT_ONLY)) can.push("출석 체크(성도 전체)");
    if(!wr.length) cant.push("수정 안 됨 · 출석 체크 안 됨 (모두 열람으로 주셨습니다)");
  }
  if(seeV) can.push("심방 기록 전체 보기");
  if(seeS) can.push("긴밀 기도 보기");
  if(!seeV && (list.length || wide.length)) cant.push("남이 쓴 심방 기록 못 봄");
  return {can: can.join(" · "), cant: cant.join(" · ")};
}

/* ───────── 대문 ───────── */
/* 마지막으로 확인한 시각 (이 기기에 기억해 둡니다) */
const SEEN_KEY = "churchSeenAt";
const readSeen = () => { try{ return localStorage.getItem(SEEN_KEY) || ""; }catch(_){ return ""; } };
const writeSeen = v => { try{ localStorage.setItem(SEEN_KEY, v); }catch(_){} };

/* 지난번 확인 뒤로 새로 올라온 중보기도·심방 */
function collectNew(members, since, seeSecret, seeVisits){
  const out = [];
  (members||[]).filter(Boolean).forEach(m => {
    (m.prayers||[]).forEach(p => {
      if(!seeSecret && p.secret) return;
      const when = p.date || "";
      if(when && when > since) out.push({kind:"기도", id:p.id, memId:m.id, memName:m.name,
        when, by:p.by || "", text:p.request || "", secret:!!p.secret});
    });
    if(seeVisits === false) return;   /* 남이 쓴 심방을 볼 수 없는 분에게는 심방을 알리지 않습니다 */
    (m.visits||[]).forEach(v => {
      const when = (v.when || "").slice(0,10);
      if(when && when > since) out.push({kind:"심방", id:v.id, memId:m.id, memName:m.name,
        when, by:v.by || "", text:(v.purpose ? v.purpose + " — " : "") + (v.note || "")});
    });
  });
  return out.sort((a,b)=> b.when.localeCompare(a.when));
}

function NewFeed({members, seeSecret, seeVisits, openMember}){
  const [since, setSince] = useState(readSeen);
  const [open, setOpen] = useState(false);
  const items = useMemo(()=> collectNew(members, since, seeSecret, seeVisits), [members, since, seeSecret, seeVisits]);
  if(!since){
    /* 처음 쓰는 기기 — 오늘까지는 본 것으로 두고 내일부터 모읍니다 */
    const today = new Date().toISOString().slice(0,10);
    writeSeen(today);
    return null;
  }
  if(!items.length) return null;
  const mark = () => {
    const today = new Date().toISOString().slice(0,10);
    writeSeen(today); setSince(today); setOpen(false);
  };
  const pray = items.filter(x=>x.kind==="기도").length;
  const visit = items.filter(x=>x.kind==="심방").length;
  return (
    <div className="newfeed">
      <div className="nf-head" onClick={()=>setOpen(o=>!o)}>
        <span className="nf-dot">{items.length}</span>
        <b>새로 올라온 것</b>
        <span className="muted small">
          {pray ? `중보기도 ${pray}건` : ""}{pray && visit ? " · " : ""}{visit ? `심방 ${visit}건` : ""}
        </span>
        <span className="nf-arrow">{open ? "▲" : "▼"}</span>
      </div>
      {open && <div className="nf-body">
        {items.slice(0,30).map(x=>(
          <button key={x.kind+x.id} className="nf-item" onClick={()=>openMember(x.memId)}>
            <span className={"nf-tag " + (x.kind==="기도" ? "t-pray" : "t-visit")}>{x.kind}</span>
            <span className="nf-name">{x.memName}</span>
            <span className="nf-text">{x.text.length > 46 ? x.text.slice(0,46) + "…" : x.text}</span>
            <span className="nf-when muted small">{x.when.slice(5)}{x.by ? " · " + x.by : ""}</span>
          </button>))}
        {items.length > 30 && <p className="muted small" style={{margin:"6px 2px 0"}}>… 그 밖에 {items.length-30}건</p>}
        <button className="btn sm" style={{marginTop:8}} onClick={mark}>모두 확인했습니다</button>
      </div>}
    </div>
  );
}


/* ═══ 홈 — 최근 몇 주의 예배별 출석 표 (관리자·교역자) ═══ */
function WeeklyAtt({att, go, weeks = 6}){
  const a = att && typeof att === "object" ? att : {};
  const svcs = (Array.isArray(SERVICES) ? SERVICES : []).filter(s => s && s.key);

  /* 주일(일요일)을 기준으로 한 주를 묶습니다 */
  const sunOf = (d) => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - x.getDay()); return x; };
  const key = (x) => `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
  const today = new Date();
  const rows = [];
  for(let i = 0; i < weeks; i++){
    const s = sunOf(today); s.setDate(s.getDate() - i*7);
    rows.push({start: key(s), label: `${s.getMonth()+1}월 ${Math.ceil((s.getDate())/7)}주`, n:{}, total:0});
  }
  const idx = {}; rows.forEach((r,i) => { idx[r.start] = i; });

  Object.keys(a).forEach(day => {
    if(typeof day !== "string" || day.length < 10) return;
    const d = new Date(day + "T00:00:00");
    if(isNaN(d)) return;
    const k = key(sunOf(d));
    const i = idx[k];
    if(i === undefined) return;
    const svcObj = a[day] && typeof a[day] === "object" ? a[day] : {};
    Object.keys(svcObj).forEach(sv => {
      const ids = svcObj[sv];
      if(!Array.isArray(ids) || !ids.length) return;
      rows[i].n[sv] = (rows[i].n[sv] || 0) + ids.length;
      rows[i].total += ids.length;
    });
  });

  const used = svcs.filter(s => rows.some(r => r.n[s.key]));
  if(!used.length) return null;
  const avg = (k) => {
    const vs = rows.map(r => r.n[k]).filter(v => typeof v === "number" && v > 0);
    return vs.length ? Math.round(vs.reduce((x,y) => x+y, 0) / vs.length) : null;
  };
  const avgTotal = (() => {
    const vs = rows.map(r => r.total).filter(v => v > 0);
    return vs.length ? Math.round(vs.reduce((x,y) => x+y, 0) / vs.length) : null;
  })();

  return (
    <div className="panel wk-panel">
      <h2>최근 {weeks}주 출석 <span className="muted small">예배별</span></h2>
      <div className="tbl-wrap"><table className="wk-tbl">
        <thead><tr><th>주</th>{used.map(s =>
          <th key={s.key}>{TAB_SHORT[s.label] || s.label}</th>)}<th>합계</th></tr></thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.start}>
              <td className="wk-w">{r.label}</td>
              {used.map(s => <td key={s.key}>{r.n[s.key] ? r.n[s.key] : <span className="muted">-</span>}</td>)}
              <td className="wk-t">{r.total ? r.total : <span className="muted">-</span>}</td>
            </tr>))}
          <tr className="wk-avg">
            <td className="wk-w">평균</td>
            {used.map(s => { const v = avg(s.key); return <td key={s.key}>{v === null ? "-" : v}</td>; })}
            <td className="wk-t">{avgTotal === null ? "-" : avgTotal}</td>
          </tr>
        </tbody>
      </table></div>
      <button className="btn sm ghost" style={{marginTop:8}} onClick={()=>go("att")}>출석 체크로 가기</button>
    </div>
  );
}
