function ExcelSheet({members, bulkSave}){
  const [rows, setRows] = useState(null);
  const [busy, setBusy] = useState("");
  const fileRef = useRef(null);
  const list = Array.isArray(members) ? members.filter(Boolean) : [];
  const manual = SOK_MODE === "manual" || SOK_MODE === "area";

  const template = () => saveFile("교인명단_서식.csv", toCSV([
    CSV_COLS,
    ["김영숙","권사","여","1956-02-15","010-0000-0000","서울시 ○○구 ○○로 12, 101동 202호",
     manual ? (sokKeys()[0] ? sokKeyLabel(sokKeys()[0]) : "") : "", "메모는 자유롭게","남편:이태진, 아들:이영욱(33)"],
  ]));

  const exportAll = () => saveFile(`교인명단_${todayStr()}.csv`, toCSV([
    CSV_COLS,
    ...list.map(m => [m.name, m.position, m.gender, m.birth, m.phone, m.address,
      m.sok ? sokKeyLabel(m.sok) : (sokOf(m) ? sokLabel(sokOf(m)) : ""), m.memo, famToText(m)]),
  ]));

  const read = (file) => {
    const r = new FileReader();
    r.onload = () => {
      const data = parseCSV(r.result);
      if(!data.length){ alert("빈 파일입니다."); return; }
      const head = data[0].map(x => String(x).replace(/\s/g, ""));
      const at = name => head.indexOf(name);
      if(at("이름") < 0){ alert("첫 줄에 칸 이름이 없습니다. '엑셀 서식 내려받기'로 받은 파일에 채워 주세요."); return; }
      const get = (r2, n) => { const i = at(n); return i < 0 ? "" : String(r2[i] || "").trim(); };
      const out = data.slice(1).map(r2 => {
        const name = get(r2, "이름");
        const birth = get(r2, "생년월일").replace(/[./]/g, "-");
        const sokName = get(r2, "속");
        const sokId = manual ? (sokKeys().find(k => sokKeyLabel(k) === sokName || k === sokName) || "") : "";
        const old = list.find(m => m.name === name && (!birth || !m.birth || m.birth === birth));
        return {name, birth, sokName, sokId, old,
          position:get(r2, "직분"), gender:get(r2, "성별"), phone:get(r2, "연락처"),
          address:get(r2, "주소"), memo:get(r2, "메모"), family:textToFam(get(r2, "가족"))};
      });
      setRows(out);
    };
    r.readAsText(file, "utf-8");
  };

  const good = rows ? rows.filter(r => r.name) : [];
  const noName = rows ? rows.length - good.length : 0;
  const upd = good.filter(r => r.old);
  const noBirth = good.filter(r => !r.birth || !r.gender);
  const noSok = manual ? good.filter(r => r.sokName && !r.sokId) : [];

  const apply = async () => {
    if(!good.length) return;
    if(!confirm(`${good.length}명을 넣습니다.\n\n새로 등록: ${good.length - upd.length}명\n이미 있는 분 정보 고침: ${upd.length}명\n\n먼저 위 띠의 [백업]을 받아 두세요. 계속할까요?`)) return;
    setBusy("저장 중…");
    try{
      const out = good.map(r => {
        const base = r.old ? {...r.old} : {...emptyMember(), id:uid()};
        const next = {...base, name:r.name, position:r.position || base.position || "",
          gender:r.gender || base.gender || "", birth:r.birth || base.birth || "",
          phone:r.phone || base.phone || "", address:r.address || base.address || "",
          memo:r.memo || base.memo || ""};
        if(r.sokId) next.sok = r.sokId;
        if(r.family.length) next.family = r.family;
        return next;
      });
      for(let i = 0; i < out.length; i += 40){
        await bulkSave(out.slice(i, i + 40));
        setBusy(`저장 중… ${Math.min(i + 40, out.length)} / ${out.length}명`);
      }
      alert(`${good.length}명을 넣었습니다.`);
      setRows(null);
    }catch(e){ /* 알림은 App 에서 */ }
    finally{ setBusy(""); }
  };

  return (
    <div className="panel">
      <h2>엑셀로 명단 넣기</h2>
      <p className="muted small" style={{marginTop:0}}>
        서식을 내려받아 엑셀에서 채운 뒤 다시 올리면 교인이 한 번에 등록됩니다.
        칸 이름은 <b>{CSV_COLS.join(" · ")}</b> 이고, <b>이름</b>만 꼭 있으면 됩니다.
        이름과 생년월일이 같은 분이 이미 있으면 그분 정보를 고칩니다.</p>
      <div className="row" style={{gap:8, flexWrap:"wrap"}}>
        <button className="btn ghost" onClick={template} disabled={!!busy}>엑셀 서식 내려받기 (.csv)</button>
        <button className="btn ghost" onClick={exportAll} disabled={!!busy || !list.length}>지금 명단 내려받기 ({list.length}명)</button>
        <input ref={fileRef} type="file" accept=".csv,text/csv" style={{display:"none"}}
          onChange={e=>{
            const f = e.target.files[0];
            if(f){
              if(!/\.csv$/i.test(f.name)){
                alert("엑셀은 'CSV UTF-8'로 저장해 올려 주세요.\n\n한글(.hwp)이나 PDF로 된 명단은 교회이음(romoo2@hanmail.net)으로 보내 주시면 넣어 드립니다.");
              } else read(f);
            }
            e.target.value = "";
          }}/>
        <button className="btn" onClick={()=>fileRef.current && fileRef.current.click()} disabled={!!busy}>엑셀 파일 올리기 (.csv)</button>
        {busy && <span className="muted small">{busy}</span>}
      </div>

      {rows && <div style={{marginTop:12}}>
        <p className="small" style={{margin:"0 0 8px"}}>
          넣을 사람 <b>{good.length}명</b> (새로 등록 {good.length - upd.length}명 · 정보 고침 {upd.length}명)
          {noName ? ` · 이름이 없어 빼는 줄 ${noName}줄` : ""}
          {noBirth.length ? ` · 성별이나 생년월일이 없어 속이 정해지지 않을 분 ${noBirth.length}명` : ""}
          {noSok.length ? ` · 설정에 없는 속 이름 ${noSok.length}명` : ""}</p>
        <div className="tbl-wrap"><table className="list-tbl">
          <thead><tr><th>이름</th><th>직분·성별</th><th>생년월일</th><th>어떻게 들어가나</th></tr></thead>
          <tbody>{good.slice(0, 50).map((r, i) => (
            <tr key={i}>
              <td className="c-name">{r.name}</td>
              <td className="c-date">{[r.position, r.gender].filter(Boolean).join(" · ")}</td>
              <td className="c-text">{r.birth || <span className="muted">없음</span>}</td>
              <td className="c-state">{r.old ? <span className="chip pos">정보 고침</span> : <span className="chip now">새로 등록</span>}</td>
            </tr>))}
          </tbody></table></div>
        {good.length > 50 && <p className="muted small">…앞의 50명만 보여 드립니다.</p>}
        <div className="row" style={{gap:8, marginTop:10}}>
          <button className="btn" onClick={apply} disabled={!!busy || !good.length}>{good.length}명 넣기</button>
          <button className="btn ghost" onClick={()=>setRows(null)} disabled={!!busy}>취소</button>
        </div>
      </div>}
    </div>
  );
}

/* ═══ 사진 한꺼번에 넣기 — 파일 이름을 교인 이름으로 해 두면 짝을 맞춰 넣습니다 ═══
   김영숙.jpg  ·  김영숙_1956.jpg (같은 이름이 여럿일 때 태어난 해로 구분) */
function BulkPhotos({members, bulkSave}){
  const [rows, setRows] = useState(null);      /* 미리 보기 */
  const [busy, setBusy] = useState("");
  const fileRef = useRef(null);

  const pick = async (files) => {
    const list = Array.from(files || []);
    if(!list.length) return;
    setBusy(`사진 ${list.length}장을 읽는 중…`);
    const out = [];
    for(let i = 0; i < list.length; i++){
      const f = list[i];
      const base = String(f.name || "").replace(/\.[^.]+$/, "").trim();
      const m = base.match(/^(.+?)[ _\-]+((?:19|20)\d{2})$/);      /* 이름_1956 */
      const nm = (m ? m[1] : base).replace(/\s+/g, "");
      const yr = m ? m[2] : "";
      const hit = (Array.isArray(members) ? members : []).filter(x => x && String(x.name || "").replace(/\s+/g, "") === nm
        && (!yr || String(x.birth || "").slice(0, 4) === yr));
      let photo = "";
      try{ photo = await readPhoto(f); }catch(_){ }
      out.push({file:f.name, name:nm, year:yr, hits:hit, pick:hit.length === 1 ? hit[0].id : "", photo});
      setBusy(`사진 ${i + 1} / ${list.length}장을 읽는 중…`);
    }
    setRows(out); setBusy("");
  };

  const ok = rows ? rows.filter(r => r.pick && r.photo) : [];
  const many = rows ? rows.filter(r => r.hits.length > 1 && !r.pick) : [];
  const none = rows ? rows.filter(r => !r.hits.length) : [];
  const over = ok.filter(r => { const m = members.find(x => x.id === r.pick); return m && m.photo; });

  const apply = async () => {
    if(!ok.length) return;
    if(over.length && !confirm(`${over.length}명은 이미 사진이 있습니다. 새 사진으로 바꿀까요?`)) return;
    if(!confirm(`${ok.length}명에게 사진을 넣습니다.`)) return;
    setBusy("저장 중…");
    try{
      const rowsOut = ok.map(r => ({...members.find(x => x.id === r.pick), photo:r.photo}));
      for(let i = 0; i < rowsOut.length; i += 40){
        await bulkSave(rowsOut.slice(i, i + 40));
        setBusy(`저장 중… ${Math.min(i + 40, rowsOut.length)} / ${rowsOut.length}명`);
      }
      alert(`${ok.length}명에게 사진을 넣었습니다.`);
      setRows(null);
    }catch(e){ /* 알림은 App 에서 */ }
    finally{ setBusy(""); }
  };

  return (
    <div className="panel">
      <h2>사진 한꺼번에 넣기</h2>
      <p className="muted small" style={{marginTop:0}}>
        사진 파일 이름을 <b>교인 이름</b>으로 바꿔 두고 여러 장을 한 번에 고르세요 (예: <b>김영숙.jpg</b>).
        같은 이름이 여럿이면 <b>김영숙_1956.jpg</b>처럼 태어난 해를 붙입니다. 사진은 작게 줄여 저장합니다.</p>
      <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}}
        onChange={e=>{ pick(e.target.files); e.target.value = ""; }}/>
      <div className="row" style={{gap:8, flexWrap:"wrap"}}>
        <button className="btn" onClick={()=>fileRef.current && fileRef.current.click()} disabled={!!busy}>사진 고르기</button>
        {rows && <button className="btn ghost" onClick={()=>setRows(null)} disabled={!!busy}>취소</button>}
        {busy && <span className="muted small">{busy}</span>}
      </div>

      {rows && <div style={{marginTop:12}}>
        <p className="small" style={{margin:"0 0 8px"}}>
          짝이 맞은 사진 <b>{ok.length}장</b>
          {many.length ? ` · 같은 이름이 여럿 ${many.length}장` : ""}
          {none.length ? ` · 짝을 못 찾음 ${none.length}장` : ""}
          {over.length ? ` · 이미 사진이 있는 분 ${over.length}명` : ""}</p>

        <div className="mem-list">
          {rows.map((r, i) => (
            <div key={i} className="bulkphoto-row">
              {r.photo ? <img src={r.photo} alt=""/> : <span className="bp-no">?</span>}
              <div className="bp-txt">
                <b>{r.file}</b>
                {r.hits.length === 1 ? <span className="muted small"> → {r.hits[0].name} {r.hits[0].position}</span>
                 : r.hits.length > 1
                   ? <select value={r.pick} onChange={e=>{ const v = e.target.value;
                       setRows(rs => rs.map((x, j) => j === i ? {...x, pick:v} : x)); }}>
                       <option value="">누구인지 고르세요…</option>
                       {r.hits.map(h => <option key={h.id} value={h.id}>{h.name} {h.position} {h.birth ? `(${h.birth.slice(0,4)}년생)` : ""}</option>)}
                     </select>
                   : <span className="muted small"> → 같은 이름의 교인을 찾지 못했습니다</span>}
              </div>
            </div>))}
        </div>

        <div className="row" style={{gap:8, marginTop:10}}>
          <button className="btn" onClick={apply} disabled={!!busy || !ok.length}>{ok.length}명에게 사진 넣기</button>
        </div>
      </div>}
    </div>
  );
}

function ChurchConfig({saveConfig, churchName, homePhoto, homePhotoReady, initialMessage, members, bulkSave, helpProps, backupProps}){
  const [cfgTab, setCfgTab] = useState("photo");   /* 열려 있는 설정 폴더 */
  const [c, setC] = useState(currentChurchConfig());
  const [msg, setMsg] = useState(initialMessage || "");
  const [saveError, setSaveError] = useState("");
  const [saving, setSaving] = useState(false);
  const saveLock = useRef(false);
  const [photoDraft, setPhotoDraft] = useState(homePhoto);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [cutWhite, setCutWhite] = useState(!!(homePhoto && homePhoto.cut));
  const lastFile = useRef(null);
  const [photoError, setPhotoError] = useState("");
  const [photoMessage, setPhotoMessage] = useState("");
  const photoInput = useRef(null);
  const photoReadToken = useRef(0);
  useEffect(() => () => { photoReadToken.current++; }, []);
  const choosePhoto = async (file, cutOpt) => {
    if(!file) return;
    lastFile.current = file;
    const cut = cutOpt === undefined ? cutWhite : cutOpt;
    const token = ++photoReadToken.current;
    setPhotoBusy(true); setPhotoError(""); setPhotoMessage(""); setMsg("");
    try{
      const next = await readChurchHomePhoto(file, cut);
      if(token !== photoReadToken.current) return;
      setPhotoDraft(next); setPhotoMessage("미리보기를 확인한 뒤 설정 저장을 눌러 주세요.");
    }catch(e){ if(token === photoReadToken.current) setPhotoError(errMsg(e)); }
    finally{ if(token === photoReadToken.current) setPhotoBusy(false); }
  };
  const changePhoto = change => {
    setPhotoDraft(photoDraft ? {...photoDraft, ...change} : null);
    setMsg(""); setPhotoMessage("미리보기를 확인한 뒤 설정 저장을 눌러 주세요.");
  };
  const resetPhoto = () => {
    photoReadToken.current++; setPhotoBusy(false); setPhotoError(""); setPhotoDraft(null);
    setMsg(""); setPhotoMessage("설정 저장을 누르면 공통 교회 이미지로 돌아갑니다.");
  };
  const upd = (k, v) => { setC({...c, [k]: v}); setMsg(""); };
  const setMotto = ch => upd("motto", {year:String(new Date().getFullYear()), text:"", verse:"", ...(c.motto || {}), ...ch});

  /* 속 목록을 [번호, 시작연도, 끝연도] 형태로 다루기 쉽게 */
  const toRows = (tbl) => tbl.map((row, i) => ({
    n: row[1],
    from: i === 0 ? "" : String(tbl[i-1][0] + 1),
    to: row[0] === 9999 ? "" : String(row[0]),
  }));
  const fromRows = (rows) => rows.map((r, i) =>
    [ i === rows.length-1 ? 9999 : (Number(r.to) || 9999), i+1 ]);

  const [fRows, setFRows] = useState(toRows(c.sokF));
  const [mRows, setMRows] = useState(toRows(c.sokM));


  const saveSettings = async () => {
    if(saveLock.current || photoBusy || !homePhotoReady) return;
    saveLock.current = true; setSaving(true); setSaveError(""); setMsg("");
    try{
      const next = {...c, sokF:fromRows(fRows), sokM:fromRows(mRows)};
      await saveConfig(next, photoDraft);
    }catch(e){
      setSaveError("저장하지 못했습니다. 입력한 내용은 남아 있습니다. " + errMsg(e));
    }finally{ saveLock.current = false; setSaving(false); }
  };

  const SokTable = ({title, rows, setRows, gender}) => (
    <div style={{marginBottom:18}}>
      <h3 style={{marginBottom:4}}>{title}</h3>
      <p className="small muted" style={{marginTop:0}}>
        각 속의 <b>마지막 출생연도</b>를 적습니다. 맨 아래 속은 그 이후 전부입니다.</p>
      {rows.map((r,i)=>(
        <div className="row" key={i} style={{marginBottom:6, alignItems:"center"}}>
          <span className="chip editor" style={{minWidth:64}}>{i+1}{gender}선교회</span>
          {i===0 ? <span className="muted small">처음부터</span>
                 : <span className="muted small">{Number(rows[i-1].to)+1}년생부터</span>}
          {i===rows.length-1
            ? <span className="muted small">이후 전부</span>
            : <React.Fragment>
                <input type="number" value={r.to} style={{width:100}}
                  onChange={e=>{ const a=[...rows]; a[i]={...r, to:e.target.value}; setRows(a); setMsg(""); }}/>
                <span className="muted small">년생까지</span>
              </React.Fragment>}
          <button className="btn sm ghost" style={{marginLeft:"auto"}}
            disabled={rows.length<=1}
            onClick={()=>{ setRows(rows.filter((_,x)=>x!==i)); setMsg(""); }}>빼기</button>
        </div>))}
      <button className="btn sm" onClick={()=>{
        const a=[...rows]; const last=a[a.length-1];
        a[a.length-1] = {...last, to: String((Number(a[a.length-2]?.to)||1960)+5)};
        a.push({to:""}); setRows(a); setMsg("");
      }}>+ 속 추가</button>
    </div>
  );

  return (
    <div>
      <div className="panel">
        <h2>교회 설정</h2>
        <p className="small muted" style={{marginTop:0}}>
          교회마다 다른 부분입니다. 여기서 바꾸면 명부·출석·교회학교에 모두 반영됩니다.
          <b> 이미 등록된 교인 기록은 지워지지 않고</b>, 새 기준으로 다시 나뉘기만 합니다.</p>
        {msg && <p role="status" style={{color:"var(--pine)",fontWeight:600}}>{msg}</p>}
        {saveError && <p role="alert" className="church-settings-error">{saveError}</p>}
        {!homePhotoReady && <p role="alert" className="church-settings-error">교회 설정을 불러오지 못했습니다. 위의 다시 불러오기를 눌러 주세요.</p>}
      </div>

      <fieldset className="church-settings-fields" disabled={saving || !homePhotoReady}>
      {(() => {
        const tabs = [
          {k:"photo",  l:"사진·표어"},
          {k:"svc",    l:"예배·직분"},
          {k:"sok",    l:"속회"},
          {k:"school", l:"교회학교"},
          ...(members && bulkSave ? [{k:"data", l:"명단"}] : []),
          ...(helpProps ? [{k:"help", l:"지원"}] : []),
        ];
        const cur = tabs.some(x=>x.k===cfgTab) ? cfgTab : "photo";
        return (
          <div className="folder-tabs no-print" role="tablist">
            {tabs.map(x => (
              <button key={x.k} type="button" role="tab" aria-selected={cur===x.k}
                className={"folder-tab cf-" + x.k + (cur===x.k ? " on" : "")} onClick={()=>setCfgTab(x.k)}>{x.l}</button>))}
          </div>);
      })()}

      <div className={"panel church-photo-panel folder-panel cf-photo" + (cfgTab==="photo" ? " on" : "")}>
        <h2>홈 화면 교회 사진과 표어</h2>
        <p className="muted" style={{marginTop:0}}>사진은 {churchName}의 홈 화면 왼쪽에 표시됩니다. 사진을 선택하고 미리보기를 확인한 뒤 설정 저장을 눌러 주세요.</p>
        <div className="church-photo-preview">
          <ChurchHomeBanner churchName={churchName} photo={photoDraft} motto={c.motto}/>
        </div>
        <div className="church-photo-controls">
          <button type="button" className="btn" onClick={() => photoInput.current.click()}>{photoBusy ? "사진 처리 중…" : "교회 사진 선택"}</button>
          <button type="button" className="btn ghost" disabled={!photoDraft && !photoBusy} onClick={resetPhoto}>공통 이미지로 변경</button>
          <input ref={photoInput} type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
            aria-label="홈 화면 교회 사진 선택" style={{display:"none"}}
            onChange={e => { const file = e.target.files[0]; e.target.value = ""; choosePhoto(file); }}/>
        </div>
        {photoDraft && <label className="cut-white">
          <input type="checkbox" checked={cutWhite} disabled={photoBusy}
            onChange={e => {
              const on = e.target.checked;
              setCutWhite(on);
              /* 틀은 바로 없애고, 원본이 남아 있으면 흰 배경까지 지웁니다 */
              setPhotoDraft(p => p ? normalizeChurchHomePhoto({...p, cut:on}) : p);
              setMsg(""); setPhotoError("");
              if(on && lastFile.current) choosePhoto(lastFile.current, true);
              else setPhotoMessage("미리보기를 확인한 뒤 사진 저장을 눌러 주세요.");
            }}/>
          <span>사진 틀 없이 배경에 얹기
            <span className="muted small"> — 흰 테두리를 없애고, 사진 가장자리의 흰 부분도 투명하게 만듭니다</span></span>
        </label>}
        <p className="muted">JPG·PNG·WebP, 15MB 이하 · 사진은 저장하기 좋은 크기로 자동 조정됩니다.</p>
        {photoDraft && <React.Fragment>
          <div className="church-photo-options" role="group" aria-label="교회 사진 표시 방법">
            <label><input type="radio" name="church-photo-fit" checked={photoDraft.fit === "contain"} onChange={() => changePhoto({fit:"contain"})}/>전체 사진 보기</label>
            <label><input type="radio" name="church-photo-fit" checked={photoDraft.fit === "cover"} onChange={() => changePhoto({fit:"cover"})}/>사진으로 영역 채우기</label>
          </div>
          {photoDraft.fit === "cover" && <div className="church-photo-position">
            <label>좌우 위치<input type="range" min="0" max="100" value={photoDraft.x} onChange={e => changePhoto({x:Number(e.target.value)})}/></label>
            <label>상하 위치<input type="range" min="0" max="100" value={photoDraft.y} onChange={e => changePhoto({y:Number(e.target.value)})}/></label>
          </div>}
        </React.Fragment>}
        {photoError && <p role="alert" className="church-settings-error">{photoError}</p>}
        <p className="church-photo-status muted" role="status">{photoBusy ? "사진을 불러오는 중입니다…" : photoMessage || (photoDraft ? "등록된 교회 사진을 사용합니다." : "공통 교회 이미지를 사용합니다.")}</p>
        <div className="motto-edit">
          <h3>올해 교회 표어</h3>
          <p className="muted small" style={{marginTop:0}}>홈 화면 가운데 칸에 나옵니다. 비워 두면 "한 사람 한 사람을 기억하고 돌보는 교회"가 나옵니다.
            줄을 바꾸고 싶은 곳에서 Enter를 누르세요.</p>
          <div className="motto-grid">
            <label>연도
              <input type="number" min="2000" max="2100" inputMode="numeric"
                value={(c.motto && c.motto.year) || ""} placeholder={String(new Date().getFullYear())}
                onChange={e => setMotto({year:e.target.value})}/></label>
            <label className="wide">표어 <span className="muted small">(80자까지)</span>
              <textarea rows={2} maxLength={80} value={(c.motto && c.motto.text) || ""}
                placeholder="예) 말씀으로 세워지고 사랑으로 하나 되는 교회"
                onChange={e => setMotto({text:e.target.value})}/></label>
            <label className="wide">말씀 구절 <span className="muted small">(선택)</span>
              <input maxLength={40} value={(c.motto && c.motto.verse) || ""} placeholder="예) 에베소서 4:16"
                onChange={e => setMotto({verse:e.target.value})}/></label>
          </div>
        </div>
        <button type="button" className="btn" disabled={photoBusy || !homePhotoReady} onClick={saveSettings}>{saving ? "저장 중…" : "설정 저장"}</button>
      </div>

      {helpProps && <div className={"folder-wrap cf-help" + (cfgTab==="help" ? " on" : "")}><HelpPanel {...helpProps}/></div>}
      {members && bulkSave && <div className={"folder-wrap cf-data" + (cfgTab==="data" ? " on" : "")}>
        {backupProps && <BackupPanel {...backupProps}/>}
        <ExcelSheet members={members} bulkSave={bulkSave}/>
        <BulkPhotos members={members} bulkSave={bulkSave}/>
      </div>}

      <div className={"panel folder-panel cf-svc" + (cfgTab==="svc" ? " on" : "")}>
        <h2>예배 종류</h2>
        <p className="small muted" style={{marginTop:0}}>출석 체크에 나오는 예배입니다. 요일을 정하면 그 예배를 열 때 가장 가까운 날짜가 자동으로 잡힙니다.</p>
        {c.services.map((s,i)=>(
          <div className="row" key={i} style={{marginBottom:6}}>
            <input value={s.label} style={{flex:"1 1 160px"}}
              onChange={e=>{ const a=[...c.services]; a[i]={...s, label:e.target.value}; upd("services",a); }}/>
            <select value={s.dow===null?"":String(s.dow)}
              onChange={e=>{ const a=[...c.services]; a[i]={...s, dow: e.target.value===""?null:Number(e.target.value)}; upd("services",a); }}>
              <option value="">요일 없음</option>
              {["일","월","화","수","목","금","토"].map((d,x)=><option key={x} value={x}>{d}요일</option>)}
            </select>
            <button className="btn sm ghost" disabled={c.services.length<=1}
              onClick={()=>upd("services", c.services.filter((_,x)=>x!==i))}>빼기</button>
          </div>))}
        <button className="btn sm" onClick={()=>upd("services",[...c.services,
          {key:"sv"+Date.now().toString(36), label:"새 예배", dow:null}])}>+ 예배 추가</button>
      </div>

      <div className={"panel folder-panel cf-school" + (cfgTab==="school" ? " on" : "")}>
        <h2>교회학교 부서</h2>
        <p className="small muted" style={{marginTop:0}}>
          우리가 쓰는 나이(세는 나이)입니다. 이 나이대는 속별 명부에서 빠집니다.</p>
        {c.depts.map((d,i)=>(
          <div className="row" key={i} style={{marginBottom:6, alignItems:"center"}}>
            <input value={d.label} style={{flex:"1 1 150px"}}
              onChange={e=>{ const a=[...c.depts]; a[i]={...d, label:e.target.value}; upd("depts",a); }}/>
            <input type="number" value={d.min} style={{width:78}}
              onChange={e=>{ const a=[...c.depts]; a[i]={...d, min:Number(e.target.value)}; upd("depts",a); }}/>
            <span className="muted small">세 ~</span>
            <input type="number" value={d.max} style={{width:78}}
              onChange={e=>{ const a=[...c.depts]; a[i]={...d, max:Number(e.target.value)}; upd("depts",a); }}/>
            <span className="muted small">세</span>
            <button className="btn sm ghost" style={{marginLeft:"auto"}} disabled={c.depts.length<=1}
              onClick={()=>upd("depts", c.depts.filter((_,x)=>x!==i))}>빼기</button>
          </div>))}
        <button className="btn sm" onClick={()=>upd("depts",[...c.depts,
          {key:"dp"+Date.now().toString(36), label:"새 부서", min:30, max:39}])}>+ 부서 추가</button>
      </div>

      <div className={"panel folder-panel cf-sok" + (cfgTab==="sok" ? " on" : "")}>
        <h2>속회(선교회) 편성</h2>
        <div style={{marginBottom:14}}>
          {[["age","나이로 자동","성별과 출생연도로 나눔"],
            ["area","주소로 자동","주소에 든 동·구역 이름으로 나눔"],
            ["manual","직접 지정","사람마다 속을 골라 넣음"]].map(([v,t,d])=>(
            <label key={v} className="row" style={{gap:6, alignItems:"center", marginBottom:5}}>
              <input type="radio" checked={(c.sokMode||"age")===v} onChange={()=>upd("sokMode",v)}/>
              <b>{t}</b> <span className="muted small">— {d}</span>
            </label>))}
        </div>

        {(c.sokMode==="manual" || c.sokMode==="area") ? <React.Fragment>
          <p className="small muted" style={{marginTop:0}}>
            {c.sokMode==="area"
              ? <React.Fragment>속 이름과 그 속이 맡는 <b>지역</b>을 적으세요. 교인 주소에 그 지역 이름이 들어 있으면 자동으로 그 속에 들어갑니다.
                  지역은 쉼표로 여러 개 적을 수 있습니다(예: 화곡1동, 화곡2동).</React.Fragment>
              : "속 이름을 자유롭게 만드세요(예: 강서속, 화곡1구역, 등촌속). 교인 등록·수정 화면에서 각 사람의 속을 고르게 됩니다."}</p>
          {(c.sokList||[]).map((s,i)=>(
            <div key={s.id} style={{marginBottom:8, paddingBottom:8,
              borderBottom: c.sokMode==="area" ? "1px solid var(--line)" : "none"}}>
              <div className="row">
                <input value={s.name} style={{flex:"1 1 180px"}} placeholder="속 이름"
                  onChange={e=>{ const a=[...c.sokList]; a[i]={...s, name:e.target.value}; upd("sokList",a); }}/>
                <button className="btn sm ghost"
                  onClick={()=>upd("sokList", c.sokList.filter((_,x)=>x!==i))}>빼기</button>
              </div>
              {c.sokMode==="area" &&
                <div className="row" style={{marginTop:5}}>
                  <span className="muted small" style={{minWidth:38}}>지역</span>
                  <input value={(s.areas||[]).join(", ")} style={{flex:"1 1 260px"}}
                    placeholder="화곡1동, 화곡2동"
                    onChange={e=>{ const a=[...c.sokList];
                      a[i]={...s, areas:e.target.value.split(",").map(x=>x.trim()).filter(Boolean)};
                      upd("sokList",a); }}/>
                </div>}
            </div>))}
          <button className="btn sm" onClick={()=>upd("sokList",[...(c.sokList||[]),
            {id:"sk"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:"새 속", areas:[]}])}>+ 속 추가</button>
          <p className="small muted" style={{marginTop:10, marginBottom:0}}>
            {c.sokMode==="area" && <React.Fragment>주소로 못 찾은 교인은 <b>속 미지정</b>에 모입니다.
              그런 분은 교인 수정에서 속을 직접 골라 주시면 되고, <b>직접 고른 속이 주소보다 우선</b>합니다.<br/></React.Fragment>}
            속을 지우면 그 속에 있던 교인은 <b>속 미지정</b>으로 돌아갑니다. 교인 기록 자체는 그대로입니다.</p>
        </React.Fragment> : <React.Fragment>
          <SokTable title="여선교회" rows={fRows} setRows={setFRows} gender="여"/>
          <SokTable title="남선교회" rows={mRows} setRows={setMRows} gender="남"/>
          <p className="small muted" style={{marginBottom:0}}>
            교인 메모에 &lsquo;3 여선교회&rsquo;처럼 적혀 있으면 나이보다 그 기록이 우선합니다.</p>
        </React.Fragment>}
      </div>

      <div className={"panel folder-panel cf-svc2" + (cfgTab==="svc" ? " on" : "")}>
        <h2>직분</h2>
        <p className="small muted" style={{marginTop:0}}>교인 등록·수정에서 고를 수 있는 직분입니다. 쉼표로 구분해 적으세요.</p>
        <textarea rows="3" value={c.positions.join(", ")}
          onChange={e=>upd("positions", e.target.value.split(",").map(s=>s.trim()).filter(Boolean))}/>
        <h3>이 중 교역자로 묶을 직분</h3>
        <p className="small muted" style={{marginTop:0}}>여기 적힌 직분은 속회·교회학교에서 빠지고 &lsquo;교역자&rsquo;로 따로 모입니다.</p>
        <textarea rows="2" value={c.ministers.join(", ")}
          onChange={e=>upd("ministers", e.target.value.split(",").map(s=>s.trim()).filter(Boolean))}/>
      </div>

      <div className="panel">
        <div className="row">
          <button className="btn" disabled={photoBusy || !homePhotoReady} onClick={saveSettings}>{saving ? "저장 중…" : "설정 저장"}</button>
          <button className="btn ghost" onClick={()=>{
            const cur = currentChurchConfig();
            setC(cur); setFRows(toRows(cur.sokF)); setMRows(toRows(cur.sokM)); setMsg("");
            photoReadToken.current++; setPhotoBusy(false); setPhotoDraft(homePhoto);
            setPhotoMessage(""); setPhotoError(""); setSaveError("");
          }}>되돌리기</button>
        </div>
        {saveError && <p role="alert" className="church-settings-error">{saveError}</p>}
      </div>
      </fieldset>
    </div>
  );
}

const NEWS_SEEN_KEY = "churchNewsSeen";   /* 마지막으로 본 소식 날짜 */

function GateNews({isAdmin, isPastor}){
  const [more, setMore] = useState(false);
  const mine = UPDATES.filter(u => u && (u.who === "all" || (u.who === "pastor" && (isAdmin || isPastor)) || (u.who === "admin" && isAdmin)));
  if(!mine.length) return null;
  /* 가장 새로운 소식 날짜를 기억해 두고, 이미 본 날짜면 띄우지 않습니다 */
  const latest = mine.reduce((a, u) => (u.date > a ? u.date : a), "");
  /* 처음 그릴 때의 값을 붙잡아 둡니다 (화면이 다시 그려져도 사라지지 않게) */
  const [seen] = useState(() => { try{ return localStorage.getItem(NEWS_SEEN_KEY) || ""; }catch(_){ return ""; } });
  useEffect(() => { try{ if(latest) localStorage.setItem(NEWS_SEEN_KEY, latest); }catch(_){} }, [latest]);
  if(!latest || seen >= latest) return null;        /* 두 번째 접속부터는 보이지 않습니다 */

  const shown = more ? mine : mine.slice(0, 3);
  const days = [];
  shown.forEach(u => { const d = days.find(x => x.date === u.date); if(d) d.items.push(u.text); else days.push({date:u.date, items:[u.text]}); });
  const md = d => { const p = String(d).split("-"); return p.length === 3 ? `${Number(p[1])}월 ${Number(p[2])}일` : d; };
  return (
    <div className="gate-news">
      <div className="gate-news-h">업데이트 소식</div>
      {days.map(d => (
        <div key={d.date} className="gate-news-day">
          <span className="gate-news-date">{md(d.date)}</span>
          <ul>{d.items.map((x, i) => <li key={i}>{x}</li>)}</ul>
        </div>))}
      {mine.length > 3 &&
        <button type="button" className="gate-news-more" onClick={()=>setMore(!more)}>
          {more ? "접기" : `지난 소식 ${mine.length - 3}건 더 보기`}</button>}
    </div>
  );
}

function Gate({churchName, onEnter, isAdmin = false, isPastor = false, userName = "", onLogout = null}){
  return (
    <div className="gate" style={{backgroundImage:`url(${GATE_BG})`}}>
      {onLogout && <div className="gate-user">
        <span className="gate-user-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.8 21c0-4.6 3.7-7.3 8.2-7.3s8.2 2.7 8.2 7.3z"/></svg></span>
        <span className="gate-user-name">{userName || "내 계정"}</span>
        <span className="gate-user-bar" aria-hidden="true"></span>
        <button type="button" onClick={onLogout}>로그아웃</button>
      </div>}
      <div className="gate-inner">
        {isAdmin && <GateNews isAdmin={isAdmin} isPastor={isPastor}/>}   {/* 업데이트 소식은 관리자에게만 */}
        <img className="gate-tile" alt="" src={GATE_TILE}/>
        <div className="gate-eng"><span>CHURCH IEUM</span></div>
        <h1 className="gate-title">교회이음</h1>
        <div className="gate-slogan">교회를 잇고, 함께 세웁니다</div>
        <div className="gate-sub">교회 공동체를 한 눈에</div>
        {churchName && <div className="gate-church">{churchName}</div>}
        <button className="gate-btn" onClick={onEnter}>들어가기
          <svg viewBox="0 0 26 14" aria-hidden="true"><path d="M1 7h23M18 1.5 24 7l-6 5.5" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>
      <footer className="gate-foot">
        <div><img src={CI_MARK} alt=""/>교회이음 · 교회를 잇고, 함께 세웁니다</div>
        <div>© 2026 교회이음 · 무단 복제 및 재배포 금지 · <a href="privacy.html" target="_blank" rel="noopener">개인정보 처리방침</a></div>
        <span className="gate-ver">Ver. {APP_VER}</span>
      </footer>
    </div>
  );
}

/* ───────── 달력 (교회 행사 · 생일) ───────── */
const EVENT_KINDS = [
  {key:"worship", label:"예배·집회", color:"#22355C"},
  {key:"edu",     label:"교육·훈련", color:"#3D5A80"},
  {key:"fellow",  label:"친교·행사", color:"#B8912F"},
  {key:"mission", label:"선교·봉사", color:"#7B5EA7"},
  {key:"etc",     label:"기타",      color:"#7A8A94"},
];
const kindOf = k => EVENT_KINDS.find(x=>x.key===k) || EVENT_KINDS[4];
const ymd = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

function Calendar({members, events, saveEvents, canEdit, openMember, openable}){
  const today = new Date();
  const [cur, setCur] = useState({y: today.getFullYear(), m: today.getMonth()});
  const [sel, setSel] = useState(ymd(today));
  const [form, setForm] = useState(null);   /* 편집 중인 행사 */

  const first = new Date(cur.y, cur.m, 1);
  const startPad = first.getDay();
  const days = new Date(cur.y, cur.m+1, 0).getDate();
  const move = n => {
    const d = new Date(cur.y, cur.m + n, 1);
    setCur({y:d.getFullYear(), m:d.getMonth()});
  };

  /* 날짜별 행사 (여러 날 걸친 행사는 그 기간 모든 날에) */
  const evByDate = useMemo(()=>{
    const map = {};
    (events||[]).forEach(e=>{
      if(!e.date) return;
      const end = e.endDate && e.endDate > e.date ? e.endDate : e.date;
      let d = new Date(e.date + "T00:00:00");
      const last = new Date(end + "T00:00:00");
      let guard = 0;
      while(d <= last && guard++ < 400){
        const k = ymd(d);
        (map[k] = map[k] || []).push(e);
        d.setDate(d.getDate()+1);
      }
    });
    return map;
  }, [events]);

  /* 이 달 생일 (연도 무관, 월·일만) */
  const birthdayOf = useMemo(()=>{
    const map = {};
    (members||[]).forEach(m=>{
      if(!m.birth || isDeceased(m)) return;
      const md = m.birth.slice(5);            /* MM-DD */
      (map[md] = map[md] || []).push(m);
    });
    return map;
  }, [members]);

  const monthBirthdays = useMemo(()=>{
    const mm = String(cur.m+1).padStart(2,"0");
    const out = [];
    Object.keys(birthdayOf).filter(md=>md.slice(0,2)===mm).sort().forEach(md=>{
      birthdayOf[md].forEach(m=>out.push({day:Number(md.slice(3)), m}));
    });
    return out.sort((a,b)=>a.day-b.day);
  }, [birthdayOf, cur.m]);

  const selEvents = evByDate[sel] || [];
  const selBirth = birthdayOf[sel.slice(5)] || [];

  const blank = {id:"", date:sel, endDate:"", title:"", place:"", note:"", kind:"worship"};
  const submit = () => {
    if(!form.title.trim() || !form.date) return;
    const e = {...form, title:form.title.trim()};
    if(e.id) saveEvents((events||[]).map(x=>x.id===e.id ? e : x));
    else saveEvents([...(events||[]), {...e, id:uid()}]);
    setForm(null);
  };
  const removeEvent = id => {
    if(confirm("이 행사를 지울까요?")) saveEvents((events||[]).filter(x=>x.id!==id));
    setForm(null);
  };

  const cells = [];
  for(let i=0;i<startPad;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);

  return (
    <div>
      <div className="panel">
        <div className="row" style={{alignItems:"center", gap:8}}>
          <button className="btn sm ghost" onClick={()=>move(-1)}>‹</button>
          <h2 style={{margin:0}}>{cur.y}년 {cur.m+1}월</h2>
          <button className="btn sm ghost" onClick={()=>move(1)}>›</button>
          <button className="btn sm ghost" onClick={()=>{
            setCur({y:today.getFullYear(), m:today.getMonth()}); setSel(ymd(today));
          }}>오늘</button>
          {canEdit && <button className="btn sm" style={{marginLeft:"auto"}}
            onClick={()=>setForm({...blank, date:sel})}>+ 행사 추가</button>}
        </div>

        <div className="cal-grid" style={{marginTop:12}}>
          {["일","월","화","수","목","금","토"].map((w,i)=>(
            <div key={w} className={"cal-wd"+(i===0?" sun":i===6?" sat":"")}>{w}</div>))}
          {cells.map((d,i)=>{
            if(d===null) return <div key={"b"+i} className="cal-cell empty"/>;
            const key = cur.y + "-" + String(cur.m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
            const evs = evByDate[key] || [];
            const bds = birthdayOf[key.slice(5)] || [];
            const isToday = key === ymd(today);
            const dow = (startPad + d - 1) % 7;
            return (
              <div key={key}
                className={"cal-cell"+(sel===key?" sel":"")+(isToday?" today":"")}
                onClick={()=>setSel(key)}>
                <div className={"dnum"+(dow===0?" sun":dow===6?" sat":"")}>{d}</div>
                {evs.slice(0,3).map(e=>(
                  <div key={e.id} className="cal-ev" style={{background:kindOf(e.kind).color}}>{e.title}</div>))}
                {evs.length>3 && <div className="cal-more">+{evs.length-3}</div>}
                {bds.length>0 && <div className="cal-bd">🎂 {bds.length>1 ? bds.length+"명" : bds[0].name}</div>}
              </div>);
          })}
        </div>
        <div className="row small muted" style={{gap:10, marginTop:10, flexWrap:"wrap"}}>
          {EVENT_KINDS.map(k=>(
            <span key={k.key} className="row" style={{gap:4, alignItems:"center"}}>
              <span style={{width:10,height:10,borderRadius:3,background:k.color,display:"inline-block"}}/>{k.label}
            </span>))}
          {openable !== false && <span>🎂 생일</span>}
        </div>
      </div>

      {form && canEdit &&
        <div className="panel">
          <h2>{form.id ? "행사" : "새 행사"}</h2>
          <div className="field"><label>행사 이름</label>
            <input value={form.title} onChange={e=>setForm({...form, title:e.target.value})}
              placeholder="예) 추수감사주일, 여름성경학교"/></div>
          <div className="row">
            <div className="field" style={{flex:"1 1 150px"}}><label>시작</label>
              <input type="date" value={form.date} onChange={e=>setForm({...form, date:e.target.value})}/></div>
            <div className="field" style={{flex:"1 1 150px"}}><label>끝 <span className="muted small">(하루면 비워 두세요)</span></label>
              <input type="date" value={form.endDate} onChange={e=>setForm({...form, endDate:e.target.value})}/></div>
            <div className="field" style={{flex:"1 1 130px"}}><label>구분</label>
              <select value={form.kind} onChange={e=>setForm({...form, kind:e.target.value})}>
                {EVENT_KINDS.map(k=><option key={k.key} value={k.key}>{k.label}</option>)}
              </select></div>
          </div>
          <div className="field"><label>장소 · 시간</label>
            <input value={form.place} onChange={e=>setForm({...form, place:e.target.value})}
              placeholder="예) 본당 오전 11시"/></div>
          <div className="field"><label>메모</label>
            <textarea rows="2" value={form.note} onChange={e=>setForm({...form, note:e.target.value})}/></div>
          <div className="row" style={{gap:6}}>
            <button className="btn" disabled={!form.title.trim()} onClick={submit}>저장</button>
            <button className="btn ghost" onClick={()=>setForm(null)}>취소</button>
            {form.id && <button className="btn sm danger" style={{marginLeft:"auto"}}
              onClick={()=>removeEvent(form.id)}>삭제</button>}
          </div>
        </div>}

      <div className="panel">
        <h2>{Number(sel.slice(5,7))}월 {Number(sel.slice(8))}일
          <span className="muted small"> {["일","월","화","수","목","금","토"][new Date(sel+"T00:00:00").getDay()]}요일</span></h2>
        {selEvents.length===0 && selBirth.length===0
          ? <p className="empty" style={{marginTop:8}}>이 날은 등록된 행사가 없습니다.</p>
          : <React.Fragment>
              {selEvents.map(e=>(
                <div key={e.id} className="cal-item">
                  <span className="dot" style={{background:kindOf(e.kind).color}}/>
                  <div style={{flex:1}}>
                    <b>{e.title}</b>
                    {e.endDate && e.endDate>e.date &&
                      <span className="muted small"> ({e.date.slice(5).replace("-","/")}~{e.endDate.slice(5).replace("-","/")})</span>}
                    {e.place && <div className="muted small">{e.place}</div>}
                    {e.note && <div className="small" style={{whiteSpace:"pre-wrap"}}>{e.note}</div>}
                  </div>
                  {canEdit && <button className="btn sm ghost" onClick={()=>setForm(e)}>수정</button>}
                </div>))}
              {selBirth.map(m=>(
                <div key={m.id} className="cal-item">
                  <span className="dot" style={{background:"#D9762A"}}/>
                  <div style={{flex:1}}>
                    <b>🎂 {m.name}</b> <span className="muted small">{m.position}
                      {typeof m.birth === "string" && /^\d{4}-\d{2}-\d{2}$/.test(m.birth) && " · " + Number(m.birth.slice(0,4)) + "년생 (" + calcAge(m.birth) + "세)"}</span>
                    {m.phone && <div className="muted small">{m.phone}</div>}
                  </div>
                  {openable !== false &&
                    <button className="btn sm ghost" onClick={()=>openMember(m.id)}>기록 보기</button>}
                </div>))}
            </React.Fragment>}
      </div>

      {openable !== false && <div className="panel">
        <h2>{cur.m+1}월 생일 <span className="muted small">{monthBirthdays.length}명</span></h2>
        {monthBirthdays.length===0
          ? <p className="empty" style={{marginTop:8}}>이 달에 생일이신 분이 없습니다.</p>
          : <div className="mem-list" style={{marginTop:8}}>
              {monthBirthdays.map(({day,m})=>(
                <button key={m.id} className="bd-card"
                  onClick={()=>{ if(openable !== false) openMember(m.id); }}>
                  <span className="bd-day">{day}일</span>
                  <span className="bd-name">{m.name}</span>
                  <span className="muted small">{m.position}</span>
                </button>))}
            </div>}
      </div>}
    </div>
  );
}

/* ───────── 심방 전체 ───────── */
function Visits({members, update, openMember, canEdit, meName, meId}){
  const [memId, setMemId] = useState("");
  const [when, setWhen] = useState(nowLocal());
  const [purpose, setPurpose] = useState("정기심방");
  const [note, setNote] = useState("");

  const all = members.flatMap(m => (m.visits||[]).map(v=>({...v, memId:m.id, memName:m.name})))
    .sort((a,b)=>(b.when||"").localeCompare(a.when||""));

  return (
    <div>
      {canEdit && <div className="panel">
        <h2>새 심방 기록</h2>
        {members.length===0 ? <p className="empty">먼저 교인을 등록해 주세요.</p> :
        <div>
          <div className="row">
            <select value={memId} onChange={e=>setMemId(e.target.value)} style={{minWidth:140}}>
              <option value="">교인 선택…</option>
              {[...members].sort(koSort).map(m=><option key={m.id} value={m.id}>{m.name} ({m.position})</option>)}
            </select>
            <input type="datetime-local" value={when} onChange={e=>setWhen(e.target.value)}/>
            <select value={purpose} onChange={e=>setPurpose(e.target.value)}>
              {PURPOSES.map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          <div className="row" style={{marginTop:8}}>
            <input placeholder="내용 (선택)" value={note} onChange={e=>setNote(e.target.value)} style={{flex:"1 1 220px"}}/>
            <button className="btn" disabled={!memId || !when} onClick={()=>{
              update(memId, o=>({...o, visits:[...(o.visits||[]),
                {id:uid(), when, purpose, note:note.trim(), by: meName, byId: meId}]}));
              setNote(""); setWhen(nowLocal());
            }}>기록 추가</button>
          </div>
        </div>}
      </div>}

      <div className="panel">
        <h2>심방 기록 전체 <span className="muted small">{all.length}건</span></h2>
        {all.length===0 ? <p className="empty">아직 심방 기록이 없습니다.</p> :
          <div className="tbl-wrap"><table className="list-tbl">
            <thead><tr><th>일시</th><th>교인</th><th>목적</th><th>내용</th><th></th></tr></thead>
            <tbody>{all.map(v=>(
              <tr key={v.id}>
                <td className="c-date" style={{whiteSpace:"nowrap"}}>{fmtDT(v.when)}
                  {v.by && <div className="muted small">{v.by}</div>}</td>
                <td className="nw c-name"><button className="btn sm ghost" style={{whiteSpace:"nowrap"}}
                  onClick={()=>openMember(v.memId)}>{v.memName}</button></td>
                <td className="c-state"><span className="chip pos">{v.purpose}</span></td>
                <td className="c-text" style={{whiteSpace:"pre-wrap"}}>{v.note}</td>
                <td className="c-act">{canEdit && <button className="btn sm danger" onClick={()=>{
                  if(confirm("이 심방 기록을 삭제할까요?"))
                    update(v.memId, o=>({...o, visits:o.visits.filter(x=>x.id!==v.id)}));
                }}>삭제</button>}</td>
              </tr>))}
            </tbody></table></div>}
      </div>
    </div>
  );
}

/* ───────── 중보기도 전체 ───────── */
function Prayers({members: members0, update, openMember, canEdit, seeSecret, openable, meName, meId}){
  /* 자료가 어긋나도 멈추지 않게 — 빈 칸이 섞인 교인 목록 */
  const members = (Array.isArray(members0) ? members0 : []).filter(m => m && typeof m === "object" && m.id != null);
  const [filter, setFilter] = useState("open");
  const [kind, setKind] = useState("all");     /* all | normal | secret */
  const [memId, setMemId] = useState("");
  const [req, setReq] = useState("");
  const [secret, setSecret] = useState(false);

  /* 긴밀 기도 보기 권한이 없으면 긴밀 기도는 처음부터 빼고 셉니다 — 목록·숫자·단추 어디에도 드러나지 않게 */
  const all = (Array.isArray(members) ? members : []).filter(Boolean)
    .flatMap(m => (Array.isArray(m.prayers) ? m.prayers : []).filter(Boolean)
      .map(p=>({...p, memId:m.id, memName:m.name})))
    .filter(p => seeSecret || !p.secret)
    .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  const kindNow = seeSecret ? kind : "all";
  const list = all.filter(p => (filter==="all" || p.status===filter)
    && (kindNow==="all" || (kindNow==="secret" ? !!p.secret : !p.secret)));
  const openN = all.filter(p=>p.status==="open").length;

  return (
    <div>
      {canEdit && <div className="panel">
        <h2>새 기도 요청</h2>
        {members.length===0 ? <p className="empty">먼저 교인을 등록해 주세요.</p> :
        <div className="row">
          <select value={memId} onChange={e=>setMemId(e.target.value)} style={{minWidth:140}}>
            <option value="">교인 선택…</option>
            {[...members].sort(koSort).map(m=><option key={m.id} value={m.id}>{m.name} ({m.position})</option>)}
          </select>
          <input placeholder="기도 요청 사항" value={req} onChange={e=>setReq(e.target.value)} style={{flex:"1 1 220px"}}/>
          <button className="btn" disabled={!memId || !req.trim()} onClick={()=>{
            update(memId, o=>({...o, prayers:[...(o.prayers||[]),
              {id:uid(), date:todayStr(), request:req.trim(), status:"open", answeredDate:"",
               secret, by: meName, byId: meId}]}));
            setReq(""); setSecret(false);
          }}>추가</button>
        </div>}
        {members.length>0 && seeSecret &&
          <label className="row small" style={{gap:6, marginTop:8, alignItems:"center"}}>
            <input type="checkbox" checked={secret} onChange={e=>setSecret(e.target.checked)}/>
            <b>긴밀 중보기도</b>
            <span className="muted">— 목회자와 관리자만 볼 수 있습니다. 속장·교사에게는 보이지 않습니다.</span>
          </label>}
      </div>}

      <div className="panel">
        <div className="row" style={{justifyContent:"space-between"}}>
          <h2 style={{margin:0}}>중보기도 <span className="muted small">요청중 {openN}건</span></h2>
          <div className="row" style={{gap:8}}>
            {seeSecret && <div className="svc-tabs" style={{margin:0}}>
              {[["all","일반+긴밀"],["normal","일반"],["secret","긴밀"]].map(([k,l])=>(
                <button key={k} className={kind===k?"on":""} onClick={()=>setKind(k)}>{l}</button>))}
            </div>}
            <div className="svc-tabs" style={{margin:0}}>
              {[["open","요청중"],["answered","응답"],["all","전체"]].map(([k,l])=>(
                <button key={k} className={filter===k?"on":""} onClick={()=>setFilter(k)}>{l}</button>))}
            </div>
          </div>
        </div>
        {list.length===0 ? <p className="empty">해당하는 기도 제목이 없습니다.</p> :
          <div className="tbl-wrap" style={{marginTop:12}}><table className="list-tbl">
            <thead><tr><th>요청일</th><th>교인</th><th>기도 제목</th><th>상태</th><th></th></tr></thead>
            <tbody>{list.map(p=>(
              <tr key={p.id}>
                <td className="c-date" style={{whiteSpace:"nowrap"}}>{p.date}
                  {p.by && <div className="muted small">{p.by}</div>}</td>
                <td className="nw c-name"><button className="btn sm ghost" style={{whiteSpace:"nowrap"}}
                  onClick={()=>{ if(openable !== false) openMember(p.memId); }}>{p.memName}</button></td>
                <td className="c-text" style={{whiteSpace:"pre-wrap"}}>
                  {p.secret && <span className="chip secret" style={{marginRight:6}}>긴밀</span>}
                  {p.request}</td>
                <td className="c-state" style={{whiteSpace:"nowrap"}}>
                  {p.status==="answered"
                    ? <span className="chip ans">응답 {p.answeredDate && `(${p.answeredDate})`}</span>
                    : <span className="chip open">요청중</span>}
                </td>
                <td className="c-act" style={{whiteSpace:"nowrap"}}>
                  {canEdit && <React.Fragment>
                  <button className="btn sm ghost" onClick={()=>update(p.memId, o=>({...o, prayers:o.prayers.map(x=>
                    x.id===p.id ? (x.status==="answered" ? {...x,status:"open",answeredDate:""} : {...x,status:"answered",answeredDate:todayStr()}) : x)}))}>
                    {p.status==="answered" ? "요청중으로" : "응답 체크"}
                  </button>{" "}
                  {seeSecret && <React.Fragment><button className="btn sm ghost" onClick={()=>update(p.memId, o=>({...o, prayers:o.prayers.map(x=>
                    x.id===p.id ? {...x, secret: !x.secret} : x)}))}>
                    {p.secret ? "일반으로" : "긴밀로"}
                  </button>{" "}</React.Fragment>}
                  <button className="btn sm danger" onClick={()=>{
                    if(confirm("이 기도 제목을 삭제할까요?"))
                      update(p.memId, o=>({...o, prayers:o.prayers.filter(x=>x.id!==p.id)}));
                  }}>삭제</button>
                  </React.Fragment>}
                </td>
              </tr>))}
            </tbody></table></div>}
      </div>
    </div>
  );
}

/* 오류가 나면 흰 화면 대신 내용을 보여 줍니다 */
function showFatal(msg){
  const el = document.getElementById("root");
  if(!el) return;
  el.innerHTML =
    '<div data-fatal="1" style="max-width:640px;margin:40px auto;padding:22px;background:#fff;'
    + 'border:1px solid #D3D9E4;border-radius:14px;font-family:sans-serif;line-height:1.7">'
    + '<h2 style="margin:0 0 10px;color:#16223D">화면을 여는 중 문제가 생겼습니다</h2>'
    + '<p style="color:#63708A;font-size:14px;margin:0 0 12px">아래 내용을 그대로 알려 주시면 고쳐 드리겠습니다.</p>'
    + '<pre style="white-space:pre-wrap;word-break:break-all;background:#F4F5F8;padding:12px;'
    + 'border-radius:10px;font-size:12.5px;color:#8E3826">' + String(msg).replace(/</g,"&lt;")
    + '\n\n— ' + (typeof APP_VER === "string" ? APP_VER : "") + ' · ' + String(navigator.userAgent || "").replace(/</g,"&lt;") + '</pre>'
    + '<button onclick="try{localStorage.clear()}catch(e){};location.reload()" '
    + 'style="margin-top:12px;padding:9px 16px;border-radius:11px;border:1px solid #22355C;'
    + 'background:#22355C;color:#fff;font-weight:600">저장된 설정 지우고 다시 열기</button>'
    + '</div>';
}
/* 앱이 이미 그려져 있는지 (오류 화면이 아닌 진짜 화면) */
function appShown(){
  const el = document.getElementById("root");
  return !!(el && el.childElementCount && !el.querySelector("[data-fatal]"));
}
/* 바깥 오류(사파리 확장·번역·광고 차단기 등이 낸 "Script error." 같은 것)와
   서버 연결이 잠깐 끊긴 것 때문에 멀쩡한 앱을 오류 화면으로 덮지 않습니다.
   이런 경우에는 3초 기다려 보고, 그때까지 화면이 하나도 안 그려졌을 때만 오류 화면을 띄웁니다. */
function softFail(msg){
  try{ console.warn("[교회이음] 넘어간 오류:", msg); }catch(_){}
  setTimeout(() => { if(!appShown()) showFatal(msg); }, 3000);
}
window.addEventListener("error", e => {
  if(e && e.target && e.target !== window) return;              /* 그림·글꼴 같은 파일을 못 받은 것 */
  const msg = (e.error && e.error.stack) || e.message || "알 수 없는 오류";
  if(!e.error || /^script error\.?$/i.test(String(e.message || "").trim())) return softFail(msg);
  showFatal(msg);
});
window.addEventListener("unhandledrejection", e => {
  const r = e && e.reason;
  softFail((r && (r.stack || r.message)) || r || "알 수 없는 오류");
});

class Guard extends React.Component {
  constructor(p){ super(p); this.state = {}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ showFatal(err && (err.stack || err.message)); }
  render(){ return this.state.err ? null : this.props.children; }
}

try{
  ReactDOM.createRoot(document.getElementById("root")).render(<Guard><Root/></Guard>);
}catch(e){ showFatal(e && (e.stack || e.message)); }
</script>
