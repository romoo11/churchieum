/* ───────── 교인 목록 ───────── */
function MemberCard({m, onClick, lead, leadLabel}){
  /* 이름이 길어도 카드 크기가 그대로이도록, 한 줄에 들어갈 때까지 글자와 자간을 줄입니다 */
  const nameLen = String(m && m.name || "").replace(/\s/g, "").length;
  const nmStyle = nameLen >= 6 ? {fontSize:"12.8px", letterSpacing:"-0.6px"}
                : nameLen === 5 ? {fontSize:"13.6px", letterSpacing:"-0.5px"}
                : nameLen === 4 ? {fontSize:"14.3px", letterSpacing:"-0.3px"} : undefined;
  const nmRef = useRef(null);
  useEffect(() => {
    const el = nmRef.current;
    if(!el || nameLen < 4) return;                  /* 세 글자까지는 손대지 않습니다 */
    let size = parseFloat(getComputedStyle(el).fontSize) || 15.5;
    let guard = 0;
    const narrow = typeof window !== "undefined" && window.innerWidth <= 560;
    const minSize = nameLen >= 6 ? 10.5 : (narrow ? 11 : 12.2);   /* 좁은 화면·긴 이름은 조금 더 줄입니다 */
    while(el.scrollWidth > el.clientWidth + 0.5 && size > minSize && guard++ < 10){
      size -= 0.5;
      el.style.fontSize = size.toFixed(1) + "px";
      el.style.letterSpacing = (size < 13 ? "-0.7px" : "-0.4px");
    }
  }, [m && m.name, m && m.position]);
  return (
    <button className={"mem-card" + (lead ? " lead" : "")} onClick={onClick} title={lead && leadLabel ? leadLabel : undefined}>
      <div className="mc-top">
        {m.photo
          ? <img className="mem-avatar" src={m.photo} alt=""/>
          : <span className="mem-avatar ph">{(m.name||"?").slice(0,1)}</span>}
        <div style={{flex:"1 1 auto", minWidth:0}}>
          <div className="mc-name-row">
            <span className="nm" ref={nmRef} style={nmStyle}>{m.name}</span>
            <span className="chip pos">{m.position||"성도"}</span>
          </div>
          {/* 명부 첫 화면에는 이름과 직분만 — 나이·연락처·봉사는 이름을 눌러 기록에서 봅니다 */}
        </div>
      </div>
    </button>
  );
}

/* ── 교회학교 한 부서: 반 나누기 · 반 이름 고치기 · 아이 옮기기 ── */
function SchoolDept({g, canEdit, setMemView, data, saveDept, canOrder, saveOrder}){
  const [ordering, setOrdering] = useState(null);   /* 순서를 바꾸는 중인 반 */
  /* 자료가 조금 어긋나 있어도 멈추지 않게 — 목록이 비었거나 빈 칸이 섞인 경우 */
  g = {...(g || {}), items: ((g && Array.isArray(g.items)) ? g.items : []).filter(m => m && m.id != null)};
  const preset = DEFAULT_CLASSES[g.key] || [];
  const classes = (data && data.classes) ? data.classes
                : preset.map((n,i)=>({id:"c"+g.key+i, name:n}));
  const of = (data && data.of) || {};
  const [editing, setEditing] = useState(false);
  const save = (classes2, of2) => saveDept({classes:classes2, of: of2 || of});

  const bucket = {};
  classes.forEach(c => bucket[c.id] = []);
  const rest = [];
  (g.items || []).filter(m => m && m.id != null).forEach(m => {
    const cid = of[m.id];
    if(cid && bucket[cid]) bucket[cid].push(m); else rest.push(m);
  });
  const Row = ({rowKey, name, items, none}) => {
    const mayOrder = canOrder && saveOrder && items.length > 1;
    const isOrdering = ordering === rowKey;
    return (
    <div style={{marginBottom:14}}>
      <div className={"cls-head"+(none?" none":"")}>
        <NmLabel text={name}/>
        <span className="ct">{items.length}명</span>
        {mayOrder && <button type="button" className="btn sm ghost ord-btn" style={{marginLeft:"auto",padding:"2px 10px"}} title="순서" aria-label="순서"
          onClick={()=>setOrdering(isOrdering ? null : rowKey)}>{isOrdering ? "순서 닫기" : <React.Fragment><span className="ord-ico" aria-hidden="true">⇅</span><span className="ord-t">순서</span></React.Fragment>}</button>}
      </div>
      {items.length===0
        ? <p className="muted small" style={{margin:"6px 0 0"}}>아직 배정된 학생이 없습니다.</p>
        : isOrdering
        ? <OrderEditor items={items} onSave={saveOrder} onClose={()=>setOrdering(null)} leadLabel={none ? null : "리더 자리"}/>
        : <div className="mem-list" style={{marginTop:8}}>
            {items.map((m, idx)=>(
              <div key={m.id}>
                <MemberCard m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}
                  lead={idx===0 && !none} leadLabel={canOrder && saveOrder ? "리더 자리" : null}/>
                {canEdit && classes.length>0 &&
                  <div className="row" style={{margin:"4px 0 10px"}}>
                    <span className="muted small">반</span>
                    <select value={of[m.id]||""} onChange={e=>{
                      const of2 = {...of};
                      if(e.target.value) of2[m.id]=e.target.value; else delete of2[m.id];
                      save(classes, of2);
                    }}>
                      <option value="">미배정</option>
                      {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>}
              </div>))}
          </div>}
    </div>
    );
  };

  return (
    <div style={{marginBottom:22}}>
      <DeptHead sKey={"S_"+g.key} name={g.label} count={g.items.length+"명"}
        right={canEdit && <button onClick={()=>setEditing(!editing)}>{editing ? "닫기" : "반 편집"}</button>}/>

      {editing && canEdit &&
        <div className="panel" style={{padding:"12px 16px", marginBottom:12}}>
          <p className="small muted" style={{marginTop:0}}>반 이름을 고치거나, 반을 더하고 뺄 수 있습니다.
            반을 지우면 그 반 학생들은 <b>미배정</b>으로 돌아갑니다.</p>
          {classes.map((c,i)=>(
            <div className="row" key={c.id} style={{marginBottom:6}}>
              <input value={c.name} onChange={e=>{
                const cs=[...classes]; cs[i]={...c, name:e.target.value}; save(cs);
              }} style={{flex:"1 1 160px"}}/>
              <button className="btn sm ghost" onClick={()=>{
                const of2={...of};
                Object.keys(of2).forEach(k=>{ if(of2[k]===c.id) delete of2[k]; });
                save(classes.filter(x=>x.id!==c.id), of2);
              }}>지우기</button>
            </div>))}
          <button className="btn sm" onClick={()=>save([...classes, {id:uid2(), name:"새 반"}])}>+ 반 추가</button>
        </div>}

      {g.items.length===0
        ? <p className="muted small" style={{margin:"0 0 8px"}}>해당 교인이 없습니다.</p>
        : classes.length===0
          ? <Row rowKey="all" name="전체" items={(g.items || []).filter(m => m && m.id != null)}/>
          : <React.Fragment>
              {classes.map(c=> <Row key={c.id} rowKey={c.id} name={c.name} items={bucket[c.id]}/>)}
              {rest.length>0 && <Row rowKey="none" name="미배정" items={rest} none/>}
            </React.Fragment>}
    </div>
  );
}

function MemberList({members: members0, setMemView, canEdit, schoolClasses, saveClasses, canEditClass, canOrder, saveOrder, canFix = false, canBulk = false, bulkSave}){
  const [bulk, setBulk] = useState(false);          /* 여러 명 고치기 중인가 */
  const [sel, setSel] = useState([]);               /* 고른 교인 id */
  const [bulkVal, setBulkVal] = useState("");       /* 새 직분 또는 새 속 */
  const [busy, setBusy] = useState(false);
  /* 자료가 조금 어긋나 있어도 화면이 멈추지 않게 합니다 — 빈 칸·숫자로 들어간 생년월일·이름 없는 교인 */
  const str = v => v == null ? "" : String(v);
  const members = useMemo(() => (Array.isArray(members0) ? members0 : [])
    .filter(m => m && typeof m === "object")
    .map(m => ["name","birth","position","phone","address"].every(k => m[k] == null || typeof m[k] === "string")
      && typeof m.name === "string" ? m
      : {...m, name:str(m.name), birth:str(m.birth), position:str(m.position), phone:str(m.phone), address:str(m.address)}), [members0]);
  const [ordering, setOrdering] = useState(null);   /* 순서를 바꾸는 중인 묶음 */
  const [book, setBook] = useState("all"); // all=교인 명부 | sok=속별 명부
  const [q, setQ] = useState("");
  const [pos, setPos] = useState("전체");
  const [mode, setMode] = useState("pos"); // pos=직분별 | name=가나다순
  const positions = ["전체", ...Array.from(new Set(members.map(m=>m.position).filter(Boolean)))
    .sort((a,b)=>{
      const ia = POSITIONS.indexOf(a), ib = POSITIONS.indexOf(b);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1; if(ib!==-1) return 1;
      return a.localeCompare(b,"ko");
    })];
  const list = members
    .filter(m => book!=="all" || mode==="order" || pos==="전체" || m.position===pos)
    .filter(m => (book==="all" && mode==="order") || !q || (m.name+m.phone+m.address).includes(q))
    .sort((book==="all" && mode==="name") ? koSort : orderSort);   /* 가나다순 보기만 가나다, 나머지는 교회가 정한 순서 */
  /* 여러 명 고치기 — 지금 화면이 무엇을 바꿀지 정합니다 */
  const bulkField = book==="sok" ? "sok" : "position";
  const bulkOpts  = bulkField==="position"
    ? POSITIONS.map(p=>({v:p, l:p}))
    : [...sokKeys().map(k=>({v:k, l:sokKeyLabel(k)})), {v:"__LONG", l:"장기결석자 (재적 제외)"}];
  const bulkLabel = (bulkOpts.find(o=>o.v===bulkVal)||{}).l || "";
  const shown = list.filter(m => m && m.id != null);
  const toggleOne = id => setSel(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  const allShown = shown.length>0 && shown.every(m=>sel.includes(m.id));
  const toggleAllShown = () => setSel(s => allShown ? s.filter(id=>!shown.some(m=>m.id===id)) : [...new Set([...s, ...shown.map(m=>m.id)])]);
  const applyBulk = async () => {
    if(!bulkVal || sel.length===0) return;
    const picked = shown.filter(m=>sel.includes(m.id));
    /* 속 편성에서 빠지는 분(교역자·사모·청년)은 제외합니다 */
    const skip = (bulkField==="sok" && bulkVal!=="__LONG") ? picked.filter(m=>isMinister(m)||isSamo(m)||isYoungAdult(m)) : [];
    const targets = picked.filter(m=>!skip.includes(m));
    if(targets.length===0){ alert("고르신 분들은 속 편성 대상이 아닙니다. (교역자·사모·청년)"); return; }
    const msg = bulkField==="position"
      ? `${targets.length}명을 ${bulkVal}로 바꿉니다.`
      : bulkVal==="__LONG"
        ? `${targets.length}명을 장기결석자로 옮깁니다.\n\n재적 교인 수와 출석 명단에서 빠지고, 관리자와 교역자만 보게 됩니다.`
        : `${targets.length}명을 ${bulkLabel}으로 옮깁니다.`;
    const extra = skip.length ? `\n\n교역자·사모·청년 ${skip.length}명은 속 편성에서 빠지므로 그대로 둡니다.` : "";
    const warn = (bulkField==="sok" && bulkVal!=="__LONG" && !(SOK_MODE==="manual" || SOK_MODE==="area"))
      ? "\n\n※ 이 교회는 나이로 자동 배정하는 방식입니다. 속을 직접 정하면 그분들은 자동 배정에서 빠져 이 속으로 고정됩니다." : "";
    if(!confirm(msg + extra + warn + "\n\n바뀐 내용은 각자 메모에 한 줄 남습니다.")) return;
    setBusy(true);
    try{
      await bulkSave(targets.map(m => bulkNewData(m, bulkField, bulkVal, bulkLabel)));
      setSel([]); setBulkVal(""); setBulk(false);
      alert(`${targets.length}명을 고쳤습니다.`);
    }catch(e){ /* 알림은 App 에서 */ }
    finally{ setBusy(false); }
  };

  const orderBtn = key => (canOrder && saveOrder && !q)
    ? <button type="button" className="btn sm ghost grp-order-btn" onClick={()=>setOrdering(ordering===key ? null : key)}>
        {ordering===key ? "순서 닫기" : "순서"}</button> : null;

  const groups = useMemo(()=>{
    const map = {};
    const absent = [];
    list.forEach(m=>{ if(isLongAbsent(m)){ absent.push(m); return; } const p = m.position || "성도"; (map[p]=map[p]||[]).push(m); });
    const known = POSITIONS.filter(p=>map[p]);
    const extra = Object.keys(map).filter(p=>!POSITIONS.includes(p)).sort((a,b)=>a.localeCompare(b,"ko"));
    const out = [...known, ...extra].map(p=>({pos:p, items:map[p]}));
    if(absent.length) out.push({pos:"장기결석자", items:absent, absent:true});   /* 재적 밖 — 맨 아래 */
    return out;
  }, [list]);

  const sokGroups = useMemo(()=>{
    const map = {};
    list.forEach(m=>{
      if(isLongAbsent(m)){                                 /* 장기결석자는 속에서 빠져 따로 */
        if(!map["LONG"]) map["LONG"] = {s:null, items:[]};
        map["LONG"].items.push(m); return;
      }
      if(isMinister(m)){                                   /* 교역자는 따로 묶음 */
        if(!map["MIN"]) map["MIN"] = {s:null, items:[]};
        map["MIN"].items.push(m); return;
      }
      if(isSamo(m)){                                       /* 사모도 별도 항목 */
        if(!map["SAMO"]) map["SAMO"] = {s:null, items:[]};
        map["SAMO"].items.push(m); return;
      }
      const s = sokOf(m);
      /* 교회학교(유치부~청년부) 대상은 속별 명부에 나오지 않음 */
      if(!s && schoolDeptOf(m)) return;
      const key = s ? (s.id ? s.id : s.g + s.n) : "zz";
      if(!map[key]) map[key] = {s:s, items:[]};
      map[key].items.push(m);
    });
    const order = ["MIN","SAMO",...sokKeys(),"zz","LONG"];   /* 설정된 속 순서대로, 장기결석자는 맨 끝 */
    return order.filter(k=>map[k]).map(k=>({
      key:k,
      label: k==="MIN" ? "교역자" : k==="SAMO" ? "사모" : k==="zz" ? "속 미지정" : k==="LONG" ? "장기결석자 (재적 제외)" : sokLabel(map[k].s),
      items: map[k].items
    }));
  }, [list]);

  const SCHOOL = SCHOOL_DEPTS;
  const schoolGroups = useMemo(()=>{
    return SCHOOL.map(s=>({
      key:s.key, label:s.label,
      items: list.filter(m=>{
        const d = schoolDeptOf(m);                          /* 청년 표시·교역자·사모까지 함께 판정 */
        return d && d.key === s.key;
      })
    }));
  }, [list]);

  const gTitle = {margin:"0 0 8px", fontSize:"17px", color:"var(--pine-deep)",
    borderBottom:"2px solid var(--gold)", display:"inline-block", paddingBottom:"2px"};

  return (
    <div>
      <div className="panel">
        <div className="row" style={{justifyContent:"space-between"}}>
          <h2 style={{margin:0}}>교인 <span className="muted small">{members.filter(m=>!isLongAbsent(m)).length}명
            {members.some(isLongAbsent) && ` · 장기결석 ${members.filter(isLongAbsent).length}명`}</span></h2>
          {canEdit && <button className="btn gold" onClick={()=>setMemView({mode:"form"})}>+ 새 교인 등록</button>}
        </div>
        <div className="svc-tabs" style={{marginTop:14, marginBottom:0}}>
          <button className={book==="all"?"on":""} onClick={()=>setBook("all")}>교인 명부</button>
          <button className={book==="sok"?"on":""} onClick={()=>setBook("sok")}>속별 명부</button>
          <button className={book==="school"?"on":""} onClick={()=>setBook("school")}>교회학교</button>
        </div>
        <div className="row" style={{marginTop:12}}>
          {!(book==="all" && mode==="order") &&
          <input placeholder="이름·연락처·주소 검색" value={q} onChange={e=>setQ(e.target.value)} style={{flex:"1 1 200px"}}/>}
          {book==="all" && mode!=="order" && <select value={pos} onChange={e=>setPos(e.target.value)}>
            {positions.map(p=><option key={p}>{p}</option>)}
          </select>}
          {book==="all" && <div className="svc-tabs" style={{margin:0}}>
            <button className={mode==="pos"?"on":""} onClick={()=>setMode("pos")}>직분별</button>
            <button className={mode==="name"?"on":""} onClick={()=>setMode("name")}>가나다순</button>
            {canOrder && saveOrder &&
              <button className={mode==="order"?"on":""} onClick={()=>{ setOrdering(null); setMode("order"); }}>순서</button>}
          </div>}
          {canBulk && bulkSave && book!=="school" && mode!=="order" &&
            <button className={"btn sm ghost" + (bulk ? " on" : "")} style={{marginLeft:8}}
              onClick={()=>{ setBulk(!bulk); setSel([]); setBulkVal(""); }}>
              {bulk ? "단체수정 끝내기" : "단체수정"}</button>}
        </div>
        {(book==="sok" || book==="school") && canOrder && saveOrder &&   /* 안내글은 고칠 수 있는 분에게만 */
          <p className="lead-note"><i></i>{book==="sok" ? "속마다" : "반마다"} 첫 칸(금색 테두리)은 {book==="sok" ? "속장" : "리더"} 자리입니다.
            {" "}순서는 머리표의 [순서] 단추로 수정합니다.</p>}
      </div>

        {bulk && canBulk && bulkSave &&
          <div className="bulk-bar">
            <span className="cnt">{sel.length}명 선택</span>
            <button className="btn sm ghost" onClick={toggleAllShown} disabled={busy}>
              {allShown ? "보이는 사람 모두 해제" : "보이는 사람 모두 선택"}</button>
            <select value={bulkVal} onChange={e=>setBulkVal(e.target.value)} disabled={busy} style={{minWidth:140}}>
              <option value="">{bulkField==="position" ? "새 직분 고르기…" : "옮길 속 고르기…"}</option>
              {bulkOpts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
            </select>
            <button className="btn" onClick={applyBulk} disabled={busy || !bulkVal || sel.length===0}>
              {busy ? "바꾸는 중…" : (bulkField==="position" ? "직분 바꾸기" : "속 옮기기")}</button>
            <button className="btn ghost" onClick={()=>{ setBulk(false); setSel([]); setBulkVal(""); }} disabled={busy}>취소</button>
            <span className="muted small" style={{flexBasis:"100%"}}>
              {bulkField==="position"
                ? "고른 분은 원래 직분과 상관없이 모두 새 직분이 됩니다."
                : (SOK_MODE==="manual" || SOK_MODE==="area")
                  ? "고른 분의 속을 직접 지정합니다. 주소 방식이면 주소보다 이 지정이 우선합니다."
                  : "이 교회는 나이로 자동 배정합니다. 직접 지정하면 그분들은 자동 배정에서 빠져 고정됩니다."}</span>
          </div>}
      {list.length===0 ? <div className="panel empty">조건에 맞는 교인이 없습니다.</div> :
       book==="school" ?
        <div>
          {schoolGroups.every(g=>g.items.length===0) ?
            <div className="panel empty">교회학교(5~29세)에 해당하는 교인이 없습니다.<br/>
              {canEdit && "자녀·학생도 '새 교인 등록'에서 생년월일과 함께 등록하면 나이에 따라 자동으로 분류됩니다."}</div> :
            schoolGroups.map(g=>(
              <SchoolDept key={g.key} g={g} canEdit={canEditClass ? canEditClass(g.key) : canEdit} setMemView={setMemView}
                canOrder={canOrder} saveOrder={saveOrder}
                data={(schoolClasses||{})[g.key]} saveDept={(d)=>saveClasses({...(schoolClasses||{}), [g.key]: d})}/>
            ))}
        </div>
       : book==="sok" ?
        <div>
          {sokGroups.map(g=>(
            <div key={g.key} style={{marginBottom:18}}>
              <DeptHead sKey={g.key==="zz" ? "" : g.key} name={g.label} count={g.items.length+"명"}
                right={canOrder && saveOrder && !q && <button type="button" className="ord-btn" title="순서" aria-label="순서" onClick={()=>setOrdering(ordering==="sok:"+g.key ? null : "sok:"+g.key)}>
                  {ordering==="sok:"+g.key ? "순서 닫기" : <React.Fragment><span className="ord-ico" aria-hidden="true">⇅</span><span className="ord-t">순서</span></React.Fragment>}</button>}/>
              {g.key==="zz" && canFix && <p className="muted small" style={{margin:"0 0 8px"}}>
                성별·생년월일이 없어 속을 정하지 못했습니다. '정보 수정'에서 성별과 생년월일을 넣으면 자동 배정됩니다.</p>}
              {ordering==="sok:"+g.key
                ? <OrderEditor items={g.items} onSave={saveOrder} onClose={()=>setOrdering(null)}
                    leadLabel={isSokLeadKey(g.key) ? "속장 자리" : null}/>
                : <div className="mem-list">
                {g.items.map((m, idx)=>(
                  <BulkWrap key={m.id} on={bulk} checked={sel.includes(m.id)} toggle={()=>toggleOne(m.id)}>
                  <MemberCard m={m} onClick={()=>{ if(bulk) toggleOne(m.id); else setMemView({mode:"detail", id:m.id}); }}
                    lead={idx===0 && isSokLeadKey(g.key)} leadLabel={canOrder && saveOrder ? "속장 자리" : null}/>
                  </BulkWrap>
                ))}
              </div>}
            </div>
          ))}
        </div>
       : (mode==="order" && canOrder && saveOrder) ?
        <MultiOrderEditor key={"ord"+list.length} groups={groups.map(g=>({key:g.pos, label:g.pos, items:g.items}))}
          onSave={saveOrder} onClose={()=>setMode("pos")}/>
       : mode==="name" ?
        <div className="mem-list">
          {list.map(m=>(
            <BulkWrap key={m.id} on={bulk} checked={sel.includes(m.id)} toggle={()=>toggleOne(m.id)}>
            <MemberCard m={m} onClick={()=>{ if(bulk) toggleOne(m.id); else setMemView({mode:"detail", id:m.id}); }}/>
            </BulkWrap>
          ))}
        </div>
       :
        <div>
          {groups.map(g=>(
            <div key={g.pos} style={{marginBottom:18}}>
              <h3 style={gTitle}>{g.pos} <span className="muted small">{g.items.length}명</span></h3>
              {ordering==="pos:"+g.pos
                ? <OrderEditor items={g.items} onSave={saveOrder} onClose={()=>setOrdering(null)}/>
                : <div className="mem-list">
                {g.items.map(m=>(
                  <BulkWrap key={m.id} on={bulk} checked={sel.includes(m.id)} toggle={()=>toggleOne(m.id)}>
                  <MemberCard m={m} onClick={()=>{ if(bulk) toggleOne(m.id); else setMemView({mode:"detail", id:m.id}); }}/>
                  </BulkWrap>
                ))}
              </div>}
            </div>
          ))}
        </div>}
    </div>
  );
}

/* ───────── 교인 등록/수정 ───────── */
function MemberForm({init, onSave, onCancel, canAbsent = false}){
  /* 자료가 어긋나도 멈추지 않게 — 가족·봉사 칸이 없는 교인도 열립니다 */
  const [m, setM] = useState(() => {
    const o = init ? JSON.parse(JSON.stringify(init)) : emptyMember();
    ["family","depts","visits","prayers"].forEach(k => { if(!Array.isArray(o[k])) o[k] = []; });
    ["name","position","gender","birth","phone","address","memo"].forEach(k => { if(o[k] == null) o[k] = ""; else if(typeof o[k] !== "string") o[k] = String(o[k]); });
    return o;
  });
  const set = (k,v)=>setM(o=>({...o,[k]:v}));
  const setArr = (k, i, f, v)=>setM(o=>{ const a=[...o[k]]; a[i]={...a[i],[f]:v}; return {...o,[k]:a}; });
  const addRow = (k, row)=>setM(o=>({...o,[k]:[...o[k], row]}));
  const delRow = (k, i)=>setM(o=>({...o,[k]:o[k].filter((_,j)=>j!==i)}));

  return (
    <div className="panel">
      <h2>{init ? "교인 정보 수정" : "새 교인 등록"}</h2>

      <div className="photo-row">
        <div className={"photo-box" + (m.photo ? " has-photo" : "")}>
          {m.photo
            ? <img src={m.photo} alt="교인 사진"/>
            : <span className="photo-ph">사진 없음</span>}
        </div>
        <div className="col" style={{gap:6}}>
          <label className="btn sm ghost photo-pick">
            {m.photo ? "사진 변경" : "사진 선택"}
            <input type="file" accept="image/*" style={{display:"none"}}
              onChange={async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
                try{ set("photo", await readPhoto(f)); }
                catch(_){ alert("사진을 불러오지 못했습니다. 다른 사진으로 다시 시도해 주세요."); } }}/>
          </label>
          {m.photo && <button className="btn sm danger" onClick={()=>set("photo","")}>사진 삭제</button>}
          <span className="muted small">휴대폰·아이패드에서는 앨범이나 카메라를 선택할 수 있습니다. 사진은 자동으로 작게 저장됩니다.</span>
        </div>
      </div>

      <div className="form-grid">
        <div className="field"><label>이름 *</label>
          <input value={m.name} onChange={e=>set("name",e.target.value)} placeholder="홍길동"/></div>
        <div className="field"><label>생년월일</label>
          <input type="date" value={m.birth} onChange={e=>set("birth",e.target.value)}/></div>
        <div className="field"><label>성별 <span className="muted small">(속 자동 배정에 사용)</span></label>
          <select value={m.gender||""} onChange={e=>set("gender",e.target.value)}>
            <option value="">선택 안 함</option>
            <option value="여">여</option>
            <option value="남">남</option>
          </select></div>
        <div className="field"><label>연락처</label>
          <input value={m.phone} onChange={e=>set("phone",e.target.value)} placeholder="010-0000-0000"/></div>
        <div className="field"><label>직분</label>
          <input list="pos-list" value={m.position} onChange={e=>set("position",e.target.value)}/>
          <datalist id="pos-list">{POSITIONS.map(p=><option key={p} value={p}/>)}</datalist></div>
        {(SOK_MODE==="manual" || SOK_MODE==="area") &&
          <div className="field"><label>속회</label>
            <select value={m.sok||""} onChange={e=>set("sok",e.target.value)}>
              <option value="">{SOK_MODE==="area" ? "주소로 자동 배정" : "속 미지정"}</option>
              {SOK_LIST.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {SOK_MODE==="area" &&
              <span className="muted small">비워 두면 주소를 보고 자동으로 배정됩니다.</span>}
          </div>}
      </div>
      {canAbsent &&
        <label className="row small" style={{gap:8, alignItems:"center", margin:"4px 0 10px"}}>
          <input type="checkbox" checked={!!m.longAbsent} onChange={e=>{
            const on = e.target.checked;
            const line = `${todayStr()} ${on ? "장기결석으로 옮김" : "장기결석에서 돌아옴"}`;
            setM(o=>({...o, longAbsent:on, memo:[String(o.memo||"").trim(), line].filter(Boolean).join("\n")}));
          }}/>
          <b>장기결석자</b>
          <span className="muted">— 재적 교인 수·출석 명단·생일에서 빠지고, 속에서 나와 "장기결석자"로 모입니다. 관리자와 교역자만 봅니다.</span>
        </label>}
      <div className="field"><label>주소</label>
        <input value={m.address} onChange={e=>set("address",e.target.value)} placeholder="시/구/동 상세주소"/></div>
      <div className="field"><label>메모</label>
        <textarea rows="2" value={m.memo} onChange={e=>set("memo",e.target.value)} placeholder="특이사항, 신앙 배경 등"/></div>

      <h3>가족</h3>
      <p className="muted small" style={{margin:"-4px 0 8px"}}>교인으로 등록된 가족은 나이·직분을 그분 기록에서 가져옵니다. 나이·직업 칸은 교인이 아닌 가족만 적으시면 됩니다.</p>
      {m.family.length===0 && <p className="muted small">등록된 가족이 없습니다.</p>}
      {m.family.map((f,i)=>(
        <div className="row" key={f.id} style={{marginBottom:8}}>
          <select value={f.relation} onChange={e=>setArr("family",i,"relation",e.target.value)} style={{width:95}}>
            {RELATIONS.map(r=><option key={r}>{r}</option>)}
          </select>
          <input placeholder="이름" value={f.name} onChange={e=>setArr("family",i,"name",e.target.value)} style={{width:110}}/>
          <input placeholder="나이" type="number" min="0" value={f.age} onChange={e=>setArr("family",i,"age",e.target.value)} style={{width:75}}/>
          <input placeholder="직업 / 학교" value={f.job} onChange={e=>setArr("family",i,"job",e.target.value)} style={{flex:"1 1 140px"}}/>
          <button className="btn sm danger" onClick={()=>delRow("family",i)}>삭제</button>
        </div>
      ))}
      <button className="btn sm ghost" onClick={()=>addRow("family",{id:uid(),relation:"배우자",name:"",age:"",job:""})}>+ 가족 추가</button>

      <h3>봉사 부서 <span className="muted small">(과거 이력도 함께 기록)</span></h3>
      {m.depts.length===0 && <p className="muted small">등록된 봉사 부서가 없습니다.</p>}
      {m.depts.map((d,i)=>(
        <div className="row" key={d.id} style={{marginBottom:8}}>
          <input placeholder="부서명 (예: 찬양대)" value={d.name} onChange={e=>setArr("depts",i,"name",e.target.value)} style={{flex:"1 1 140px"}}/>
          <input placeholder="시작 (예: 2020)" value={d.from} onChange={e=>setArr("depts",i,"from",e.target.value)} style={{width:110}}/>
          <input placeholder="종료" value={d.to} disabled={d.current} onChange={e=>setArr("depts",i,"to",e.target.value)} style={{width:110}}/>
          <label className="row small" style={{gap:5}}>
            <input type="checkbox" checked={!!d.current}
              onChange={e=>{ setArr("depts",i,"current",e.target.checked); if(e.target.checked) setArr("depts",i,"to",""); }}/>
            현재 봉사 중
          </label>
          <button className="btn sm danger" onClick={()=>delRow("depts",i)}>삭제</button>
        </div>
      ))}
      <button className="btn sm ghost" onClick={()=>addRow("depts",{id:uid(),name:"",from:"",to:"",current:true})}>+ 부서 추가</button>

      <hr className="divider"/>
      <div className="row">
        <button className="btn" disabled={!m.name.trim()} onClick={()=>onSave({...m, name:m.name.trim()})}>저장</button>
        <button className="btn ghost" onClick={onCancel}>취소</button>
        {!m.name.trim() && <span className="muted small">이름을 입력하면 저장할 수 있습니다.</span>}
      </div>
    </div>
  );
}

/* ───────── 교인 상세 ───────── */
function MemberDetail({m, att, setMemView, update, remove, canEdit, canDelete, allMembers, openMember, limited, seeSecret, outside, canPray, meName, meId, canAtt = true, specials, printChurch}){
  const [pSecret, setPSecret] = useState(false);
  const visiblePrayers = (m && m.prayers ? m.prayers : []).filter(p => seeSecret || !p.secret);
  /* 속장·교사는 자기가 남긴 심방 기록만 봅니다 */
  const visibleVisits = (m && m.visits ? m.visits : []).filter(v => !limited || v.byId === meId);
  const [vWhen, setVWhen] = useState(nowLocal());
  const [vPurpose, setVPurpose] = useState("정기심방");
  const [vNote, setVNote] = useState("");
  const [pReq, setPReq] = useState("");
  const [tab, setTab] = useState("fam");            /* 열려 있는 폴더 */
  const [memoOpen, setMemoOpen] = useState(false);

  if(!m) return <div className="panel empty">교인 정보를 찾을 수 없습니다.</div>;
  const age = calcAge(m.birth);
  const year = String(new Date().getFullYear());

  /* 기본 예배 + 특별예배. 출석 기록에만 남아 있는 예배(목록에서 뺀 것)도 함께 찾아 준다 */
  const attStat = (()=>{
    const known = [...SERVICES, ...(specials||[])];
    const knownKeys = new Set(known.map(s=>s.key));
    const extraKeys = new Set();
    Object.keys(att).forEach(d=>{
      Object.keys(att[d]||{}).forEach(k=>{
        if(!knownKeys.has(k) && (att[d][k]||[]).includes(m.id)) extraKeys.add(k);
      });
    });
    const rows = [...known, ...[...extraKeys].map(k=>({key:k, label:"지난 특별예배", from:""}))];
    return rows.map(s=>{
      const dates = Object.keys(att).filter(d => (att[d][s.key]||[]).includes(m.id)).sort();
      return {key:s.key, label:s.label, from:s.from||"",
        special:!SERVICES.some(x=>x.key===s.key),
        total:dates.length,
        year:dates.filter(d=>d.startsWith(year)).length,
        last:dates.length ? dates[dates.length-1] : null};
    }).filter(s => !s.special || s.total > 0 || String(s.from||"").startsWith(year));
       /* 특별예배: 올해 것은 0회라도 표시, 지난 해 것은 참석 기록이 있을 때만 */
  })();

  const curDepts = (m.depts||[]).filter(d=>d.current);
  const pastDepts = (m.depts||[]).filter(d=>!d.current);

  return (
    <div>
      <div className="back-line">
        <button className="btn sm ghost" onClick={()=>setMemView({mode:"list"})}>← 명부로</button>
        <button className="btn sm ghost no-print" style={{marginLeft:"auto"}}
          onClick={()=>window.print()}>인쇄</button>
      </div>

      <div className="print-head">
        <span className="ph-church">{printChurch || "교적 카드"}</span>
        <span className="ph-date">출력일 {new Date().toISOString().slice(0,10)}</span>
      </div>

      <div className="panel id-card">
        <div className="mem-detail-head">
          {m.photo && <img className="mem-photo-lg" src={m.photo} alt={m.name+" 사진"}/>}
          <div className="row" style={{justifyContent:"space-between", flex:"1 1 auto"}}>
            <h2 style={{margin:0}}>{m.name} <span className="chip pos">{m.position||"성도"}</span></h2>

                  if(confirm("이 심방 기록을 삭제할까요?")) update(o=>({...o, visits:o.visits.filter(x=>x.id!==v.id)}));

      {(!limited || canPray) && <div className={"panel folder-panel f-pray" + (tab==="pray" ? " on" : "")}>

            <thead><tr><th>요청일</th><th>기도 제목</th><th>상태</th><th></th></tr></thead>

                  {(canEdit || (limited && p.byId === meId)) && <React.Fragment>
                  <button className="btn sm ghost" onClick={()=>update(o=>({...o, prayers:o.prayers.map(x=>

        {(canEdit || canPray) && <React.Fragment>

/* ───────── 출석 체크 ───────── */
function Attendance({members: members0, att: att0, saveAtt, markAtt, refreshAtt, canEdit, canCheckMember, schoolClasses, specials, saveSpecials, isAdmin, canOrder, saveOrder, orderVer}){
  const [ordering, setOrdering] = useState(null);   /* 순서를 바꾸는 중인 묶음 */
  /* 자료가 조금 어긋나 있어도 화면이 멈추지 않게 합니다 — 빈 칸·이름 없는 교인·비어 있는 출석 날짜 */
  const members = useMemo(() => (Array.isArray(members0) ? members0 : [])
    .filter(m => m && typeof m === "object")
    .map(m => (typeof m.name === "string" && (m.birth == null || typeof m.birth === "string")
                && (m.position == null || typeof m.position === "string")) ? m
      : {...m, name: String(m.name == null ? "" : m.name),
               birth: m.birth == null ? "" : String(m.birth),
               position: m.position == null ? "" : String(m.position)}), [members0]);
  const att = useMemo(() => {
    const out = {};
    Object.keys(att0 || {}).forEach(d => { const v = att0[d]; out[d] = (v && typeof v === "object") ? v : {}; });
    return out;
  }, [att0]);
  const mayCheck = m => canEdit && (!canCheckMember || canCheckMember(m));
  const [svc, setSvc] = useState("sun");
  const [showPast, setShowPast] = useState(false);   /* 지난 특별예배 펼치기 */
  /* 특별예배: 기간이 끝나지 않은 것만 탭에 두고, 지난 것은 접어 둔다 */
  const spAll = useMemo(()=>
    (specials||[]).map(s=>({key:s.key, label:s.label, dow:null, special:true, from:s.from, to:s.to}))
      .sort((a,b)=>(b.from||"").localeCompare(a.from||"")),
  [specials]);
  const t0 = todayStr();
  const spNow  = spAll.filter(s => s.to >= t0);      /* 진행 중이거나 앞으로 있을 것 */
  const spPast = spAll.filter(s => s.to <  t0);      /* 이미 끝난 것 */
  const allServices = useMemo(()=> [...SERVICES, ...spAll], [spAll]);
  const svcObj = allServices.find(s=>s.key===svc) || SERVICES[0];
  const [spForm, setSpForm] = useState(null);
  const pickSvc = s => {
    setSvc(s.key);
    if(s.special){
      const t = todayStr();
      setDate(t >= s.from && t <= s.to ? t : s.to < t ? s.to : s.from);
    } else if(s.dow !== null) setDate(lastWeekday(s.dow));
  };
  const [date, setDate] = useState(()=> lastWeekday(0));
  const [q, setQ] = useState("");

  useEffect(()=>{ if(svcObj.dow!==null) setDate(lastWeekday(svcObj.dow)); }, [svc]);

  const checked = (att[date] && att[date][svc]) || [];
  const toggle = id => {
    if(!canEdit) return;
    const who = members.find(m => m.id === id);
    if(who && !mayCheck(who)) return;          /* 담당 밖 교인은 손대지 않습니다 */
    if(markAtt) markAtt(date, svc, [id], !checked.includes(id));
    else saveAtt(date, svc, checked.includes(id) ? checked.filter(x=>x!==id) : [...checked, id]);
  };

  /* 다른 분이 체크한 것을 받아 오기 — 이 화면을 보고 있는 동안 30초마다, 화면으로 돌아올 때도 */
  useEffect(() => {
    if(!refreshAtt) return;
    const tick = () => { if(!document.hidden) refreshAtt(); };
    const timer = setInterval(tick, 30000);
    window.addEventListener("focus", tick);
    document.addEventListener("visibilitychange", tick);
    return () => { clearInterval(timer); window.removeEventListener("focus", tick); document.removeEventListener("visibilitychange", tick); };
  }, [refreshAtt]);
  const clearAll = () => {
    if(checked.length && confirm(`${date} ${svcObj.label} 출석 체크를 모두 해제할까요?`))
      saveAtt(date, svc, []);
  };

  const list = [...members.filter(m=>!isDeceased(m)).sort(orderSort), ...GUESTS]
    .filter(m=>!q || m.name.includes(q));
  const recent = Object.keys(att).filter(d=>(att[d][svc]||[]).length).sort().reverse().slice(0,8);

  /* 연도별 통계 — 예배 종류마다 따로, 1월 1일 ~ 12월 31일 */
  const years = useMemo(()=>{
    const s = new Set();
    Object.keys(att).forEach(d=>{ allServices.forEach(v=>{ if((att[d][v.key]||[]).length) s.add(d.slice(0,4)); }); });
    return [...s].sort().reverse();
  }, [att, allServices]);
  const [statYear, setStatYear] = useState("");
  const year = statYear || years[0] || String(new Date().getFullYear());

  /* 그 해 1월 1일부터 오늘까지, 이 예배의 날짜별 출석 인원 */
  const yearRows = useMemo(()=>
    Object.keys(att)
      .filter(d => d.slice(0,4) === year && (att[d][svc]||[]).length)
      .sort()
      .map(d => ({date:d, n:(att[d][svc]||[]).length})),
  [att, svc, year]);

  /* 속별 · 교회학교 부서별 편성 */
  const groups = useMemo(()=>{
    const map = {}, order = [];
    const bucket = (key, label) => {
      if(!map[key]){ map[key] = {key, label, items:[]}; order.push(key); }
      return map[key];
    };
    /* 교역자는 직분마다 따로 묶음 — 담임목사 · 부목사 · 전도사 (설정의 교역자 직분 순서대로) */
    (Array.isArray(MINISTERS) ? MINISTERS : []).forEach(p => { if(p) bucket("MIN_"+p, String(p)); });
    bucket("SAMO", "사모");
    sokKeys().forEach(k=>
      bucket(k, sokKeyLabel(k)));
    SCHOOL_DEPTS.forEach(s => {
      const dep = (schoolClasses||{})[s.key];
      const cls = dep && dep.classes ? dep.classes
                : (DEFAULT_CLASSES[s.key]||[]).map((n,i)=>({id:"c"+s.key+i, name:n}));
      if(cls.length){
        cls.forEach(c => { const b = bucket("S_"+s.key+"_"+c.id, c.name); b.dept = s; b.cls = true; });
        const bn = bucket("S_"+s.key+"_none", "미배정"); bn.dept = s; bn.cls = true; bn.none = true;
      } else { const b = bucket("S_"+s.key, "교회학교 · "+s.label); b.dept = s; }
    });
    bucket("GUEST", "미소속 (등록하지 않은 방문자)");
    bucket("zz", "편성 없음");

    list.forEach(m=>{
      if(m.guest){ map["GUEST"].items.push(m); return; }
      if(isMinister(m)){ const p = String(m.position || "교역자"); bucket("MIN_"+p, p).items.push(m); return; }
      if(isSamo(m)){ map["SAMO"].items.push(m); return; }
      const s = sokOf(m);
      if(s){ const kk = s.id ? s.id : s.g+s.n; bucket(kk, sokLabel(s)).items.push(m); return; }
      const d = schoolDeptOf(m);
      if(d){
        const dep = (schoolClasses||{})[d.key];
        const cls = dep && dep.classes ? dep.classes
                  : (DEFAULT_CLASSES[d.key]||[]).map((n,i)=>({id:"c"+d.key+i, name:n}));
        if(cls.length){
          const cid = dep && dep.of ? dep.of[m.id] : null;
          const key = (cid && cls.some(c=>c.id===cid)) ? "S_"+d.key+"_"+cid : "S_"+d.key+"_none";
          map[key].items.push(m);
        } else map["S_"+d.key].items.push(m);
        return;
      }
      map["zz"].items.push(m);
    });
    return order.map(k=>map[k]).filter(g=>g.items.length);
  }, [list, schoolClasses, orderVer]);

  /* 부서 전체 재적·출석 (반으로 나뉜 부서만) */
  const deptSummary = useMemo(()=>{
    const s = {};
    groups.forEach(g=>{
      if(!g.dept || !g.cls) return;
      const k = g.dept.key;
      if(!s[k]) s[k] = {dept:g.dept, total:0, on:0, firstKey:g.key};
      s[k].total += g.items.length;
      s[k].on += g.items.filter(m=>checked.includes(m.id)).length;
    });
    return s;
  }, [groups, checked]);

  const toggleDept = (k) => {
    if(!canEdit) return;
    const ids = groups.filter(g=>g.dept && g.dept.key===k)
      .flatMap(g=>g.items.filter(mayCheck).map(m=>m.id));
    if(!ids.length) return;
    const allOn = ids.every(id=>checked.includes(id));
    if(markAtt) markAtt(date, svc, ids, !allOn);
    else saveAtt(date, svc, allOn ? checked.filter(id=>!ids.includes(id))
                                  : [...checked, ...ids.filter(id=>!checked.includes(id))]);
  };

  const toggleGroup = g => {
    if(!canEdit) return;
    const ids = g.items.filter(mayCheck).map(m=>m.id);
    if(!ids.length) return;
    const allOn = ids.every(id=>checked.includes(id));
    if(markAtt) markAtt(date, svc, ids, !allOn);
    else saveAtt(date, svc, allOn ? checked.filter(id=>!ids.includes(id))
                                  : [...checked, ...ids.filter(id=>!checked.includes(id))]);
  };
  const gTitle = {margin:0, fontSize:"16px", color:"var(--pine-deep)",
    borderBottom:"2px solid var(--gold)", display:"inline-block", paddingBottom:"2px"};

  return (
    <div>
      <div className="panel">
        <h2>출석 체크</h2>
        <div className="svc-tabs">
          {[...SERVICES, ...spNow].map(s=>(
            <button key={s.key} className={svc===s.key?"on":""} onClick={()=>pickSvc(s)}>
              {s.special && "✦ "}{s.label}</button>
          ))}
          {/* 지난 특별예배를 보고 있으면 그 탭도 함께 표시 */}
          {svcObj.special && spPast.some(s=>s.key===svc) &&
            <button className="on" onClick={()=>{}}>✦ {svcObj.label}</button>}
          {spPast.length>0 &&
            <button className="svc-past" onClick={()=>setShowPast(!showPast)}>
              {showPast ? "지난 특별예배 접기" : "지난 특별예배 " + spPast.length + "건"}</button>}
          {isAdmin && <button className="svc-add" title="특별예배 추가"
            onClick={()=>setSpForm({key:"", label:"", from:todayStr(), to:todayStr()})}>+ 특별예배</button>}
        </div>

        {showPast && spPast.length>0 &&
          <div className="sp-past-box">
            <span className="muted small">지난 특별예배</span>
            {spPast.map(s=>(
              <button key={s.key} className={"btn sm"+(svc===s.key?"":" ghost")}
                onClick={()=>{ pickSvc(s); setShowPast(false); }}>
                {s.label} <span className="muted small">{s.from.slice(2).replace(/-/g,".")}</span>
              </button>))}
          </div>}

        {spForm && isAdmin &&
          <div className="panel" style={{padding:"14px 16px", marginBottom:12}}>
            <h3 style={{marginTop:0}}>{spForm.key ? "특별예배" : "새 특별예배"}</h3>
            <p className="small muted" style={{marginTop:0}}>
              특별새벽기도회처럼 일정 기간 매일 드리는 예배를 만들 수 있습니다. 기간 안의 날짜를 골라 매일 출석을 체크하시면 됩니다.</p>
            <div className="field"><label>이름</label>
              <input value={spForm.label} onChange={e=>setSpForm({...spForm, label:e.target.value})}
                placeholder="예) 특별새벽기도회, 부흥회"/></div>
            <div className="row">
              <div className="field" style={{flex:"1 1 150px"}}><label>시작</label>
                <input type="date" value={spForm.from} onChange={e=>setSpForm({...spForm, from:e.target.value})}/></div>
              <div className="field" style={{flex:"1 1 150px"}}><label>끝</label>
                <input type="date" value={spForm.to} onChange={e=>setSpForm({...spForm, to:e.target.value})}/></div>
            </div>
            <div className="row" style={{gap:6}}>
              <button className="btn" disabled={!spForm.label.trim() || !spForm.from || !spForm.to}
                onClick={()=>{
                  const k = spForm.key || ("sp" + Date.now().toString(36));
                  const item = {key:k, label:spForm.label.trim(), from:spForm.from, to:spForm.to};
                  const next = spForm.key
                    ? (specials||[]).map(x=>x.key===k ? item : x)
                    : [...(specials||[]), item];
                  saveSpecials(next); setSvc(k); setDate(item.from); setSpForm(null);
                }}>저장</button>
              <button className="btn ghost" onClick={()=>setSpForm(null)}>취소</button>
              {spForm.key &&
                <button className="btn sm danger" style={{marginLeft:"auto"}} onClick={()=>{
                  if(confirm("이 특별예배를 목록에서 지울까요?\n이미 체크한 출석 기록은 그대로 남습니다.")){
                    saveSpecials((specials||[]).filter(x=>x.key!==spForm.key));
                    setSvc("sun"); setSpForm(null);
                  }
                }}>목록에서 빼기</button>}
            </div>
          </div>}

        {svcObj.special &&
          <div className="sp-note">
            <b>{svcObj.label}</b>
            <span className="muted small"> {svcObj.from.replace(/-/g,".")} ~ {svcObj.to.replace(/-/g,".")}
              · 모두 {Math.round((new Date(svcObj.to)-new Date(svcObj.from))/86400000)+1}일</span>
            {isAdmin && <button className="btn sm ghost" style={{marginLeft:"auto"}}
              onClick={()=>setSpForm({key:svcObj.key, label:svcObj.label, from:svcObj.from, to:svcObj.to})}>수정</button>}
          </div>}
        <div className="row">
          <input type="date" value={date} onChange={e=>setDate(e.target.value)}/>
          <span className="muted">{date && `${weekdayOf(date)}요일`}</span>
          <span className="count-badge" style={{marginLeft:"auto"}}>{checked.length}</span>
          <span className="muted small">/ {members.length}명 출석</span>
          {canEdit && <button className="btn sm danger" onClick={clearAll} disabled={!checked.length}>모두 해제</button>}
        </div>
        <div className="row" style={{marginTop:10}}>
          <input placeholder="이름 검색" value={q} onChange={e=>setQ(e.target.value)} style={{flex:"1 1 160px",maxWidth:260}}/>
        </div>

        {members.length===0 ? <p className="empty">먼저 교인을 등록해 주세요.</p> :
         groups.length===0 ? <p className="empty">이름에 '{q}'이(가) 들어가는 교인이 없습니다.</p> :
          groups.map(g=>{
            const onCount = g.items.filter(m=>checked.includes(m.id)).length;
            const allOn = onCount === g.items.length;
            const dk = g.dept && g.cls ? g.dept.key : null;
            const sum = dk ? deptSummary[dk] : null;
            const showDeptHead = sum && sum.firstKey === g.key;   /* 부서의 첫 반 위에만 부서 머리표 */
            const rate = sum && sum.total ? Math.round(sum.on / sum.total * 100) : 0;
            const mayOrder = canOrder && saveOrder && !q && g.key !== "GUEST" && g.items.length > 1;
            const isOrdering = ordering === g.key;
            /* 속마다·반마다 첫 칸은 속장·리더 자리 (교역자·사모·미배정·방문자는 제외) */
            const leadKind = g.cls ? (g.none ? null : "리더 자리")
                           : g.dept ? "리더 자리"
                           : isSokLeadKey(g.key) ? "속장 자리" : null;
            return (
              <div key={g.key} style={{marginTop: showDeptHead ? 22 : 14}}>
                {showDeptHead &&
                  <DeptHead sKey={"S_"+dk} name={"교회학교 · " + sum.dept.label}
                    count={"출석 " + sum.on + " / 재적 " + sum.total + "명 · " + rate + "%"}
                    right={canEdit && <button onClick={()=>toggleDept(dk)}>부서 전체</button>}/>}
                {g.cls
                  ? <div className={"cls-head"+(g.none?" none":"")}>
                      <NmLabel text={g.label}/>
                      <span className="ct">{onCount} / {g.items.length}명</span>
                      {mayOrder && <button className="btn sm ghost ord-btn" style={{marginLeft:"auto",padding:"2px 10px"}} title="순서" aria-label="순서"
                        onClick={()=>setOrdering(isOrdering ? null : g.key)}>{isOrdering ? "순서 닫기" : <React.Fragment><span className="ord-ico" aria-hidden="true">⇅</span><span className="ord-t">순서</span></React.Fragment>}</button>}
                      {canEdit && !isOrdering && <button className="btn sm ghost" style={{marginLeft: mayOrder ? 6 : "auto",padding:"2px 10px"}}
                        onClick={()=>toggleGroup(g)}>{allOn ? "반 해제" : "반 체크"}</button>}
                    </div>
                  : <DeptHead sKey={g.key} name={g.label} count={onCount + " / " + g.items.length + "명"}
                      right={(mayOrder || canEdit) && <React.Fragment>
                        {mayOrder && <button type="button" className="ord-btn" title="순서" aria-label="순서" onClick={()=>setOrdering(isOrdering ? null : g.key)}>{isOrdering ? "순서 닫기" : <React.Fragment><span className="ord-ico" aria-hidden="true">⇅</span><span className="ord-t">순서</span></React.Fragment>}</button>}
                        {canEdit && !isOrdering && <button onClick={()=>toggleGroup(g)}>{allOn ? "전체 해제" : "전체 체크"}</button>}
                      </React.Fragment>}/>}
                {isOrdering
                  ? <OrderEditor items={g.items} onSave={saveOrder} onClose={()=>setOrdering(null)} leadLabel={leadKind}/>
                  : <div className="att-list" style={{marginTop:8}}>
                  {g.items.map((m, idx)=>{
                    const on = checked.includes(m.id);
                    const lead = !!leadKind && idx === 0 && !m.guest;
                    return (
                      <button key={m.id} className={"att-item"+(on?" on":"")+(mayCheck(m)?"":" locked")+(lead?" lead":"")}
                        onClick={()=>toggle(m.id)} disabled={!mayCheck(m)}
                        title={mayCheck(m) && lead && canOrder && saveOrder ? leadKind : undefined}
                        aria-pressed={on}>
                        <span className="mark">{on?"✓":""}</span>
                        <span className="att-name">{m.name}</span>
                      </button>);
                  })}
                </div>}
              </div>);
          })}
        <p className="muted small" style={{marginTop:14,marginBottom:0}}>{canEdit ? "이름을 누르면 출석/해제가 되고, 체크 즉시 서버에 저장됩니다." : ""}
          {canOrder && saveOrder && " 속마다·반마다 첫 칸(금색 테두리)은 속장·리더 자리이며, 머리표의 [순서]로 바꿉니다."}</p>
      </div>

      <div className="panel">
        <div className="row" style={{alignItems:"baseline", gap:10, flexWrap:"wrap"}}>
          <h2 style={{margin:0}}>{date} ({weekdayOf(date)}) {svcObj.label} 출석자
            <span className="muted small"> {checked.length}명</span></h2>
          {years.length>1 &&
            <select value={year} onChange={e=>setStatYear(e.target.value)} style={{marginLeft:"auto"}}>
              {years.map(y=><option key={y} value={y}>{y}년 흐름</option>)}
            </select>}
        </div>

        <div className="att-summary">
          <div className="att-names">
            {(() => {
              if(checked.length === 0) return <p className="empty" style={{margin:0}}>아직 체크된 분이 없습니다.</p>;
              const shown = groups.filter(g => g.items.some(m => checked.includes(m.id)));
              const draw = g => {
                const on = g.items.filter(m => checked.includes(m.id));
                return (
                  <div key={g.key} style={{marginBottom:9}}>
                    <div className="row small" style={{gap:6, alignItems:"baseline"}}>
                      <b style={{color:"var(--pine-deep)"}}>{g.label}</b>
                      <span className="muted">{on.length}명</span>
                    </div>
                    <div style={{marginTop:2}}>{on.map(m => m.name).join(", ")}</div>
                  </div>);
              };
              /* 그래프는 뒤쪽 짧은 묶음들 옆에 띄웁니다 — 앞쪽 묶음은 화면 폭을 다 씁니다 */
              let cut = shown.length;
              let lines = 0;
              for(let i = shown.length - 1; i >= 0; i--){
                const n = shown[i].items.filter(m => checked.includes(m.id)).length;
                lines += 2 + Math.floor(n / 9);          /* 제목 줄 + 이름 줄 */
                if(lines > 11) break;                     /* 그래프 높이만큼만 */
                cut = i;
              }
              return (
                <React.Fragment>
                  {shown.slice(0, cut).map(draw)}
                  <ChurchMonthChart rows={yearRows} year={year} label={svcObj.label}/>
                  {shown.slice(cut).map(draw)}
                </React.Fragment>);
            })()}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────── 연간 출석 흐름 (꺾은선) ───────── */
function LineChart({rows, year, label, today}){
  if(!rows || rows.length===0)
    return <div className="att-chart"><p className="empty" style={{margin:0}}>{year}년 {label} 기록이 아직 없습니다.</p></div>;

  const W = 560, H = 250, L = 42, R = 14, T = 18, B = 34;
  const iw = W - L - R, ih = H - T - B;
  const ns = rows.map(r=>r.n);
  const hi = Math.max(...ns), lo = Math.min(...ns);
  const top = Math.ceil((hi * 1.12) / 10) * 10 || 10;
  const x = i => rows.length===1 ? L + iw/2 : L + (i/(rows.length-1)) * iw;
  const y = n => T + ih - (n/top) * ih;
  const pts = rows.map((r,i)=>[x(i), y(r.n)]);
  const line = pts.map((p,i)=>(i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + " L " + pts[pts.length-1][0].toFixed(1) + " " + (T+ih) + " L " + pts[0][0].toFixed(1) + " " + (T+ih) + " Z";
  const ticks = [0, Math.round(top/2), top];
  const avg = Math.round(ns.reduce((a,b)=>a+b,0)/ns.length);
  /* 가로 눈금은 달이 바뀌는 지점에만 */
  const monthTicks = rows.map((r,i)=>({i, mo:r.date.slice(5,7)}))
    .filter((t,i,a)=> i===0 || t.mo !== a[i-1].mo);

  return (
    <div className="att-chart">
      <div className="chart-head">
        <b>{year}년 {label} 출석 흐름</b>
        <span className="muted small">{rows.length}회 · 평균 {avg}명 · 최고 {hi}명 · 최저 {lo}명</span>
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{width:"100%", height:"auto"}}>
        <defs>
          <linearGradient id="attFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#22355C" stopOpacity="0.22"/>
            <stop offset="100%" stopColor="#22355C" stopOpacity="0.02"/>
          </linearGradient>
        </defs>
        {ticks.map(t=>(
          <g key={t}>
            <line x1={L} y1={y(t)} x2={W-R} y2={y(t)} stroke="#DDE2EC" strokeWidth="1"/>
            <text x={L-8} y={y(t)+4} textAnchor="end" fontSize="11" fill="#63708A">{t}</text>
          </g>))}
        <line x1={L} y1={y(avg)} x2={W-R} y2={y(avg)} stroke="#B8912F" strokeWidth="1.2" strokeDasharray="5 4"/>
        <rect x={L+2} y={y(avg)+4} width="58" height="15" rx="7.5" fill="#E3E8F2" opacity="0.92"/>
        <text x={L+8} y={y(avg)+15} textAnchor="start" fontSize="10.5" fill="#8C6C1E">평균 {avg}명</text>
        <path d={area} fill="url(#attFill)"/>
        <path d={line} fill="none" stroke="#22355C" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
        {rows.map((r,i)=>(
          <g key={r.date}>
            <circle cx={x(i)} cy={y(r.n)} r={r.date===today ? 5.5 : 3.4}
              fill={r.date===today ? "#B8912F" : "#FBFCFE"} stroke="#22355C" strokeWidth="2"/>
            {(rows.length<=14 || r.n===hi || r.n===lo || r.date===today) &&
              <text x={x(i)} y={r.n < avg ? y(r.n)+16 : y(r.n)-10}
                textAnchor="middle" fontSize="10.5" fill="#16223D">{r.n}</text>}
          </g>))}
        {monthTicks.map(t=>(
          <text key={t.mo} x={x(t.i)} y={H-12} textAnchor="middle" fontSize="11" fill="#63708A">{Number(t.mo)}월</text>
        ))}
      </svg>
    </div>
  );
}

/* ───────── 교회 설정 (관리자 전용) ───────── */




/* ═══ 교회 예배 출석 — 달별 평균 인원 (교인 기록의 그래프와 같은 모양) ═══ */
function ChurchMonthChart({rows, year, label}){
  const list = Array.isArray(rows) ? rows.filter(r => r && typeof r.date === "string") : [];
  if(!list.length)
    return <div className="att-chart"><p className="empty" style={{margin:0}}>{year}년 {label} 기록이 아직 없습니다.</p></div>;

  const data = [];
  for(let mo = 1; mo <= 12; mo++){
    const key = `${year}-${pad(mo)}`;
    const ns = list.filter(r => r.date.slice(0, 7) === key).map(r => Number(r.n) || 0);
    data.push({mo, times:ns.length, n:ns.length ? Math.round(ns.reduce((a, b) => a + b, 0) / ns.length) : 0});
  }
  const hi = Math.max(...data.map(d => d.n), 1);
  const all = list.map(r => Number(r.n) || 0);
  const avg = Math.round(all.reduce((a, b) => a + b, 0) / all.length);
  const nowMo = (String(year) === String(new Date().getFullYear())) ? new Date().getMonth() + 1 : 0;

  const W = 560, H = 250, L = 34, R = 10, T = 18, B = 34;
  const iw = W - L - R, ih = H - T - B, bw = iw / 12;
  const y = n => T + ih - (n / hi) * ih;

  return (
    <div className="att-chart">
      <div className="chart-head">
        <b>{year}년 {label} 달별 평균 출석</b>
        <span className="muted small">{list.length}회 · 평균 {avg}명 · 가장 많은 달 {hi}명</span>
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{width:"100%", height:"auto"}} role="img" aria-label="달별 평균 출석">
        {[0, Math.round(hi / 2), hi].filter((v, i, a) => a.indexOf(v) === i).map(v => (
          <g key={v}>
            <line x1={L} y1={y(v)} x2={W - R} y2={y(v)} stroke="#DDE2EC" strokeWidth="1"/>
            <text x={L - 6} y={y(v) + 4} textAnchor="end" fontSize="11" fill="#63708A">{v}</text>
          </g>))}
        {data.map(d => {
          const x = L + (d.mo - 1) * bw + bw * 0.18, w = bw * 0.64;
          const cur = d.mo === nowMo;
          return (
            <g key={d.mo}>
              {d.n > 0 &&
                <rect x={x} y={y(d.n)} width={w} height={Math.max(0, T + ih - y(d.n))} rx="3"
                  fill={cur ? "#B8912F" : "#22355C"} opacity={cur ? 1 : 0.85}>
                  <title>{d.mo}월 · {d.times}회 · 평균 {d.n}명</title>
                </rect>}
              {d.n > 0 && <text x={x + w / 2} y={y(d.n) - 4} textAnchor="middle" fontSize="10.5"
                fill={cur ? "#8C6C1E" : "#22355C"} fontWeight="700">{d.n}</text>}
              <text x={x + w / 2} y={H - 12} textAnchor="middle" fontSize="10.5" fill="#63708A">{d.mo}월</text>
            </g>);
        })}
        <line x1={L} y1={T + ih} x2={W - R} y2={T + ih} stroke="#C7CFDE" strokeWidth="1"/>
      </svg>
    </div>
  );
}

/* ═══ 교인 한 사람의 달별 출석 횟수 그래프 ═══
   자료가 어긋나도 멈추지 않도록 모든 값을 확인하며 셉니다. */
function MemberMonthChart({att, memberId, months = 12}){
  const data = (() => {
    const now = new Date();
    const keys = [];
    for(let i = months - 1; i >= 0; i--){
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      keys.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
    }
    const cnt = {}; keys.forEach(k => { cnt[k] = 0; });
    const a = att && typeof att === "object" ? att : {};
    Object.keys(a).forEach(day => {
      if(typeof day !== "string" || day.length < 7) return;
      const mo = day.slice(0, 7);
      if(!(mo in cnt)) return;
      const svcs = a[day] && typeof a[day] === "object" ? a[day] : {};
      Object.keys(svcs).forEach(k => {
        const ids = svcs[k];
        if(Array.isArray(ids) && ids.indexOf(memberId) >= 0) cnt[mo] += 1;
      });
    });
    return keys.map(k => ({mo:k, n:cnt[k]}));
  })();

  const total = data.reduce((s, d) => s + d.n, 0);
  if(!total) return <div className="att-chart"><p className="empty" style={{margin:0}}>최근 {months}달 출석 기록이 아직 없습니다.</p></div>;

  const W = 560, H = 112, L = 24, R = 8, T = 12, B = 22;
  const iw = W - L - R, ih = H - T - B;
  const hi = Math.max(...data.map(d => d.n));
  const top = Math.max(hi, 1);
  const bw = iw / data.length;
  const avg = Math.round((total / data.length) * 10) / 10;
  const y = n => T + ih - (n / top) * ih;
  const label = k => { const p = String(k).split("-"); return Number(p[1]) + "월"; };

  return (
    <div className="att-chart">
      <div className="chart-head">
        <b>달별 출석 횟수</b>
        <span className="muted small">최근 {months}달 · 모두 {total}회 · 한 달 평균 {avg}회</span>
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{width:"100%", height:"auto"}} role="img" aria-label="달별 출석 횟수">
        {[0, Math.round(top / 2), top].filter((v, i, a2) => a2.indexOf(v) === i).map(v => (
          <g key={v}>
            <line x1={L} y1={y(v)} x2={W - R} y2={y(v)} stroke="#DDE2EC" strokeWidth="1"/>
            <text x={L - 5} y={y(v) + 4} textAnchor="end" fontSize="10" fill="#63708A">{v}</text>
          </g>))}
        {data.map((d, i) => {
          const x = L + i * bw + bw * 0.18, w = bw * 0.64;
          const h = Math.max(0, T + ih - y(d.n));
          const last = i === data.length - 1;
          return (
            <g key={d.mo}>
              {d.n > 0 &&
                <rect x={x} y={y(d.n)} width={w} height={h} rx="3"
                  fill={last ? "#B8912F" : "#22355C"} opacity={last ? 1 : 0.85}/>}
              {d.n > 0 && <text x={x + w / 2} y={y(d.n) - 3} textAnchor="middle" fontSize="9.5"
                fill={last ? "#8C6C1E" : "#22355C"} fontWeight="700">{d.n}</text>}
              <text x={x + w / 2} y={H - 7} textAnchor="middle" fontSize="9" fill="#63708A">{label(d.mo)}</text>
            </g>);
        })}
        <line x1={L} y1={T + ih} x2={W - R} y2={T + ih} stroke="#C7CFDE" strokeWidth="1"/>
      </svg>
    </div>
  );
}

/* ═══ 엑셀(CSV) 명부 — 내려받기 · 올리기 ═══
   엑셀에서 바로 열리도록 앞에 표식(BOM)을 붙여 저장합니다. */
const CSV_COLS = ["이름","직분","성별","생년월일","연락처","주소","속","메모","가족"];

const csvCell = v => {
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const toCSV = rows => "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");

/* 따옴표와 줄바꿈까지 제대로 읽습니다 */
const parseCSV = (text) => {
  const s = String(text || "").replace(/^\uFEFF/, "");
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(q){
      if(c === '"'){ if(s[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c === '"') q = true;
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(c !== "\r") cell += c;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
};

const saveFile = (name, text, type) => {
  const blob = new Blob([text], {type: type || "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* 가족: "아내:김영숙, 아들:이영욱(33)" 처럼 한 칸에 적습니다 */
const famToText = m => (Array.isArray(m.family) ? m.family : [])
  .filter(Boolean)
  .map(f => `${f.relation || ""}:${f.name || ""}${f.age ? "(" + f.age + ")" : ""}`).join(", ");
const textToFam = s => String(s || "").split(/[,;]/).map(x => x.trim()).filter(Boolean).map((x, i) => {
  const p = x.split(":");
  const rel = p.length > 1 ? p[0].trim() : "";
  const rest = (p.length > 1 ? p.slice(1).join(":") : x).trim();
  const g = rest.match(/^(.*?)\s*\((\d{1,3})\)\s*$/);
  return {id:"f" + (i + 1), relation:rel, name:(g ? g[1] : rest).trim(), age:g ? g[2] : "", job:""};
});
