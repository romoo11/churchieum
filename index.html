<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="application-name" content="교우이음">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16223D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="교우이음">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<!-- 앱 정보·아이콘은 저장소의 진짜 파일을 씁니다 (안드로이드 크롬은 파일 안에 박은 방식을 읽지 않음) -->
<link rel="manifest" href="manifest.webmanifest">
<title>교우이음 — 교인 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F4F5F8; --card:#FFFFFF; --ink:#1E2635; --muted:#63708A;
    --pine:#22355C; --pine-deep:#16223D; --pine-soft:#E3E8F2;
    --gold:#C29B3C; --gold-soft:#F4EAD2;
    --blue:#3D5A80; --clay:#A8442F; --clay-soft:#F4E2DC;
    --line:#D3D9E4;
  }
  /* 부서·속 머리표 (아이콘 배지) */
  .dept-head{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:12px;
    color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.10);margin-bottom:10px}
  .dept-head .ico{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.24);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .dept-head .nm{font-family:"Gowun Batang","Noto Sans KR",serif;font-size:17px;font-weight:700}
  .dept-head .ct{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 10px;font-size:12.5px}
  .dept-head .sp{margin-left:auto;display:flex;gap:6px}
  .dept-head button{border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:4px 11px;
    background:linear-gradient(180deg,#FFFFFF 0%,#EEF2F8 55%,#DDE4EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 1px 3px rgba(0,0,0,.22);
    font-size:13px;color:#1E2635;font-weight:600}
  .dept-head button:hover{background:#fff}
  /* 반 머리표 */
  .cls-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 13px;border-radius:11px;
    border:1px solid #BFCADE;border-left:5px solid var(--pine);
    background:linear-gradient(180deg,#F4F7FC 0%,#E6ECF6 55%,#D9E1EE 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(34,53,92,.10)}
  .cls-head .nm{font-weight:700;font-size:15px;color:var(--pine-deep)}
  .cls-head .ct{color:var(--muted);font-size:12.5px}
  .cls-head .btn.sm{margin-left:auto}
  .cls-head.none{background:#EBEEF4;border-left-color:#AEB6C6}
  .cls-head.none .nm{color:#63708A}
  .chip.secret{background:#7E2F20;color:#fff}
  td.nw, th.nw{white-space:nowrap}
  .rw{display:inline-flex;border:1px solid #BAC5D9;border-radius:9px;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
  .rw-b{border:none;background:linear-gradient(180deg,#FFFFFF,#E9EDF4);color:#5C6B85;
    font-size:11.5px;font-weight:600;padding:3px 9px;line-height:1.4}
  .rw-b+.rw-b{border-left:1px solid #BAC5D9}
  .rw-b.on{background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 44%,#B8912F 100%);
    color:#33280B;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .able{margin-top:5px;white-space:normal;max-width:280px;line-height:1.5}
  .able span{display:block;font-size:11.5px}
  .able-yes{color:var(--pine)}
  .able-no{color:#8A6A2E}
  .scope-col{min-width:230px}
  .scope-row{display:flex;align-items:center;gap:5px;margin-bottom:5px}
  .scope-row .chip{white-space:nowrap}
  .scope-col select{max-width:230px}
  .svc-add{border:1.5px dashed #7A8CB0;border-radius:999px;padding:7px 15px;
    font-weight:600;color:var(--pine);text-shadow:0 1px 0 rgba(255,255,255,.85);
    background:linear-gradient(180deg,#FFFFFF 0%,#F2F5FA 48%,#E2E8F2 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.10)}
  .svc-add:hover{filter:brightness(1.04)}
  .svc-past{border:1px solid #C3CBDB;border-radius:999px;padding:7px 15px;
    font-weight:600;color:var(--muted);text-shadow:0 1px 0 rgba(255,255,255,.8);
    background:linear-gradient(180deg,#FAFBFD 0%,#EBEEF5 48%,#DDE2EC 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 4px rgba(34,53,92,.10)}
  .svc-past:hover{filter:brightness(1.04)}
  .sp-past-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#EDEFF5;
    border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .sp-note{display:flex;align-items:center;gap:8px;background:#F1EDF6;border-left:5px solid #7B5EA7;
    border-radius:10px;padding:9px 14px;margin-bottom:12px;flex-wrap:wrap}
  /* 시작 화면 */
  /* ═══ 대문 — 배경 무늬 위에 업데이트 소식 · 마크 · 들어가기 ═══ */
  .gate{position:fixed;inset:0;z-index:50;background-color:#153161;background-size:cover;background-position:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;
    padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .gate-inner{margin:auto;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .gate-news{width:100%;box-sizing:border-box;text-align:left;color:#DCE5F3;
    background:rgba(9,22,50,.55);border:1px solid rgba(255,255,255,.18);border-radius:14px;
    padding:12px 16px 10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    box-shadow:0 6px 22px rgba(0,0,0,.25);font-size:13.5px;line-height:1.55}
  .gate-news + .gate-logo{margin-top:26px}
  .gate-news-h{font-weight:700;color:#F2D98A;letter-spacing:1px;margin-bottom:6px;font-size:13px}
  .gate-news-day{display:flex;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,.08)}
  .gate-news-day:first-of-type{border-top:0}
  .gate-news-date{flex:none;width:52px;color:#9FB3D3;font-size:12.5px;padding-top:1px}
  .gate-news-day ul{margin:0;padding-left:16px}
  .gate-news-day li{margin:1px 0}
  .gate-news-more{margin-top:4px;background:none;border:0;color:#AFC3E2;font-size:12.5px;cursor:pointer;padding:4px 0;text-decoration:underline}
  .gate-logo{width:clamp(100px,18vh,150px);height:auto;margin-top:0;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
  .gate-church{margin-top:14px;font-family:"Gowun Batang","Noto Sans KR",serif;color:#fff;font-weight:700;
    font-size:clamp(22px,3.2vh,30px);letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.45);max-width:90vw}
  .gate-app{margin-top:.3em;font-family:"Gowun Batang","Noto Sans KR",serif;color:#C7D6EE;
    font-size:clamp(14px,2vh,19px);letter-spacing:7px;text-indent:7px;font-weight:700}
  .gate-tag{margin-top:.5em;color:#93A8C9;font-size:13px;letter-spacing:.3px;padding:0 4px}
  .gate-btn{margin-top:1.3em;background:rgba(255,255,255,.10);color:#fff;
    border:1.5px solid rgba(255,255,255,.8);border-radius:999px;
    padding:0.72em 2.6em;font-size:16px;font-weight:700;letter-spacing:2px;
    font-family:"Gowun Batang","Noto Sans KR",serif;line-height:1;cursor:pointer;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 4px 16px rgba(0,0,0,.3);transition:background .15s, transform .08s}
  .gate-btn:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
  .gate-btn:active{transform:translateY(1px)}
  .gate-foot{margin-top:28px;color:#7E93B6;font-size:11.5px;line-height:1.8}
  .gate-foot b{color:#B9C9E4;font-family:"Gowun Batang","Noto Sans KR",serif;letter-spacing:1.5px}
  .app-copy{display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--muted);font-size:11.5px;padding:26px 12px 34px;line-height:1.6;text-align:left}
  .app-copy span{opacity:.75}
  .ch-row{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:7px;
    border:1px solid #BAC5D9;border-radius:12px;
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.12)}
  .owner-bar{margin:10px auto 0;max-width:1180px;padding:9px 14px;border-radius:12px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;
    border:1px solid #C8A24A;color:#4A3A12;
    background:linear-gradient(180deg,#FBF3DC 0%,#F3E4B8 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 2px 5px rgba(74,58,18,.12)}
  .owner-bar button{margin-left:auto}
  /* 운영자 현황 */
  .own-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 14px;margin-bottom:8px;border:1px solid #BAC5D9;border-radius:13px;
    background:linear-gradient(180deg,#FFFFFF 0%,#F2F5FA 48%,#E3E9F3 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 5px rgba(34,53,92,.12)}
  .own-main{flex:1 1 210px;min-width:0}
  .own-name{font-family:"Gowun Batang",serif;font-weight:700;font-size:16.5px;
    color:var(--pine-deep);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .own-st{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
    border:1px solid rgba(34,53,92,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(34,53,92,.1)}
  .st-live{background:linear-gradient(180deg,#DFF0DD,#BFE0BB);color:#245C1E}
  .st-part{background:linear-gradient(180deg,#FBF0D6,#F2E0AE);color:#7A5B12}
  .st-none{background:linear-gradient(180deg,#F0EEEE,#DEDCDC);color:#6A6A6A}
  .own-nums{display:flex;gap:14px;flex-wrap:wrap}
  .own-nums > div{text-align:center;min-width:52px}
  .own-nums b{display:block;font-family:"Gowun Batang",serif;font-size:17px;color:var(--pine)}
  .own-nums span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .own-act{display:flex;gap:6px;flex:0 0 auto}
  .join-code{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 16px;
    padding:12px 15px;border-radius:12px;border:1px solid #D8C79A;
    background:linear-gradient(180deg,#FDF8EC 0%,#F6EBCE 100%)}
  .join-code b{display:block;font-family:"Gowun Batang",serif;font-size:26px;letter-spacing:6px;
    color:#7A5B12;margin-top:1px}
  /* 새로 올라온 것 */
  .newfeed{margin:0 0 12px;border:1px solid #C8A24A;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,#FDF8EC 0%,#F6EBCE 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 6px rgba(74,58,18,.13)}
  .nf-head{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
  .nf-head b{font-family:"Gowun Batang",serif;font-size:15.5px;color:#4A3A12}
  .nf-dot{min-width:23px;height:23px;padding:0 6px;border-radius:999px;flex:none;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,#C25A4A,#A8412F);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 1px 3px rgba(0,0,0,.2)}
  .nf-arrow{margin-left:auto;color:#8A6A2E;font-size:11px}
  .nf-body{padding:0 10px 11px}
  .nf-item{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;flex-wrap:wrap;
    padding:8px 10px;margin-bottom:5px;border:1px solid #E0D3AE;border-radius:11px;
    background:linear-gradient(180deg,#FFFFFF,#F7F2E4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95)}
  .nf-item:hover{filter:brightness(1.03)}
  .nf-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;flex:none;
    border:1px solid rgba(34,53,92,.14)}
  .t-pray{background:linear-gradient(180deg,#E6EEF8,#CBDBF0);color:#28456F}
  .t-visit{background:linear-gradient(180deg,#E7F1E4,#CBE0C6);color:#2C5624}
  .nf-name{font-weight:700;color:var(--pine-deep);flex:none}
  .nf-text{color:#4A4A4A;font-size:13.5px;flex:1 1 150px;min-width:0}
  .nf-when{flex:none}
  /* 인쇄 — 교적 카드 한 장으로 */
  .print-head{display:none}
  @media print{
    @page{ size:A4; margin:14mm 14mm 12mm; }
    html,body{background:#fff !important}
    header.top, .tabbar, .newfeed, .owner-bar, .back-line, .no-print,
    .app-copy, nav, .top-right{display:none !important}
    .wrap{padding:0 !important;max-width:none !important}
    .print-head{display:flex !important;align-items:baseline;gap:8px;
      border-bottom:1.5px solid #333;padding-bottom:6px;margin-bottom:12px}
    .ph-church{font-family:"Gowun Batang",serif;font-size:15pt;font-weight:700;color:#000}
    .ph-date{margin-left:auto;font-size:9pt;color:#555}
    .panel{box-shadow:none !important;border:1px solid #BBB !important;
      background:#fff !important;border-radius:4px !important;
      margin-bottom:8px !important;padding:10px 12px !important;
      break-inside:avoid;page-break-inside:avoid}
    .panel h2{font-size:11.5pt !important;border:none !important;
      border-bottom:1px solid #CCC !important;padding-bottom:3px !important;
      margin-bottom:6px !important;color:#000 !important}
    .panel h2::after{display:none !important}
    table{font-size:9.5pt !important;width:100% !important}
    th,td{padding:3px 6px !important;border-color:#DDD !important;color:#111 !important}
    thead th{background:#EEE !important;color:#000 !important}
    .tbl-wrap{overflow:visible !important}
    .btn, button, select, input, textarea, label{display:none !important}
    /* 표 안의 이름 단추는 글자로 남깁니다 */
    td .btn.danger, td .btn.sm.danger{display:none !important}
    td .btn, td button{display:inline !important;border:none !important;
      background:none !important;box-shadow:none !important;padding:0 !important;
      color:#000 !important;font-size:9.5pt !important;font-weight:400 !important;
      text-shadow:none !important}
    /* 새로 적는 칸과 화면 안내는 종이에 싣지 않습니다 */
    .panel h3{display:none !important}
    .panel > .row{display:none !important}
    .muted.small, p.small.muted{display:none !important}
    .mem-photo-lg{width:26mm !important;height:26mm !important;box-shadow:none !important}
    .chip{border:1px solid #BBB !important;background:#F5F5F5 !important;color:#222 !important;
      box-shadow:none !important}
    .empty{color:#777 !important}
    a{text-decoration:none;color:#000}
  }
  /* 달력 */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wd{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 0}
  .cal-wd.sun{color:#A8442F}.cal-wd.sat{color:#3D5A80}
  .cal-cell{min-height:82px;border:1px solid #C9D2E1;border-radius:11px;
    padding:4px 5px;cursor:pointer;overflow:hidden;
    background:linear-gradient(180deg,#FFFFFF 0%,#F3F6FB 55%,#E6EBF4 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(34,53,92,.10);
    transition:filter .12s}
  .cal-cell:hover{filter:brightness(1.05)}
  .cal-cell.empty{background:transparent;border:0;cursor:default;min-height:0}
  .cal-cell.sel{border-color:var(--pine);box-shadow:0 0 0 2px rgba(34,53,92,.18)}
  .cal-cell.today{background:#EDF1F8}
  .cal-cell .dnum{font-size:13px;font-weight:700;color:var(--pine-deep);margin-bottom:2px}
  .cal-cell .dnum.sun{color:#A8442F}.cal-cell .dnum.sat{color:#3D5A80}
  .cal-cell.today .dnum::after{content:"오늘";font-size:9.5px;font-weight:600;margin-left:4px;
    color:#fff;background:var(--pine);border-radius:6px;padding:0 5px}
  .cal-ev{font-size:11px;color:#fff;border-radius:5px;padding:1px 5px;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-more{font-size:10.5px;color:var(--muted)}
  .cal-bd{font-size:11px;color:#8A4A12;background:#FBEFE2;border-radius:5px;padding:1px 5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-item{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid #E9EDF4}
  .cal-item:last-child{border-bottom:0}
  .cal-item .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .bd-card{display:flex;align-items:center;gap:8px;border:1px solid #BAC5D9;
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.12);
    border-radius:10px;padding:8px 12px;text-align:left;font-size:14.5px}
  .bd-card:hover{border-color:var(--pine)}
  .bd-day{background:#FBEFE2;color:#8A4A12;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:600}
  .bd-name{font-weight:600;color:var(--pine-deep)}
  @media(max-width:560px){
    .cal-cell{min-height:62px;padding:3px}
    .cal-cell .dnum{font-size:12px}
    .cal-ev,.cal-bd{font-size:9.5px;padding:0 3px}
  }
  /* 출석 통계 */
  .att-summary{display:grid;grid-template-columns:minmax(200px,1fr) minmax(300px,1.35fr);gap:18px;margin-top:12px}
  @media(max-width:820px){.att-summary{grid-template-columns:1fr}}
  .att-names{max-height:330px;overflow-y:auto;padding-right:6px;font-size:14.5px;line-height:1.55}
  .att-chart{background:var(--pine-soft);border-radius:12px;padding:12px 14px}
  .chart-head{display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
  .chart-head b{font-family:"Gowun Batang","Noto Sans KR",serif;color:var(--pine-deep);font-size:15px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;font-size:15.5px;line-height:1.55}
  h1,h2,h3{font-family:"Gowun Batang","Noto Sans KR",serif;letter-spacing:-.01em}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;max-width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
  textarea{width:100%;resize:vertical}
  .wrap{max-width:1020px;margin:0 auto;padding:0 16px 70px}

  header.top{background:var(--pine-deep);color:#EEF1F7;position:sticky;top:0;z-index:20;
    box-shadow:0 2px 10px rgba(20,40,32,.25)}
  .top-in{max-width:1320px;margin:0 auto;padding:10px 14px;
    display:flex;flex-wrap:nowrap;align-items:center;gap:10px}
  .top-in > .brand{flex:0 0 auto}
  .top-in > .back-btn{flex:0 0 auto}
  .top-in > nav{flex:1 1 auto;min-width:0}
  .top-in > .top-right{flex:0 0 auto;margin-left:auto}
  .brand{font-family:"Gowun Batang",serif;font-weight:700;font-size:18px;
    display:flex;align-items:center;gap:7px;white-space:nowrap}
  .brand svg{flex:none}
  .brand button{background:none;border:none;color:inherit;font:inherit;padding:0;text-align:left}
  .brand button:hover{text-decoration:underline}
  .logo-btn{background:transparent;border:0;padding:0;line-height:0;cursor:pointer;
    border-radius:8px;-webkit-tap-highlight-color:transparent}
  .logo-btn:hover{opacity:.8}
  .back-btn{color:#EEF1F7;padding:6px 12px;border-radius:11px;font-size:14px;font-weight:600;
    white-space:nowrap;border:1px solid rgba(255,255,255,.26);
    background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.04) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.32), 0 1px 3px rgba(0,0,0,.28)}
  .back-btn:hover{background:rgba(255,255,255,.26)}
  .back-btn.off{visibility:hidden;pointer-events:none}
  nav{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap}
  .top-right{display:flex;gap:4px;align-items:center;white-space:nowrap}
  /* 화면이 좁아질수록 조금씩 더 줄여 한 줄을 지킨다 */
  nav button{background:none;border:1px solid transparent;color:#CFDDD6;padding:7px 10px;
    border-radius:11px;font-weight:500;font-size:14.5px;
    transition:filter .12s, transform .08s, background .12s}
  nav button:not(.on):hover{background:rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  nav button:active{transform:translateY(1px)}
  nav button.on{color:#33280B;font-weight:700;border:1px solid #8C6C1E;
    text-shadow:0 1px 0 rgba(255,255,255,.42);
    background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 44%,#B8912F 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.18),
      0 2px 4px rgba(0,0,0,.24)}
  .refresh-btn{font-size:16px;line-height:1;padding:5px 10px}
  .backup-btn{color:#EEF1F7;padding:6px 11px;border-radius:11px;font-size:13px;white-space:nowrap;
    border:1px solid rgba(255,255,255,.24);
    background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.11) 46%,rgba(255,255,255,.03) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 1px 3px rgba(0,0,0,.30);
    transition:filter .12s, transform .08s}
  .backup-btn:hover{filter:brightness(1.25)}
  .backup-btn:active{transform:translateY(1px)}
  @media (max-width:1240px){
    .top-in{gap:8px;padding:9px 12px}
    .brand{font-size:17px}
    nav button{padding:7px 8px;font-size:14px}
    .backup-btn{padding:5px 9px;font-size:12.5px}
    .back-btn{padding:6px 10px;font-size:13.5px}
  }
  @media (max-width:1080px){
    .brand{font-size:15.5px;gap:6px}
    .brand svg{width:22px;height:22px}
    nav button{padding:6px 7px;font-size:13.5px}
    .backup-btn{padding:5px 8px;font-size:12px}
    .back-btn{padding:5px 9px;font-size:13px}
    .top-in{gap:6px}
  }
  @media (max-width:860px){
    .brand button{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .backup-btn{padding:4px 7px;font-size:11.5px}
    nav button{padding:6px 6px;font-size:13px}
  }

  .hero{position:relative;border-radius:16px;overflow:hidden;margin:20px 0 22px;
    box-shadow:0 8px 28px rgba(30,63,54,.28)}
  .hero svg{display:block;width:100%;height:auto}
  .hero-text{position:absolute;left:0;right:0;bottom:0;padding:18px 26px;
    background:linear-gradient(transparent,rgba(12,20,38,.74));color:#F7F3E6}
  .hero-text h1{margin:0;font-size:clamp(22px,4.2vw,34px)}
  .hero-text p{margin:4px 0 0;font-size:clamp(13px,2.2vw,15.5px);color:#DCE3F0}

  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-family:"Gowun Batang",serif;font-size:30px;font-weight:700;color:var(--pine)}
  .stat .l{color:var(--muted);font-size:13.5px}
  .stat.gold .n{color:var(--gold)}
  .stat.clay .n{color:var(--clay)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .panel h2{margin:0 0 12px;font-size:19px;color:var(--pine-deep);
    border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:3px}
  .panel h3{margin:18px 0 8px;font-size:16.5px;color:var(--pine-deep)}
  .muted{color:var(--muted)}
  .small{font-size:13.5px}

  /* 물방울(광택) 단추 — 위는 밝고 아래는 짙게, 안쪽 위에 흰 하이라이트 */
  .btn{color:#fff;border:1px solid #1B2C4E;border-radius:13px;padding:9px 17px;font-weight:600;
    background:linear-gradient(180deg,#5A7FB4 0%,#2E4E82 42%,#22355C 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -2px 5px rgba(0,0,0,.20),
      0 2px 5px rgba(22,34,61,.28);
    text-shadow:0 1px 1px rgba(0,0,0,.28);transition:filter .12s, transform .08s, box-shadow .12s}
  .btn:hover{filter:brightness(1.09)}
  .btn:active{transform:translateY(1px);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.32), 0 1px 2px rgba(22,34,61,.25)}
  .btn.gold{color:#33280B;border-color:#8C6C1E;text-shadow:0 1px 0 rgba(255,255,255,.35);
    background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 42%,#B8912F 100%)}
  .btn.ghost{color:var(--pine);border:1px solid #B9C4D8;text-shadow:0 1px 0 rgba(255,255,255,.8);
    background:linear-gradient(180deg,#FFFFFF 0%,#EDF1F8 48%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 4px rgba(34,53,92,.10),
      0 2px 5px rgba(34,53,92,.14)}
  .btn.danger{color:#8E3826;border-color:#D9B3A9;text-shadow:0 1px 0 rgba(255,255,255,.7);
    background:linear-gradient(180deg,#FFFFFF 0%,#FBEDE9 48%,#F2DAD2 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 4px rgba(142,56,38,.10),
      0 2px 5px rgba(142,56,38,.14)}
  .btn.sm{padding:5px 12px;font-size:13.5px;border-radius:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .field label{font-weight:600;font-size:13.5px;color:var(--pine-deep)}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 16px}

  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
    border:1px solid rgba(34,53,92,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(34,53,92,.10)}
  .chip.pos{background:var(--pine-soft);color:var(--pine-deep)}
  .chip.now{background:var(--gold-soft);color:#7A5E14}
  .chip.past{background:#EEECE3;color:var(--muted)}
  .chip.open{background:var(--clay-soft);color:var(--clay)}
  .chip.ans{background:var(--pine-soft);color:var(--pine)}
  .chip.admin{background:var(--gold-soft);color:#7A5E14}
  .chip.editor{background:var(--pine-soft);color:var(--pine-deep)}
  .chip.pending{background:var(--clay-soft);color:var(--clay)}
  .chip.viewer{background:#E2E9F2;color:#3D5A80}

  .mem-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:6px}
  .mem-card{border:1px solid #BAC5D9;border-radius:13px;padding:8px 10px;text-align:left;
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 4px rgba(34,53,92,.09),
      0 2px 4px rgba(34,53,92,.13);
    transition:filter .12s, transform .08s, box-shadow .12s}
  .mem-card:hover{filter:brightness(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),
    0 3px 9px rgba(34,53,92,.22)}
  .mem-card:active{transform:translateY(1px)}
  .mem-card .nm{font-family:"Gowun Batang",serif;font-size:15.5px;font-weight:700;
    color:var(--pine-deep);text-shadow:0 1px 0 rgba(255,255,255,.8);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* 이름 줄 — 이름과 직분이 늘 한 줄에 (이름이 길면 이름만 줄어듭니다) */
  /* 이름 줄 높이를 고정해 글자가 줄어들어도 카드 크기가 같게 합니다 */
  .mc-name-row{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:nowrap;min-width:0;
    height:22px}
  .mem-card .nm{line-height:22px}
  .mem-card .sub{line-height:16px;height:16px}
  .mc-name-row .chip.pos{flex:none}
  .mem-card .mc-name-row .chip.pos{font-size:10.5px;padding:1px 6px}
  @media (max-width:560px){ .mem-card .mc-name-row .chip.pos{font-size:10px;padding:1px 5px} }
  .mem-card .sub{color:var(--muted);font-size:11.5px;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-top{display:flex;gap:8px;align-items:center}
  .mem-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 1px 3px rgba(34,53,92,.28), inset 0 1px 0 rgba(255,255,255,.6)}
  .mem-avatar.ph{display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#D6E0F0 0%,#B7C6DE 100%);
    color:var(--pine-deep);font-family:"Gowun Batang",serif;font-weight:700;font-size:15px;
    text-shadow:0 1px 0 rgba(255,255,255,.7)}
  @media (max-width:560px){ .mem-list{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))} }
  .mem-detail-head{display:flex;gap:14px;align-items:flex-start}
  /* ── 사진이 들어가는 틀은 모두 물방울 결로 ── */
  .photo-frame{position:relative;overflow:hidden;border-radius:13px;
    border:1px solid rgba(34,53,92,.30);
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 5px rgba(34,53,92,.12),
      0 3px 8px rgba(34,53,92,.20)}
  .photo-frame::after{content:"";position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 30%,
      rgba(255,255,255,0) 52%,rgba(34,53,92,.12) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 1px rgba(255,255,255,.18)}
  .mem-photo-lg{width:88px;height:88px;border-radius:13px;object-fit:cover;flex:none;
    border:1px solid rgba(34,53,92,.30);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 3px 8px rgba(34,53,92,.20)}
  .photo-row{display:flex;gap:14px;align-items:flex-start;margin:4px 0 14px}
  .photo-box{width:96px;height:96px;border-radius:13px;flex:none;position:relative;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    border:1px dashed #B2BED4;
    background:linear-gradient(180deg,#FFFFFF 0%,#F3F6FB 50%,#E4EAF3 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 5px rgba(34,53,92,.13)}
  .photo-box.has-photo{border:1px solid rgba(34,53,92,.30);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 5px rgba(34,53,92,.12),
      0 3px 8px rgba(34,53,92,.20)}
  .photo-box.has-photo::after{content:"";position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 30%,
      rgba(255,255,255,0) 52%,rgba(34,53,92,.12) 100%)}
  .photo-box img{width:100%;height:100%;object-fit:cover}
  .photo-box .photo-ph{color:var(--muted);font-size:12.5px;text-align:center}
  .photo-pick{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .col{display:flex;flex-direction:column}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;color:var(--pine-deep);font-size:13px;border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap}
  td{border-bottom:1px solid #EAE8DE;padding:8px;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .tbl-wrap{overflow-x:auto}

  .svc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .svc-tabs button{border:1px solid #B9C4D8;border-radius:999px;padding:7px 16px;font-weight:600;
    color:#4A5875;text-shadow:0 1px 0 rgba(255,255,255,.85);
    background:linear-gradient(180deg,#FFFFFF 0%,#EEF2F8 48%,#DBE2EE 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 4px rgba(34,53,92,.09),
      0 2px 4px rgba(34,53,92,.12);transition:filter .12s, transform .08s}
  .svc-tabs button:hover{filter:brightness(1.05)}
  .svc-tabs button:active{transform:translateY(1px)}
  .svc-tabs button.on{border-color:#1B2C4E;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);
    background:linear-gradient(180deg,#5A7FB4 0%,#2E4E82 42%,#22355C 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -2px 5px rgba(0,0,0,.20),
      0 2px 5px rgba(22,34,61,.28)}
  .att-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:5px;margin-top:12px}
  @media (max-width:560px){ .att-list{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))} }
  .att-item{display:flex;align-items:center;gap:6px;border:1px solid #BAC5D9;border-radius:11px;
    padding:6px 8px;font-weight:500;text-align:left;font-size:13.5px;
    white-space:nowrap;overflow:hidden;
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 4px rgba(34,53,92,.08),
      0 2px 4px rgba(34,53,92,.12);transition:filter .12s, transform .08s}
  .att-item.locked{opacity:.62;cursor:default;box-shadow:none}
  .att-item.locked:hover{filter:none}
  .att-item.locked:active{transform:none}
  .att-item:hover{filter:brightness(1.05)}
  .att-item:active{transform:translateY(1px)}
  .att-item.on{border-color:#1B2C4E;color:#fff;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.3);
    background:linear-gradient(180deg,#5A7FB4 0%,#2E4E82 42%,#22355C 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -2px 5px rgba(0,0,0,.20),
      0 2px 5px rgba(22,34,61,.28)}
  .att-item.on .muted{color:#C3D1E8}
  .att-item .mark{flex:none;width:17px;height:17px;border-radius:5px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#fff;background:#fff}
  .att-item.on .mark{background:#fff;border-color:#fff;color:#22355C}
  .att-item .muted{font-size:11px}
  .count-badge{font-family:"Gowun Batang",serif;font-size:22px;font-weight:700;color:var(--pine)}

  .empty{padding:28px 10px;text-align:center;color:var(--muted)}
  .back-line{margin:16px 0 10px}
  .divider{border:none;border-top:1px solid var(--line);margin:16px 0}
  .notice{background:var(--gold-soft);border:1px solid #E4D3A2;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
  .err-banner{background:var(--clay-soft);border:1px solid #DFB1A2;color:#7C2E1E;
    border-radius:10px;padding:10px 14px;font-size:13.5px;margin:14px 0}

  .modal-back{position:fixed;inset:0;background:rgba(18,30,25,.55);display:flex;
    align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal-back .panel{max-width:440px;width:100%;margin:0}

  .center-box{max-width:430px;margin:60px auto;padding:0 16px}
  .center-box .panel{padding:26px 26px 24px}
  .center-box .logo-line{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px;
    font-family:"Gowun Batang",serif;font-weight:700;font-size:21px;color:var(--pine-deep)}
  .center-box input{width:100%}
  .auth-tabs{display:flex;gap:6px;margin-bottom:16px}
  .auth-tabs button{flex:1;border:1px solid #B9C4D8;border-radius:11px;padding:9px;font-weight:600;
    color:#4A5875;text-shadow:0 1px 0 rgba(255,255,255,.85);
    background:linear-gradient(180deg,#FFFFFF 0%,#EEF2F8 48%,#DBE2EE 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.12)}
  .auth-tabs button.on{border-color:#1B2C4E;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);
    background:linear-gradient(180deg,#5A7FB4 0%,#2E4E82 42%,#22355C 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), 0 2px 5px rgba(22,34,61,.28)}

  /* ── 아래쪽 탭바 (휴대폰) ── */
  .tabbar{display:none}
  @media (max-width:640px){
    .top-in{padding:7px 8px;gap:6px;flex-wrap:nowrap}
    /* 위 띠에는 교회 이름과 백업·가져오기·교회 바꾸기·로그아웃만 */
    header.top nav{display:none}
    .top-in > .back-btn{display:none}
    .brand{font-size:14.5px;gap:5px;flex:0 0 auto}
    .brand svg{width:20px;height:20px}
    .brand button{max-width:27vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .top-right{flex:1 1 auto;justify-content:flex-end;overflow-x:auto;

    .backup-btn{padding:5px 7px;font-size:11px;flex:0 0 auto;border-radius:9px}

    .tabbar::-webkit-scrollbar{display:none}
    .tab{flex:1 1 0;min-width:0;background:none;border:1px solid transparent;

    .me-name{display:none}
    .tab:active{transform:translateY(1px)}
    .tab.on{color:#33280B;font-weight:700;border:1px solid #8C6C1E;
      background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 44%,#B8912F 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 4px rgba(0,0,0,.22)}
    .tab.off{visibility:hidden;pointer-events:none}
    /* 탭바에 가리지 않도록 본문 아래 여백 */

/* 가져오기(합치기)에서 빈 값이 기존 값을 덮어쓰지 않도록 필드 단위로 병합 */
const isEmptyVal = v => v===undefined || v===null || v==="" || (Array.isArray(v) && v.length===0);
const mergeMember = (ex, im) => { const out={...ex}; for(const k in im){ if(!isEmptyVal(im[k])) out[k]=im[k]; } return out; };

/* 교인 사진: 선택한 이미지 파일을 작게 압축해 base64 문자열로 변환
   한 장 9KB 안팎 — 명부 카드(34px)와 기록 화면에서 차이를 느끼기 어렵습니다 */
const PHOTO_MAX = 360, PHOTO_Q = 0.72;
const readPhoto = (file) => new Promise((resolve, reject)=>{
  const r = new FileReader();
  r.onerror = () => reject(new Error("read"));
  r.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("img"));
    img.onload = () => {
      const max = PHOTO_MAX;
      let w = img.width, h = img.height;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", PHOTO_Q));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

function normalizeChurchHomePhoto(value){
  if(value === null || value === undefined) return null;
  if(typeof value !== "object" || value.version !== 1 ||
     typeof value.dataUrl !== "string" || value.dataUrl.length > CHURCH_HOME_PHOTO_LIMIT ||
     !/^data:image\/(jpeg|png);base64,[A-Za-z0-9+/]+={0,2}$/.test(value.dataUrl)){
    throw new Error("저장된 교회 사진 형식을 확인할 수 없습니다.");
  }
  const position = n => Number.isFinite(n) ? Math.min(100, Math.max(0, n)) : 50;
  return {version:1, dataUrl:value.dataUrl, fit:value.fit === "cover" ? "cover" : "contain",
          x:position(value.x), y:position(value.y), cut: value.cut === true};
}

function parseChurchHomePhoto(rows){
  const row = (rows || []).find(r => r.key === CHURCH_HOME_PHOTO_KEY);
  return row ? normalizeChurchHomePhoto(JSON.parse(row.value)) : null;
}

/* 가장자리에서 번져 들어가며 흰 배경만 지웁니다 (그림 안쪽 흰색은 남김) */
function eraseWhiteBackground(ctx, w, h){
  const im = ctx.getImageData(0, 0, w, h);
  const d = im.data;
  const near = i => d[i] > 228 && d[i+1] > 228 && d[i+2] > 228;
  const seen = new Uint8Array(w * h);
  const stack = [];
  for(let x = 0; x < w; x++){ stack.push(x); stack.push((h-1)*w + x); }
  for(let y = 0; y < h; y++){ stack.push(y*w); stack.push(y*w + w - 1); }
  while(stack.length){
    const p = stack.pop();
    if(p < 0 || p >= w*h || seen[p]) continue;
    const i = p * 4;
    if(!near(i)) continue;
    seen[p] = 1; d[i+3] = 0;
    const x = p % w, y = (p - x) / w;
    if(x > 0) stack.push(p - 1);
    if(x < w-1) stack.push(p + 1);
    if(y > 0) stack.push(p - w);
    if(y < h-1) stack.push(p + w);
  }
  /* 가장자리 톱니를 부드럽게 */
  for(let p = 0; p < w*h; p++){
    if(seen[p]) continue;
    const i = p * 4;
    if(!near(i)) continue;
    const x = p % w, y = (p - x) / w;
    let open = 0;
    if(x > 0 && seen[p-1]) open++;
    if(x < w-1 && seen[p+1]) open++;
    if(y > 0 && seen[p-w]) open++;
    if(y < h-1 && seen[p+w]) open++;
    if(open) d[i+3] = Math.round(255 * (1 - open / 4));
  }
  ctx.putImageData(im, 0, 0);
}

function readChurchHomePhoto(file, cut){
  return new Promise((resolve, reject) => {
    if(!file || !["image/jpeg", "image/png", "image/webp"].includes(file.type)){
      reject(new Error("JPG, PNG, WebP 사진을 선택해 주세요. HEIC 사진은 JPG로 바꾼 뒤 올려 주세요.")); return;
    }
    if(file.size > 15 * 1024 * 1024){
      reject(new Error("사진은 15MB 이하로 선택해 주세요.")); return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("사진을 열 수 없습니다. 다른 사진으로 다시 시도해 주세요.")); };
    img.onload = () => {
      try{
        if(!img.naturalWidth || !img.naturalHeight) throw new Error("사진 크기를 확인할 수 없습니다.");
        const canvas = document.createElement("canvas");
        const scale = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        const ctx = canvas.getContext("2d");
        if(!ctx) throw new Error("이 브라우저에서 사진을 처리할 수 없습니다.");
        let dataUrl = "";
        for(let attempt = 0; attempt < 7; attempt++){
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if(!cut){ ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          if(cut){
            eraseWhiteBackground(ctx, canvas.width, canvas.height);
            dataUrl = canvas.toDataURL("image/png");
          } else {
            dataUrl = canvas.toDataURL("image/jpeg", Math.max(.55, .85 - attempt * .08));
          }
          if(dataUrl.length <= CHURCH_HOME_PHOTO_LIMIT) break;
          canvas.width = Math.max(1, Math.round(canvas.width * (cut ? .75 : .8)));
          canvas.height = Math.max(1, Math.round(canvas.height * (cut ? .75 : .8)));
        }
        if(dataUrl.length > CHURCH_HOME_PHOTO_LIMIT)
          throw new Error("배경을 지운 사진이 너무 큽니다. 조금 작은 사진으로 올려 주세요.");
        resolve(normalizeChurchHomePhoto({version:1, dataUrl, fit:"contain", x:50, y:50, cut: !!cut}));
      }catch(e){ reject(e); }
      finally{ URL.revokeObjectURL(url); }
    };
    img.src = url;
  });
}

async function persistChurchSettings(sb, churchId, role, nextConfig, nextPhoto){
  if(role !== "admin" || typeof churchId !== "string" || !churchId.trim()){
    throw new Error("교회 관리자만 설정과 사진을 저장할 수 있습니다.");
  }
  const photo = normalizeChurchHomePhoto(nextPhoto);
  // 한 요청으로 함께 저장하여 설정만 바뀌거나 사진만 바뀌는 일을 막습니다.
  const {data, error} = await sb.from("settings").upsert([
    {church_id:churchId, key:"churchConfig", value:JSON.stringify(nextConfig)},
    {church_id:churchId, key:CHURCH_HOME_PHOTO_KEY, value:JSON.stringify(photo)},
  ]).select("key");
  if(error) throw error;
  if(!data || !["churchConfig", CHURCH_HOME_PHOTO_KEY].every(key => data.some(row => row.key === key))){
    throw new Error("저장 결과를 확인하지 못했습니다. 다시 저장해 주세요.");
  }
  return photo;
}

function ChurchHomeBanner({churchName, photo}){
  const [failed, setFailed] = useState(false);
  useEffect(() => { setFailed(false); }, [photo && photo.dataUrl]);
  const custom = photo && !failed;
  return <div className="hero church-home-banner">
    <img className="church-home-background" src={CHURCH_HOME_BACKGROUND} alt="" width="1400" height="787"/>
    <div className={"church-photo-slot" + (custom && photo.cut ? " cut-out" : "")}>
      <img src={custom ? photo.dataUrl : CHURCH_HOME_DEFAULT_PHOTO}
        alt={custom ? `${churchName} 교회 사진` : "공통 교회 이미지"}
        style={{objectFit:custom ? photo.fit : "cover", objectPosition:custom ? `${photo.x}% ${photo.y}%` : "center"}}
        onError={() => { if(custom) setFailed(true); }}/>
    </div>
    <div className="hero-text">
      <h1>{churchName} 교인 관리</h1>
      <p>한 사람 한 사람을 기억하고 돌보기 위한 목양 수첩</p>
    </div>
  </div>;
}

const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowLocal = () => { const d = new Date(); return `${todayStr()}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WEEKDAYS = ["일","월","화","수","목","금","토"];
const weekdayOf = ds => { const d = new Date(ds + "T00:00:00"); return isNaN(d) ? "" : WEEKDAYS[d.getDay()]; };
const lastWeekday = (dow) => {
  const d = new Date(); const diff = (d.getDay() - dow + 7) % 7;
  d.setDate(d.getDate() - diff);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const koAge = birth => {
  if (!birth) return null;
  const y = parseInt(String(birth).slice(0,4), 10);
  if (!y) return null;
  return new Date().getFullYear() - y + 1;
};
const calcAge = birth => {
  if (!birth) return null;
  const b = new Date(birth + "T00:00:00"); if (isNaN(b)) return null;
  const t = new Date(); let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a;
};
/* 서버가 저장하지 못하는 보이지 않는 글자(빈 글자 등)를 걸러 냅니다.
   한글 문서·PDF에서 옮긴 글에 섞여 들어오면 "unsupported Unicode escape sequence" 오류로 저장이 멈춥니다. */
const cleanText = x => {
  if(typeof x === "string")
    return x.replace(/\u0000/g, " ").replace(/[\u0001-\u0008\u000B\u000C\u000E-\u001F\u007F\uFFFE\uFFFF]/g, "");
  if(Array.isArray(x)) return x.map(cleanText);
  if(x && typeof x === "object"){ const o = {}; Object.keys(x).forEach(k => { o[k] = cleanText(x[k]); }); return o; }
  return x;
};

const fmtDT = v => {
  if (!v) return "";
  const [d, t] = v.split("T");
  return t ? `${d} (${weekdayOf(d)}) ${t}` : `${d} (${weekdayOf(d)})`;
};
const koSort = (a, b) => (a.name || "").localeCompare(b.name || "", "ko");

/* ═══ 교인 배치 순서 — 교회마다 선임을 앞에 두도록 직접 정합니다 ═══
   설정의 memberOrder(교인 id 목록) 순서대로 놓고, 목록에 없는 분(새로 등록한 분 등)은 그 뒤에 가나다순으로 둡니다. */
let MEMBER_RANK = {};
const setMemberRank = ids => {
  const r = {};
  (Array.isArray(ids) ? ids : []).forEach((id, i) => { if(id != null && r[id] === undefined) r[id] = i; });
  MEMBER_RANK = r;
};
const orderSort = (a, b) => {
  const ra = a ? MEMBER_RANK[a.id] : undefined, rb = b ? MEMBER_RANK[b.id] : undefined;
  const ha = ra !== undefined, hb = rb !== undefined;
  if(ha && hb && ra !== rb) return ra - rb;
  if(ha !== hb) return ha ? -1 : 1;
  return koSort(a || {}, b || {});
};
/* 첫 칸을 속장·리더 자리로 표시할 묶음인가 — 교역자·사모·미지정·방문자·미배정은 제외 */
const isSokLeadKey = key => {
  const k = String(key == null ? "" : key);
  return !!k && k !== "zz" && k !== "SAMO" && k !== "GUEST" && k !== "LONG" && k.indexOf("MIN") !== 0
    && k.indexOf("S_") !== 0 && !/_none$/.test(k);
};

/* 한 묶음 안에서 바꾼 순서를 교회 전체 순서에 끼워 넣습니다 — 다른 묶음의 앞뒤는 그대로 둡니다 */
const placeOrder = (allMembers, groupIds) => {
  const full = (Array.isArray(allMembers) ? allMembers : []).filter(m => m && m.id != null)
    .slice().sort(orderSort).map(m => m.id);
  const want = (Array.isArray(groupIds) ? groupIds : []).filter(id => full.includes(id));
  const slots = want.map(id => full.indexOf(id)).sort((x, y) => x - y);
  slots.forEach((pos, i) => { full[pos] = want[i]; });
  return full;
};

/* 교인 명부 [순서 정하기] — 직분마다 묶어 보여 주고, 한 번에 저장 */
function MultiOrderEditor({groups, onSave, onClose}){
  const byId = {};
  (groups || []).forEach(g => (g && g.items || []).forEach(m => { if(m && m.id != null) byId[m.id] = m; }));
  const [gs, setGs] = useState(() => (groups || []).filter(Boolean).map(g => ({
    key: g.key, label: g.label, ids: (g.items || []).filter(m => m && m.id != null).map(m => m.id)})));
  const [busy, setBusy] = useState(false);
  const [dirty, setDirty] = useState(false);
  const upd = (gi, fn) => {
    setGs(prev => prev.map((g, i) => i === gi ? {...g, ids: fn(g.ids.filter(id => byId[id]))} : g));
    setDirty(true);
  };
  const move = (gi, i, d) => upd(gi, ids => {
    const j = i + d; if(j < 0 || j >= ids.length) return ids;
    const n = [...ids]; const x = n[i]; n[i] = n[j]; n[j] = x; return n;
  });
  const toTop = (gi, i) => upd(gi, ids => { if(i <= 0) return ids; const n = [...ids]; const [x] = n.splice(i, 1); n.unshift(x); return n; });
  const resetKo = () => {
    if(!confirm("모든 직분의 순서를 가나다순으로 되돌릴까요? (저장을 눌러야 반영됩니다)")) return;
    setGs(prev => prev.map(g => ({...g, ids: g.ids.filter(id => byId[id]).sort((a, b) => koSort(byId[a], byId[b]))})));
    setDirty(true);
  };
  const save = async () => {
    setBusy(true);
    try{ await onSave(gs.flatMap(g => g.ids.filter(id => byId[id]))); setDirty(false); onClose(true); }
    catch(e){ alert("순서를 저장하지 못했습니다. " + errMsg(e)); }
    finally{ setBusy(false); }
  };
  const cancel = () => { if(!dirty || confirm("바꾼 순서를 저장하지 않고 나갈까요?")) onClose(false); };
  return (
    <div>
      <div className="panel" style={{padding:"12px 16px"}}>
        <b>순서</b>
        <p className="muted small" style={{margin:"4px 0 0"}}>
          같은 직분 안에서 <b>▲ ▼</b>로 한 칸씩, <b>⤒</b>로 맨 위로 옮기고 아래 <b>순서 저장</b>을 눌러 주세요.
          선임을 앞에 두시면 됩니다. 저장한 순서는 직분별 명부 · 속별 명부 · 출석 체크에 함께 쓰이고,
          새로 등록한 분은 그 직분의 맨 뒤에 붙습니다.</p>
      </div>
      {gs.map((g, gi) => { const ids = g.ids.filter(id => byId[id]); if(!ids.length) return null; return (
        <div key={g.key} className="order-edit" style={{marginBottom:14}}>
          <h3 style={{margin:"2px 0 6px", fontSize:"16px", color:"var(--pine-deep)"}}>{g.label} <span className="muted small">{ids.length}명</span></h3>
          {ids.map((id, i) => { const m = byId[id]; return (
            <div key={id} className="order-row">
              <span className="order-no">{i+1}</span>
              <span className="order-nm">{m.name} <span className="muted small">{m.position}</span></span>
              <button type="button" className="btn sm ghost" onClick={()=>toTop(gi,i)} disabled={busy || i===0 || ids.length<2} title="맨 위로" aria-label="맨 위로">⤒</button>
              <button type="button" className="btn sm ghost" onClick={()=>move(gi,i,-1)} disabled={busy || i===0} aria-label="위로">▲</button>
              <button type="button" className="btn sm ghost" onClick={()=>move(gi,i,1)} disabled={busy || i===ids.length-1} aria-label="아래로">▼</button>
            </div>); })}
        </div>); })}
      <div className="order-save-bar">
        <button type="button" className="btn" onClick={save} disabled={busy}>{busy ? "저장 중…" : (dirty ? "순서 저장" : "순서 저장 (바뀐 것 없음)")}</button>
        <button type="button" className="btn ghost" onClick={cancel} disabled={busy}>나가기</button>
        <button type="button" className="btn ghost" style={{marginLeft:"auto"}} onClick={resetKo} disabled={busy}>가나다순으로 되돌리기</button>
      </div>
    </div>
  );
}

/* 순서 바꾸기 — ▲▼ 로 자리를 옮기고 한 번에 저장 */
function OrderEditor({items, onSave, onClose, leadLabel}){
  const clean = (items || []).filter(m => m && m.id != null);
  const [ids, setIds] = useState(() => clean.map(m => m.id));
  const [busy, setBusy] = useState(false);
  const byId = {}; clean.forEach(m => { byId[m.id] = m; });
  const shown = ids.filter(id => byId[id]);
  const move = (i, d) => {
    const j = i + d; if(j < 0 || j >= shown.length) return;
    const n = [...shown]; const x = n[i]; n[i] = n[j]; n[j] = x; setIds(n);
  };
  const toTop = i => { if(i <= 0) return; const n = [...shown]; const [x] = n.splice(i, 1); n.unshift(x); setIds(n); };
  const save = async () => {
    setBusy(true);
    try{ await onSave(shown); onClose(); }
    catch(e){ alert("순서를 저장하지 못했습니다. " + errMsg(e)); }
    finally{ setBusy(false); }
  };
  return (
    <div className="order-edit">
      <p className="muted small" style={{margin:"0 0 8px"}}>
        ▲▼ 단추로 자리를 바꾸고 <b>순서 저장</b>을 눌러 주세요. 선임을 앞에 두시면 됩니다.
        이 순서는 교인 명부 · 속별 명부 · 교회학교 · 출석 체크에 함께 쓰입니다.
        {leadLabel && <React.Fragment><br/>맨 위 칸은 <b>{leadLabel}</b>로 금색 테두리가 둘러집니다.</React.Fragment>}</p>
      {shown.map((id, i) => { const m = byId[id]; return (
        <div key={id} className={"order-row" + (leadLabel && i===0 ? " lead" : "")}>
          <span className="order-no">{i+1}</span>
          <span className="order-nm">{m.name} <span className="muted small">{m.position}</span>
            {leadLabel && i===0 && <span className="lead-tag">{leadLabel}</span>}</span>
          <button type="button" className="btn sm ghost" onClick={()=>toTop(i)} disabled={busy || i===0} title="맨 위로" aria-label="맨 위로">⤒</button>
          <button type="button" className="btn sm ghost" onClick={()=>move(i,-1)} disabled={busy || i===0} aria-label="위로">▲</button>
          <button type="button" className="btn sm ghost" onClick={()=>move(i,1)} disabled={busy || i===shown.length-1} aria-label="아래로">▼</button>
        </div>); })}
      <div className="row" style={{marginTop:10, gap:8, flexWrap:"wrap"}}>
        <button type="button" className="btn" onClick={save} disabled={busy}>{busy ? "저장 중…" : "순서 저장"}</button>
        <button type="button" className="btn ghost" onClick={onClose} disabled={busy}>취소</button>
        <button type="button" className="btn ghost" style={{marginLeft:"auto"}} disabled={busy}
          onClick={()=>setIds([...clean].sort(koSort).map(m=>m.id))}>가나다순으로 되돌리기</button>
      </div>
    </div>
  );
}
const errMsg = e => (e && e.message) ? e.message : "알 수 없는 오류";

const headStyle = key => {
  if(!key) return {background:"linear-gradient(135deg,#7A869C,#59637A)", ico:"•"};
  const k = String(key);
  if(k === "MIN" || k.indexOf("MIN_") === 0) return {background:"linear-gradient(135deg,#B8912F,#8C6C1E)", ico:"✝"};
  if(k === "SAMO") return {background:"linear-gradient(135deg,#9C7BA6,#75577F)", ico:"❦"};
  if(k === "GUEST") return {background:"linear-gradient(135deg,#7A869C,#59637A)", ico:"✦"};
  if(k.indexOf("S_")===0){
    const dep = k.slice(2).split("_")[0];
    const s = DEPT_STYLE[dep] || {};
    return {background: s.bg || "linear-gradient(135deg,#3F7FA8,#2C5E80)", ico: s.ico || "🎒"};
  }
  const s = SOK_STYLE[k];
  if(s) return {background:s.bg, ico: k[0]==="남" ? "♦" : "❀"};
  if(k[0]==="남" || k[0]==="여"){
    const n = Number(k.slice(1)) || 1;
    const base = k[0]==="남" ? [34,53,92] : [168,68,47];
    const step = k[0]==="남" ? 14 : 10;
    const c1 = base.map(v=>Math.min(255, v + step*(n-1)));

    return {background:`linear-gradient(135deg,rgb(${c1}),rgb(${c2}))`, ico: k[0]==="남" ? "♦" : "❀"};

};
/* 속 개수에 맞춰 이름표 만들기 */
const sokCount = g => (g==="여" ? SOK_F : SOK_M).length;

/* ═══ 여러 명 한꺼번에 고치기 — 관리자 전용 ═══
   직분 바꾸기: 고른 분 모두 그 직분이 됩니다.
   속 편성하기: 직접 지정·주소 방식이면 교인 카드의 속을, 나이 방식이면 메모 표기(예 3여선교회)를 씁니다.
   두 경우 모두 메모에 바뀐 내역을 한 줄 남깁니다. */
const bulkNewData = (m, field, value, label) => {
  const day = todayStr();
  const memo0 = typeof m.memo === "string" ? m.memo : (m.memo == null ? "" : String(m.memo));
  if(field === "position"){
    const before = m.position || "(직분 없음)";
    const memo = [memo0.trim(), `${day} ${before} → ${value}`].filter(Boolean).join("\n");
    return {...m, position: value, memo};
  }
  /* 장기결석자로 옮기기 */
  if(value === "__LONG"){
    const memo = [memo0.trim(), `${day} 장기결석으로 옮김`].filter(Boolean).join("\n");
    return {...m, longAbsent: true, memo};
  }
  /* 속 편성 (장기결석이었다면 재적으로 돌아옵니다) */
  const back = isLongAbsent(m) ? `${day} 장기결석에서 돌아옴` : "";
  const ageMode = !(SOK_MODE === "manual" || SOK_MODE === "area");
  /* 앞서 적어 둔 속 배정 줄은 지웁니다 — 옛 표기가 먼저 읽히지 않도록 */
  const kept = memo0.split("\n").filter(l => !/^\s*\d{4}-\d{2}-\d{2}\s*속 배정 →/.test(l)).join("\n").trim();
  const mark = ageMode ? (String(value).slice(1) + String(value).slice(0,1) + "선교회") : label;
  const memo = [kept, back, `${day} 속 배정 → ${mark}`].filter(Boolean).join("\n");
  return ageMode ? {...m, longAbsent: false, memo} : {...m, longAbsent: false, sok: value, memo};
};

/* 설정된 속 개수에 맞춘 키 목록: 남1..남n, 여1..여m */
const sokKeys = () => (SOK_MODE === "manual" || SOK_MODE === "area")
  ? SOK_LIST.map(s=>s.id)
  : [ ...SOK_M.map((_,i)=>"남"+(i+1)), ...SOK_F.map((_,i)=>"여"+(i+1)) ];
/* 키 하나의 이름표 */
const sokKeyLabel = k => (SOK_MODE === "manual" || SOK_MODE === "area")
  ? ((SOK_LIST.find(s=>s.id===k)||{}).name || "속 미지정")
  : sokLabel({g:k[0], n:Number(k.slice(1))});
function sokOf(m){
  if(isMinister(m) || isSamo(m) || isYoungAdult(m)) return null;   /* 교역자·사모·청년은 속 편성 제외 */

  if(SOK_MODE === "manual" || SOK_MODE === "area"){
    /* 사람에게 직접 지정한 속이 있으면 그것이 우선 */
    const id = m && m.sok;
    if(id && SOK_LIST.some(s=>s.id===id)) return {id};
    /* 주소 방식이면 주소에 든 지역 이름으로 찾음 */
    if(SOK_MODE === "area"){
      const addr = normArea(m && m.address);
      if(addr){
        for(const s of SOK_LIST){
          for(const a of (s.areas||[])){
            const key = normArea(a);
            if(key && addr.indexOf(key) >= 0) return {id:s.id};
          }
        }
      }
    }
    return null;
  }

  /* 메모에 속이 적혀 있으면 나이보다 먼저 따릅니다 (10속 넘는 교회도 가능) */
  const memo = m.memo || "";
  const fromMemo = (g) => {
    const hits = [...memo.matchAll(new RegExp("([0-9]{1,3})\\s*" + g + "선교회", "g"))];
    for(const h of hits){
      const n = Number(h[1]);
      if(n >= 1 && n <= sokCount(g)) return {g, n};   /* 설정된 속 수 안에 있을 때만 */
    }
    return null;
  };
  const memoF = fromMemo("여"); if(memoF) return memoF;
  const memoM = fromMemo("남"); if(memoM) return memoM;
  const y = m.birth ? Number(m.birth.slice(0,4)) : 0;
  if(y){
    const ka = koAge(m.birth);
    if(ka !== null && ka <= schoolMaxAge()) return null;   /* 교회학교(유치부~청년부) 대상은 속 편성 제외 */
    if(m.gender==="여"){ for(const p of SOK_F){ if(y<=p[0]) return {g:"여", n:p[1]}; } }
    if(m.gender==="남"){ for(const p of SOK_M){ if(y<=p[0]) return {g:"남", n:p[1]}; } }
  }
  return null;
}
/* 주소 비교용으로 정리: 공백 제거, '화곡제1동' → '화곡1동' 같은 표기 차이 흡수 */
const normArea = t => {
  if(!t) return "";
  return String(t)
    .replace(/\s+/g, "")
    .replace(/제([0-9]+)(동|가|구역)/g, "$1$2")
    .toLowerCase();
};
const sokLabel = s => {
  if(!s) return "속 미지정";
  if(s.id){ const f = SOK_LIST.find(x=>x.id===s.id); return f ? f.name : "속 미지정"; }
  return `${s.g}자 ${s.n}속 (${s.n}${s.g}선교회)`;
};
/* 현재 나이로 교회학교 부서 찾기 */
/* 한 사람이 속한 편성 구분: 남1~3, 여1~7, 교회학교 부서, 그 외 */
const scopeKeyOf = m => {
  if(isLongAbsent(m)) return "LONG";
  if(isMinister(m)) return "MIN";
  if(isSamo(m)) return "SAMO";
  const s = sokOf(m);
  if(s) return s.id ? s.id : s.g + s.n;
  const d = schoolDeptOf(m);
  if(d) return "S_" + d.key;
  return "zz";
};
/* 미소속 방문자 자리 — 등록하지 않은 분이 예배에 오셨을 때 인원만 세기 위한 칸 */
const GUESTS = Array.from({length:10}, (_,i)=>({
  id: "guest-" + (i+1), name: "무명" + (i+1), position: "방문", birth: "", gender: "",
  memo: "", photo: "", family: [], depts: [], visits: [], prayers: [], guest: true
}));

const ATT_ONLY = "ATT_ONLY";   /* 예배 출석 체크만 (성도 전체 · 교회학교 제외) */
const CARE_ALL   = "CARE_ALL";    /* (예전) 심방·긴밀 기도 둘 다 */
const VISIT_ALL  = "VISIT_ALL";   /* 심방 기록 전체 보기 */
const SECRET_ALL = "SECRET_ALL";  /* 긴밀 기도 보기 */
const PASTOR   = "PASTOR";     /* 교역자 — 성도·교회학교 전체 열람·수정 */
const ELDER    = "ELDER";      /* 장로 — 성도·교회학교 전체 열람만 */
const ROLE_SCOPES = [PASTOR, ELDER, CARE_ALL, VISIT_ALL, SECRET_ALL];
/* 사람 범위가 아닌, 보기 권한만 뜻하는 표시 */
const VIEW_FLAGS = [CARE_ALL, VISIT_ALL, SECRET_ALL];
const SCOPE_LIST = () => [
  [PASTOR, "교역자 (성도·교회학교 전체)"],
  [ELDER, "장로 (성도·교회학교 전체)"],
  [VISIT_ALL, "심방 기록 전체 보기"],
  [SECRET_ALL, "긴밀 기도 보기"],
  [ATT_ONLY, "예배 출석 체크만 (성도 전체 · 교회학교 제외)"],
  ["SOK_ALL", "속 전체 (남·여 모든 속)"],
  ["SOK_F_ALL", "여선교회 전체 (총여선교회장)"],
  ["SOK_M_ALL", "남선교회 전체 (총남선교회장)"],
  ...sokKeys()
      .map(k=>[k, sokKeyLabel(k)]),
  ["S_ALL", "교회학교 전체 (유치부~청년부)"],
  ...SCHOOL_DEPTS.map(s=>["S_"+s.key, "교회학교 · "+s.label]),
];
const LEGACY_SCOPE = {MIN:"교역자 명단", SAMO:"사모 명단", CARE_ALL:"심방·긴밀 기도 전체 보기"};
const scopeLabel = k => {
  const f = SCOPE_LIST().find(x=>x[0]===k);
  return f ? f[1] : (LEGACY_SCOPE[k] || "편성 없음");
};
/* 한 사람의 담당 목록 (예전 방식인 문자열 하나도 그대로 읽힘) */
/* 담당 하나는 "키" 또는 "키:w"(수정) / "키:r"(열람) 로 적힙니다.
   예전 자료는 표시가 없으니, 그때는 계정 권한을 따릅니다. */
const entKey  = e => String(e).split(":")[0];
const entMode = e => { const p = String(e).split(":"); return p[1] === "w" ? "w" : p[1] === "r" ? "r" : ""; };
const entIsW  = (e, oldRole) => {
  const m = entMode(e);
  if(m) return m === "w";
  return oldRole === "editor" || oldRole === "admin";   /* 예전 방식 */
};
const withMode = (e, w) => entKey(e) + (w ? ":w" : ":r");

const scopesOf = (leaders, id) => {
  const v = (leaders||{})[id];
  if(!v) return [];
  return Array.isArray(v) ? v.filter(Boolean) : [v];
};
/* 담당 범위에 드는 사람인지 */
/* 속 하나가 여선교회인지 남선교회인지 (나이 방식은 키 앞 글자, 그 밖에는 이름으로) */
const sokSideOf = (key) => {
  if(!key) return "";
  if(key[0] === "여" || key[0] === "남") return key[0];
  const f = SOK_LIST.find(s => s.id === key);
  const nm = (f && f.name) || "";
  if(nm.indexOf("여") >= 0) return "여";
  if(nm.indexOf("남") >= 0) return "남";
  return "";
};

const inScope = (m, k) => {
  if(isLongAbsent(m)) return k === PASTOR;                /* 장기결석자는 교역자만 */
  if(k === PASTOR || k === ELDER) return true;        /* 성도·교회학교 전체 */
  const sk = scopeKeyOf(m);
  if(k === ATT_ONLY)  return sk.indexOf("S_") !== 0;                  /* 교역자·어른 전부, 교회학교 제외 */
  if(k === "SOK_ALL") return sk === "MIN" || sk === "SAMO" || (sk !== "zz" && sk.indexOf("S_") !== 0);
  if(k === "SOK_F_ALL") return sokSideOf(sk) === "여";                /* 여선교회 전부 */
  if(k === "SOK_M_ALL") return sokSideOf(sk) === "남";                /* 남선교회 전부 */
  if(k === "S_ALL")   return sk.indexOf("S_") === 0;                  /* 교회학교 전부 */
  return sk === k;
};

const schoolDeptOf = m => {
  if(isMinister(m) || isSamo(m) || isLongAbsent(m)) return null;
  if(isYoungAdult(m)) return SCHOOL_DEPTS.find(s => s.key === "young") || null;
  const a = koAge(m.birth);
  if(a === null) return null;
  return SCHOOL_DEPTS.find(s => a >= s.min && a <= s.max) || null;
};

const ROLE_LABEL = {admin:"관리자", editor:"구성원", viewer:"구성원", pending:"승인 대기"};

const emptyMember = () => ({
  id: uid(), name:"", birth:"", phone:"", address:"", position:"성도", gender:"", memo:"", photo:"",
  sok:"", family:[], depts:[], visits:[], prayers:[]
});

/* ───────── 로그인 / 회원가입 ───────── */
function Auth({sb, resetServer, embedded}){
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setMsg("");
    try{
      if(mode === "login"){
        const {error} = await sb.auth.signInWithPassword({email, password:pw});
        if(error) setMsg("로그인 실패 — " + errMsg(error));
      }else{
        const {data, error} = await sb.auth.signUp({email, password:pw, options:{data:{name}}});
        if(error) setMsg("가입 실패 — " + errMsg(error));
        else if(!data.session) setMsg("가입 신청이 접수되었습니다. 이메일 확인이 켜져 있는 서버라면 받은 메일의 확인 버튼을 누른 뒤 로그인해 주세요.");
      }
    }catch(e){ setMsg(errMsg(e)); }
    setBusy(false);
  };

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교우이음</div>
        <div className="auth-tabs">
          <button className={mode==="login"?"on":""} onClick={()=>{setMode("login");setMsg("");}}>로그인</button>
          <button className={mode==="signup"?"on":""} onClick={()=>{setMode("signup");setMsg("");}}>가입 신청</button>
        </div>
        {mode==="signup" &&
          <div className="field"><label>이름</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="실명을 입력해 주세요"/></div>}
        <div className="field"><label>이메일</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></div>
        <div className="field"><label>비밀번호</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="6자 이상"
            onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/></div>
        {msg && <div className="err-banner">{msg}</div>}
        <button className="btn" style={{width:"100%"}} disabled={busy || !email || pw.length<6 || (mode==="signup" && !name.trim())}
          onClick={submit}>{busy ? "처리 중…" : (mode==="login" ? "로그인" : "가입 신청")}</button>
        {mode==="signup" &&
          <p className="small muted" style={{marginBottom:0}}>가입 후에는 <b>관리자(담임목사)의 승인</b>이 있어야 교인 기록을 볼 수 있습니다.</p>}
        {!embedded && <React.Fragment>
          <hr className="divider"/>
          <button className="btn sm ghost" onClick={resetServer}>서버 주소 다시 설정</button>
        </React.Fragment>}
      </div>
    </div>
  );
}

/* ───────── 운영자 현황 (교회이음 운영자만) ───────── */
function OwnerBoard({sb, onClose, onPick}){
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState("");

  const load = useCallback(async ()=>{
    setErr("");
    const {data, error} = await sb.rpc("owner_overview");
    if(error){ setErr(errMsg(error)); setRows([]); return; }
    setRows(data || []);
  }, [sb]);
  useEffect(()=>{ load(); }, [load]);

  const daysAgo = t => {
    if(!t) return null;
    const d = Math.floor((Date.now() - new Date(t).getTime()) / 86400000);
    return d;
  };
  const agoText = t => {
    const d = daysAgo(t);
    if(d === null) return "-";
    if(d === 0) return "오늘";
    if(d === 1) return "어제";
    if(d < 30) return d + "일 전";
    return Math.floor(d/30) + "달 전";
  };
  /* 쓰고 있나 판단: 출석 기록이 최근 14일 안에 있으면 쓰는 중 */
  const state = r => {
    if(!r.members_total) return {t:"시작 안 함", c:"st-none"};
    const d = daysAgo(r.last_att ? r.last_att + "T12:00:00" : null);
    if(d === null) return {t:"교인만 넣음", c:"st-part"};
    if(d <= 14) return {t:"쓰는 중", c:"st-live"};
    if(d <= 45) return {t:"멈춘 듯", c:"st-part"};
    return {t:"안 쓰는 듯", c:"st-none"};
  };
  const kb = n => n < 1024 ? n + "B" : (n/1024 < 1024 ? Math.round(n/1024) + "KB" : (n/1048576).toFixed(1) + "MB");

  const dropChurch = async (r)=>{
    const typed = prompt(
      `[운영자] ${r.name} 를 지웁니다.\n\n` +
      `교인 ${r.members_total}명, 출석 ${r.att_days}일치 기록이 모두 사라집니다.\n` +
      `관리자: ${r.admin_email || "없음"}\n` +
      `되돌릴 수 없습니다.\n\n` +
      `정말 지우시려면 교회 이름을 그대로 적어 주세요.`, "");
    if(typed === null) return;
    if(typed.trim() !== r.name){ alert("교회 이름이 달라 지우지 않았습니다."); return; }
    setBusy(r.id); setErr("");
    const {error} = await sb.rpc("delete_church", {p_id: r.id, p_name: r.name});
    setBusy("");
    if(error){ setErr(errMsg(error)); return; }
    try{ if(localStorage.getItem(PICK_KEY) === r.id) localStorage.removeItem(PICK_KEY); }catch(_){}
    load();
  };

  if(rows === null)
    return <div className="center-box"><div className="panel empty">현황을 불러오는 중…</div></div>;

  const live = rows.filter(r=>state(r).t === "쓰는 중").length;
  const totalMembers = rows.reduce((a,r)=>a + (r.members_total||0), 0);

  return (
    <div className="wrap">
      <div className="panel">
        <div className="row" style={{alignItems:"center"}}>
          <h2 style={{border:"none",margin:0}}>교회 사용 현황
            <span className="muted small"> 교회 {rows.length}곳 · 쓰는 중 {live}곳 · 교인 합계 {totalMembers}명</span></h2>
          <button className="btn sm ghost" style={{marginLeft:"auto"}} onClick={load}>새로 보기</button>
          <button className="btn sm" onClick={onClose}>닫기</button>
        </div>
        {err && <p style={{color:"var(--clay)"}}>{err}</p>}

        {rows.length === 0 && <p className="empty">아직 만들어진 교회가 없습니다.</p>}

        {rows.map(r=>{
          const st = state(r);
          return (
            <div className="own-row" key={r.id}>
              <div className="own-main">
                <div className="own-name">
                  {r.name}
                  <span className={"own-st " + st.c}>{st.t}</span>
                </div>
                <div className="muted small">{r.admin_email || "관리자 없음"} · 가입코드 {r.join_code}</div>
              </div>
              <div className="own-nums">
                <div><b>{r.members_total}</b><span>교인</span></div>
                <div><b>{r.users_total}</b><span>사용자{r.users_pending ? ` (대기 ${r.users_pending})` : ""}</span></div>
                <div><b>{r.att_days}</b><span>출석 날수</span></div>
                <div><b>{r.last_att ? agoText(r.last_att + "T12:00:00") : "-"}</b><span>마지막 출석</span></div>
                <div><b>{agoText(r.last_sign_in)}</b><span>마지막 접속</span></div>
                <div><b>{kb(Number(r.photo_bytes || 0))}</b><span>자료 크기</span></div>
              </div>
              <div className="own-act">
                <button className="btn sm ghost" onClick={()=>onPick(r.id)}>들어가 보기</button>
                <button className="btn sm danger" disabled={busy === r.id}
                  onClick={()=>dropChurch(r)}>{busy === r.id ? "지우는 중…" : "지우기"}</button>
              </div>
            </div>);
        })}

        <p className="small muted" style={{marginTop:14}}>
          <b>쓰는 중</b>은 최근 2주 안에 출석을 체크한 교회입니다.
          <b>멈춘 듯</b>은 한 달 반 안, 그보다 오래되면 <b>안 쓰는 듯</b>으로 봅니다.
          교인을 한 명도 넣지 않았으면 <b>시작 안 함</b>입니다.
        </p>
      </div>
    </div>
  );
}

/* ───────── 교회 고르기 · 만들기 · 가입 신청 ───────── */
function ChurchPicker({sb, session, logout, onPick}){
  const [rows, setRows] = useState(null);      /* 내가 속한/신청한 교회들 */
  const [canMake, setCanMake] = useState(true); /* 교회를 더 만들 수 있는지 */
  const [isOwner, setIsOwner] = useState(false); /* 교회이음 운영자인지 */
  const [board, setBoard] = useState(false);     /* 현황 화면 보기 */
  const [mode, setMode] = useState("");        /* "" | "new" | "join" */
  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const pickRef = useRef(onPick); pickRef.current = onPick;   /* 바로 들어가기에 쓰는 값 */

  const load = useCallback(async ()=>{
    setErr("");
    const {data, error} = await sb.from("church_users")
      .select("church_id, role, churches(name, join_code)")
      .eq("user_id", session.user.id);
    if(error){ setErr(errMsg(error)); setRows([]); return; }
    const list = (Array.isArray(data) ? data : []).filter(r => r && r.church_id).map(r=>({
      id: r.church_id, role: r.role,
      name: (r.churches && r.churches.name) || "이름 없는 교회",
      code: (r.churches && r.churches.join_code) || "",
    }));
    const ow = await sb.rpc("is_app_owner");
    const owner = !ow.error && ow.data === true;
    setIsOwner(owner);
    /* 속한 교회가 하나뿐이고 승인까지 되었으면 목록을 건너뛰고 바로 들어갑니다.
       운영자이거나, 이번 창에서 [교회 바꾸기]로 스스로 나온 경우는 목록을 보여 줍니다. */
    let left = false;
    try{ left = sessionStorage.getItem(LEFT_KEY) === "1"; }catch(_){}
    if(!owner && !left && list.length === 1 && list[0].role && list[0].role !== "pending"){
      pickRef.current(list[0].id);
      return;
    }
    setRows(list);
    const can = await sb.rpc("can_create_church");
    if(!can.error) setCanMake(can.data !== false);
  }, [sb, session]);
  useEffect(()=>{ load(); }, [load]);

  const makeChurch = async ()=>{
    if(!name.trim()) return;
    setBusy(true); setErr("");
    const {data, error} = await sb.rpc("create_church", {p_name: name.trim()});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    onPick(data);
  };
  const dropChurch = async (r)=>{
    const typed = prompt(
      `${r.name} 를 지우면 그 교회의 교인·출석·심방·중보기도 기록이 모두 사라집니다.\n` +
      `되돌릴 수 없습니다. 먼저 백업을 받아 두셨는지 확인해 주세요.\n\n` +
      `정말 지우시려면 아래에 교회 이름을 그대로 적어 주세요.`, "");
    if(typed === null) return;
    if(typed.trim() !== r.name){ alert("교회 이름이 달라 지우지 않았습니다."); return; }
    setBusy(true); setErr("");
    const {error} = await sb.rpc("delete_church", {p_id: r.id, p_name: r.name});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    try{ if(localStorage.getItem(PICK_KEY) === r.id) localStorage.removeItem(PICK_KEY); }catch(_){}
    load();
  };

  const joinChurch = async ()=>{
    if(!code.trim()) return;
    setBusy(true); setErr("");
    const {error} = await sb.rpc("join_church", {p_code: code.trim().toUpperCase()});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    setMode(""); setCode(""); load();
  };

  if(rows === null)
    return <div className="center-box"><div className="panel empty">교회를 확인하는 중…</div></div>;

  if(board) return <OwnerBoard sb={sb} onClose={()=>setBoard(false)} onPick={onPick}/>;

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교우이음</div>
        <p className="small muted" style={{marginTop:0}}>
          {session.user.email} 님으로 접속했습니다.</p>
        {err && <p style={{color:"var(--clay)"}}>{err}</p>}

        {rows.length > 0 && <React.Fragment>
          <h2>내 교회</h2>
          {rows.map(r=>(
            <div className="ch-row" key={r.id}>
              <div style={{flex:1}}>
                <b>{r.name}</b>
                {r.role === "pending"
                  ? <div className="muted small">승인을 기다리는 중입니다</div>
                  : <div className="muted small">{ROLE_LABEL[r.role] || r.role}
                      {r.role==="admin" && r.code && ` · 가입 코드 ${r.code}`}</div>}
              </div>
              {r.role === "pending"
                ? <button className="btn sm ghost" onClick={load}>승인 확인</button>
                : <React.Fragment>
                    <button className="btn sm" onClick={()=>onPick(r.id)}>들어가기</button>{" "}
                    {r.role === "admin" &&
                      <button className="btn sm danger" disabled={busy}
                        onClick={()=>dropChurch(r)}>지우기</button>}
                  </React.Fragment>}
            </div>))}
        </React.Fragment>}

        {mode === "" && <React.Fragment>
          <div className="row" style={{marginTop:16}}>
            {canMake && <button className="btn" onClick={()=>setMode("new")}>+ 우리 교회 만들기</button>}
            <button className="btn ghost" onClick={()=>setMode("join")}>가입 코드로 신청</button>
            {isOwner && <button className="btn ghost" onClick={()=>setBoard(true)}>사용 현황</button>}
            <button className="btn ghost" style={{marginLeft:"auto"}} onClick={logout}>로그아웃</button>
          </div>
          {!canMake && <p className="small muted" style={{marginTop:10,marginBottom:0}}>
            한 계정으로는 교회를 하나만 만들 수 있습니다.
            다른 교회에 들어가시려면 그 교회의 <b>가입 코드</b>로 신청해 주세요.</p>}
        </React.Fragment>}

        {mode === "new" && <div style={{marginTop:16}}>
          <h2>우리 교회 만들기</h2>
          <p className="small muted" style={{marginTop:0}}>
            교회를 만든 분이 <b>관리자</b>가 됩니다. 만들고 나면 <b>가입 코드</b>가 생기는데,
            그 코드를 교역자·속장님께 알려 주면 각자 가입 신청을 할 수 있습니다.</p>
          <div className="field"><label>교회 이름</label>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="예) 한빛교회" onKeyDown={e=>e.key==="Enter"&&makeChurch()}/></div>
          <div className="row">
            <button className="btn" disabled={busy || !name.trim()} onClick={makeChurch}>
              {busy ? "만드는 중…" : "만들기"}</button>
            <button className="btn ghost" onClick={()=>setMode("")}>취소</button>
          </div>
        </div>}

        {mode === "join" && <div style={{marginTop:16}}>
          <h2>가입 코드로 신청</h2>
          <p className="small muted" style={{marginTop:0}}>
            교회 관리자에게 받은 <b>6자리 코드</b>를 넣어 주세요. 신청 뒤 관리자가 승인하면 들어갈 수 있습니다.</p>
          <div className="field"><label>가입 코드</label>
            <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())}
              placeholder="ABC123" maxLength={6}
              style={{letterSpacing:"4px", fontSize:"18px", fontWeight:700, textAlign:"center"}}
              onKeyDown={e=>e.key==="Enter"&&joinChurch()}/></div>
          <div className="row">
            <button className="btn" disabled={busy || code.length<4} onClick={joinChurch}>
              {busy ? "신청 중…" : "신청하기"}</button>
            <button className="btn ghost" onClick={()=>setMode("")}>취소</button>
          </div>
        </div>}
      </div>
    </div>
  );
}

/* ───────── 최상위 ───────── */
function Root(){
  const embedded = !!(EMBED_URL && EMBED_KEY);
  const [cfg, setCfg] = useState(()=>{
    if(EMBED_URL && EMBED_KEY) return {url:EMBED_URL, key:EMBED_KEY};
    try{ const c = JSON.parse(localStorage.getItem(CFG_KEY)); if(c && c.url && c.key) return c; }catch(e){}
    return null;
  });
  const sb = useMemo(()=> cfg ? supabase.createClient(cfg.url, cfg.key) : null, [cfg]);
  const [session, setSession] = useState(undefined); // undefined=확인 중
  const [profile, setProfile] = useState(undefined);

  useEffect(()=>{
    if(!sb){ setSession(null); return; }
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e, s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  }, [sb]);

  /* 고른 교회 */
  const [churchId, setChurchId] = useState(()=>{
    try{ return localStorage.getItem(PICK_KEY) || ""; }catch(_){ return ""; }
  });
  const pickChurch = id => { try{ localStorage.setItem(PICK_KEY, id); }catch(_){} setChurchId(id); };
  const leaveChurch = () => { try{ localStorage.removeItem(PICK_KEY); sessionStorage.setItem(LEFT_KEY, "1"); }catch(_){} setChurchId(""); setProfile(undefined); };

  const loadProfile = useCallback(async ()=>{
    if(!sb || !session || !churchId){ setProfile(undefined); return; }
    const {data, error} = await sb.from("church_users")
      .select("role,name,email").eq("church_id", churchId).eq("user_id", session.user.id).maybeSingle();
    if(!error && data){
      setProfile({id:session.user.id, email:data.email || session.user.email,
                  name:data.name || "", role:data.role, guestOwner:false});
      return;
    }
    /* 그 교회 소속이 아님 — 교회이음 운영자면 살펴보기로 들어갑니다 */
    const ow = await sb.rpc("is_app_owner");
    if(!ow.error && ow.data === true){
      setProfile({id:session.user.id, email:session.user.email,
                  name:"교회이음 운영자", role:"admin", guestOwner:true});
      return;
    }
    setProfile(null);
  }, [sb, session, churchId]);

  useEffect(()=>{ if(session && churchId) loadProfile(); }, [session, churchId, loadProfile]);

  const [lastCfg, setLastCfg] = useState(null);
  const saveCfg = c => { localStorage.setItem(CFG_KEY, JSON.stringify(c)); setCfg(c); };
  const resetServer = () => { setLastCfg(cfg); localStorage.removeItem(CFG_KEY); setCfg(null); };
  const logout = async () => { await sb.auth.signOut(); setProfile(undefined); };

  if(!cfg) return <Setup onSave={saveCfg} initial={lastCfg}/>;
  if(session === undefined) return <div className="center-box"><div className="panel empty">서버에 연결하는 중…</div></div>;
  if(!session) return <Auth sb={sb} resetServer={resetServer} embedded={embedded}/>;
  if(!churchId) return <ChurchPicker sb={sb} session={session} logout={logout} onPick={pickChurch}/>;
  if(profile === undefined) return <div className="center-box"><div className="panel empty">사용자 정보를 확인하는 중…</div></div>;
  if(profile === null){ leaveChurch(); return <div className="center-box"><div className="panel empty">교회를 다시 고르는 중…</div></div>; }
  if(profile.role === "pending") return <Pending profile={profile} logout={logout} refresh={loadProfile} back={leaveChurch}/>;
  return <App key={churchId} sb={sb} profile={profile} logout={logout} churchId={churchId} leaveChurch={leaveChurch}/>;
}

/* ───────── 앱 본체 ───────── */
function App({sb, profile, logout, churchId, leaveChurch}){
  const [churchName, setChurchName] = useState("우리교회");
  const [homePhoto, setHomePhoto] = useState(null);
  const [homePhotoReady, setHomePhotoReady] = useState(false);
