function SchoolDept({g, canEdit, setMemView, data, saveDept}){
  const preset = DEFAULT_CLASSES[g.key] || [];
  const classes = (data && data.classes) ? data.classes
                : preset.map((n,i)=>({id:"c"+g.key+i, name:n}));
  const of = (data && data.of) || {};
  const [editing, setEditing] = useState(false);
  const save = (classes2, of2) => saveDept({classes:classes2, of: of2 || of});

  const bucket = {};
  classes.forEach(c => bucket[c.id] = []);
  const rest = [];
  g.items.forEach(m => {
    const cid = of[m.id];
    if(cid && bucket[cid]) bucket[cid].push(m); else rest.push(m);
  });
  const Row = ({name, items, none}) => (
    <div style={{marginBottom:14}}>
      <div className={"cls-head"+(none?" none":"")}>
        <span className="nm">{name}</span>
        <span className="ct">{items.length}명</span>
      </div>
      {items.length===0
        ? <p className="muted small" style={{margin:"6px 0 0"}}>아직 배정된 학생이 없습니다.</p>
        : <div className="mem-list" style={{marginTop:8}}>
            {items.map(m=>(
              <div key={m.id}>
                <MemberCard m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}/>
                {canEdit && classes.length>0 &&
                  <div className="row" style={{margin:"4px 0 10px"}}>
                    <span className="muted small">반</span>
                    <select value={of[m.id]||""} onChange={e=>{
                      const of2 = {...of};
                      if(e.target.value) of2[m.id]=e.target.value; else delete of2[m.id];
                      save(classes, of2);
                    }}>
                      <option value="">미배정</option>
                      {classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                  </div>}
              </div>))}
          </div>}
    </div>
  );

  return (
    <div style={{marginBottom:22}}>
      <DeptHead sKey={"S_"+g.key} name={g.label} count={g.items.length+"명"}
        right={canEdit && <button onClick={()=>setEditing(!editing)}>{editing ? "닫기" : "반 편집"}</button>}/>

      {editing && canEdit &&
        <div className="panel" style={{padding:"12px 16px", marginBottom:12}}>
          <p className="small muted" style={{marginTop:0}}>반 이름을 고치거나, 반을 더하고 뺄 수 있습니다.
            반을 지우면 그 반 학생들은 <b>미배정</b>으로 돌아갑니다.</p>
          {classes.map((c,i)=>(
            <div className="row" key={c.id} style={{marginBottom:6}}>
              <input value={c.name} onChange={e=>{
                const cs=[...classes]; cs[i]={...c, name:e.target.value}; save(cs);
              }} style={{flex:"1 1 160px"}}/>
              <button className="btn sm ghost" onClick={()=>{
                const of2={...of};
                Object.keys(of2).forEach(k=>{ if(of2[k]===c.id) delete of2[k]; });
                save(classes.filter(x=>x.id!==c.id), of2);
              }}>지우기</button>
            </div>))}
          <button className="btn sm" onClick={()=>save([...classes, {id:uid2(), name:"새 반"}])}>+ 반 추가</button>
        </div>}

      {g.items.length===0
        ? <p className="muted small" style={{margin:"0 0 8px"}}>해당 교인이 없습니다.</p>
        : classes.length===0
          ? <Row name="전체" items={g.items}/>
          : <React.Fragment>
              {classes.map(c=> <Row key={c.id} name={c.name} items={bucket[c.id]}/>)}
              {rest.length>0 && <Row name="미배정" items={rest} none/>}
            </React.Fragment>}
    </div>
  );
}

function MemberList({members, setMemView, canEdit, schoolClasses, saveClasses, canEditClass}){
  const [book, setBook] = useState("all"); // all=교인 명부 | sok=속별 명부
  const [q, setQ] = useState("");
  const [pos, setPos] = useState("전체");
  const [mode, setMode] = useState("pos"); // pos=직분별 | name=가나다순
  const positions = ["전체", ...Array.from(new Set(members.map(m=>m.position).filter(Boolean)))
    .sort((a,b)=>{
      const ia = POSITIONS.indexOf(a), ib = POSITIONS.indexOf(b);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1; if(ib!==-1) return 1;
      return a.localeCompare(b,"ko");
    })];
  const list = members
    .filter(m => book!=="all" || pos==="전체" || m.position===pos)
    .filter(m => !q || (m.name+m.phone+m.address).includes(q))
    .sort(koSort);

  const groups = useMemo(()=>{
    const map = {};
    list.forEach(m=>{ const p = m.position || "성도"; (map[p]=map[p]||[]).push(m); });
    const known = POSITIONS.filter(p=>map[p]);
    const extra = Object.keys(map).filter(p=>!POSITIONS.includes(p)).sort((a,b)=>a.localeCompare(b,"ko"));
    return [...known, ...extra].map(p=>({pos:p, items:map[p]}));
  }, [list]);

  const sokGroups = useMemo(()=>{
    const map = {};
    list.forEach(m=>{
      if(isMinister(m)){                                   /* 교역자는 따로 묶음 */
        if(!map["MIN"]) map["MIN"] = {s:null, items:[]};
        map["MIN"].items.push(m); return;
      }
      if(isSamo(m)){                                       /* 사모도 별도 항목 */
        if(!map["SAMO"]) map["SAMO"] = {s:null, items:[]};
        map["SAMO"].items.push(m); return;
      }
      const s = sokOf(m);
      /* 교회학교(유치부~청년부) 대상은 속별 명부에 나오지 않음 */
      if(!s && schoolDeptOf(m)) return;
      const key = s ? (s.id ? s.id : s.g + s.n) : "zz";
      if(!map[key]) map[key] = {s:s, items:[]};
      map[key].items.push(m);
    });
    const order = ["MIN","SAMO",...sokKeys(),"zz"];   /* 설정된 속 순서대로 */
    return order.filter(k=>map[k]).map(k=>({
      key:k,
      label: k==="MIN" ? "교역자" : k==="SAMO" ? "사모" : k==="zz" ? "속 미지정" : sokLabel(map[k].s),
      items: map[k].items
    }));
  }, [list]);

  const SCHOOL = SCHOOL_DEPTS;
  const schoolGroups = useMemo(()=>{
    return SCHOOL.map(s=>({
      key:s.key, label:s.label,
      items: list.filter(m=>{
        const d = schoolDeptOf(m);                          /* 청년 표시·교역자·사모까지 함께 판정 */
        return d && d.key === s.key;
      })
    }));
  }, [list]);

  const gTitle = {margin:"0 0 8px", fontSize:"17px", color:"var(--pine-deep)",
    borderBottom:"2px solid var(--gold)", display:"inline-block", paddingBottom:"2px"};

  return (
    <div>
      <div className="panel">
        <div className="row" style={{justifyContent:"space-between"}}>
          <h2 style={{margin:0}}>교인 <span className="muted small">{members.length}명</span></h2>
          {canEdit && <button className="btn gold" onClick={()=>setMemView({mode:"form"})}>+ 새 교인 등록</button>}
        </div>
        <div className="svc-tabs" style={{marginTop:14, marginBottom:0}}>
          <button className={book==="all"?"on":""} onClick={()=>setBook("all")}>교인 명부</button>
          <button className={book==="sok"?"on":""} onClick={()=>setBook("sok")}>속별 명부</button>
          <button className={book==="school"?"on":""} onClick={()=>setBook("school")}>교회학교</button>
        </div>
        <div className="row" style={{marginTop:12}}>
          <input placeholder="이름·연락처·주소 검색" value={q} onChange={e=>setQ(e.target.value)} style={{flex:"1 1 200px"}}/>
          {book==="all" && <select value={pos} onChange={e=>setPos(e.target.value)}>
            {positions.map(p=><option key={p}>{p}</option>)}
          </select>}
          {book==="all" && <div className="svc-tabs" style={{margin:0}}>
            <button className={mode==="pos"?"on":""} onClick={()=>setMode("pos")}>직분별</button>
            <button className={mode==="name"?"on":""} onClick={()=>setMode("name")}>가나다순</button>
          </div>}
        </div>
      </div>

      {list.length===0 ? <div className="panel empty">조건에 맞는 교인이 없습니다.</div> :
       book==="school" ?
        <div>
          {schoolGroups.every(g=>g.items.length===0) ?
            <div className="panel empty">교회학교(5~29세)에 해당하는 교인이 없습니다.<br/>
              자녀·학생도 '새 교인 등록'에서 생년월일과 함께 등록하면 나이에 따라 자동으로 분류됩니다.</div> :
            schoolGroups.map(g=>(
              <SchoolDept key={g.key} g={g} canEdit={canEditClass ? canEditClass(g.key) : canEdit} setMemView={setMemView}
                data={(schoolClasses||{})[g.key]} saveDept={(d)=>saveClasses({...(schoolClasses||{}), [g.key]: d})}/>
            ))}
        </div>
       : book==="sok" ?
        <div>
          {sokGroups.map(g=>(
            <div key={g.key} style={{marginBottom:18}}>
              <DeptHead sKey={g.key==="zz" ? "" : g.key} name={g.label} count={g.items.length+"명"}/>
              {g.key==="zz" && <p className="muted small" style={{margin:"0 0 8px"}}>
                성별·생년월일이 없어 속을 정하지 못했습니다. '정보 수정'에서 성별과 생년월일을 넣으면 자동 배정됩니다.</p>}
              <div className="mem-list">
                {g.items.map(m=>(
                  <MemberCard key={m.id} m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}/>
                ))}
              </div>
            </div>
          ))}
        </div>
       : mode==="name" ?
        <div className="mem-list">
          {list.map(m=>(
            <MemberCard key={m.id} m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}/>
          ))}
        </div>
       :
        <div>
          {groups.map(g=>(
            <div key={g.pos} style={{marginBottom:18}}>
              <h3 style={gTitle}>{g.pos} <span className="muted small">{g.items.length}명</span></h3>
              <div className="mem-list">
                {g.items.map(m=>(
                  <MemberCard key={m.id} m={m} onClick={()=>setMemView({mode:"detail", id:m.id})}/>
                ))}
              </div>
            </div>
          ))}
        </div>}
    </div>
  );
}

/* ───────── 교인 등록/수정 ───────── */
function MemberForm({init, onSave, onCancel}){
  const [m, setM] = useState(init ? JSON.parse(JSON.stringify(init)) : emptyMember());
  const set = (k,v)=>setM(o=>({...o,[k]:v}));
  const setArr = (k, i, f, v)=>setM(o=>{ const a=[...o[k]]; a[i]={...a[i],[f]:v}; return {...o,[k]:a}; });
  const addRow = (k, row)=>setM(o=>({...o,[k]:[...o[k], row]}));
  const delRow = (k, i)=>setM(o=>({...o,[k]:o[k].filter((_,j)=>j!==i)}));

  return (
    <div className="panel">
      <h2>{init ? "교인 정보 수정" : "새 교인 등록"}</h2>

      <div className="photo-row">
        <div className={"photo-box" + (m.photo ? " has-photo" : "")}>
          {m.photo
            ? <img src={m.photo} alt="교인 사진"/>
            : <span className="photo-ph">사진 없음</span>}
        </div>
        <div className="col" style={{gap:6}}>
          <label className="btn sm ghost photo-pick">
            {m.photo ? "사진 변경" : "사진 선택"}
            <input type="file" accept="image/*" style={{display:"none"}}
              onChange={async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
                try{ set("photo", await readPhoto(f)); }
                catch(_){ alert("사진을 불러오지 못했습니다. 다른 사진으로 다시 시도해 주세요."); } }}/>
          </label>
          {m.photo && <button className="btn sm danger" onClick={()=>set("photo","")}>사진 삭제</button>}
          <span className="muted small">휴대폰·아이패드에서는 앨범이나 카메라를 선택할 수 있습니다. 사진은 자동으로 작게 저장됩니다.</span>
        </div>
      </div>

      <div className="form-grid">
        <div className="field"><label>이름 *</label>
          <input value={m.name} onChange={e=>set("name",e.target.value)} placeholder="홍길동"/></div>
        <div className="field"><label>생년월일</label>
          <input type="date" value={m.birth} onChange={e=>set("birth",e.target.value)}/></div>
        <div className="field"><label>성별 <span className="muted small">(속 자동 배정에 사용)</span></label>
          <select value={m.gender||""} onChange={e=>set("gender",e.target.value)}>
            <option value="">선택 안 함</option>
            <option value="여">여</option>
            <option value="남">남</option>
          </select></div>
        <div className="field"><label>연락처</label>
          <input value={m.phone} onChange={e=>set("phone",e.target.value)} placeholder="010-0000-0000"/></div>
        <div className="field"><label>직분</label>
          <input list="pos-list" value={m.position} onChange={e=>set("position",e.target.value)}/>
          <datalist id="pos-list">{POSITIONS.map(p=><option key={p} value={p}/>)}</datalist></div>
        {(SOK_MODE==="manual" || SOK_MODE==="area") &&
          <div className="field"><label>속회</label>
            <select value={m.sok||""} onChange={e=>set("sok",e.target.value)}>
              <option value="">{SOK_MODE==="area" ? "주소로 자동 배정" : "속 미지정"}</option>
              {SOK_LIST.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {SOK_MODE==="area" &&
              <span className="muted small">비워 두면 주소를 보고 자동으로 배정됩니다.</span>}
          </div>}
      </div>
      <div className="field"><label>주소</label>
        <input value={m.address} onChange={e=>set("address",e.target.value)} placeholder="시/구/동 상세주소"/></div>
      <div className="field"><label>메모</label>
        <textarea rows="2" value={m.memo} onChange={e=>set("memo",e.target.value)} placeholder="특이사항, 신앙 배경 등"/></div>

      <h3>가족</h3>
      {m.family.length===0 && <p className="muted small">등록된 가족이 없습니다.</p>}
      {m.family.map((f,i)=>(
        <div className="row" key={f.id} style={{marginBottom:8}}>
          <select value={f.relation} onChange={e=>setArr("family",i,"relation",e.target.value)} style={{width:95}}>
            {RELATIONS.map(r=><option key={r}>{r}</option>)}
          </select>
          <input placeholder="이름" value={f.name} onChange={e=>setArr("family",i,"name",e.target.value)} style={{width:110}}/>
          <input placeholder="나이" type="number" min="0" value={f.age} onChange={e=>setArr("family",i,"age",e.target.value)} style={{width:75}}/>
          <input placeholder="직업 / 학교" value={f.job} onChange={e=>setArr("family",i,"job",e.target.value)} style={{flex:"1 1 140px"}}/>
          <button className="btn sm danger" onClick={()=>delRow("family",i)}>삭제</button>
        </div>
      ))}
      <button className="btn sm ghost" onClick={()=>addRow("family",{id:uid(),relation:"배우자",name:"",age:"",job:""})}>+ 가족 추가</button>

      <h3>봉사 부서 <span className="muted small">(과거 이력도 함께 기록)</span></h3>
      {m.depts.length===0 && <p className="muted small">등록된 봉사 부서가 없습니다.</p>}
      {m.depts.map((d,i)=>(
        <div className="row" key={d.id} style={{marginBottom:8}}>
          <input placeholder="부서명 (예: 찬양대)" value={d.name} onChange={e=>setArr("depts",i,"name",e.target.value)} style={{flex:"1 1 140px"}}/>
          <input placeholder="시작 (예: 2020)" value={d.from} onChange={e=>setArr("depts",i,"from",e.target.value)} style={{width:110}}/>
          <input placeholder="종료" value={d.to} disabled={d.current} onChange={e=>setArr("depts",i,"to",e.target.value)} style={{width:110}}/>
          <label className="row small" style={{gap:5}}>
            <input type="checkbox" checked={!!d.current}
              onChange={e=>{ setArr("depts",i,"current",e.target.checked); if(e.target.checked) setArr("depts",i,"to",""); }}/>
            현재 봉사 중
          </label>
          <button className="btn sm danger" onClick={()=>delRow("depts",i)}>삭제</button>
        </div>
      ))}
      <button className="btn sm ghost" onClick={()=>addRow("depts",{id:uid(),name:"",from:"",to:"",current:true})}>+ 부서 추가</button>

      <hr className="divider"/>
      <div className="row">
        <button className="btn" disabled={!m.name.trim()} onClick={()=>onSave({...m, name:m.name.trim()})}>저장</button>
        <button className="btn ghost" onClick={onCancel}>취소</button>
        {!m.name.trim() && <span className="muted small">이름을 입력하면 저장할 수 있습니다.</span>}
      </div>
    </div>
  );
}

/* ───────── 교인 상세 ───────── */
function MemberDetail({m, att, setMemView, update, remove, canEdit, canDelete, allMembers, openMember, limited, seeSecret, outside, canPray, meName, meId, specials}){
  const [pSecret, setPSecret] = useState(false);
  const visiblePrayers = (m && m.prayers ? m.prayers : []).filter(p => seeSecret || !p.secret);
  /* 속장·교사는 자기가 남긴 심방 기록만 봅니다 */
  const visibleVisits = (m && m.visits ? m.visits : []).filter(v => !limited || v.byId === meId);
  const [vWhen, setVWhen] = useState(nowLocal());
  const [vPurpose, setVPurpose] = useState("정기심방");
  const [vNote, setVNote] = useState("");
  const [pReq, setPReq] = useState("");

  if(!m) return <div className="panel empty">교인 정보를 찾을 수 없습니다.</div>;
  const age = calcAge(m.birth);
  const year = String(new Date().getFullYear());

  /* 기본 예배 + 특별예배. 출석 기록에만 남아 있는 예배(목록에서 뺀 것)도 함께 찾아 준다 */
  const attStat = (()=>{
    const known = [...SERVICES, ...(specials||[])];
    const knownKeys = new Set(known.map(s=>s.key));
    const extraKeys = new Set();
    Object.keys(att).forEach(d=>{
      Object.keys(att[d]||{}).forEach(k=>{
        if(!knownKeys.has(k) && (att[d][k]||[]).includes(m.id)) extraKeys.add(k);
      });
    });
    const rows = [...known, ...[...extraKeys].map(k=>({key:k, label:"지난 특별예배", from:""}))];
    return rows.map(s=>{
      const dates = Object.keys(att).filter(d => (att[d][s.key]||[]).includes(m.id)).sort();
      return {key:s.key, label:s.label, from:s.from||"",
        special:!SERVICES.some(x=>x.key===s.key),
        total:dates.length,
        year:dates.filter(d=>d.startsWith(year)).length,
        last:dates.length ? dates[dates.length-1] : null};
    }).filter(s => !s.special || s.total > 0 || String(s.from||"").startsWith(year));
       /* 특별예배: 올해 것은 0회라도 표시, 지난 해 것은 참석 기록이 있을 때만 */
  })();

  const curDepts = (m.depts||[]).filter(d=>d.current);
  const pastDepts = (m.depts||[]).filter(d=>!d.current);

  return (
    <div>
      <div className="back-line">
        <button className="btn sm ghost" onClick={()=>setMemView({mode:"list"})}>← 명부로</button>
      </div>

      <div className="panel">
        <div className="mem-detail-head">
          {m.photo && <img className="mem-photo-lg" src={m.photo} alt={m.name+" 사진"}/>}
          <div className="row" style={{justifyContent:"space-between", flex:"1 1 auto"}}>
            <h2 style={{margin:0}}>{m.name} <span className="chip pos">{m.position||"성도"}</span></h2>
            {canEdit && <div className="row" style={{gap:6}}>
              <button className="btn sm" onClick={()=>setMemView({mode:"form", id:m.id})}>정보 수정</button>
              {canDelete!==false && <button className="btn sm danger" onClick={remove}>삭제</button>}
            </div>}
          </div>
        </div>
        <div className="tbl-wrap" style={{marginTop:12}}><table>
          <tbody>
            <tr><th style={{width:90}}>생년월일</th><td>{m.birth ? `${m.birth} (${age}세)` : <span className="muted">미입력</span>}</td></tr>
            <tr><th>속회</th><td>{sokOf(m) ? sokLabel(sokOf(m)) :
              <span className="muted">{SOK_MODE==="manual"
                ? "미지정 — '정보 수정'에서 속회를 골라 주세요"
                : SOK_MODE==="area"
                ? "미지정 — 주소에 맞는 속이 없습니다. 주소를 확인하거나 '정보 수정'에서 속회를 골라 주세요"
                : "미지정 — 성별과 생년월일을 입력하면 자동 배정됩니다"}</span>}{m.gender && <span className="muted small"> · 성별: {m.gender}</span>}</td></tr>
            <tr><th>연락처</th><td>{m.phone ? <a href={"tel:"+m.phone.replace(/[^0-9+]/g,"")}>{m.phone}</a> : <span className="muted">미입력</span>}</td></tr>
            <tr><th>주소</th><td>{m.address || <span className="muted">미입력</span>}</td></tr>
            {m.memo && <tr><th>메모</th><td style={{whiteSpace:"pre-wrap"}}>{m.memo}</td></tr>}
          </tbody></table></div>
      </div>

      {outside && <div className="panel" style={{padding:"12px 16px"}}>
        <span className="muted small">담당 범위 밖의 교인입니다 — <b>가족으로 이어져</b> 열람 중입니다.</span>
      </div>}

      <div className="panel">
        <h2>가족</h2>
        {(m.family||[]).length===0 ? <p className="empty">등록된 가족이 없습니다. '정보 수정'에서 추가할 수 있습니다.</p> :
          <div className="tbl-wrap"><table>
            <thead><tr><th>관계</th><th>이름</th><th>나이</th><th>직업 / 학교</th></tr></thead>
            <tbody>{m.family.map(f=>{
              const nm = (f.name||"").trim();
              const link = nm && (allMembers||[]).find(x => x.id!==m.id && (x.name||"").trim()===nm);
              return (
                <tr key={f.id}>
                  <td>{f.relation}</td>
                  <td>{link
                    ? <button className="btn sm ghost" style={{padding:"2px 8px"}}
                        title={nm + " 님의 교인 기록으로 이동"}
                        onClick={()=>openMember(link.id)}>{nm} ↗</button>
                    : nm}</td>
                  <td>{f.age && (/^\d{1,3}$/.test(String(f.age)) ? f.age + "세" : f.age)}</td>
                  <td>{f.job}</td>
                </tr>);
            })}
            </tbody></table></div>}
        {(m.family||[]).length>0 &&
          <p className="muted small" style={{marginBottom:0}}>이름 옆에 ↗ 표시가 있는 분은 교인으로 등록되어 있습니다. 눌러서 그분 기록으로 바로 넘어갈 수 있습니다.</p>}
      </div>

      <div className="panel">
        <h2>봉사 부서</h2>
        {(m.depts||[]).length===0 ? <p className="empty">등록된 봉사 이력이 없습니다.</p> : (
          <div>
            {curDepts.length>0 && <div style={{marginBottom:8}}>
              {curDepts.map(d=><span key={d.id} className="chip now" style={{marginRight:6}}>
                {d.name}{d.from && ` (${d.from}~현재)`}</span>)}
            </div>}
            {pastDepts.length>0 && <div>
              {pastDepts.map(d=><span key={d.id} className="chip past" style={{marginRight:6}}>
                {d.name}{(d.from||d.to) && ` (${d.from||"?"}~${d.to||"?"})`}</span>)}
            </div>}
          </div>)}
      </div>

      <div className="panel">
        <h2>예배 출석 현황</h2>
        <div className="tbl-wrap"><table>
          <thead><tr><th>예배</th><th>올해 출석</th><th>누적</th><th>최근 출석일</th></tr></thead>
          <tbody>{attStat.map(s=>(
            <tr key={s.key}><td>{s.special && "✦ "}{s.label}</td>
              <td><b style={{color:"var(--pine)"}}>{s.year}</b>회</td>
              <td>{s.total}회</td>
              <td>{s.last ? `${s.last} (${weekdayOf(s.last)})` : <span className="muted">기록 없음</span>}</td></tr>))}
          </tbody></table></div>
        <p className="muted small" style={{marginBottom:0}}>출석 체크는 상단 <b>출석</b> 메뉴에서 예배별로 진행합니다.</p>
      </div>

      {(!limited || canPray) && <div className="panel">
        <h2>심방 기록 <span className="muted small">{visibleVisits.length}건</span></h2>
        {visibleVisits.length>0 &&
          <div className="tbl-wrap"><table>
            <thead><tr><th>일시</th><th>목적</th><th>내용</th><th></th></tr></thead>
            <tbody>{[...visibleVisits].sort((a,b)=>(b.when||"").localeCompare(a.when||"")).map(v=>(
              <tr key={v.id}>
                <td style={{whiteSpace:"nowrap"}}>{fmtDT(v.when)}
                  {v.by && <div className="muted small">{v.by}</div>}</td>
                <td><span className="chip pos">{v.purpose}</span></td>
                <td style={{whiteSpace:"pre-wrap"}}>{v.note}</td>
                <td>{(canEdit || (limited && v.byId === meId)) && <button className="btn sm danger" onClick={()=>{
                  if(confirm("이 심방 기록을 삭제할까요?")) update(o=>({...o, visits:o.visits.filter(x=>x.id!==v.id)}));
                }}>삭제</button>}</td>
              </tr>))}
            </tbody></table></div>}
        {(canEdit || canPray) && <React.Fragment>
        <h3>새 심방 기록</h3>
        <div className="row">
          <input type="datetime-local" value={vWhen} onChange={e=>setVWhen(e.target.value)}/>
          <select value={vPurpose} onChange={e=>setVPurpose(e.target.value)}>
            {PURPOSES.map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
        <div className="row" style={{marginTop:8}}>
          <input placeholder="내용 (선택)" value={vNote} onChange={e=>setVNote(e.target.value)} style={{flex:"1 1 220px"}}/>
          <button className="btn" disabled={!vWhen} onClick={()=>{
            update(o=>({...o, visits:[...(o.visits||[]),
              {id:uid(), when:vWhen, purpose:vPurpose, note:vNote.trim(), by: meName, byId: meId}]}));
            setVNote(""); setVWhen(nowLocal());
          }}>기록 추가</button>
        </div>
        {limited && <p className="muted small" style={{marginTop:8, marginBottom:0}}>
          여기에 남긴 심방 기록은 목회자와 함께 보게 됩니다.</p>}
        </React.Fragment>}
      </div>}

      {(!limited || canPray) && <div className="panel">
        <h2>중보기도 <span className="muted small">{visiblePrayers.length}건</span></h2>
        {visiblePrayers.length>0 &&
          <div className="tbl-wrap"><table>
            <thead><tr><th>요청일</th><th>기도 제목</th><th>상태</th><th></th></tr></thead>
            <tbody>{[...visiblePrayers].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(p=>(
              <tr key={p.id}>
                <td style={{whiteSpace:"nowrap"}}>{p.date}
                  {p.by && <div className="muted small">{p.by}</div>}</td>
                <td style={{whiteSpace:"pre-wrap"}}>
                  {p.secret && <span className="chip secret" style={{marginRight:6}}>긴밀</span>}
                  {p.request}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  {p.status==="answered"
                    ? <span className="chip ans">응답 {p.answeredDate && `(${p.answeredDate})`}</span>
                    : <span className="chip open">요청중</span>}
                </td>
                <td style={{whiteSpace:"nowrap"}}>
                  {(canEdit || (limited && p.byId === meId)) && <React.Fragment>
                  <button className="btn sm ghost" onClick={()=>update(o=>({...o, prayers:o.prayers.map(x=>
                    x.id===p.id ? (x.status==="answered" ? {...x,status:"open",answeredDate:""} : {...x,status:"answered",answeredDate:todayStr()}) : x)}))}>
                    {p.status==="answered" ? "요청중으로" : "응답 체크"}
                  </button>{" "}
                  <button className="btn sm danger" onClick={()=>{
                    if(confirm("이 기도 제목을 삭제할까요?")) update(o=>({...o, prayers:o.prayers.filter(x=>x.id!==p.id)}));
                  }}>삭제</button>
                  </React.Fragment>}
                </td>
              </tr>))}
            </tbody></table></div>}
        {(canEdit || canPray) && <React.Fragment>
        <h3>새 기도 제목</h3>
        <div className="row">
          <input placeholder="기도 요청 사항" value={pReq} onChange={e=>setPReq(e.target.value)} style={{flex:"1 1 240px"}}/>
          <button className="btn" disabled={!pReq.trim()} onClick={()=>{
            update(o=>({...o, prayers:[...(o.prayers||[]),
              {id:uid(), date:todayStr(), request:pReq.trim(), status:"open", answeredDate:"",
               secret: pSecret, by: meName, byId: meId}]}));
            setPReq(""); setPSecret(false);
          }}>추가</button>
        </div>
        {!limited &&
          <label className="row small" style={{gap:6, marginTop:8, alignItems:"center"}}>
            <input type="checkbox" checked={pSecret} onChange={e=>setPSecret(e.target.checked)}/>
            <b>긴밀 중보기도</b>
            <span className="muted">— 목회자와 관리자만 볼 수 있습니다. 속장·교사에게는 보이지 않습니다.</span>
          </label>}
        {limited && <p className="muted small" style={{marginTop:8, marginBottom:0}}>
          여기에 올린 기도제목은 목회자와 함께 보게 됩니다.</p>}
        </React.Fragment>}
      </div>}
    </div>
  );
}

/* ───────── 출석 체크 ───────── */
function Attendance({members, att, saveAtt, canEdit, canCheckMember, schoolClasses, specials, saveSpecials, isAdmin}){
  const mayCheck = m => canEdit && (!canCheckMember || canCheckMember(m));
  const [svc, setSvc] = useState("sun");
  const [showPast, setShowPast] = useState(false);   /* 지난 특별예배 펼치기 */
  /* 특별예배: 기간이 끝나지 않은 것만 탭에 두고, 지난 것은 접어 둔다 */
  const spAll = useMemo(()=>
    (specials||[]).map(s=>({key:s.key, label:s.label, dow:null, special:true, from:s.from, to:s.to}))
      .sort((a,b)=>(b.from||"").localeCompare(a.from||"")),
  [specials]);
  const t0 = todayStr();
  const spNow  = spAll.filter(s => s.to >= t0);      /* 진행 중이거나 앞으로 있을 것 */
  const spPast = spAll.filter(s => s.to <  t0);      /* 이미 끝난 것 */
  const allServices = useMemo(()=> [...SERVICES, ...spAll], [spAll]);
  const svcObj = allServices.find(s=>s.key===svc) || SERVICES[0];
  const [spForm, setSpForm] = useState(null);
  const pickSvc = s => {
    setSvc(s.key);
    if(s.special){
      const t = todayStr();
      setDate(t >= s.from && t <= s.to ? t : s.to < t ? s.to : s.from);
    } else if(s.dow !== null) setDate(lastWeekday(s.dow));
  };
  const [date, setDate] = useState(()=> lastWeekday(0));
  const [q, setQ] = useState("");

  useEffect(()=>{ if(svcObj.dow!==null) setDate(lastWeekday(svcObj.dow)); }, [svc]);

  const checked = (att[date] && att[date][svc]) || [];
  const toggle = id => {
    if(!canEdit) return;
    const who = members.find(m => m.id === id);
    if(who && !mayCheck(who)) return;          /* 담당 밖 교인은 손대지 않습니다 */
    const ids = checked.includes(id) ? checked.filter(x=>x!==id) : [...checked, id];
    saveAtt(date, svc, ids);
  };
  const clearAll = () => {
    if(checked.length && confirm(`${date} ${svcObj.label} 출석 체크를 모두 해제할까요?`))
      saveAtt(date, svc, []);
  };

  const list = [...members.filter(m=>!isDeceased(m)).sort(koSort), ...GUESTS]
    .filter(m=>!q || m.name.includes(q));
  const recent = Object.keys(att).filter(d=>(att[d][svc]||[]).length).sort().reverse().slice(0,8);

  /* 연도별 통계 — 예배 종류마다 따로, 1월 1일 ~ 12월 31일 */
  const years = useMemo(()=>{
    const s = new Set();
    Object.keys(att).forEach(d=>{ allServices.forEach(v=>{ if((att[d][v.key]||[]).length) s.add(d.slice(0,4)); }); });
    return [...s].sort().reverse();
  }, [att, allServices]);
  const [statYear, setStatYear] = useState("");
  const year = statYear || years[0] || String(new Date().getFullYear());

  /* 그 해 1월 1일부터 오늘까지, 이 예배의 날짜별 출석 인원 */
  const yearRows = useMemo(()=>
    Object.keys(att)
      .filter(d => d.slice(0,4) === year && (att[d][svc]||[]).length)
      .sort()
      .map(d => ({date:d, n:(att[d][svc]||[]).length})),
  [att, svc, year]);

  /* 속별 · 교회학교 부서별 편성 */
  const groups = useMemo(()=>{
    const map = {}, order = [];
    const bucket = (key, label) => {
      if(!map[key]){ map[key] = {key, label, items:[]}; order.push(key); }
      return map[key];
    };
    bucket("MIN", "교역자");
    bucket("SAMO", "사모");
    sokKeys().forEach(k=>
      bucket(k, sokKeyLabel(k)));
    SCHOOL_DEPTS.forEach(s => {
      const dep = (schoolClasses||{})[s.key];
      const cls = dep && dep.classes ? dep.classes
                : (DEFAULT_CLASSES[s.key]||[]).map((n,i)=>({id:"c"+s.key+i, name:n}));
      if(cls.length){
        cls.forEach(c => { const b = bucket("S_"+s.key+"_"+c.id, c.name); b.dept = s; b.cls = true; });
        const bn = bucket("S_"+s.key+"_none", "미배정"); bn.dept = s; bn.cls = true; bn.none = true;
      } else { const b = bucket("S_"+s.key, "교회학교 · "+s.label); b.dept = s; }
    });
    bucket("GUEST", "미소속 (등록하지 않은 방문자)");
    bucket("zz", "편성 없음");

    list.forEach(m=>{
      if(m.guest){ map["GUEST"].items.push(m); return; }
      if(isMinister(m)){ map["MIN"].items.push(m); return; }
      if(isSamo(m)){ map["SAMO"].items.push(m); return; }
      const s = sokOf(m);
      if(s){ const kk = s.id ? s.id : s.g+s.n; bucket(kk, sokLabel(s)).items.push(m); return; }
      const d = schoolDeptOf(m);
      if(d){
        const dep = (schoolClasses||{})[d.key];
        const cls = dep && dep.classes ? dep.classes
                  : (DEFAULT_CLASSES[d.key]||[]).map((n,i)=>({id:"c"+d.key+i, name:n}));
        if(cls.length){
          const cid = dep && dep.of ? dep.of[m.id] : null;
          const key = (cid && cls.some(c=>c.id===cid)) ? "S_"+d.key+"_"+cid : "S_"+d.key+"_none";
          map[key].items.push(m);
        } else map["S_"+d.key].items.push(m);
        return;
      }
      map["zz"].items.push(m);
    });
    return order.map(k=>map[k]).filter(g=>g.items.length);
  }, [list, schoolClasses]);

  /* 부서 전체 재적·출석 (반으로 나뉜 부서만) */
  const deptSummary = useMemo(()=>{
    const s = {};
    groups.forEach(g=>{
      if(!g.dept || !g.cls) return;
      const k = g.dept.key;
      if(!s[k]) s[k] = {dept:g.dept, total:0, on:0, firstKey:g.key};
      s[k].total += g.items.length;
      s[k].on += g.items.filter(m=>checked.includes(m.id)).length;
    });
    return s;
  }, [groups, checked]);

  const toggleDept = (k) => {
    if(!canEdit) return;
    const ids = groups.filter(g=>g.dept && g.dept.key===k)
      .flatMap(g=>g.items.filter(mayCheck).map(m=>m.id));
    if(!ids.length) return;
    const allOn = ids.every(id=>checked.includes(id));
    saveAtt(date, svc, allOn ? checked.filter(id=>!ids.includes(id))
                             : [...checked, ...ids.filter(id=>!checked.includes(id))]);
  };

  const toggleGroup = g => {
    if(!canEdit) return;
    const ids = g.items.filter(mayCheck).map(m=>m.id);
    if(!ids.length) return;
    const allOn = ids.every(id=>checked.includes(id));
    saveAtt(date, svc, allOn ? checked.filter(id=>!ids.includes(id))
                             : [...checked, ...ids.filter(id=>!checked.includes(id))]);
  };
  const gTitle = {margin:0, fontSize:"16px", color:"var(--pine-deep)",
    borderBottom:"2px solid var(--gold)", display:"inline-block", paddingBottom:"2px"};

  return (
    <div>
      <div className="panel">
        <h2>출석 체크</h2>
        <div className="svc-tabs">
          {[...SERVICES, ...spNow].map(s=>(
            <button key={s.key} className={svc===s.key?"on":""} onClick={()=>pickSvc(s)}>
              {s.special && "✦ "}{s.label}</button>
          ))}
          {/* 지난 특별예배를 보고 있으면 그 탭도 함께 표시 */}
          {svcObj.special && spPast.some(s=>s.key===svc) &&
            <button className="on" onClick={()=>{}}>✦ {svcObj.label}</button>}
          {spPast.length>0 &&
            <button className="svc-past" onClick={()=>setShowPast(!showPast)}>
              {showPast ? "지난 특별예배 접기" : "지난 특별예배 " + spPast.length + "건"}</button>}
          {isAdmin && <button className="svc-add" title="특별예배 추가"
            onClick={()=>setSpForm({key:"", label:"", from:todayStr(), to:todayStr()})}>+ 특별예배</button>}
        </div>

        {showPast && spPast.length>0 &&
          <div className="sp-past-box">
            <span className="muted small">지난 특별예배</span>
            {spPast.map(s=>(
              <button key={s.key} className={"btn sm"+(svc===s.key?"":" ghost")}
                onClick={()=>{ pickSvc(s); setShowPast(false); }}>
                {s.label} <span className="muted small">{s.from.slice(2).replace(/-/g,".")}</span>
              </button>))}
          </div>}

        {spForm && isAdmin &&
          <div className="panel" style={{padding:"14px 16px", marginBottom:12}}>
            <h3 style={{marginTop:0}}>{spForm.key ? "특별예배 고치기" : "새 특별예배"}</h3>
            <p className="small muted" style={{marginTop:0}}>
              특별새벽기도회처럼 일정 기간 매일 드리는 예배를 만들 수 있습니다. 기간 안의 날짜를 골라 매일 출석을 체크하시면 됩니다.</p>
            <div className="field"><label>이름</label>
              <input value={spForm.label} onChange={e=>setSpForm({...spForm, label:e.target.value})}
                placeholder="예) 특별새벽기도회, 부흥회"/></div>
            <div className="row">
              <div className="field" style={{flex:"1 1 150px"}}><label>시작</label>
                <input type="date" value={spForm.from} onChange={e=>setSpForm({...spForm, from:e.target.value})}/></div>
              <div className="field" style={{flex:"1 1 150px"}}><label>끝</label>
                <input type="date" value={spForm.to} onChange={e=>setSpForm({...spForm, to:e.target.value})}/></div>
            </div>
            <div className="row" style={{gap:6}}>
              <button className="btn" disabled={!spForm.label.trim() || !spForm.from || !spForm.to}
                onClick={()=>{
                  const k = spForm.key || ("sp" + Date.now().toString(36));
                  const item = {key:k, label:spForm.label.trim(), from:spForm.from, to:spForm.to};
                  const next = spForm.key
                    ? (specials||[]).map(x=>x.key===k ? item : x)
                    : [...(specials||[]), item];
                  saveSpecials(next); setSvc(k); setDate(item.from); setSpForm(null);
                }}>저장</button>
              <button className="btn ghost" onClick={()=>setSpForm(null)}>취소</button>
              {spForm.key &&
                <button className="btn sm danger" style={{marginLeft:"auto"}} onClick={()=>{
                  if(confirm("이 특별예배를 목록에서 지울까요?\n이미 체크한 출석 기록은 그대로 남습니다.")){
                    saveSpecials((specials||[]).filter(x=>x.key!==spForm.key));
                    setSvc("sun"); setSpForm(null);
                  }
                }}>목록에서 빼기</button>}
            </div>
          </div>}

        {svcObj.special &&
          <div className="sp-note">
            <b>{svcObj.label}</b>
            <span className="muted small"> {svcObj.from.replace(/-/g,".")} ~ {svcObj.to.replace(/-/g,".")}
              · 모두 {Math.round((new Date(svcObj.to)-new Date(svcObj.from))/86400000)+1}일</span>
            {isAdmin && <button className="btn sm ghost" style={{marginLeft:"auto"}}
              onClick={()=>setSpForm({key:svcObj.key, label:svcObj.label, from:svcObj.from, to:svcObj.to})}>고치기</button>}
          </div>}
        <div className="row">
          <input type="date" value={date} onChange={e=>setDate(e.target.value)}/>
          <span className="muted">{date && `${weekdayOf(date)}요일`}</span>
          <span className="count-badge" style={{marginLeft:"auto"}}>{checked.length}</span>
          <span className="muted small">/ {members.length}명 출석</span>
          {canEdit && <button className="btn sm danger" onClick={clearAll} disabled={!checked.length}>모두 해제</button>}
        </div>
        <div className="row" style={{marginTop:10}}>
          <input placeholder="이름 검색" value={q} onChange={e=>setQ(e.target.value)} style={{flex:"1 1 160px",maxWidth:260}}/>
        </div>

        {members.length===0 ? <p className="empty">먼저 교인을 등록해 주세요.</p> :
         groups.length===0 ? <p className="empty">이름에 '{q}'이(가) 들어가는 교인이 없습니다.</p> :
          groups.map(g=>{
            const onCount = g.items.filter(m=>checked.includes(m.id)).length;
            const allOn = onCount === g.items.length;
            const dk = g.dept && g.cls ? g.dept.key : null;
            const sum = dk ? deptSummary[dk] : null;
            const showDeptHead = sum && sum.firstKey === g.key;   /* 부서의 첫 반 위에만 부서 머리표 */
            const rate = sum && sum.total ? Math.round(sum.on / sum.total * 100) : 0;
            return (
              <div key={g.key} style={{marginTop: showDeptHead ? 22 : 14}}>
                {showDeptHead &&
                  <DeptHead sKey={"S_"+dk} name={"교회학교 · " + sum.dept.label}
                    count={"출석 " + sum.on + " / 재적 " + sum.total + "명 · " + rate + "%"}
                    right={canEdit && <button onClick={()=>toggleDept(dk)}>부서 전체</button>}/>}
                {g.cls
                  ? <div className={"cls-head"+(g.none?" none":"")}>
                      <span className="nm">{g.label}</span>
                      <span className="ct">{onCount} / {g.items.length}명</span>
                      {canEdit && <button className="btn sm ghost" style={{marginLeft:"auto",padding:"2px 10px"}}
                        onClick={()=>toggleGroup(g)}>{allOn ? "반 해제" : "반 체크"}</button>}
                    </div>
                  : <DeptHead sKey={g.key} name={g.label} count={onCount + " / " + g.items.length + "명"}
                      right={canEdit && <button onClick={()=>toggleGroup(g)}>{allOn ? "전체 해제" : "전체 체크"}</button>}/>}
                <div className="att-list" style={{marginTop:8}}>
                  {g.items.map(m=>{
                    const on = checked.includes(m.id);
                    return (
                      <button key={m.id} className={"att-item"+(on?" on":"")+(mayCheck(m)?"":" locked")}
                        onClick={()=>toggle(m.id)} disabled={!mayCheck(m)}
                        title={mayCheck(m)?undefined:"담당 밖이라 보기만 됩니다"}
                        aria-pressed={on}>
                        <span className="mark">{on?"✓":""}</span>
                        <span>{m.name} <span className="muted small">{m.position}</span></span>
                      </button>);
                  })}
                </div>
              </div>);
          })}
        <p className="muted small" style={{marginTop:14,marginBottom:0}}>{canEdit ? "이름을 누르면 출석/해제가 되고, 체크 즉시 서버에 저장됩니다." : "열람 권한으로 접속 중입니다. 출석 체크는 수정 권한이 있는 분만 할 수 있습니다."}</p>
      </div>

      <div className="panel">
        <div className="row" style={{alignItems:"baseline", gap:10, flexWrap:"wrap"}}>
          <h2 style={{margin:0}}>{date} ({weekdayOf(date)}) {svcObj.label} 출석자
            <span className="muted small"> {checked.length}명</span></h2>
          {years.length>1 &&
            <select value={year} onChange={e=>setStatYear(e.target.value)} style={{marginLeft:"auto"}}>
              {years.map(y=><option key={y} value={y}>{y}년 흐름</option>)}
            </select>}
        </div>

        <div className="att-summary">
          <div className="att-names">
            {checked.length===0
              ? <p className="empty" style={{margin:0}}>아직 체크된 분이 없습니다.</p>
              : groups.filter(g=>g.items.some(m=>checked.includes(m.id))).map(g=>{
                  const on = g.items.filter(m=>checked.includes(m.id));
                  return (
                    <div key={g.key} style={{marginBottom:9}}>
                      <div className="row small" style={{gap:6, alignItems:"baseline"}}>
                        <b style={{color:"var(--pine-deep)"}}>{g.label}</b>
                        <span className="muted">{on.length}명</span>
                      </div>
                      <div style={{marginTop:2}}>{on.map(m=>m.name).join(", ")}</div>
                    </div>);
                })}
          </div>
          <LineChart rows={yearRows} year={year} label={svcObj.label} today={date}/>
        </div>
      </div>
    </div>
  );
}

/* ───────── 연간 출석 흐름 (꺾은선) ───────── */
function LineChart({rows, year, label, today}){
  if(!rows || rows.length===0)
    return <div className="att-chart"><p className="empty" style={{margin:0}}>{year}년 {label} 기록이 아직 없습니다.</p></div>;

  const W = 560, H = 250, L = 42, R = 14, T = 18, B = 34;
  const iw = W - L - R, ih = H - T - B;
  const ns = rows.map(r=>r.n);
  const hi = Math.max(...ns), lo = Math.min(...ns);
  const top = Math.ceil((hi * 1.12) / 10) * 10 || 10;
  const x = i => rows.length===1 ? L + iw/2 : L + (i/(rows.length-1)) * iw;
  const y = n => T + ih - (n/top) * ih;
  const pts = rows.map((r,i)=>[x(i), y(r.n)]);
  const line = pts.map((p,i)=>(i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + " L " + pts[pts.length-1][0].toFixed(1) + " " + (T+ih) + " L " + pts[0][0].toFixed(1) + " " + (T+ih) + " Z";
  const ticks = [0, Math.round(top/2), top];
  const avg = Math.round(ns.reduce((a,b)=>a+b,0)/ns.length);
  /* 가로 눈금은 달이 바뀌는 지점에만 */
  const monthTicks = rows.map((r,i)=>({i, mo:r.date.slice(5,7)}))
    .filter((t,i,a)=> i===0 || t.mo !== a[i-1].mo);

  return (
    <div className="att-chart">
      <div className="chart-head">
        <b>{year}년 {label} 출석 흐름</b>
        <span className="muted small">{rows.length}회 · 평균 {avg}명 · 최고 {hi}명 · 최저 {lo}명</span>
      </div>
      <svg viewBox={"0 0 " + W + " " + H} style={{width:"100%", height:"auto"}}>
        <defs>
          <linearGradient id="attFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#22355C" stopOpacity="0.22"/>
            <stop offset="100%" stopColor="#22355C" stopOpacity="0.02"/>
          </linearGradient>
        </defs>
        {ticks.map(t=>(
          <g key={t}>
            <line x1={L} y1={y(t)} x2={W-R} y2={y(t)} stroke="#DDE2EC" strokeWidth="1"/>
            <text x={L-8} y={y(t)+4} textAnchor="end" fontSize="11" fill="#63708A">{t}</text>
          </g>))}
        <line x1={L} y1={y(avg)} x2={W-R} y2={y(avg)} stroke="#B8912F" strokeWidth="1.2" strokeDasharray="5 4"/>
        <rect x={L+2} y={y(avg)+4} width="58" height="15" rx="7.5" fill="#E3E8F2" opacity="0.92"/>
        <text x={L+8} y={y(avg)+15} textAnchor="start" fontSize="10.5" fill="#8C6C1E">평균 {avg}명</text>
        <path d={area} fill="url(#attFill)"/>
        <path d={line} fill="none" stroke="#22355C" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
        {rows.map((r,i)=>(
          <g key={r.date}>
            <circle cx={x(i)} cy={y(r.n)} r={r.date===today ? 5.5 : 3.4}
              fill={r.date===today ? "#B8912F" : "#FBFCFE"} stroke="#22355C" strokeWidth="2"/>
            {(rows.length<=14 || r.n===hi || r.n===lo || r.date===today) &&
              <text x={x(i)} y={r.n < avg ? y(r.n)+16 : y(r.n)-10}
                textAnchor="middle" fontSize="10.5" fill="#16223D">{r.n}</text>}
          </g>))}
        {monthTicks.map(t=>(
          <text key={t.mo} x={x(t.i)} y={H-12} textAnchor="middle" fontSize="11" fill="#63708A">{Number(t.mo)}월</text>
        ))}
      </svg>
    </div>
  );
}

/* ───────── 교회 설정 (관리자 전용) ───────── */
function ChurchConfig({saveConfig, churchName, homePhoto, homePhotoReady, initialMessage}){
  const [c, setC] = useState(currentChurchConfig());
  const [msg, setMsg] = useState(initialMessage || "");
  const [saveError, setSaveError] = useState("");
  const [saving, setSaving] = useState(false);
  const saveLock = useRef(false);
  const [photoDraft, setPhotoDraft] = useState(homePhoto);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [cutWhite, setCutWhite] = useState(!!(homePhoto && homePhoto.cut));
  const lastFile = useRef(null);
  const [photoError, setPhotoError] = useState("");
  const [photoMessage, setPhotoMessage] = useState("");
  const photoInput = useRef(null);
  const photoReadToken = useRef(0);
  useEffect(() => () => { photoReadToken.current++; }, []);
  const choosePhoto = async (file, cutOpt) => {
    if(!file) return;
    lastFile.current = file;
    const cut = cutOpt === undefined ? cutWhite : cutOpt;
    const token = ++photoReadToken.current;
    setPhotoBusy(true); setPhotoError(""); setPhotoMessage(""); setMsg("");
    try{
      const next = await readChurchHomePhoto(file, cut);
      if(token !== photoReadToken.current) return;
      setPhotoDraft(next); setPhotoMessage("미리보기를 확인한 뒤 설정 저장을 눌러 주세요.");
    }catch(e){ if(token === photoReadToken.current) setPhotoError(errMsg(e)); }
    finally{ if(token === photoReadToken.current) setPhotoBusy(false); }
  };
  const changePhoto = change => {
    setPhotoDraft(photoDraft ? {...photoDraft, ...change} : null);
    setMsg(""); setPhotoMessage("미리보기를 확인한 뒤 설정 저장을 눌러 주세요.");
  };
  const resetPhoto = () => {
    photoReadToken.current++; setPhotoBusy(false); setPhotoError(""); setPhotoDraft(null);
    setMsg(""); setPhotoMessage("설정 저장을 누르면 공통 교회 이미지로 돌아갑니다.");
  };
  const upd = (k, v) => { setC({...c, [k]: v}); setMsg(""); };

  /* 속 목록을 [번호, 시작연도, 끝연도] 형태로 다루기 쉽게 */
  const toRows = (tbl) => tbl.map((row, i) => ({
    n: row[1],
    from: i === 0 ? "" : String(tbl[i-1][0] + 1),
    to: row[0] === 9999 ? "" : String(row[0]),
  }));
  const fromRows = (rows) => rows.map((r, i) =>
    [ i === rows.length-1 ? 9999 : (Number(r.to) || 9999), i+1 ]);

  const [fRows, setFRows] = useState(toRows(c.sokF));
  const [mRows, setMRows] = useState(toRows(c.sokM));


  const saveSettings = async () => {
    if(saveLock.current || photoBusy || !homePhotoReady) return;
    saveLock.current = true; setSaving(true); setSaveError(""); setMsg("");
    try{
      const next = {...c, sokF:fromRows(fRows), sokM:fromRows(mRows)};
      await saveConfig(next, photoDraft);
    }catch(e){
      setSaveError("저장하지 못했습니다. 입력한 내용은 남아 있습니다. " + errMsg(e));
    }finally{ saveLock.current = false; setSaving(false); }
  };

  const SokTable = ({title, rows, setRows, gender}) => (
    <div style={{marginBottom:18}}>
      <h3 style={{marginBottom:4}}>{title}</h3>
      <p className="small muted" style={{marginTop:0}}>
        각 속의 <b>마지막 출생연도</b>를 적습니다. 맨 아래 속은 그 이후 전부입니다.</p>
      {rows.map((r,i)=>(
        <div className="row" key={i} style={{marginBottom:6, alignItems:"center"}}>
          <span className="chip editor" style={{minWidth:64}}>{i+1}{gender}선교회</span>
          {i===0 ? <span className="muted small">처음부터</span>
                 : <span className="muted small">{Number(rows[i-1].to)+1}년생부터</span>}
          {i===rows.length-1
            ? <span className="muted small">이후 전부</span>
            : <React.Fragment>
                <input type="number" value={r.to} style={{width:100}}
                  onChange={e=>{ const a=[...rows]; a[i]={...r, to:e.target.value}; setRows(a); setMsg(""); }}/>
                <span className="muted small">년생까지</span>
              </React.Fragment>}
          <button className="btn sm ghost" style={{marginLeft:"auto"}}
            disabled={rows.length<=1}
            onClick={()=>{ setRows(rows.filter((_,x)=>x!==i)); setMsg(""); }}>빼기</button>
        </div>))}
      <button className="btn sm" onClick={()=>{
        const a=[...rows]; const last=a[a.length-1];
        a[a.length-1] = {...last, to: String((Number(a[a.length-2]?.to)||1960)+5)};
        a.push({to:""}); setRows(a); setMsg("");
      }}>+ 속 추가</button>
    </div>
  );

  return (
    <div>
      <div className="panel">
        <h2>교회 설정</h2>
        <p className="small muted" style={{marginTop:0}}>
          교회마다 다른 부분입니다. 여기서 바꾸면 명부·출석·교회학교에 모두 반영됩니다.
          <b> 이미 등록된 교인 기록은 지워지지 않고</b>, 새 기준으로 다시 나뉘기만 합니다.</p>
        {msg && <p role="status" style={{color:"var(--pine)",fontWeight:600}}>{msg}</p>}
        {saveError && <p role="alert" className="church-settings-error">{saveError}</p>}
        {!homePhotoReady && <p role="alert" className="church-settings-error">교회 설정을 불러오지 못했습니다. 위의 다시 불러오기를 눌러 주세요.</p>}
      </div>

      <fieldset className="church-settings-fields" disabled={saving || !homePhotoReady}>
      <div className="panel church-photo-panel">
        <h2>홈 화면 교회 사진</h2>
        <p className="muted" style={{marginTop:0}}>사진은 {churchName}의 홈 화면 왼쪽에 표시됩니다. 사진을 선택하고 미리보기를 확인한 뒤 설정 저장을 눌러 주세요.</p>
        <div className="church-photo-preview">
          <ChurchHomeBanner churchName={churchName} photo={photoDraft}/>
        </div>
        <div className="church-photo-controls">
          <button type="button" className="btn" onClick={() => photoInput.current.click()}>{photoBusy ? "사진 처리 중…" : "교회 사진 선택"}</button>
          <button type="button" className="btn ghost" disabled={!photoDraft && !photoBusy} onClick={resetPhoto}>공통 이미지로 변경</button>
          <input ref={photoInput} type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
            aria-label="홈 화면 교회 사진 선택" style={{display:"none"}}
            onChange={e => { const file = e.target.files[0]; e.target.value = ""; choosePhoto(file); }}/>
        </div>
        {photoDraft && <label className="cut-white">
          <input type="checkbox" checked={cutWhite} disabled={photoBusy}
            onChange={e => {
              const on = e.target.checked;
              setCutWhite(on);
              /* 틀은 바로 없애고, 원본이 남아 있으면 흰 배경까지 지웁니다 */
              setPhotoDraft(p => p ? normalizeChurchHomePhoto({...p, cut:on}) : p);
              setMsg(""); setPhotoError("");
              if(on && lastFile.current) choosePhoto(lastFile.current, true);
              else setPhotoMessage("미리보기를 확인한 뒤 사진 저장을 눌러 주세요.");
            }}/>
          <span>사진 틀 없이 배경에 얹기
            <span className="muted small"> — 흰 테두리를 없애고, 사진 가장자리의 흰 부분도 투명하게 만듭니다</span></span>
        </label>}
        <p className="muted">JPG·PNG·WebP, 15MB 이하 · 사진은 저장하기 좋은 크기로 자동 조정됩니다.</p>
        {photoDraft && <React.Fragment>
          <div className="church-photo-options" role="group" aria-label="교회 사진 표시 방법">
            <label><input type="radio" name="church-photo-fit" checked={photoDraft.fit === "contain"} onChange={() => changePhoto({fit:"contain"})}/>전체 사진 보기</label>
            <label><input type="radio" name="church-photo-fit" checked={photoDraft.fit === "cover"} onChange={() => changePhoto({fit:"cover"})}/>사진으로 영역 채우기</label>
          </div>
          {photoDraft.fit === "cover" && <div className="church-photo-position">
            <label>좌우 위치<input type="range" min="0" max="100" value={photoDraft.x} onChange={e => changePhoto({x:Number(e.target.value)})}/></label>
            <label>상하 위치<input type="range" min="0" max="100" value={photoDraft.y} onChange={e => changePhoto({y:Number(e.target.value)})}/></label>
          </div>}
        </React.Fragment>}
        {photoError && <p role="alert" className="church-settings-error">{photoError}</p>}
        <p className="church-photo-status muted" role="status">{photoBusy ? "사진을 불러오는 중입니다…" : photoMessage || (photoDraft ? "등록된 교회 사진을 사용합니다." : "공통 교회 이미지를 사용합니다.")}</p>
        <button type="button" className="btn" disabled={photoBusy || !homePhotoReady} onClick={saveSettings}>{saving ? "저장 중…" : "설정 저장"}</button>
      </div>

      <div className="panel">
        <h2>예배 종류</h2>
        <p className="small muted" style={{marginTop:0}}>출석 체크에 나오는 예배입니다. 요일을 정하면 그 예배를 열 때 가장 가까운 날짜가 자동으로 잡힙니다.</p>
        {c.services.map((s,i)=>(
          <div className="row" key={i} style={{marginBottom:6}}>
            <input value={s.label} style={{flex:"1 1 160px"}}
              onChange={e=>{ const a=[...c.services]; a[i]={...s, label:e.target.value}; upd("services",a); }}/>
            <select value={s.dow===null?"":String(s.dow)}
              onChange={e=>{ const a=[...c.services]; a[i]={...s, dow: e.target.value===""?null:Number(e.target.value)}; upd("services",a); }}>
              <option value="">요일 없음</option>
              {["일","월","화","수","목","금","토"].map((d,x)=><option key={x} value={x}>{d}요일</option>)}
            </select>
            <button className="btn sm ghost" disabled={c.services.length<=1}
              onClick={()=>upd("services", c.services.filter((_,x)=>x!==i))}>빼기</button>
          </div>))}
        <button className="btn sm" onClick={()=>upd("services",[...c.services,
          {key:"sv"+Date.now().toString(36), label:"새 예배", dow:null}])}>+ 예배 추가</button>
      </div>

      <div className="panel">
        <h2>교회학교 부서</h2>
        <p className="small muted" style={{marginTop:0}}>
          우리가 쓰는 나이(세는 나이)입니다. 이 나이대는 속별 명부에서 빠집니다.</p>
        {c.depts.map((d,i)=>(
          <div className="row" key={i} style={{marginBottom:6, alignItems:"center"}}>
            <input value={d.label} style={{flex:"1 1 150px"}}
              onChange={e=>{ const a=[...c.depts]; a[i]={...d, label:e.target.value}; upd("depts",a); }}/>
            <input type="number" value={d.min} style={{width:78}}
              onChange={e=>{ const a=[...c.depts]; a[i]={...d, min:Number(e.target.value)}; upd("depts",a); }}/>
            <span className="muted small">세 ~</span>
            <input type="number" value={d.max} style={{width:78}}
              onChange={e=>{ const a=[...c.depts]; a[i]={...d, max:Number(e.target.value)}; upd("depts",a); }}/>
            <span className="muted small">세</span>
            <button className="btn sm ghost" style={{marginLeft:"auto"}} disabled={c.depts.length<=1}
              onClick={()=>upd("depts", c.depts.filter((_,x)=>x!==i))}>빼기</button>
          </div>))}
        <button className="btn sm" onClick={()=>upd("depts",[...c.depts,
          {key:"dp"+Date.now().toString(36), label:"새 부서", min:30, max:39}])}>+ 부서 추가</button>
      </div>

      <div className="panel">
        <h2>속회(선교회) 편성</h2>
        <div style={{marginBottom:14}}>
          {[["age","나이로 자동","성별과 출생연도로 나눔"],
            ["area","주소로 자동","주소에 든 동·구역 이름으로 나눔"],
            ["manual","직접 지정","사람마다 속을 골라 넣음"]].map(([v,t,d])=>(
            <label key={v} className="row" style={{gap:6, alignItems:"center", marginBottom:5}}>
              <input type="radio" checked={(c.sokMode||"age")===v} onChange={()=>upd("sokMode",v)}/>
              <b>{t}</b> <span className="muted small">— {d}</span>
            </label>))}
        </div>

        {(c.sokMode==="manual" || c.sokMode==="area") ? <React.Fragment>
          <p className="small muted" style={{marginTop:0}}>
            {c.sokMode==="area"
              ? <React.Fragment>속 이름과 그 속이 맡는 <b>지역</b>을 적으세요. 교인 주소에 그 지역 이름이 들어 있으면 자동으로 그 속에 들어갑니다.
                  지역은 쉼표로 여러 개 적을 수 있습니다(예: 화곡1동, 화곡2동).</React.Fragment>
              : "속 이름을 자유롭게 만드세요(예: 강서속, 화곡1구역, 등촌속). 교인 등록·수정 화면에서 각 사람의 속을 고르게 됩니다."}</p>
          {(c.sokList||[]).map((s,i)=>(
            <div key={s.id} style={{marginBottom:8, paddingBottom:8,
              borderBottom: c.sokMode==="area" ? "1px solid var(--line)" : "none"}}>
              <div className="row">
                <input value={s.name} style={{flex:"1 1 180px"}} placeholder="속 이름"
                  onChange={e=>{ const a=[...c.sokList]; a[i]={...s, name:e.target.value}; upd("sokList",a); }}/>
                <button className="btn sm ghost"
                  onClick={()=>upd("sokList", c.sokList.filter((_,x)=>x!==i))}>빼기</button>
              </div>
              {c.sokMode==="area" &&
                <div className="row" style={{marginTop:5}}>
                  <span className="muted small" style={{minWidth:38}}>지역</span>
                  <input value={(s.areas||[]).join(", ")} style={{flex:"1 1 260px"}}
                    placeholder="화곡1동, 화곡2동"
                    onChange={e=>{ const a=[...c.sokList];
                      a[i]={...s, areas:e.target.value.split(",").map(x=>x.trim()).filter(Boolean)};
                      upd("sokList",a); }}/>
                </div>}
            </div>))}
          <button className="btn sm" onClick={()=>upd("sokList",[...(c.sokList||[]),
            {id:"sk"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:"새 속", areas:[]}])}>+ 속 추가</button>
          <p className="small muted" style={{marginTop:10, marginBottom:0}}>
            {c.sokMode==="area" && <React.Fragment>주소로 못 찾은 교인은 <b>속 미지정</b>에 모입니다.
              그런 분은 교인 수정에서 속을 직접 골라 주시면 되고, <b>직접 고른 속이 주소보다 우선</b>합니다.<br/></React.Fragment>}
            속을 지우면 그 속에 있던 교인은 <b>속 미지정</b>으로 돌아갑니다. 교인 기록 자체는 그대로입니다.</p>
        </React.Fragment> : <React.Fragment>
          <SokTable title="여선교회" rows={fRows} setRows={setFRows} gender="여"/>
          <SokTable title="남선교회" rows={mRows} setRows={setMRows} gender="남"/>
          <p className="small muted" style={{marginBottom:0}}>
            교인 메모에 &lsquo;3 여선교회&rsquo;처럼 적혀 있으면 나이보다 그 기록이 우선합니다.</p>
        </React.Fragment>}
      </div>

      <div className="panel">
        <h2>직분</h2>
        <p className="small muted" style={{marginTop:0}}>교인 등록·수정에서 고를 수 있는 직분입니다. 쉼표로 구분해 적으세요.</p>
        <textarea rows="3" value={c.positions.join(", ")}
          onChange={e=>upd("positions", e.target.value.split(",").map(s=>s.trim()).filter(Boolean))}/>
        <h3>이 중 교역자로 묶을 직분</h3>
        <p className="small muted" style={{marginTop:0}}>여기 적힌 직분은 속회·교회학교에서 빠지고 &lsquo;교역자&rsquo;로 따로 모입니다.</p>
        <textarea rows="2" value={c.ministers.join(", ")}
          onChange={e=>upd("ministers", e.target.value.split(",").map(s=>s.trim()).filter(Boolean))}/>
      </div>

      <div className="panel">
        <div className="row">
          <button className="btn" disabled={photoBusy || !homePhotoReady} onClick={saveSettings}>{saving ? "저장 중…" : "설정 저장"}</button>
          <button className="btn ghost" onClick={()=>{
            const cur = currentChurchConfig();
            setC(cur); setFRows(toRows(cur.sokF)); setMRows(toRows(cur.sokM)); setMsg("");
            photoReadToken.current++; setPhotoBusy(false); setPhotoDraft(homePhoto);
            setPhotoMessage(""); setPhotoError(""); setSaveError("");
          }}>되돌리기</button>
        </div>
        {saveError && <p role="alert" className="church-settings-error">{saveError}</p>}
      </div>
      </fieldset>
    </div>
  );
}

/* ───────── 시작 화면 ───────── */
function Gate({churchName, onEnter}){
  return (

/* ───────── 달력 (교회 행사 · 생일) ───────── */
const EVENT_KINDS = [
  {key:"worship", label:"예배·집회", color:"#22355C"},
  {key:"edu",     label:"교육·훈련", color:"#3D5A80"},
  {key:"fellow",  label:"친교·행사", color:"#B8912F"},
  {key:"mission", label:"선교·봉사", color:"#7B5EA7"},
  {key:"etc",     label:"기타",      color:"#7A8A94"},
];
const kindOf = k => EVENT_KINDS.find(x=>x.key===k) || EVENT_KINDS[4];
const ymd = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

function Calendar({members, events, saveEvents, canEdit, openMember, openable}){
  const today = new Date();
  const [cur, setCur] = useState({y: today.getFullYear(), m: today.getMonth()});
  const [sel, setSel] = useState(ymd(today));
  const [form, setForm] = useState(null);   /* 편집 중인 행사 */

  const first = new Date(cur.y, cur.m, 1);
  const startPad = first.getDay();
  const days = new Date(cur.y, cur.m+1, 0).getDate();
  const move = n => {
    const d = new Date(cur.y, cur.m + n, 1);
    setCur({y:d.getFullYear(), m:d.getMonth()});
  };

  /* 날짜별 행사 (여러 날 걸친 행사는 그 기간 모든 날에) */
  const evByDate = useMemo(()=>{
    const map = {};
    (events||[]).forEach(e=>{
      if(!e.date) return;
      const end = e.endDate && e.endDate > e.date ? e.endDate : e.date;
      let d = new Date(e.date + "T00:00:00");
      const last = new Date(end + "T00:00:00");
      let guard = 0;
      while(d <= last && guard++ < 400){
        const k = ymd(d);
        (map[k] = map[k] || []).push(e);
        d.setDate(d.getDate()+1);
      }
    });
    return map;
  }, [events]);

  /* 이 달 생일 (연도 무관, 월·일만) */
  const birthdayOf = useMemo(()=>{
    const map = {};
    (members||[]).forEach(m=>{
      if(!m.birth || isDeceased(m)) return;
      const md = m.birth.slice(5);            /* MM-DD */
      (map[md] = map[md] || []).push(m);
    });
    return map;
  }, [members]);

  const monthBirthdays = useMemo(()=>{
    const mm = String(cur.m+1).padStart(2,"0");
    const out = [];
    Object.keys(birthdayOf).filter(md=>md.slice(0,2)===mm).sort().forEach(md=>{
      birthdayOf[md].forEach(m=>out.push({day:Number(md.slice(3)), m}));
    });
    return out.sort((a,b)=>a.day-b.day);
  }, [birthdayOf, cur.m]);

  const selEvents = evByDate[sel] || [];
  const selBirth = birthdayOf[sel.slice(5)] || [];

  const blank = {id:"", date:sel, endDate:"", title:"", place:"", note:"", kind:"worship"};
  const submit = () => {
    if(!form.title.trim() || !form.date) return;
    const e = {...form, title:form.title.trim()};
    if(e.id) saveEvents((events||[]).map(x=>x.id===e.id ? e : x));
    else saveEvents([...(events||[]), {...e, id:uid()}]);
    setForm(null);
  };
  const removeEvent = id => {
    if(confirm("이 행사를 지울까요?")) saveEvents((events||[]).filter(x=>x.id!==id));
    setForm(null);
  };

  const cells = [];
  for(let i=0;i<startPad;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);

  return (
    <div>
      <div className="panel">
        <div className="row" style={{alignItems:"center", gap:8}}>
          <button className="btn sm ghost" onClick={()=>move(-1)}>‹</button>
          <h2 style={{margin:0}}>{cur.y}년 {cur.m+1}월</h2>
          <button className="btn sm ghost" onClick={()=>move(1)}>›</button>
          <button className="btn sm ghost" onClick={()=>{
            setCur({y:today.getFullYear(), m:today.getMonth()}); setSel(ymd(today));
          }}>오늘</button>
          {canEdit && <button className="btn sm" style={{marginLeft:"auto"}}
            onClick={()=>setForm({...blank, date:sel})}>+ 행사 추가</button>}
        </div>

        <div className="cal-grid" style={{marginTop:12}}>
          {["일","월","화","수","목","금","토"].map((w,i)=>(
            <div key={w} className={"cal-wd"+(i===0?" sun":i===6?" sat":"")}>{w}</div>))}
          {cells.map((d,i)=>{
            if(d===null) return <div key={"b"+i} className="cal-cell empty"/>;
            const key = cur.y + "-" + String(cur.m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
            const evs = evByDate[key] || [];
            const bds = birthdayOf[key.slice(5)] || [];
            const isToday = key === ymd(today);
            const dow = (startPad + d - 1) % 7;
            return (
              <div key={key}
                className={"cal-cell"+(sel===key?" sel":"")+(isToday?" today":"")}
                onClick={()=>setSel(key)}>
                <div className={"dnum"+(dow===0?" sun":dow===6?" sat":"")}>{d}</div>
                {evs.slice(0,3).map(e=>(
                  <div key={e.id} className="cal-ev" style={{background:kindOf(e.kind).color}}>{e.title}</div>))}
                {evs.length>3 && <div className="cal-more">+{evs.length-3}</div>}
                {bds.length>0 && <div className="cal-bd">🎂 {bds.length>1 ? bds.length+"명" : bds[0].name}</div>}
              </div>);
          })}
        </div>
        <div className="row small muted" style={{gap:10, marginTop:10, flexWrap:"wrap"}}>
          {EVENT_KINDS.map(k=>(
            <span key={k.key} className="row" style={{gap:4, alignItems:"center"}}>
              <span style={{width:10,height:10,borderRadius:3,background:k.color,display:"inline-block"}}/>{k.label}
            </span>))}
          <span>🎂 생일</span>
        </div>
      </div>

      {form && canEdit &&
        <div className="panel">
          <h2>{form.id ? "행사 고치기" : "새 행사"}</h2>
          <div className="field"><label>행사 이름</label>
            <input value={form.title} onChange={e=>setForm({...form, title:e.target.value})}
              placeholder="예) 추수감사주일, 여름성경학교"/></div>
          <div className="row">
            <div className="field" style={{flex:"1 1 150px"}}><label>시작</label>
              <input type="date" value={form.date} onChange={e=>setForm({...form, date:e.target.value})}/></div>
            <div className="field" style={{flex:"1 1 150px"}}><label>끝 <span className="muted small">(하루면 비워 두세요)</span></label>
              <input type="date" value={form.endDate} onChange={e=>setForm({...form, endDate:e.target.value})}/></div>
            <div className="field" style={{flex:"1 1 130px"}}><label>구분</label>
              <select value={form.kind} onChange={e=>setForm({...form, kind:e.target.value})}>
                {EVENT_KINDS.map(k=><option key={k.key} value={k.key}>{k.label}</option>)}
              </select></div>
          </div>
          <div className="field"><label>장소 · 시간</label>
            <input value={form.place} onChange={e=>setForm({...form, place:e.target.value})}
              placeholder="예) 본당 오전 11시"/></div>
          <div className="field"><label>메모</label>
            <textarea rows="2" value={form.note} onChange={e=>setForm({...form, note:e.target.value})}/></div>
          <div className="row" style={{gap:6}}>
            <button className="btn" disabled={!form.title.trim()} onClick={submit}>저장</button>
            <button className="btn ghost" onClick={()=>setForm(null)}>취소</button>
            {form.id && <button className="btn sm danger" style={{marginLeft:"auto"}}
              onClick={()=>removeEvent(form.id)}>삭제</button>}
          </div>
        </div>}

      <div className="panel">
        <h2>{Number(sel.slice(5,7))}월 {Number(sel.slice(8))}일
          <span className="muted small"> {["일","월","화","수","목","금","토"][new Date(sel+"T00:00:00").getDay()]}요일</span></h2>
        {selEvents.length===0 && selBirth.length===0
          ? <p className="empty" style={{marginTop:8}}>이 날은 등록된 행사가 없습니다.</p>
          : <React.Fragment>
              {selEvents.map(e=>(
                <div key={e.id} className="cal-item">
                  <span className="dot" style={{background:kindOf(e.kind).color}}/>
                  <div style={{flex:1}}>
                    <b>{e.title}</b>
                    {e.endDate && e.endDate>e.date &&
                      <span className="muted small"> ({e.date.slice(5).replace("-","/")}~{e.endDate.slice(5).replace("-","/")})</span>}
                    {e.place && <div className="muted small">{e.place}</div>}
                    {e.note && <div className="small" style={{whiteSpace:"pre-wrap"}}>{e.note}</div>}
                  </div>
                  {canEdit && <button className="btn sm ghost" onClick={()=>setForm(e)}>고치기</button>}
                </div>))}
              {selBirth.map(m=>(
                <div key={m.id} className="cal-item">
                  <span className="dot" style={{background:"#D9762A"}}/>
                  <div style={{flex:1}}>
                    <b>🎂 {m.name}</b> <span className="muted small">{m.position}
                      {m.birth && " · " + Number(m.birth.slice(0,4)) + "년생 (" + (new Date().getFullYear()-Number(m.birth.slice(0,4))+1) + "세)"}</span>
                    {m.phone && <div className="muted small">{m.phone}</div>}
                  </div>
                  {openable !== false &&
                    <button className="btn sm ghost" onClick={()=>openMember(m.id)}>기록 보기</button>}
                </div>))}
            </React.Fragment>}
      </div>

      <div className="panel">
        <h2>{cur.m+1}월 생일 <span className="muted small">{monthBirthdays.length}명</span></h2>
        {monthBirthdays.length===0
          ? <p className="empty" style={{marginTop:8}}>이 달에 생일이신 분이 없습니다.</p>
          : <div className="mem-list" style={{marginTop:8}}>
              {monthBirthdays.map(({day,m})=>(
                <button key={m.id} className="bd-card"
                  onClick={()=>{ if(openable !== false) openMember(m.id); }}>
                  <span className="bd-day">{day}일</span>
                  <span className="bd-name">{m.name}</span>
                  <span className="muted small">{m.position}</span>
                </button>))}
            </div>}
      </div>
    </div>
  );
}

/* ───────── 심방 전체 ───────── */
function Visits({members, update, openMember, canEdit, meName, meId}){
  const [memId, setMemId] = useState("");
  const [when, setWhen] = useState(nowLocal());
  const [purpose, setPurpose] = useState("정기심방");
  const [note, setNote] = useState("");

  const all = members.flatMap(m => (m.visits||[]).map(v=>({...v, memId:m.id, memName:m.name})))
    .sort((a,b)=>(b.when||"").localeCompare(a.when||""));

  return (
    <div>
      {canEdit && <div className="panel">
        <h2>새 심방 기록</h2>
        {members.length===0 ? <p className="empty">먼저 교인을 등록해 주세요.</p> :
        <div>
          <div className="row">
            <select value={memId} onChange={e=>setMemId(e.target.value)} style={{minWidth:140}}>
              <option value="">교인 선택…</option>
              {[...members].sort(koSort).map(m=><option key={m.id} value={m.id}>{m.name} ({m.position})</option>)}
            </select>
            <input type="datetime-local" value={when} onChange={e=>setWhen(e.target.value)}/>
            <select value={purpose} onChange={e=>setPurpose(e.target.value)}>
              {PURPOSES.map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          <div className="row" style={{marginTop:8}}>
            <input placeholder="내용 (선택)" value={note} onChange={e=>setNote(e.target.value)} style={{flex:"1 1 220px"}}/>
            <button className="btn" disabled={!memId || !when} onClick={()=>{
              update(memId, o=>({...o, visits:[...(o.visits||[]),
                {id:uid(), when, purpose, note:note.trim(), by: meName, byId: meId}]}));
              setNote(""); setWhen(nowLocal());
            }}>기록 추가</button>
          </div>
        </div>}
      </div>}

      <div className="panel">
        <h2>심방 기록 전체 <span className="muted small">{all.length}건</span></h2>
        {all.length===0 ? <p className="empty">아직 심방 기록이 없습니다.</p> :
          <div className="tbl-wrap"><table>
            <thead><tr><th>일시</th><th>교인</th><th>목적</th><th>내용</th><th></th></tr></thead>
            <tbody>{all.map(v=>(
              <tr key={v.id}>
                <td style={{whiteSpace:"nowrap"}}>{fmtDT(v.when)}
                  {v.by && <div className="muted small">{v.by}</div>}</td>
                <td className="nw"><button className="btn sm ghost" style={{whiteSpace:"nowrap"}}
                  onClick={()=>openMember(v.memId)}>{v.memName}</button></td>
                <td><span className="chip pos">{v.purpose}</span></td>
                <td style={{whiteSpace:"pre-wrap"}}>{v.note}</td>
                <td>{canEdit && <button className="btn sm danger" onClick={()=>{
                  if(confirm("이 심방 기록을 삭제할까요?"))
                    update(v.memId, o=>({...o, visits:o.visits.filter(x=>x.id!==v.id)}));
                }}>삭제</button>}</td>
              </tr>))}
            </tbody></table></div>}
      </div>
    </div>
  );
}

/* ───────── 중보기도 전체 ───────── */
function Prayers({members, update, openMember, canEdit, seeSecret, openable, meName, meId}){
  const [filter, setFilter] = useState("open");
  const [kind, setKind] = useState("all");     /* all | normal | secret */
  const [memId, setMemId] = useState("");
  const [req, setReq] = useState("");
  const [secret, setSecret] = useState(false);

  const all = members.flatMap(m => (m.prayers||[]).map(p=>({...p, memId:m.id, memName:m.name})))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const list = all.filter(p => (filter==="all" || p.status===filter)
    && (seeSecret || !p.secret)
    && (kind==="all" || (kind==="secret" ? !!p.secret : !p.secret)));
  const openN = all.filter(p=>p.status==="open").length;

  return (
    <div>
      {canEdit && <div className="panel">
        <h2>새 기도 요청</h2>
        {members.length===0 ? <p className="empty">먼저 교인을 등록해 주세요.</p> :
        <div className="row">
          <select value={memId} onChange={e=>setMemId(e.target.value)} style={{minWidth:140}}>
            <option value="">교인 선택…</option>
            {[...members].sort(koSort).map(m=><option key={m.id} value={m.id}>{m.name} ({m.position})</option>)}
          </select>
          <input placeholder="기도 요청 사항" value={req} onChange={e=>setReq(e.target.value)} style={{flex:"1 1 220px"}}/>
          <button className="btn" disabled={!memId || !req.trim()} onClick={()=>{
            update(memId, o=>({...o, prayers:[...(o.prayers||[]),
              {id:uid(), date:todayStr(), request:req.trim(), status:"open", answeredDate:"",
               secret, by: meName, byId: meId}]}));
            setReq(""); setSecret(false);
          }}>추가</button>
        </div>}
        {members.length>0 &&
          <label className="row small" style={{gap:6, marginTop:8, alignItems:"center"}}>
            <input type="checkbox" checked={secret} onChange={e=>setSecret(e.target.checked)}/>
            <b>긴밀 중보기도</b>
            <span className="muted">— 목회자와 관리자만 볼 수 있습니다. 속장·교사에게는 보이지 않습니다.</span>
          </label>}
      </div>}

      <div className="panel">
        <div className="row" style={{justifyContent:"space-between"}}>
          <h2 style={{margin:0}}>중보기도 <span className="muted small">요청중 {openN}건</span></h2>
          <div className="row" style={{gap:8}}>
            <div className="svc-tabs" style={{margin:0}}>
              {[["all","일반+긴밀"],["normal","일반"],["secret","긴밀"]].map(([k,l])=>(
                <button key={k} className={kind===k?"on":""} onClick={()=>setKind(k)}>{l}</button>))}
            </div>
            <div className="svc-tabs" style={{margin:0}}>
              {[["open","요청중"],["answered","응답"],["all","전체"]].map(([k,l])=>(
                <button key={k} className={filter===k?"on":""} onClick={()=>setFilter(k)}>{l}</button>))}
            </div>
          </div>
        </div>
        {list.length===0 ? <p className="empty">해당하는 기도 제목이 없습니다.</p> :
          <div className="tbl-wrap" style={{marginTop:12}}><table>
            <thead><tr><th>요청일</th><th>교인</th><th>기도 제목</th><th>상태</th><th></th></tr></thead>
            <tbody>{list.map(p=>(
              <tr key={p.id}>
                <td style={{whiteSpace:"nowrap"}}>{p.date}
                  {p.by && <div className="muted small">{p.by}</div>}</td>
                <td className="nw"><button className="btn sm ghost" style={{whiteSpace:"nowrap"}}
                  onClick={()=>{ if(openable !== false) openMember(p.memId); }}>{p.memName}</button></td>
                <td style={{whiteSpace:"pre-wrap"}}>
                  {p.secret && <span className="chip secret" style={{marginRight:6}}>긴밀</span>}
                  {p.request}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  {p.status==="answered"
                    ? <span className="chip ans">응답 {p.answeredDate && `(${p.answeredDate})`}</span>
                    : <span className="chip open">요청중</span>}
                </td>
                <td style={{whiteSpace:"nowrap"}}>
                  {canEdit && <React.Fragment>
                  <button className="btn sm ghost" onClick={()=>update(p.memId, o=>({...o, prayers:o.prayers.map(x=>
                    x.id===p.id ? (x.status==="answered" ? {...x,status:"open",answeredDate:""} : {...x,status:"answered",answeredDate:todayStr()}) : x)}))}>
                    {p.status==="answered" ? "요청중으로" : "응답 체크"}
                  </button>{" "}
                  <button className="btn sm ghost" onClick={()=>update(p.memId, o=>({...o, prayers:o.prayers.map(x=>
                    x.id===p.id ? {...x, secret: !x.secret} : x)}))}>
                    {p.secret ? "일반으로" : "긴밀로"}
                  </button>{" "}
                  <button className="btn sm danger" onClick={()=>{
                    if(confirm("이 기도 제목을 삭제할까요?"))
                      update(p.memId, o=>({...o, prayers:o.prayers.filter(x=>x.id!==p.id)}));
                  }}>삭제</button>
                  </React.Fragment>}
                </td>
              </tr>))}
            </tbody></table></div>}
      </div>
    </div>
  );
}

/* 오류가 나면 흰 화면 대신 내용을 보여 줍니다 */
function showFatal(msg){
  const el = document.getElementById("root");
  if(!el) return;
  el.innerHTML =
    '<div style="max-width:640px;margin:40px auto;padding:22px;background:#fff;'
    + 'border:1px solid #D3D9E4;border-radius:14px;font-family:sans-serif;line-height:1.7">'
    + '<h2 style="margin:0 0 10px;color:#16223D">화면을 여는 중 문제가 생겼습니다</h2>'
    + '<p style="color:#63708A;font-size:14px;margin:0 0 12px">아래 내용을 그대로 알려 주시면 고쳐 드리겠습니다.</p>'
    + '<pre style="white-space:pre-wrap;word-break:break-all;background:#F4F5F8;padding:12px;'
    + 'border-radius:10px;font-size:12.5px;color:#8E3826">' + String(msg) + '</pre>'
    + '<button onclick="try{localStorage.clear()}catch(e){};location.reload()" '
    + 'style="margin-top:12px;padding:9px 16px;border-radius:11px;border:1px solid #22355C;'
    + 'background:#22355C;color:#fff;font-weight:600">저장된 설정 지우고 다시 열기</button>'
    + '</div>';
}
window.addEventListener("error", e => showFatal((e.error && e.error.stack) || e.message));
window.addEventListener("unhandledrejection", e => showFatal(
  (e.reason && (e.reason.stack || e.reason.message)) || e.reason));

class Guard extends React.Component {
  constructor(p){ super(p); this.state = {}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ showFatal(err && (err.stack || err.message)); }
  render(){ return this.state.err ? null : this.props.children; }
}

try{
  ReactDOM.createRoot(document.getElementById("root")).render(<Guard><Root/></Guard>);
}catch(e){ showFatal(e && (e.stack || e.message)); }
</script>
</body>
