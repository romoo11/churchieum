<title>교우이음 — 교인 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root{
    --paper:#F4F5F8; --card:#FFFFFF; --ink:#1E2635; --muted:#63708A;
    --pine:#22355C; --pine-deep:#16223D; --pine-soft:#E3E8F2;
    --gold:#C29B3C; --gold-soft:#F4EAD2;
    --blue:#3D5A80; --clay:#A8442F; --clay-soft:#F4E2DC;
    --line:#D3D9E4;
  }
  /* 부서·속 머리표 (아이콘 배지) */
  .dept-head{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:12px;
    color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.10);margin-bottom:10px}
  .dept-head .ico{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.24);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .dept-head .nm{font-family:"Gowun Batang","Noto Sans KR",serif;font-size:17px;font-weight:700}
  .dept-head .ct{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 10px;font-size:12.5px}
  .dept-head .sp{margin-left:auto;display:flex;gap:6px}
  .dept-head button{border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:4px 11px;
    background:linear-gradient(180deg,#FFFFFF 0%,#EEF2F8 55%,#DDE4EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 1px 3px rgba(0,0,0,.22);
    font-size:13px;color:#1E2635;font-weight:600}
  .dept-head button:hover{background:#fff}
  /* 반 머리표 */
  .cls-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 13px;border-radius:11px;
    border:1px solid #BFCADE;border-left:5px solid var(--pine);
    background:linear-gradient(180deg,#F4F7FC 0%,#E6ECF6 55%,#D9E1EE 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(34,53,92,.10)}
  .cls-head .nm{font-weight:700;font-size:15px;color:var(--pine-deep)}
  .cls-head .ct{color:var(--muted);font-size:12.5px}
  .cls-head .btn.sm{margin-left:auto}
  .cls-head.none{background:#EBEEF4;border-left-color:#AEB6C6}
  .cls-head.none .nm{color:#63708A}
  .chip.secret{background:#7E2F20;color:#fff}
  td.nw, th.nw{white-space:nowrap}
  .rw{display:inline-flex;border:1px solid #BAC5D9;border-radius:9px;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
  .rw-b{border:none;background:linear-gradient(180deg,#FFFFFF,#E9EDF4);color:#5C6B85;
    font-size:11.5px;font-weight:600;padding:3px 9px;line-height:1.4}
  .rw-b+.rw-b{border-left:1px solid #BAC5D9}
  .rw-b.on{background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 44%,#B8912F 100%);
    color:#33280B;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .able{margin-top:5px;white-space:normal;max-width:280px;line-height:1.5}
  .able span{display:block;font-size:11.5px}
  .able-yes{color:var(--pine)}
  .able-no{color:#8A6A2E}
  .scope-col{min-width:230px}
  .scope-row{display:flex;align-items:center;gap:5px;margin-bottom:5px}
  .scope-row .chip{white-space:nowrap}
  .scope-col select{max-width:230px}
  .svc-add{border:1.5px dashed #7A8CB0;border-radius:999px;padding:7px 15px;
    font-weight:600;color:var(--pine);text-shadow:0 1px 0 rgba(255,255,255,.85);
    background:linear-gradient(180deg,#FFFFFF 0%,#F2F5FA 48%,#E2E8F2 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.10)}
  .svc-add:hover{filter:brightness(1.04)}
  .svc-past{border:1px solid #C3CBDB;border-radius:999px;padding:7px 15px;
    font-weight:600;color:var(--muted);text-shadow:0 1px 0 rgba(255,255,255,.8);
    background:linear-gradient(180deg,#FAFBFD 0%,#EBEEF5 48%,#DDE2EC 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 4px rgba(34,53,92,.10)}
  .svc-past:hover{filter:brightness(1.04)}
  .sp-past-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#EDEFF5;
    border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .sp-note{display:flex;align-items:center;gap:8px;background:#F1EDF6;border-left:5px solid #7B5EA7;
    border-radius:10px;padding:9px 14px;margin-bottom:12px;flex-wrap:wrap}
  /* 시작 화면 */
  .gate{position:fixed;inset:0;z-index:50;background:#153161;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .gate-art{position:relative;line-height:0;flex:0 0 auto;
    width:min(100vw, calc(100vh * 1448 / 1086));aspect-ratio:1448 / 1086}
  .gate-art img{display:block;width:100%;height:100%}
  /* 로고 아래 빈 자리 (60% ~ 90%) */
  .gate-over{position:absolute;left:0;right:0;top:61%;
    display:flex;flex-direction:column;align-items:center;line-height:1.35;text-align:center}
  .gate-church{font-family:"Gowun Batang","Noto Sans KR",serif;color:#fff;font-weight:700;
    font-size:clamp(17px,2.5vw,32px);letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .gate-app{margin-top:.35em;font-family:"Gowun Batang","Noto Sans KR",serif;
    color:#C7D6EE;font-size:clamp(12px,1.55vw,20px);letter-spacing:7px;
    text-indent:7px;font-weight:700}
  .gate-tag{margin-top:.5em;color:#93A8C9;font-size:clamp(9px,1.05vw,13.5px);
    letter-spacing:.3px}
  .gate-btn{margin-top:1.5em;background:rgba(255,255,255,.10);color:#fff;
    border:1.5px solid rgba(255,255,255,.8);border-radius:999px;
    padding:0.72em 2.6em;font-size:clamp(11px,1.35vw,17px);font-weight:700;letter-spacing:2px;
    font-family:"Gowun Batang","Noto Sans KR",serif;line-height:1;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 4px 16px rgba(0,0,0,.3);transition:background .15s, transform .08s}
  .gate-btn:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
  .gate-btn:active{transform:translateY(1px)}
  .gate-foot{position:absolute;left:0;right:0;bottom:4%;text-align:center;
    color:#7E93B6;font-size:clamp(8px,.92vw,12px);line-height:1.8}
  .gate-foot b{color:#B9C9E4;font-family:"Gowun Batang","Noto Sans KR",serif;letter-spacing:1.5px}
  /* 세로 화면에서는 가운데를 키워 글씨가 읽히게 */
  /* 글씨는 화면 밖으로 나가지 않게 */
  .gate-church,.gate-app,.gate-tag,.gate-btn{max-width:90vw}
  .gate-tag{padding:0 4px}
  .gate-foot{padding:0 10px}
  @media (max-aspect-ratio: 1/1){
    .gate-art{width:min(205vw, calc(100vh * 1448 / 1086))}
    .gate-church{font-size:clamp(19px,5.4vw,30px)}
    .gate-app{font-size:clamp(13px,3.4vw,20px);letter-spacing:5px;text-indent:5px}
    .gate-tag{font-size:clamp(10px,2.5vw,14px)}
    .gate-btn{font-size:clamp(12px,3vw,16px);margin-top:1.2em}
    .gate-foot{font-size:clamp(9px,2.1vw,12px);bottom:6%}
  }
  .app-copy{display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--muted);font-size:11.5px;padding:26px 12px 34px;line-height:1.6;text-align:left}
  .app-copy span{opacity:.75}
  .ch-row{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:7px;
    border:1px solid #BAC5D9;border-radius:12px;
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);

const readPhoto = (file) => new Promise((resolve, reject)=>{
  const r = new FileReader();
  r.onerror = () => reject(new Error("read"));
  r.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("img"));
    img.onload = () => {
      const max = 480;
      let w = img.width, h = img.height;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

function normalizeChurchHomePhoto(value){
  if(value === null || value === undefined) return null;
  if(typeof value !== "object" || value.version !== 1 ||
     typeof value.dataUrl !== "string" || value.dataUrl.length > CHURCH_HOME_PHOTO_LIMIT ||
     !/^data:image\/(jpeg|png);base64,[A-Za-z0-9+/]+={0,2}$/.test(value.dataUrl)){
    throw new Error("저장된 교회 사진 형식을 확인할 수 없습니다.");
  }
  const position = n => Number.isFinite(n) ? Math.min(100, Math.max(0, n)) : 50;
  return {version:1, dataUrl:value.dataUrl, fit:value.fit === "cover" ? "cover" : "contain",
          x:position(value.x), y:position(value.y), cut: value.cut === true};
}

function parseChurchHomePhoto(rows){
  const row = (rows || []).find(r => r.key === CHURCH_HOME_PHOTO_KEY);
  return row ? normalizeChurchHomePhoto(JSON.parse(row.value)) : null;
}

/* 가장자리에서 번져 들어가며 흰 배경만 지웁니다 (그림 안쪽 흰색은 남김) */
function eraseWhiteBackground(ctx, w, h){
  const im = ctx.getImageData(0, 0, w, h);
  const d = im.data;
  const near = i => d[i] > 228 && d[i+1] > 228 && d[i+2] > 228;
  const seen = new Uint8Array(w * h);
  const stack = [];
  for(let x = 0; x < w; x++){ stack.push(x); stack.push((h-1)*w + x); }
  for(let y = 0; y < h; y++){ stack.push(y*w); stack.push(y*w + w - 1); }
  while(stack.length){
    const p = stack.pop();
    if(p < 0 || p >= w*h || seen[p]) continue;
    const i = p * 4;
    if(!near(i)) continue;
    seen[p] = 1; d[i+3] = 0;
    const x = p % w, y = (p - x) / w;
    if(x > 0) stack.push(p - 1);
    if(x < w-1) stack.push(p + 1);
    if(y > 0) stack.push(p - w);
    if(y < h-1) stack.push(p + w);
  }
  /* 가장자리 톱니를 부드럽게 */
  for(let p = 0; p < w*h; p++){
    if(seen[p]) continue;
    const i = p * 4;
    if(!near(i)) continue;
    const x = p % w, y = (p - x) / w;
    let open = 0;
    if(x > 0 && seen[p-1]) open++;
    if(x < w-1 && seen[p+1]) open++;
    if(y > 0 && seen[p-w]) open++;
    if(y < h-1 && seen[p+w]) open++;
    if(open) d[i+3] = Math.round(255 * (1 - open / 4));
  }
  ctx.putImageData(im, 0, 0);
}

function readChurchHomePhoto(file, cut){
  return new Promise((resolve, reject) => {
    if(!file || !["image/jpeg", "image/png", "image/webp"].includes(file.type)){
      reject(new Error("JPG, PNG, WebP 사진을 선택해 주세요. HEIC 사진은 JPG로 바꾼 뒤 올려 주세요.")); return;
    }
    if(file.size > 15 * 1024 * 1024){
      reject(new Error("사진은 15MB 이하로 선택해 주세요.")); return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("사진을 열 수 없습니다. 다른 사진으로 다시 시도해 주세요.")); };
    img.onload = () => {
      try{
        if(!img.naturalWidth || !img.naturalHeight) throw new Error("사진 크기를 확인할 수 없습니다.");
        const canvas = document.createElement("canvas");
        const scale = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        const ctx = canvas.getContext("2d");
        if(!ctx) throw new Error("이 브라우저에서 사진을 처리할 수 없습니다.");
        let dataUrl = "";
        for(let attempt = 0; attempt < 7; attempt++){
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if(!cut){ ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          if(cut){
            eraseWhiteBackground(ctx, canvas.width, canvas.height);
            dataUrl = canvas.toDataURL("image/png");
          } else {
            dataUrl = canvas.toDataURL("image/jpeg", Math.max(.55, .85 - attempt * .08));
          }
          if(dataUrl.length <= CHURCH_HOME_PHOTO_LIMIT) break;
          canvas.width = Math.max(1, Math.round(canvas.width * (cut ? .75 : .8)));
          canvas.height = Math.max(1, Math.round(canvas.height * (cut ? .75 : .8)));
        }
        if(dataUrl.length > CHURCH_HOME_PHOTO_LIMIT)
          throw new Error("배경을 지운 사진이 너무 큽니다. 조금 작은 사진으로 올려 주세요.");
        resolve(normalizeChurchHomePhoto({version:1, dataUrl, fit:"contain", x:50, y:50, cut: !!cut}));
      }catch(e){ reject(e); }
      finally{ URL.revokeObjectURL(url); }
    };
    img.src = url;
  });
}

async function persistChurchSettings(sb, churchId, role, nextConfig, nextPhoto){
  if(role !== "admin" || typeof churchId !== "string" || !churchId.trim()){
    throw new Error("교회 관리자만 설정과 사진을 저장할 수 있습니다.");
  }
  const photo = normalizeChurchHomePhoto(nextPhoto);
  // 한 요청으로 함께 저장하여 설정만 바뀌거나 사진만 바뀌는 일을 막습니다.
  const {data, error} = await sb.from("settings").upsert([
    {church_id:churchId, key:"churchConfig", value:JSON.stringify(nextConfig)},
    {church_id:churchId, key:CHURCH_HOME_PHOTO_KEY, value:JSON.stringify(photo)},
  ]).select("key");
  if(error) throw error;
  if(!data || !["churchConfig", CHURCH_HOME_PHOTO_KEY].every(key => data.some(row => row.key === key))){
    throw new Error("저장 결과를 확인하지 못했습니다. 다시 저장해 주세요.");
  }
  return photo;
}

function ChurchHomeBanner({churchName, photo}){
  const [failed, setFailed] = useState(false);
  useEffect(() => { setFailed(false); }, [photo && photo.dataUrl]);
  const custom = photo && !failed;
  return <div className="hero church-home-banner">
    <img className="church-home-background" src={CHURCH_HOME_BACKGROUND} alt="" width="1400" height="787"/>
    <div className={"church-photo-slot" + (custom && photo.cut ? " cut-out" : "")}>
      <img src={custom ? photo.dataUrl : CHURCH_HOME_DEFAULT_PHOTO}
        alt={custom ? `${churchName} 교회 사진` : "공통 교회 이미지"}
        style={{objectFit:custom ? photo.fit : "cover", objectPosition:custom ? `${photo.x}% ${photo.y}%` : "center"}}
        onError={() => { if(custom) setFailed(true); }}/>
    </div>
    <div className="hero-text">
      <h1>{churchName} 교인 관리</h1>
      <p>한 사람 한 사람을 기억하고 돌보기 위한 목양 수첩</p>
    </div>
  </div>;
}

const nowLocal = () => { const d = new Date(); return `${todayStr()}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WEEKDAYS = ["일","월","화","수","목","금","토"];
const weekdayOf = ds => { const d = new Date(ds + "T00:00:00"); return isNaN(d) ? "" : WEEKDAYS[d.getDay()]; };
const lastWeekday = (dow) => {
  const d = new Date(); const diff = (d.getDay() - dow + 7) % 7;
  d.setDate(d.getDate() - diff);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const koAge = birth => {
  if (!birth) return null;
  const y = parseInt(String(birth).slice(0,4), 10);
  if (!y) return null;
  return new Date().getFullYear() - y + 1;
};
const calcAge = birth => {
  if (!birth) return null;
  const b = new Date(birth + "T00:00:00"); if (isNaN(b)) return null;
  const t = new Date(); let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a;
};
const fmtDT = v => {
  if (!v) return "";
  const [d, t] = v.split("T");
  return t ? `${d} (${weekdayOf(d)}) ${t}` : `${d} (${weekdayOf(d)})`;
};

/* 교회학교 부서 (현재 나이 기준). 이 나이대는 속별 명부에서 제외됨 */
let SCHOOL_DEPTS = [
  {key:"kinder", label:"유치부 (5~7세)", min:5, max:7},
  {key:"child", label:"아동부 (8~13세)", min:8, max:13},
  {key:"youth", label:"중고등부 (14~19세)", min:14, max:19},
  {key:"young", label:"청년부 (20~29세)", min:20, max:29},
];
/* 교회학교 최고 나이 이하는 속 편성에서 제외 (현재 29세 이하) */
const schoolMaxAge = () => Math.max(...SCHOOL_DEPTS.map(s=>s.max));

let MINISTERS = ["담임목사","부목사","전도사"];   /* 교역자 — 속·부서와 별도로 묶음 */
const isMinister = m => MINISTERS.includes(m && m.position);
const isSamo = m => (m && m.position) === "사모";   /* 사모 — 속회와 별도 항목 */
/* 청년(직분이 '청년'이거나 메모에 청년부)은 나이와 상관없이 청년부 */
const isYoungAdult = m => (m && m.position) === "청년" || /청년부/.test((m && m.memo) || "");

/* 속 편성 방식
   "age"    = 나이·성별로 자동
   "manual" = 속 이름을 만들고 사람마다 지정
   "area"   = 주소에 든 지역 이름으로 자동 (사람마다 직접 지정도 가능) */
let SOK_MODE = "age";
/* 직접 지정·주소 방식일 때 쓰는 속 목록 [{id, name, areas:["화곡1동","화곡2동"]}] */
let SOK_LIST = [];

let SOK_F = [[1948,1],[1954,2],[1958,3],[1962,4],[1968,5],[1973,6],[9999,7]];
let SOK_M = [[1954,1],[1967,2],[9999,3]];   /* 1남 ~1954 · 2남 1955~1967 · 3남 1968~ */

/* 지금 설정을 그대로 꺼내기 (설정 화면에서 사용) */
const currentChurchConfig = () => ({
  sokMode: SOK_MODE,
  sokList: SOK_LIST.map(s=>({...s})),
  services: SERVICES.map(s=>({...s})),
  positions: [...POSITIONS],
  ministers: [...MINISTERS],
  depts: SCHOOL_DEPTS.map(d=>({...d})),
  sokF: SOK_F.map(x=>[...x]),
  sokM: SOK_M.map(x=>[...x]),
});
/* 설정을 프로그램에 적용 */
const applyChurchConfig = (c) => {
  if(!c) return;
  if(c.sokMode === "age" || c.sokMode === "manual" || c.sokMode === "area") SOK_MODE = c.sokMode;
  if(Array.isArray(c.sokList)) SOK_LIST = c.sokList;
  if(Array.isArray(c.services) && c.services.length) SERVICES = c.services;
  if(Array.isArray(c.positions) && c.positions.length) POSITIONS = c.positions;
  if(Array.isArray(c.ministers)) MINISTERS = c.ministers;
  if(Array.isArray(c.depts) && c.depts.length) SCHOOL_DEPTS = c.depts;
  if(Array.isArray(c.sokF) && c.sokF.length) SOK_F = c.sokF;
  if(Array.isArray(c.sokM) && c.sokM.length) SOK_M = c.sokM;
};
/* 속 개수에 맞춰 이름표 만들기 */
const sokCount = g => (g==="여" ? SOK_F : SOK_M).length;
/* 설정된 속 개수에 맞춘 키 목록: 남1..남n, 여1..여m */
const sokKeys = () => (SOK_MODE === "manual" || SOK_MODE === "area")
  ? SOK_LIST.map(s=>s.id)
  : [ ...SOK_M.map((_,i)=>"남"+(i+1)), ...SOK_F.map((_,i)=>"여"+(i+1)) ];
/* 키 하나의 이름표 */
const sokKeyLabel = k => (SOK_MODE === "manual" || SOK_MODE === "area")
  ? ((SOK_LIST.find(s=>s.id===k)||{}).name || "속 미지정")
  : sokLabel({g:k[0], n:Number(k.slice(1))});
function sokOf(m){
  if(isMinister(m) || isSamo(m) || isYoungAdult(m)) return null;   /* 교역자·사모·청년은 속 편성 제외 */

  if(SOK_MODE === "manual" || SOK_MODE === "area"){
    /* 사람에게 직접 지정한 속이 있으면 그것이 우선 */
    const id = m && m.sok;
    if(id && SOK_LIST.some(s=>s.id===id)) return {id};
    /* 주소 방식이면 주소에 든 지역 이름으로 찾음 */
    if(SOK_MODE === "area"){
      const addr = normArea(m && m.address);
      if(addr){
        for(const s of SOK_LIST){
          for(const a of (s.areas||[])){
            const key = normArea(a);
            if(key && addr.indexOf(key) >= 0) return {id:s.id};
          }
        }
      }
    }
    return null;
  }

  /* 메모에 속이 적혀 있으면 나이보다 먼저 따릅니다 (10속 넘는 교회도 가능) */
  const memo = m.memo || "";
  const fromMemo = (g) => {
    const hits = [...memo.matchAll(new RegExp("([0-9]{1,3})\\s*" + g + "선교회", "g"))];
    for(const h of hits){
      const n = Number(h[1]);
      if(n >= 1 && n <= sokCount(g)) return {g, n};   /* 설정된 속 수 안에 있을 때만 */
    }
    return null;
  };
  const memoF = fromMemo("여"); if(memoF) return memoF;
  const memoM = fromMemo("남"); if(memoM) return memoM;
  const y = m.birth ? Number(m.birth.slice(0,4)) : 0;
  if(y){
    const ka = koAge(m.birth);
    if(ka !== null && ka <= schoolMaxAge()) return null;   /* 교회학교(유치부~청년부) 대상은 속 편성 제외 */
    if(m.gender==="여"){ for(const p of SOK_F){ if(y<=p[0]) return {g:"여", n:p[1]}; } }
    if(m.gender==="남"){ for(const p of SOK_M){ if(y<=p[0]) return {g:"남", n:p[1]}; } }
  }
  return null;
}
/* 주소 비교용으로 정리: 공백 제거, '화곡제1동' → '화곡1동' 같은 표기 차이 흡수 */
const normArea = t => {
  if(!t) return "";
  return String(t)
    .replace(/\s+/g, "")
    .replace(/제([0-9]+)(동|가|구역)/g, "$1$2")
    .toLowerCase();
};
const sokLabel = s => {
  if(!s) return "속 미지정";
  if(s.id){ const f = SOK_LIST.find(x=>x.id===s.id); return f ? f.name : "속 미지정"; }
  return `${s.g}자 ${s.n}속 (${s.n}${s.g}선교회)`;
};
/* 현재 나이로 교회학교 부서 찾기 */
/* 한 사람이 속한 편성 구분: 남1~3, 여1~7, 교회학교 부서, 그 외 */
const scopeKeyOf = m => {
  if(isMinister(m)) return "MIN";
  if(isSamo(m)) return "SAMO";
  const s = sokOf(m);
  if(s) return s.id ? s.id : s.g + s.n;
  const d = schoolDeptOf(m);
  if(d) return "S_" + d.key;
  return "zz";
};
/* 미소속 방문자 자리 — 등록하지 않은 분이 예배에 오셨을 때 인원만 세기 위한 칸 */

/* 사람 범위가 아닌, 보기 권한만 뜻하는 표시 */
const VIEW_FLAGS = [CARE_ALL, VISIT_ALL, SECRET_ALL];
const SCOPE_LIST = () => [
  [PASTOR, "교역자 (성도·교회학교 전체)"],
  [ELDER, "장로 (성도·교회학교 전체)"],
  [VISIT_ALL, "심방 기록 전체 보기"],
  [SECRET_ALL, "긴밀 기도 보기"],
  [ATT_ONLY, "예배 출석 체크만 (성도 전체 · 교회학교 제외)"],
  ["SOK_ALL", "속 전체 (남·여 모든 속)"],
  ["SOK_F_ALL", "여선교회 전체 (총여선교회장)"],

  ...sokKeys()
      .map(k=>[k, sokKeyLabel(k)]),

  ...SCHOOL_DEPTS.map(s=>["S_"+s.key, "교회학교 · "+s.label]),

const LEGACY_SCOPE = {MIN:"교역자 명단", SAMO:"사모 명단", CARE_ALL:"심방·긴밀 기도 전체 보기"};
const scopeLabel = k => {
  const f = SCOPE_LIST().find(x=>x[0]===k);
  return f ? f[1] : (LEGACY_SCOPE[k] || "편성 없음");
};
/* 한 사람의 담당 목록 (예전 방식인 문자열 하나도 그대로 읽힘) */
/* 담당 하나는 "키" 또는 "키:w"(수정) / "키:r"(열람) 로 적힙니다.
   예전 자료는 표시가 없으니, 그때는 계정 권한을 따릅니다. */
const entKey  = e => String(e).split(":")[0];
const entMode = e => { const p = String(e).split(":"); return p[1] === "w" ? "w" : p[1] === "r" ? "r" : ""; };
const entIsW  = (e, oldRole) => {
  const m = entMode(e);
  if(m) return m === "w";
  return oldRole === "editor" || oldRole === "admin";   /* 예전 방식 */
};
const withMode = (e, w) => entKey(e) + (w ? ":w" : ":r");

const scopesOf = (leaders, id) => {
  const v = (leaders||{})[id];
  if(!v) return [];
  return Array.isArray(v) ? v.filter(Boolean) : [v];
};
/* 담당 범위에 드는 사람인지 */
/* 속 하나가 여선교회인지 남선교회인지 (나이 방식은 키 앞 글자, 그 밖에는 이름으로) */
const sokSideOf = (key) => {
  if(!key) return "";
  if(key[0] === "여" || key[0] === "남") return key[0];
  const f = SOK_LIST.find(s => s.id === key);
  const nm = (f && f.name) || "";
  if(nm.indexOf("여") >= 0) return "여";
  if(nm.indexOf("남") >= 0) return "남";
  return "";
};

const inScope = (m, k) => {
  if(k === PASTOR || k === ELDER) return true;        /* 성도·교회학교 전체 */
  const sk = scopeKeyOf(m);
  if(k === ATT_ONLY)  return sk.indexOf("S_") !== 0;                  /* 교역자·어른 전부, 교회학교 제외 */
  if(k === "SOK_ALL") return sk === "MIN" || sk === "SAMO" || (sk !== "zz" && sk.indexOf("S_") !== 0);
  if(k === "SOK_F_ALL") return sokSideOf(sk) === "여";                /* 여선교회 전부 */
  if(k === "SOK_M_ALL") return sokSideOf(sk) === "남";                /* 남선교회 전부 */
  if(k === "S_ALL")   return sk.indexOf("S_") === 0;                  /* 교회학교 전부 */
  return sk === k;
};

const schoolDeptOf = m => {
  if(isMinister(m) || isSamo(m)) return null;
  if(isYoungAdult(m)) return SCHOOL_DEPTS.find(s => s.key === "young") || null;
  const a = koAge(m.birth);
  if(a === null) return null;
  return SCHOOL_DEPTS.find(s => a >= s.min && a <= s.max) || null;
};

/* ───────── 서버 주소 설정 화면 ───────── */
function Setup({onSave, initial}){
  const [url, setUrl] = useState(initial ? initial.url : "");
  const [key, setKey] = useState(initial ? initial.key : "");
  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교우이음 — 처음 설정</div>
        <p className="small muted">이 프로그램의 기록은 교회 전용 Supabase 서버에 저장됩니다.
          Supabase 프로젝트 화면의 <b>Settings → API</b>에서 아래 두 가지를 복사해 붙여넣어 주세요.
          이 설정은 한 번만 하면 이 기기에 기억됩니다.</p>
        <div className="field"><label>Project URL</label>
          <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"/></div>
        <div className="field"><label>anon public 키</label>
          <input value={key} onChange={e=>setKey(e.target.value)} placeholder="eyJ..."/></div>
        <button className="btn" style={{width:"100%"}} disabled={!url.trim().startsWith("http") || key.trim().length < 20}
          onClick={()=>onSave({url:url.trim().replace(/\/+$/,""), key:key.trim()})}>저장하고 시작</button>
      </div>
    </div>
  );
}

/* ───────── 로그인 / 회원가입 ───────── */
function Auth({sb, resetServer, embedded}){
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setMsg("");
    try{
      if(mode === "login"){
        const {error} = await sb.auth.signInWithPassword({email, password:pw});
        if(error) setMsg("로그인 실패 — " + errMsg(error));
      }else{
        const {data, error} = await sb.auth.signUp({email, password:pw, options:{data:{name}}});
        if(error) setMsg("가입 실패 — " + errMsg(error));
        else if(!data.session) setMsg("가입 신청이 접수되었습니다. 이메일 확인이 켜져 있는 서버라면 받은 메일의 확인 버튼을 누른 뒤 로그인해 주세요.");
      }
    }catch(e){ setMsg(errMsg(e)); }
    setBusy(false);
  };

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교우이음</div>
        <div className="auth-tabs">
          <button className={mode==="login"?"on":""} onClick={()=>{setMode("login");setMsg("");}}>로그인</button>
          <button className={mode==="signup"?"on":""} onClick={()=>{setMode("signup");setMsg("");}}>가입 신청</button>
        </div>
        {mode==="signup" &&
          <div className="field"><label>이름</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="실명을 입력해 주세요"/></div>}
        <div className="field"><label>이메일</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></div>
        <div className="field"><label>비밀번호</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="6자 이상"
            onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/></div>
        {msg && <div className="err-banner">{msg}</div>}
        <button className="btn" style={{width:"100%"}} disabled={busy || !email || pw.length<6 || (mode==="signup" && !name.trim())}
          onClick={submit}>{busy ? "처리 중…" : (mode==="login" ? "로그인" : "가입 신청")}</button>
        {mode==="signup" &&
          <p className="small muted" style={{marginBottom:0}}>가입 후에는 <b>관리자(담임목사)의 승인</b>이 있어야 교인 기록을 볼 수 있습니다.</p>}
        {!embedded && <React.Fragment>
          <hr className="divider"/>
          <button className="btn sm ghost" onClick={resetServer}>서버 주소 다시 설정</button>
        </React.Fragment>}
      </div>
    </div>
  );
}

/* ───────── 운영자 현황 (교회이음 운영자만) ───────── */
function OwnerBoard({sb, onClose, onPick}){
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState("");

  const load = useCallback(async ()=>{
    setErr("");
    const {data, error} = await sb.rpc("owner_overview");
    if(error){ setErr(errMsg(error)); setRows([]); return; }
    setRows(data || []);
  }, [sb]);
  useEffect(()=>{ load(); }, [load]);

  const daysAgo = t => {
    if(!t) return null;
    const d = Math.floor((Date.now() - new Date(t).getTime()) / 86400000);
    return d;
  };
  const agoText = t => {
    const d = daysAgo(t);
    if(d === null) return "-";
    if(d === 0) return "오늘";
    if(d === 1) return "어제";
    if(d < 30) return d + "일 전";
    return Math.floor(d/30) + "달 전";
  };
  /* 쓰고 있나 판단: 출석 기록이 최근 14일 안에 있으면 쓰는 중 */
  const state = r => {
    if(!r.members_total) return {t:"시작 안 함", c:"st-none"};
    const d = daysAgo(r.last_att ? r.last_att + "T12:00:00" : null);
    if(d === null) return {t:"교인만 넣음", c:"st-part"};
    if(d <= 14) return {t:"쓰는 중", c:"st-live"};
    if(d <= 45) return {t:"멈춘 듯", c:"st-part"};
    return {t:"안 쓰는 듯", c:"st-none"};
  };
  const kb = n => n < 1024 ? n + "B" : (n/1024 < 1024 ? Math.round(n/1024) + "KB" : (n/1048576).toFixed(1) + "MB");

  const dropChurch = async (r)=>{
    const typed = prompt(
      `[운영자] ${r.name} 를 지웁니다.\n\n` +
      `교인 ${r.members_total}명, 출석 ${r.att_days}일치 기록이 모두 사라집니다.\n` +
      `관리자: ${r.admin_email || "없음"}\n` +
      `되돌릴 수 없습니다.\n\n` +
      `정말 지우시려면 교회 이름을 그대로 적어 주세요.`, "");
    if(typed === null) return;
    if(typed.trim() !== r.name){ alert("교회 이름이 달라 지우지 않았습니다."); return; }
    setBusy(r.id); setErr("");
    const {error} = await sb.rpc("delete_church", {p_id: r.id, p_name: r.name});
    setBusy("");
    if(error){ setErr(errMsg(error)); return; }
    try{ if(localStorage.getItem(PICK_KEY) === r.id) localStorage.removeItem(PICK_KEY); }catch(_){}
    load();
  };

  if(rows === null)
    return <div className="center-box"><div className="panel empty">현황을 불러오는 중…</div></div>;

  const live = rows.filter(r=>state(r).t === "쓰는 중").length;
  const totalMembers = rows.reduce((a,r)=>a + (r.members_total||0), 0);

  return (
    <div className="wrap">
      <div className="panel">
        <div className="row" style={{alignItems:"center"}}>
          <h2 style={{border:"none",margin:0}}>교회 사용 현황
            <span className="muted small"> 교회 {rows.length}곳 · 쓰는 중 {live}곳 · 교인 합계 {totalMembers}명</span></h2>
          <button className="btn sm ghost" style={{marginLeft:"auto"}} onClick={load}>새로 보기</button>
          <button className="btn sm" onClick={onClose}>닫기</button>
        </div>
        {err && <p style={{color:"var(--clay)"}}>{err}</p>}

        {rows.length === 0 && <p className="empty">아직 만들어진 교회가 없습니다.</p>}

        {rows.map(r=>{
          const st = state(r);
          return (
            <div className="own-row" key={r.id}>
              <div className="own-main">
                <div className="own-name">
                  {r.name}
                  <span className={"own-st " + st.c}>{st.t}</span>
                </div>
                <div className="muted small">{r.admin_email || "관리자 없음"} · 가입코드 {r.join_code}</div>
              </div>
              <div className="own-nums">
                <div><b>{r.members_total}</b><span>교인</span></div>
                <div><b>{r.users_total}</b><span>사용자{r.users_pending ? ` (대기 ${r.users_pending})` : ""}</span></div>
                <div><b>{r.att_days}</b><span>출석 날수</span></div>
                <div><b>{r.last_att ? agoText(r.last_att + "T12:00:00") : "-"}</b><span>마지막 출석</span></div>
                <div><b>{agoText(r.last_sign_in)}</b><span>마지막 접속</span></div>
                <div><b>{kb(Number(r.photo_bytes || 0))}</b><span>자료 크기</span></div>
              </div>
              <div className="own-act">
                <button className="btn sm ghost" onClick={()=>onPick(r.id)}>들어가 보기</button>
                <button className="btn sm danger" disabled={busy === r.id}
                  onClick={()=>dropChurch(r)}>{busy === r.id ? "지우는 중…" : "지우기"}</button>
              </div>
            </div>);
        })}

        <p className="small muted" style={{marginTop:14}}>
          <b>쓰는 중</b>은 최근 2주 안에 출석을 체크한 교회입니다.
          <b>멈춘 듯</b>은 한 달 반 안, 그보다 오래되면 <b>안 쓰는 듯</b>으로 봅니다.
          교인을 한 명도 넣지 않았으면 <b>시작 안 함</b>입니다.
        </p>
      </div>
    </div>
  );
}

/* ───────── 교회 고르기 · 만들기 · 가입 신청 ───────── */
function ChurchPicker({sb, session, logout, onPick}){
  const [rows, setRows] = useState(null);      /* 내가 속한/신청한 교회들 */
  const [canMake, setCanMake] = useState(true); /* 교회를 더 만들 수 있는지 */
  const [isOwner, setIsOwner] = useState(false); /* 교회이음 운영자인지 */
  const [board, setBoard] = useState(false);     /* 현황 화면 보기 */
  const [mode, setMode] = useState("");        /* "" | "new" | "join" */
  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const load = useCallback(async ()=>{
    setErr("");
    const {data, error} = await sb.from("church_users")
      .select("church_id, role, churches(name, join_code)")
      .eq("user_id", session.user.id);
    if(error){ setErr(errMsg(error)); setRows([]); return; }
    setRows((data||[]).map(r=>({
      id: r.church_id, role: r.role,
      name: (r.churches && r.churches.name) || "이름 없는 교회",
      code: (r.churches && r.churches.join_code) || "",
    })));
    const can = await sb.rpc("can_create_church");
    if(!can.error) setCanMake(can.data !== false);
    const ow = await sb.rpc("is_app_owner");
    if(!ow.error) setIsOwner(ow.data === true);
  }, [sb, session]);
  useEffect(()=>{ load(); }, [load]);

  const makeChurch = async ()=>{
    if(!name.trim()) return;
    setBusy(true); setErr("");
    const {data, error} = await sb.rpc("create_church", {p_name: name.trim()});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    onPick(data);
  };
  const dropChurch = async (r)=>{
    const typed = prompt(
      `${r.name} 를 지우면 그 교회의 교인·출석·심방·중보기도 기록이 모두 사라집니다.\n` +
      `되돌릴 수 없습니다. 먼저 백업을 받아 두셨는지 확인해 주세요.\n\n` +
      `정말 지우시려면 아래에 교회 이름을 그대로 적어 주세요.`, "");
    if(typed === null) return;
    if(typed.trim() !== r.name){ alert("교회 이름이 달라 지우지 않았습니다."); return; }
    setBusy(true); setErr("");
    const {error} = await sb.rpc("delete_church", {p_id: r.id, p_name: r.name});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    try{ if(localStorage.getItem(PICK_KEY) === r.id) localStorage.removeItem(PICK_KEY); }catch(_){}
    load();
  };

  const joinChurch = async ()=>{
    if(!code.trim()) return;
    setBusy(true); setErr("");
    const {error} = await sb.rpc("join_church", {p_code: code.trim().toUpperCase()});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    setMode(""); setCode(""); load();
  };

  if(rows === null)
    return <div className="center-box"><div className="panel empty">교회를 확인하는 중…</div></div>;

  if(board) return <OwnerBoard sb={sb} onClose={()=>setBoard(false)} onPick={onPick}/>;

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교우이음</div>
        <p className="small muted" style={{marginTop:0}}>
          {session.user.email} 님으로 접속했습니다.</p>
        {err && <p style={{color:"var(--clay)"}}>{err}</p>}

        {rows.length > 0 && <React.Fragment>
          <h2>내 교회</h2>
          {rows.map(r=>(
            <div className="ch-row" key={r.id}>
              <div style={{flex:1}}>
                <b>{r.name}</b>
                {r.role === "pending"
                  ? <div className="muted small">승인을 기다리는 중입니다</div>
                  : <div className="muted small">{ROLE_LABEL[r.role] || r.role}
                      {r.role==="admin" && r.code && ` · 가입 코드 ${r.code}`}</div>}
              </div>
              {r.role === "pending"
                ? <button className="btn sm ghost" onClick={load}>승인 확인</button>
                : <React.Fragment>
                    <button className="btn sm" onClick={()=>onPick(r.id)}>들어가기</button>{" "}
                    {r.role === "admin" &&
                      <button className="btn sm danger" disabled={busy}
                        onClick={()=>dropChurch(r)}>지우기</button>}
                  </React.Fragment>}
            </div>))}
        </React.Fragment>}

        {mode === "" && <React.Fragment>
          <div className="row" style={{marginTop:16}}>
            {canMake && <button className="btn" onClick={()=>setMode("new")}>+ 우리 교회 만들기</button>}
            <button className="btn ghost" onClick={()=>setMode("join")}>가입 코드로 신청</button>
            {isOwner && <button className="btn ghost" onClick={()=>setBoard(true)}>사용 현황</button>}
            <button className="btn ghost" style={{marginLeft:"auto"}} onClick={logout}>로그아웃</button>
          </div>
          {!canMake && <p className="small muted" style={{marginTop:10,marginBottom:0}}>
            한 계정으로는 교회를 하나만 만들 수 있습니다.
            다른 교회에 들어가시려면 그 교회의 <b>가입 코드</b>로 신청해 주세요.</p>}
        </React.Fragment>}

        {mode === "new" && <div style={{marginTop:16}}>
          <h2>우리 교회 만들기</h2>
          <p className="small muted" style={{marginTop:0}}>
            교회를 만든 분이 <b>관리자</b>가 됩니다. 만들고 나면 <b>가입 코드</b>가 생기는데,
            그 코드를 교역자·속장님께 알려 주면 각자 가입 신청을 할 수 있습니다.</p>
          <div className="field"><label>교회 이름</label>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="예) 한빛교회" onKeyDown={e=>e.key==="Enter"&&makeChurch()}/></div>
          <div className="row">
            <button className="btn" disabled={busy || !name.trim()} onClick={makeChurch}>
              {busy ? "만드는 중…" : "만들기"}</button>
            <button className="btn ghost" onClick={()=>setMode("")}>취소</button>
          </div>
        </div>}

        {mode === "join" && <div style={{marginTop:16}}>
          <h2>가입 코드로 신청</h2>
          <p className="small muted" style={{marginTop:0}}>
            교회 관리자에게 받은 <b>6자리 코드</b>를 넣어 주세요. 신청 뒤 관리자가 승인하면 들어갈 수 있습니다.</p>
          <div className="field"><label>가입 코드</label>
            <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())}
              placeholder="ABC123" maxLength={6}
              style={{letterSpacing:"4px", fontSize:"18px", fontWeight:700, textAlign:"center"}}
              onKeyDown={e=>e.key==="Enter"&&joinChurch()}/></div>
          <div className="row">
            <button className="btn" disabled={busy || code.length<4} onClick={joinChurch}>
              {busy ? "신청 중…" : "신청하기"}</button>
            <button className="btn ghost" onClick={()=>setMode("")}>취소</button>
          </div>
        </div>}
      </div>
    </div>
  );
}

/* ───────── 최상위 ───────── */
function Root(){
  const embedded = !!(EMBED_URL && EMBED_KEY);
  const [cfg, setCfg] = useState(()=>{
    if(EMBED_URL && EMBED_KEY) return {url:EMBED_URL, key:EMBED_KEY};
    try{ const c = JSON.parse(localStorage.getItem(CFG_KEY)); if(c && c.url && c.key) return c; }catch(e){}
    return null;
  });
  const sb = useMemo(()=> cfg ? supabase.createClient(cfg.url, cfg.key) : null, [cfg]);
  const [session, setSession] = useState(undefined); // undefined=확인 중
  const [profile, setProfile] = useState(undefined);

  useEffect(()=>{
    if(!sb){ setSession(null); return; }
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e, s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  }, [sb]);

  /* 고른 교회 */
  const [churchId, setChurchId] = useState(()=>{
    try{ return localStorage.getItem(PICK_KEY) || ""; }catch(_){ return ""; }
  });
  const pickChurch = id => { try{ localStorage.setItem(PICK_KEY, id); }catch(_){} setChurchId(id); };
  const leaveChurch = () => { try{ localStorage.removeItem(PICK_KEY); }catch(_){} setChurchId(""); setProfile(undefined); };

  const loadProfile = useCallback(async ()=>{
    if(!sb || !session || !churchId){ setProfile(undefined); return; }
    const {data, error} = await sb.from("church_users")
      .select("role,name,email").eq("church_id", churchId).eq("user_id", session.user.id).maybeSingle();
    if(!error && data){
      setProfile({id:session.user.id, email:data.email || session.user.email,
                  name:data.name || "", role:data.role, guestOwner:false});
      return;
    }
    /* 그 교회 소속이 아님 — 교회이음 운영자면 살펴보기로 들어갑니다 */
    const ow = await sb.rpc("is_app_owner");
    if(!ow.error && ow.data === true){
      setProfile({id:session.user.id, email:session.user.email,
                  name:"교회이음 운영자", role:"admin", guestOwner:true});
      return;
    }
    setProfile(null);
  }, [sb, session, churchId]);

  useEffect(()=>{ if(session && churchId) loadProfile(); }, [session, churchId, loadProfile]);

  const [lastCfg, setLastCfg] = useState(null);
  const saveCfg = c => { localStorage.setItem(CFG_KEY, JSON.stringify(c)); setCfg(c); };
  const resetServer = () => { setLastCfg(cfg); localStorage.removeItem(CFG_KEY); setCfg(null); };
  const logout = async () => { await sb.auth.signOut(); setProfile(undefined); };

  if(!cfg) return <Setup onSave={saveCfg} initial={lastCfg}/>;
  if(session === undefined) return <div className="center-box"><div className="panel empty">서버에 연결하는 중…</div></div>;
  if(!session) return <Auth sb={sb} resetServer={resetServer} embedded={embedded}/>;
  if(!churchId) return <ChurchPicker sb={sb} session={session} logout={logout} onPick={pickChurch}/>;
  if(profile === undefined) return <div className="center-box"><div className="panel empty">사용자 정보를 확인하는 중…</div></div>;
  if(profile === null){ leaveChurch(); return <div className="center-box"><div className="panel empty">교회를 다시 고르는 중…</div></div>; }
  if(profile.role === "pending") return <Pending profile={profile} logout={logout} refresh={loadProfile} back={leaveChurch}/>;
  return <App key={churchId} sb={sb} profile={profile} logout={logout} churchId={churchId} leaveChurch={leaveChurch}/>;
}

/* ───────── 앱 본체 ───────── */
function App({sb, profile, logout, churchId, leaveChurch}){
  const [churchName, setChurchName] = useState("우리교회");
  const [homePhoto, setHomePhoto] = useState(null);
  const [homePhotoReady, setHomePhotoReady] = useState(false);
  const [cfgNotice, setCfgNotice] = useState("");
  const [members, setMembers] = useState([]);
  const [att, setAtt] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [err, setErr] = useState("");
  const [entered, setEntered] = useState(false);   /* 시작 화면 → 들어가기 */
  const [view, setView] = useState("home");
  const [memView, setMemView] = useState({mode:"list"});
  const fileRef = useRef(null);
  const [leaders, setLeaders] = useState({});   /* {사용자ID: "여3"} 담당 속 */
  /* 교회학교 반: {부서키: {classes:[{id,name}], of:{교인ID:반ID}}} */
  const [schoolClasses, setSchoolClasses] = useState({});
  const [events, setEvents] = useState([]);   /* 교회 행사 [{id,date,endDate,title,place,note,kind}] */
  const [specials, setSpecials] = useState([]);  /* 특별예배 [{key,label,from,to}] */
  const [joinCode, setJoinCode] = useState("");
  const [cfgVer, setCfgVer] = useState(0);       /* 설정이 바뀌면 화면 다시 그리기 */
  const isAdmin = profile.role === "admin";
  const myEnts = scopesOf(leaders, profile.id);                 /* ["ELDER:r","여3:w"] 같은 목록 */
  const oldRole = profile.role;                                 /* 예전 자료를 읽을 때만 씁니다 */
  const isW = e => entIsW(e, oldRole);

  /* 사람 범위로 쓰는 담당만 (보기 표시는 뺀다) */
  const rangeEnts = myEnts.filter(e => VIEW_FLAGS.indexOf(entKey(e)) < 0);
  const listEnts  = rangeEnts.filter(e => entKey(e) !== ATT_ONLY);
  const wideEnts  = rangeEnts.filter(e => entKey(e) === PASTOR || entKey(e) === ELDER);

  /* 심방 기록 전체 보기 / 긴밀 기도 보기 — 따로 정합니다 */
  const canSeeVisits = isAdmin || myEnts.some(e => entKey(e) === VISIT_ALL || entKey(e) === CARE_ALL);
  const canSeeSecret = isAdmin || myEnts.some(e => entKey(e) === SECRET_ALL || entKey(e) === CARE_ALL);
  /* 성도·교회학교 전체를 보는 사람 */
  const fullView = isAdmin || wideEnts.length > 0;
  /* 담당이 하나도 없는 사람 — 달력과 일반 중보기도만 */
  const noScope = !fullView && rangeEnts.length === 0;
  /* 명단 없이 출석만 맡은 분 */
  const attOnly = !isAdmin && !fullView && rangeEnts.length > 0 && listEnts.length === 0;
  /* 담당이 있어 범위가 좁은 사람 */
  const isLeader = !isAdmin && !fullView && rangeEnts.length > 0;

  /* 이 교인을 볼 수 있는가 / 고칠 수 있는가 */
  const canViewM = m => isAdmin || listEnts.some(e => inScope(m, entKey(e)));
  const canWriteM = m => isAdmin || listEnts.some(e => isW(e) && inScope(m, entKey(e)));
  /* 출석 체크는 '수정'으로 준 담당 안에서만 (출석 체크만 담당 포함) */
  const canCheckMember = m => isAdmin || rangeEnts.some(e => isW(e) && inScope(m, entKey(e)));

  /* 화면 전체에 쓰는 큰 스위치 — 교역자에게 수정으로 준 경우 전체 편집 */
  const canEdit = isAdmin || wideEnts.some(e => entKey(e) === PASTOR && isW(e));
  const canCheckAtt = isAdmin || rangeEnts.some(isW);
  const isSchoolTeacher = listEnts.some(e => { const k = entKey(e); return k === "S_ALL" || k.indexOf("S_") === 0; });

  /* 속장은 자기 담당만, 전체 담당이면 모두 */
  const myMembers = fullView ? members : members.filter(canViewM);
  const attMembers = fullView ? members
    : members.filter(m => rangeEnts.some(e => inScope(m, entKey(e))));

  /* 이 사람의 정보를 고칠 수 있는가 — 교사는 자기 담당 학생만 */
  const canEditMember = (m) => {
    if(canEdit) return true;
    return !!m && canWriteM(m);        /* '수정'으로 받은 담당 범위 안이면 고칠 수 있습니다 */
  };
  /* 속장·교사가 담당 범위 밖이라도 볼 수 있는 사람: 담당 교인과 가족으로 이어진 분 (한 다리까지) */
  const viewMembers = useMemo(()=>{
    if(!isLeader) return members;
    const mine = myMembers;
    const mineIds = new Set(mine.map(x=>x.id));
    const nm = s => (s||"").trim();
    const famNames = new Set();
    mine.forEach(x => (x.family||[]).forEach(f => { if(nm(f.name)) famNames.add(nm(f.name)); }));
    const myNames = new Set(mine.map(x=>nm(x.name)).filter(Boolean));
    const extra = members.filter(x =>
      !mineIds.has(x.id) && (
        famNames.has(nm(x.name)) ||                                   /* 담당 교인의 가족란에 있는 분 */
        (x.family||[]).some(f => myNames.has(nm(f.name)))             /* 그분의 가족란에 담당 교인이 있는 경우 */
      ));
    return [...mine, ...extra];
  }, [isLeader, members, myMembers]);

  const fail = e => setErr("저장/불러오기에 실패했습니다 — 원인: " + errMsg(e) + " · 이 문구를 Claude에게 보여주시면 해결할 수 있습니다.");

  const loadAll = useCallback(async ()=>{
    setErr(""); setCfgNotice(""); setHomePhotoReady(false);
    const ch = await sb.from("churches").select("name,join_code").eq("id", churchId).maybeSingle();
    if(ch.data){ setChurchName(ch.data.name || "우리교회"); setJoinCode(ch.data.join_code || ""); }
    const [m, a, s] = await Promise.all([
      sb.from("members").select("id,data").eq("church_id", churchId),
      sb.from("attendance").select("date,service,ids").eq("church_id", churchId),
      sb.from("settings").select("key,value").eq("church_id", churchId),
    ]);
    if(m.error) return fail(m.error);
    if(a.error) return fail(a.error);
    setMembers((m.data||[]).map(r=>r.data));
    const na = {};
    (a.data||[]).forEach(r=>{ na[r.date] = na[r.date]||{}; na[r.date][r.service] = r.ids||[]; });
    setAtt(na);
    if(s.error) fail(s.error);
    if(!s.error){
      try{
        setHomePhoto(parseChurchHomePhoto(s.data)); setHomePhotoReady(true);
      }catch(photoError){
        setErr("홈 사진을 불러오지 못했습니다. 다시 불러오기를 눌러 주세요. " + errMsg(photoError));
      }
      const cc = (s.data||[]).find(r=>r.key==="churchConfig");
      if(cc && cc.value){ try{ applyChurchConfig(JSON.parse(cc.value)); setCfgVer(v=>v+1); }catch(_){} }
      const sp = (s.data||[]).find(r=>r.key==="specialServices");
      if(sp && sp.value){ try{ setSpecials(JSON.parse(sp.value)||[]); }catch(_){ setSpecials([]); } }
      else setSpecials([]);
      const ev = (s.data||[]).find(r=>r.key==="events");
      if(ev && ev.value){ try{ setEvents(JSON.parse(ev.value)||[]); }catch(_){ setEvents([]); } }
      else setEvents([]);
      const sc = (s.data||[]).find(r=>r.key==="schoolClasses");
      if(sc && sc.value){ try{ setSchoolClasses(JSON.parse(sc.value)||{}); }catch(_){ setSchoolClasses({}); } }
      const ld = (s.data||[]).find(r=>r.key==="leaders");
      if(ld && ld.value){ try{ setLeaders(JSON.parse(ld.value)||{}); }catch(_){ setLeaders({}); } }
      else setLeaders({});
    }
    setLoaded(true);
  }, [sb, churchId]);

  useEffect(()=>{ if(churchId) loadAll(); }, [loadAll, churchId]);

  /* ── 서버 쓰기 ── */
  const saveMemberRow = async (m) => {
    setMembers(ms => ms.some(x=>x.id===m.id) ? ms.map(x=>x.id===m.id?m:x) : [...ms, m]);
    const {error} = await sb.from("members")
      .upsert({church_id:churchId, id:m.id, data:m});
    if(error){ fail(error); loadAll(); }
  };
  const updateMember = (id, fn) => {
    const cur = members.find(x=>x.id===id); if(!cur) return;
    saveMemberRow(fn(cur));
  };
  const removeMember = async (id) => {
    setMembers(ms=>ms.filter(x=>x.id!==id));
    const {error} = await sb.from("members").delete().eq("church_id", churchId).eq("id", id);
    if(error){ fail(error); loadAll(); return; }
    // 출석 기록에서도 제거
    const updates = [];
    const na = {};
    for(const d in att){
      na[d] = {};
      for(const s in att[d]){
        const ids = att[d][s];
        if(ids.includes(id)){
          const nids = ids.filter(x=>x!==id);
          na[d][s] = nids;
          updates.push({church_id:churchId, date:d, service:s, ids:nids});
        }else na[d][s] = ids;
      }
    }
    setAtt(na);
    if(updates.length){
      const {error:e2} = await sb.from("attendance").upsert(updates);
      if(e2){ fail(e2); loadAll(); }
    }
  };
  const saveAtt = async (date, service, ids) => {
    setAtt(a=>({...a, [date]:{...(a[date]||{}), [service]:ids}}));
    const {error} = await sb.from("attendance")
      .upsert({church_id:churchId, date, service, ids});
    if(error){ fail(error); loadAll(); }
  };
  const renameChurch = async () => {
    const n = prompt("교회 이름을 입력하세요", churchName);
    if(!n || !n.trim()) return;
    setChurchName(n.trim());
    const {error} = await sb.from("churches").update({name:n.trim()}).eq("id", churchId);
    if(error) fail(error);
  };

  /* ── 백업 ── */
  const doExport = () => {
    const blob = new Blob([JSON.stringify({version:1, exportedAt:new Date().toISOString(), churchName, members, att}, null, 2)],
      {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `교인관리_백업_${todayStr()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  const [pendingImport, setPendingImport] = useState(null);
  const doImport = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.members)) throw new Error("형식 오류");
        setPendingImport(d);
      }catch(e){ alert("백업 파일을 읽지 못했습니다. 이 프로그램에서 내보낸 JSON 파일인지 확인해 주세요."); }
    };
    r.readAsText(file);
  };
  const runImport = async (mode) => {
    const d = pendingImport;
    setPendingImport(null);
    setErr("");
    let e;
    if(mode === "replace"){
      ({error:e} = await sb.from("members").delete().eq("church_id", churchId)); if(e) return fail(e);
      ({error:e} = await sb.from("attendance").delete().eq("church_id", churchId)); if(e) return fail(e);
    }
    const curById = {};
    if(mode === "merge") members.forEach(x=>{ curById[x.id] = x; });
    const rows = (d.members||[]).map(im=>{
      const data = (mode === "merge" && im.id && curById[im.id]) ? mergeMember(curById[im.id], im) : im;
      return {church_id:churchId, id:im.id||uid(), data};
    });
    for(let i=0;i<rows.length;i+=100){
      ({error:e} = await sb.from("members").upsert(rows.slice(i,i+100))); if(e) return fail(e);
    }
    const attIn = d.att||{};
    const arows = [];
    for(const dt in attIn) for(const s in attIn[dt]){
      let ids = attIn[dt][s]||[];
      if(mode === "merge"){
        const cur = (att[dt] && att[dt][s]) || [];
        ids = Array.from(new Set([...cur, ...ids]));
      }
      if(ids.length) arows.push({church_id:churchId, date:dt, service:s, ids});
    }
    for(let i=0;i<arows.length;i+=100){
      ({error:e} = await sb.from("attendance").upsert(arows.slice(i,i+100))); if(e) return fail(e);
    }
    await loadAll();
    alert(mode === "merge" ? "명단을 합쳐 넣었습니다." : "가져오기(전체 교체)가 완료되었습니다.");
  };

  const saveConfig = async (next, nextPhoto) => {
    if(!homePhotoReady) throw new Error("설정을 먼저 다시 불러온 뒤 저장해 주세요.");
    const savedPhoto = await persistChurchSettings(sb, churchId, profile.role, next, nextPhoto);
    applyChurchConfig(next); setHomePhoto(savedPhoto);
    setCfgNotice("설정을 저장했습니다. 교회 사진이 홈 화면에 반영되었습니다.");
    setCfgVer(v=>v+1);
  };

  const saveSpecials = async (next) => {
    setSpecials(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"specialServices", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveEvents = async (next) => {
    setEvents(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"events", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveClasses = async (next) => {
    setSchoolClasses(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"schoolClasses", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveLeaders = async (next) => {
    setLeaders(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"leaders", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const byId = id => members.find(m => m.id === id);
  
  /* 뒤로 가기: 지나온 화면을 쌓아 두었다가 한 걸음씩 되돌아감 */
  const histRef = useRef([]);
  const [histLen, setHistLen] = useState(0);
  const nowScreen = useRef({view:"home", memView:{mode:"list"}});
  nowScreen.current = {view, memView};

  const pushHistory = (from) => {
    const cur = from || nowScreen.current;
    const last = histRef.current[histRef.current.length-1];
    /* 같은 화면이면 쌓지 않음 */
    if(last && last.view===cur.view &&
       (last.memView||{}).mode===(cur.memView||{}).mode &&
       (last.memView||{}).id===(cur.memView||{}).id) return;
    histRef.current = [...histRef.current.slice(-29), cur];
    setHistLen(histRef.current.length);
  };
  const goBack = () => {
    if(!histRef.current.length) return;
    const prev = histRef.current[histRef.current.length-1];
    histRef.current = histRef.current.slice(0, -1);
    setHistLen(histRef.current.length);
    setView(prev.view);
    setMemView(prev.memView || {mode:"list"});
    window.scrollTo(0,0);
  };

  const go = v => {
    const allowed = navItems.some(x => x[0] === v);
    if(!allowed) return;
    if(v !== view) pushHistory();
    setView(v); if(v==="members") setMemView({mode:"list"}); window.scrollTo(0,0);
  };
  const openMember = id => {
    if(attOnly) return;
    if(isLeader && !viewMembers.some(m=>m.id===id)) return;
    pushHistory();
    setView("members"); setMemView({mode:"detail", id}); window.scrollTo(0,0);
  };

  let navItems;
  if(noScope){
    navItems = [["home","홈"],["cal","달력"],["pray","중보기도"]];
  } else if(attOnly){
    navItems = [["home","홈"],["att","예배 출석 체크"]];
  } else if(fullView && !isAdmin){
    navItems = [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["pray","중보기도"]];
  } else if(isLeader){
    const keys = listEnts.map(entKey);
    navItems = [["home","홈"],
      ["members", keys.every(k=>k.indexOf("S_")===0) ? "우리 부서"
                : keys.some(k=>k.indexOf("S_")===0) ? "담당 교인" : "우리 속 교인"],
      ["att","출석 체크"],["cal","달력"],["pray","중보기도"]];
  } else {
    navItems = [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["pray","중보기도"]];
  }
  if(canSeeVisits && !noScope){
    const at = navItems.findIndex(x=>x[0]==="pray");
    navItems.splice(at >= 0 ? at : navItems.length, 0, ["visit","심방"]);
  }
  if(isAdmin){ navItems.push(["team","사용자"]); navItems.push(["cfg","설정"]); }

  if(!entered) return <Gate churchName={churchName} onEnter={()=>setEntered(true)}/>;

  return (
    <div>
      {pendingImport && (
        <div className="modal-back" onClick={()=>setPendingImport(null)}>
          <div className="panel" onClick={e=>e.stopPropagation()}>
            <h2>명단 가져오기</h2>
            <p className="small">파일에 교인 <b>{pendingImport.members.length}명</b>의 기록이 있습니다. 어떻게 넣을까요?</p>
            <button className="btn" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("merge")}>
              추가하기 — 기존 기록은 그대로 두고 합침 (권장)</button>
            <button className="btn danger" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("replace")}>
              전체 교체 — 기존 교인·출석 기록을 지우고 이 파일로 바꿈</button>
            <button className="btn ghost" style={{width:"100%"}} onClick={()=>setPendingImport(null)}>취소</button>
            <p className="muted small" style={{marginTop:10,marginBottom:0}}>
              추가하기를 누르면 새 교인은 추가되고, 같은 교인(같은 고유번호)은 파일 내용으로 갱신됩니다. 모든 사용자에게 함께 적용됩니다.</p>
          </div>
        </div>
      )}
      <header className="top">
        <div className="top-in">
          <div className="brand">
            <button className="logo-btn" onClick={()=>{ setEntered(false); window.scrollTo(0,0); }}
              title="시작 화면으로">
              <Logo/>
            </button>
            <button onClick={isAdmin ? renameChurch : undefined} title={isAdmin?"교회 이름 바꾸기":""}>{churchName} 교인 관리</button>
          </div>
          <button className={"back-btn"+(histLen>0?"":" off")} onClick={goBack}
            title="이전 화면으로" aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>‹ 뒤로</button>
          <nav>
            {navItems.map(([k,l])=>(
              <button key={k} className={view===k?"on":""} onClick={()=>go(k)}>{l}</button>
            ))}
          </nav>
          <div className="top-right">
            <button className="backup-btn refresh-btn" title="새로 불러오기"
              onClick={()=>window.location.reload()} aria-label="새로 불러오기">⟳</button>
            {canEdit && !isLeader && <button className="backup-btn" onClick={doExport}>백업</button>}
            {isAdmin && <button className="backup-btn" onClick={()=>fileRef.current.click()}>가져오기</button>}
            {leaveChurch && <button className="backup-btn" onClick={leaveChurch} title="다른 교회로">
              교회<span className="me-name"> 바꾸기</span></button>}
            <button className="backup-btn" onClick={logout}>
              <span className="me-name">{profile.name || "나"} · </span>로그아웃</button>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
              onChange={e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=""; }}/>
          </div>
        </div>
      </header>

      {/* 휴대폰에서는 메뉴를 아래쪽 탭바로 */}
      <nav className="tabbar" aria-label="화면 이동">
        <button className={"tab"+(histLen>0?"":" off")} onClick={goBack}
          aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>
          <span className="tab-ico">‹</span><span className="tab-lab">뒤로</span></button>
        {navItems.map(([k,l])=>(
          <button key={k} className={"tab"+(view===k?" on":"")} onClick={()=>go(k)}>
            <span className="tab-ico">{TAB_ICON[k] || "•"}</span>
            <span className="tab-lab">{TAB_SHORT[l] || l}</span>
          </button>))}
      </nav>

      {profile.guestOwner && <div className="owner-bar">
        교회이음 운영자로 <b>{churchName}</b> 를 살펴보고 있습니다.
        이 교회의 구성원 목록에는 나타나지 않습니다.
        <button className="btn sm ghost" onClick={leaveChurch}>나가기</button>
      </div>}

      <div className="wrap">
        {err && <div className="err-banner">{err} <button className="btn sm ghost" onClick={loadAll}>다시 불러오기</button></div>}
        {!loaded ? <div className="panel empty">기록을 불러오는 중…</div> : <React.Fragment>
        {isLeader && <div className="panel" style={{padding:"12px 16px",marginBottom:12}}>
          <b>{myEnts.map(e => scopeLabel(entKey(e)) + (isW(e) ? " (수정)" : " (열람)")).join(" · ")}</b> 담당으로 접속 중입니다.
          <span className="muted small">
            {attOnly
              ? ` · 성도 ${attMembers.length}명의 예배 출석만 체크하실 수 있습니다. 교인 신상은 보이지 않습니다.`
              : myEnts.some(e => entKey(e) === ATT_ONLY)
              ? ` · 예배 출석은 ${attMembers.length}명 전체를 체크하시고, 교인 명단은 담당 ${myMembers.length}명만 보입니다.`
              : ` · ${myMembers.length}명의 신상을 보고 출석을 체크하실 수 있습니다.`}
            {isSchoolTeacher && " 담당 부서 학생의 정보는 직접 수정하실 수 있습니다."}</span>
        </div>}
        {view==="home" && <Home churchName={churchName} homePhoto={homePhoto} members={attOnly ? [] : myMembers} att={att} go={go} openMember={openMember}
          canSeeVisits={canSeeVisits} canSeeSecret={canSeeSecret} meId={profile.id}/>}
        {view==="members" && attOnly &&
          <p className="empty">예배 출석 체크만 맡으셨습니다. 교인 명부는 볼 수 없습니다.</p>}
        {view==="members" && !attOnly && (
          memView.mode==="list" ? <MemberList members={myMembers}
            setMemView={v=>{ pushHistory({view:"members", memView:{mode:"list"}}); setMemView(v); }} canEdit={canEdit}
            schoolClasses={schoolClasses} saveClasses={saveClasses}
            canEditClass={(deptKey)=> canEdit ||
              listEnts.some(e => isW(e) && (entKey(e)==="S_ALL" || entKey(e)==="S_"+deptKey))}/> :
          memView.mode==="form" && memView.id && !canEditMember(byId(memView.id))
            ? <div className="panel empty">이 교인의 정보는 수정할 수 없습니다.
                <div style={{marginTop:10}}><button className="btn sm" onClick={()=>setMemView({mode:"detail", id:memView.id})}>돌아가기</button></div>
              </div> :
          memView.mode==="form" && !memView.id && !canEdit
            ? <div className="panel empty">새 교인 등록은 관리자와 수정 권한이 있는 분만 할 수 있습니다.
                <div style={{marginTop:10}}><button className="btn sm" onClick={()=>setMemView({mode:"list"})}>돌아가기</button></div>
              </div> :
          memView.mode==="form" ? <MemberForm init={memView.id ? byId(memView.id) : null}
              onCancel={()=>setMemView(memView.id ? {mode:"detail", id:memView.id} : {mode:"list"})}
              onSave={(m)=>{ saveMemberRow(m); setMemView({mode:"detail", id:m.id}); }}/> :
          <MemberDetail m={viewMembers.find(x=>x.id===memView.id)} att={att} specials={specials}
            setMemView={v=>{ pushHistory({view:"members", memView}); setMemView(v); }}
            canEdit={canEdit || canEditMember(viewMembers.find(x=>x.id===memView.id))}
            canDelete={canEdit}
            allMembers={viewMembers} openMember={openMember}
            limited={!canSeeVisits} seeSecret={canSeeSecret}
            canPray={!attOnly && (canEdit || canWriteM(memView && byId(memView.id)))}
            meName={profile.name || profile.email} meId={profile.id}
            outside={isLeader && !myMembers.some(x=>x.id===memView.id)}
            update={fn=>updateMember(memView.id, fn)}
            remove={()=>{
              const m = byId(memView.id);
              if(confirm(`'${m.name}' 님의 모든 기록(가족·심방·기도 포함)을 삭제할까요?\n모든 사용자에게 함께 적용되며, 되돌릴 수 없습니다.`)){
                removeMember(memView.id);
                setMemView({mode:"list"});
              }
            }}/>
        )}
        {view==="att" && <Attendance members={attMembers} att={att} saveAtt={saveAtt}
          canEdit={canCheckAtt}
          canCheckMember={canCheckMember}
          schoolClasses={schoolClasses} specials={specials} saveSpecials={saveSpecials} isAdmin={isAdmin || canEdit}/>}
        {view==="visit" && (!canSeeVisits
          ? <p className="empty">심방 기록은 목회자와 관리자만 볼 수 있습니다.</p>
          : <Visits members={members} update={updateMember} openMember={openMember} canEdit={canEdit}
              meName={profile.name || profile.email} meId={profile.id}/>)}
        {view==="cal" && <Calendar members={members} events={events} saveEvents={saveEvents}
          canEdit={canEdit} openMember={openMember}
          openable={!noScope && !attOnly}/>}
        {view==="pray" &&
          <Prayers members={members} update={updateMember} openMember={openMember}
            canEdit={canEdit && !noScope} seeSecret={canSeeSecret}
            openable={!noScope && !attOnly}
            meName={profile.name || profile.email} meId={profile.id}/>}
        {view==="team" && isAdmin && <Team sb={sb} me={profile} leaders={leaders} saveLeaders={saveLeaders}
          churchId={churchId} joinCode={joinCode}/>}
        {view==="cfg" && isAdmin && <ChurchConfig key={cfgVer} saveConfig={saveConfig} churchName={churchName}
          homePhoto={homePhoto} homePhotoReady={homePhotoReady} initialMessage={cfgNotice}/>}
        </React.Fragment>}
      </div>
      <div className="app-copy">

/* ───────── 사용자(승인) 관리 ───────── */
/* 담당 목록을 보고 '실제로 할 수 있는 일'을 한 줄로 풀어 줍니다 */
function abilityOf(role, ents){
  if(role === "admin") return {can:"모든 기능", cant:""};
  if(role === "pending") return {can:"", cant:"승인을 기다리는 중입니다"};
  const es = ents || [];
  const key = e => entKey(e);
  const w   = e => entIsW(e, role);
  const wide = es.filter(e => key(e) === PASTOR || key(e) === ELDER);
  const seeV = es.some(e => key(e) === VISIT_ALL || key(e) === CARE_ALL);
  const seeS = es.some(e => key(e) === SECRET_ALL || key(e) === CARE_ALL);
  const range = es.filter(e => VIEW_FLAGS.indexOf(key(e)) < 0);
  const list  = range.filter(e => key(e) !== ATT_ONLY && key(e) !== PASTOR && key(e) !== ELDER);
  const can = [], cant = [];

  if(!range.length){ 
    return {can:"달력·일반 중보기도 보기", cant:"교인 명부 못 봄"};
  }
  if(wide.length) can.push("성도·교회학교 전체 보기");
  if(list.length) can.push(list.map(e => scopeLabel(key(e))).join(", ") + " 보기");
  if(!wide.length && !list.length) can.push("출석 명단만 보기");

  const wr = range.filter(w);
  if(wr.some(e => key(e) === PASTOR)) can.push("교인 신상 수정(전체) · 출석 체크(전체)");
  else {
    const wl = wr.filter(e => key(e) !== ATT_ONLY);
    if(wl.length){
      const nm = wl.map(e => key(e) === ELDER ? "전체" : scopeLabel(key(e))).join(", ");
      can.push("교인 신상 수정(" + nm + ") · 출석 체크(" + nm + ")");
    }
    if(wr.some(e => key(e) === ATT_ONLY)) can.push("출석 체크(성도 전체)");
    if(!wr.length) cant.push("고치기 안 됨 · 출석 체크 안 됨 (모두 열람으로 주셨습니다)");
  }
  if(seeV) can.push("심방 기록 전체 보기");
  if(seeS) can.push("긴밀 기도 보기");
  if(!seeV && (list.length || wide.length)) cant.push("남이 쓴 심방 기록 못 봄");
  return {can: can.join(" · "), cant: cant.join(" · ")};
}

function Home({churchName, homePhoto, members, att, go, openMember,
               canSeeVisits, canSeeSecret, meId}){
  const thisMonth = new Date().getMonth()+1;
  const birthdays = members
    .filter(m => m.birth && Number(m.birth.split("-")[1]) === thisMonth)
    .sort((a,b)=> a.birth.slice(5).localeCompare(b.birth.slice(5)));

  const lastSunday = useMemo(()=>{
    const dates = Object.keys(att).filter(d => (att[d].sun||[]).length).sort();
    return dates.length ? dates[dates.length-1] : null;
  }, [att]);
  const sunCount = lastSunday ? att[lastSunday].sun.length : 0;

  /* 볼 수 있는 것만 셉니다 */
  const openPray = members.reduce((n,m)=> n + (m.prayers||[])
    .filter(p=>p.status==="open" && (canSeeSecret || !p.secret)).length, 0);
  const monthPrefix = `${new Date().getFullYear()}-${pad(thisMonth)}`;
  const visitsThisMonth = members.reduce((n,m)=> n + (m.visits||[])
    .filter(v=>(v.when||"").startsWith(monthPrefix) && (canSeeVisits || v.byId === meId)).length, 0);

  return (
    <div>
      <ChurchHomeBanner churchName={churchName} photo={homePhoto}/>

      <div className="grid-stats">
        <button className="stat" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("members")}>
          <div className="n">{members.length}</div><div className="l">등록 교인</div>
        </button>
        <button className="stat" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("att")}>
          <div className="n">{sunCount}</div>
          <div className="l">{lastSunday ? `주일 출석 (${lastSunday.slice(5).replace("-","/")})` : "주일 출석 기록 없음"}</div>
        </button>
        <button className="stat clay" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("pray")}>
          <div className="n">{openPray}</div><div className="l">응답을 기다리는 기도</div>
        </button>
        {canSeeVisits &&
          <button className="stat gold" style={{textAlign:"left",cursor:"pointer"}} onClick={()=>go("visit")}>
            <div className="n">{visitsThisMonth}</div><div className="l">이번 달 심방</div>
          </button>}
      </div>

      <div className="panel">
        <h2>이번 달 생일 <span className="muted small">({thisMonth}월)</span></h2>
        {birthdays.length===0 ? <p className="empty">이번 달에 생일인 교인이 없습니다.</p> :
          <div className="tbl-wrap"><table>
            <thead><tr><th>날짜</th><th>이름</th><th>직분</th><th>연락처</th></tr></thead>
            <tbody>{birthdays.map(m=>(
              <tr key={m.id}>
                <td>{m.birth.slice(5).replace("-","월 ")}일</td>
                <td><button className="btn sm ghost" onClick={()=>openMember(m.id)}>{m.name}</button></td>
                <td>{m.position}</td><td>{m.phone}</td>
              </tr>))}
            </tbody></table></div>}
      </div>

      {members.length===0 &&
        <div className="notice">아직 등록된 교인이 없습니다. 상단의 <b>교인</b> 메뉴에서 첫 교인을 등록해 보세요.</div>}
    </div>
  );
}
