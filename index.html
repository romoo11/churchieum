     · 상업적 이용 및 판매

<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>교인 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F4F5F8; --card:#FFFFFF; --ink:#1E2635; --muted:#63708A;
    --pine:#22355C; --pine-deep:#16223D; --pine-soft:#E3E8F2;
    --gold:#C29B3C; --gold-soft:#F4EAD2;
    --blue:#3D5A80; --clay:#A8442F; --clay-soft:#F4E2DC;
    --line:#D3D9E4;
  }
  /* 부서·속 머리표 (아이콘 배지) */
  .dept-head{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:12px;
    color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.10);margin-bottom:10px}
  .dept-head .ico{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.24);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .dept-head .nm{font-family:"Gowun Batang","Noto Sans KR",serif;font-size:17px;font-weight:700}
  .dept-head .ct{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 10px;font-size:12.5px}
  .dept-head .sp{margin-left:auto;display:flex;gap:6px}
  .dept-head button{border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:4px 11px;
    background:linear-gradient(180deg,#FFFFFF 0%,#EEF2F8 55%,#DDE4EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 1px 3px rgba(0,0,0,.22);
    font-size:13px;color:#1E2635;font-weight:600}
  .dept-head button:hover{background:#fff}
  /* 반 머리표 */
  .cls-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 13px;border-radius:11px;
    border:1px solid #BFCADE;border-left:5px solid var(--pine);
    background:linear-gradient(180deg,#F4F7FC 0%,#E6ECF6 55%,#D9E1EE 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(34,53,92,.10)}
  .cls-head .nm{font-weight:700;font-size:15px;color:var(--pine-deep)}
  .cls-head .ct{color:var(--muted);font-size:12.5px}
  .cls-head .btn.sm{margin-left:auto}
  .cls-head.none{background:#EBEEF4;border-left-color:#AEB6C6}
  .cls-head.none .nm{color:#63708A}
  .chip.secret{background:#7E2F20;color:#fff}
  td.nw, th.nw{white-space:nowrap}
  .scope-col{min-width:230px}
  .scope-row{display:flex;align-items:center;gap:5px;margin-bottom:5px}
  .scope-row .chip{white-space:nowrap}
  .scope-col select{max-width:230px}
  .svc-add{border:1.5px dashed #7A8CB0;border-radius:999px;padding:7px 15px;
    font-weight:600;color:var(--pine);text-shadow:0 1px 0 rgba(255,255,255,.85);
    background:linear-gradient(180deg,#FFFFFF 0%,#F2F5FA 48%,#E2E8F2 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.10)}
  .svc-add:hover{filter:brightness(1.04)}
  .svc-past{border:1px solid #C3CBDB;border-radius:999px;padding:7px 15px;
    font-weight:600;color:var(--muted);text-shadow:0 1px 0 rgba(255,255,255,.8);
    background:linear-gradient(180deg,#FAFBFD 0%,#EBEEF5 48%,#DDE2EC 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 4px rgba(34,53,92,.10)}
  .svc-past:hover{filter:brightness(1.04)}
  .sp-past-box{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#EDEFF5;
    border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .sp-note{display:flex;align-items:center;gap:8px;background:#F1EDF6;border-left:5px solid #7B5EA7;
    border-radius:10px;padding:9px 14px;margin-bottom:12px;flex-wrap:wrap}
  /* 시작 화면 */
  .gate{position:fixed;inset:0;z-index:50;background:#12300F;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .gate-art{position:relative;line-height:0;flex:0 0 auto;
    width:min(100vw, calc(100vh * 1448 / 1086));aspect-ratio:1448 / 1086}
  .gate-art img{display:block;width:100%;height:100%}
  /* 그림 속 로고 아래 빈 잔디밭 자리 (76% ~ 90%) */
  .gate-over{position:absolute;left:0;right:0;top:76.5%;height:13.5%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2%;
    line-height:1.3}
  .gate-name{font-family:"Gowun Batang","Noto Sans KR",serif;color:#fff;font-weight:700;
    font-size:clamp(16px,2.35vw,30px);letter-spacing:1px;
    text-shadow:0 2px 9px rgba(0,0,0,.65), 0 0 22px rgba(0,0,0,.5)}
  .gate-btn{background:rgba(255,255,255,.12);color:#fff;
    border:2px solid rgba(255,255,255,.85);border-radius:999px;
    padding:0.7em 2.4em;font-size:clamp(12px,1.5vw,18px);font-weight:700;letter-spacing:2px;
    font-family:"Gowun Batang","Noto Sans KR",serif;line-height:1;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    text-shadow:0 1px 6px rgba(0,0,0,.5);box-shadow:0 4px 16px rgba(0,0,0,.35);
    transition:background .15s, transform .08s}
  .gate-btn:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
  .gate-btn:active{transform:translateY(1px)}
  /* 세로 화면에서는 가운데를 키워 글씨가 읽히게 */
  @media (max-aspect-ratio: 1/1){
    .gate-art{width:min(172vw, calc(100vh * 1448 / 1086))}
    .gate-name{font-size:clamp(15px,3.9vw,26px)}
    .gate-btn{font-size:clamp(11px,2.5vw,16px)}
  }
  .app-copy{display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--muted);font-size:11.5px;padding:26px 12px 34px;line-height:1.6;text-align:left}
  .app-copy span{opacity:.75}
  .ch-row{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:7px;
    border:1px solid #BAC5D9;border-radius:12px;
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.12)}
  .join-code{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 16px;
    padding:12px 15px;border-radius:12px;border:1px solid #D8C79A;
    background:linear-gradient(180deg,#FDF8EC 0%,#F6EBCE 100%)}
  .join-code b{display:block;font-family:"Gowun Batang",serif;font-size:26px;letter-spacing:6px;
    color:#7A5B12;margin-top:1px}
  /* 달력 */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wd{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 0}
  .cal-wd.sun{color:#A8442F}.cal-wd.sat{color:#3D5A80}
  .cal-cell{min-height:82px;border:1px solid #C9D2E1;border-radius:11px;
    padding:4px 5px;cursor:pointer;overflow:hidden;
    background:linear-gradient(180deg,#FFFFFF 0%,#F3F6FB 55%,#E6EBF4 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(34,53,92,.10);
    transition:filter .12s}
  .cal-cell:hover{filter:brightness(1.05)}
  .cal-cell.empty{background:transparent;border:0;cursor:default;min-height:0}
  .cal-cell.sel{border-color:var(--pine);box-shadow:0 0 0 2px rgba(34,53,92,.18)}
  .cal-cell.today{background:#EDF1F8}
  .cal-cell .dnum{font-size:13px;font-weight:700;color:var(--pine-deep);margin-bottom:2px}
  .cal-cell .dnum.sun{color:#A8442F}.cal-cell .dnum.sat{color:#3D5A80}
  .cal-cell.today .dnum::after{content:"오늘";font-size:9.5px;font-weight:600;margin-left:4px;
    color:#fff;background:var(--pine);border-radius:6px;padding:0 5px}
  .cal-ev{font-size:11px;color:#fff;border-radius:5px;padding:1px 5px;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-more{font-size:10.5px;color:var(--muted)}
  .cal-bd{font-size:11px;color:#8A4A12;background:#FBEFE2;border-radius:5px;padding:1px 5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-item{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid #E9EDF4}
  .cal-item:last-child{border-bottom:0}
  .cal-item .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .bd-card{display:flex;align-items:center;gap:8px;border:1px solid #BAC5D9;
    background:linear-gradient(180deg,#FFFFFF 0%,#EFF3F9 46%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 2px 4px rgba(34,53,92,.12);
    border-radius:10px;padding:8px 12px;text-align:left;font-size:14.5px}
  .bd-card:hover{border-color:var(--pine)}
  .bd-day{background:#FBEFE2;color:#8A4A12;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:600}
  .bd-name{font-weight:600;color:var(--pine-deep)}
  @media(max-width:560px){
    .cal-cell{min-height:62px;padding:3px}
    .cal-cell .dnum{font-size:12px}
    .cal-ev,.cal-bd{font-size:9.5px;padding:0 3px}
  }
  /* 출석 통계 */
  .att-summary{display:grid;grid-template-columns:minmax(200px,1fr) minmax(300px,1.35fr);gap:18px;margin-top:12px}
  @media(max-width:820px){.att-summary{grid-template-columns:1fr}}
  .att-names{max-height:330px;overflow-y:auto;padding-right:6px;font-size:14.5px;line-height:1.55}
  .att-chart{background:var(--pine-soft);border-radius:12px;padding:12px 14px}
  .chart-head{display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
  .chart-head b{font-family:"Gowun Batang","Noto Sans KR",serif;color:var(--pine-deep);font-size:15px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;font-size:15.5px;line-height:1.55}
  h1,h2,h3{font-family:"Gowun Batang","Noto Sans KR",serif;letter-spacing:-.01em}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;max-width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
  textarea{width:100%;resize:vertical}
  .wrap{max-width:1020px;margin:0 auto;padding:0 16px 70px}

  header.top{background:var(--pine-deep);color:#EEF1F7;position:sticky;top:0;z-index:20;
    box-shadow:0 2px 10px rgba(20,40,32,.25)}
  .top-in{max-width:1320px;margin:0 auto;padding:10px 14px;
    display:flex;flex-wrap:nowrap;align-items:center;gap:10px}
  .top-in > .brand{flex:0 0 auto}
  .top-in > .back-btn{flex:0 0 auto}
  .top-in > nav{flex:1 1 auto;min-width:0}
  .top-in > .top-right{flex:0 0 auto;margin-left:auto}
  .brand{font-family:"Gowun Batang",serif;font-weight:700;font-size:18px;
    display:flex;align-items:center;gap:7px;white-space:nowrap}
  .brand svg{flex:none}
  .brand button{background:none;border:none;color:inherit;font:inherit;padding:0;text-align:left}
  .brand button:hover{text-decoration:underline}
  .logo-btn{background:transparent;border:0;padding:0;line-height:0;cursor:pointer;
    border-radius:8px;-webkit-tap-highlight-color:transparent}
  .logo-btn:hover{opacity:.8}
  .back-btn{color:#EEF1F7;padding:6px 12px;border-radius:11px;font-size:14px;font-weight:600;
    white-space:nowrap;border:1px solid rgba(255,255,255,.26);
    background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.04) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.32), 0 1px 3px rgba(0,0,0,.28)}
  .back-btn:hover{background:rgba(255,255,255,.26)}
  .back-btn.off{visibility:hidden;pointer-events:none}
  nav{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap}
  .top-right{display:flex;gap:4px;align-items:center;white-space:nowrap}
  /* 화면이 좁아질수록 조금씩 더 줄여 한 줄을 지킨다 */
  nav button{background:none;border:1px solid transparent;color:#CFDDD6;padding:7px 10px;
    border-radius:11px;font-weight:500;font-size:14.5px;
    transition:filter .12s, transform .08s, background .12s}
  nav button:not(.on):hover{background:rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  nav button:active{transform:translateY(1px)}
  nav button.on{color:#33280B;font-weight:700;border:1px solid #8C6C1E;
    text-shadow:0 1px 0 rgba(255,255,255,.42);
    background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 44%,#B8912F 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.18),
      0 2px 4px rgba(0,0,0,.24)}
  .backup-btn{color:#EEF1F7;padding:6px 11px;border-radius:11px;font-size:13px;white-space:nowrap;
    border:1px solid rgba(255,255,255,.24);
    background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.11) 46%,rgba(255,255,255,.03) 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 1px 3px rgba(0,0,0,.30);
    transition:filter .12s, transform .08s}
  .backup-btn:hover{filter:brightness(1.25)}
  .backup-btn:active{transform:translateY(1px)}
  @media (max-width:1240px){
    .top-in{gap:8px;padding:9px 12px}
    .brand{font-size:17px}
    nav button{padding:7px 8px;font-size:14px}
    .backup-btn{padding:5px 9px;font-size:12.5px}
    .back-btn{padding:6px 10px;font-size:13.5px}
  }
  @media (max-width:1080px){
    .brand{font-size:15.5px;gap:6px}
    .brand svg{width:22px;height:22px}
    nav button{padding:6px 7px;font-size:13.5px}
    .backup-btn{padding:5px 8px;font-size:12px}
    .back-btn{padding:5px 9px;font-size:13px}
    .top-in{gap:6px}
  }
  @media (max-width:860px){
    .brand button{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .backup-btn{padding:4px 7px;font-size:11.5px}
    nav button{padding:6px 6px;font-size:13px}
  }

  .hero{position:relative;border-radius:16px;overflow:hidden;margin:20px 0 22px;
    box-shadow:0 8px 28px rgba(30,63,54,.28)}
  .hero svg{display:block;width:100%;height:auto}
  .hero-text{position:absolute;left:0;right:0;bottom:0;padding:18px 26px;
    background:linear-gradient(transparent,rgba(12,20,38,.74));color:#F7F3E6}
  .hero-text h1{margin:0;font-size:clamp(22px,4.2vw,34px)}
  .hero-text p{margin:4px 0 0;font-size:clamp(13px,2.2vw,15.5px);color:#DCE3F0}

  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-family:"Gowun Batang",serif;font-size:30px;font-weight:700;color:var(--pine)}
  .stat .l{color:var(--muted);font-size:13.5px}
  .stat.gold .n{color:var(--gold)}
  .stat.clay .n{color:var(--clay)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .panel h2{margin:0 0 12px;font-size:19px;color:var(--pine-deep);
    border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:3px}
  .panel h3{margin:18px 0 8px;font-size:16.5px;color:var(--pine-deep)}
  .muted{color:var(--muted)}
  .small{font-size:13.5px}

  /* 물방울(광택) 단추 — 위는 밝고 아래는 짙게, 안쪽 위에 흰 하이라이트 */
  .btn{color:#fff;border:1px solid #1B2C4E;border-radius:13px;padding:9px 17px;font-weight:600;
    background:linear-gradient(180deg,#5A7FB4 0%,#2E4E82 42%,#22355C 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -2px 5px rgba(0,0,0,.20),
      0 2px 5px rgba(22,34,61,.28);
    text-shadow:0 1px 1px rgba(0,0,0,.28);transition:filter .12s, transform .08s, box-shadow .12s}
  .btn:hover{filter:brightness(1.09)}
  .btn:active{transform:translateY(1px);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.32), 0 1px 2px rgba(22,34,61,.25)}
  .btn.gold{color:#33280B;border-color:#8C6C1E;text-shadow:0 1px 0 rgba(255,255,255,.35);
    background:linear-gradient(180deg,#EBD9A4 0%,#D3B159 42%,#B8912F 100%)}
  .btn.ghost{color:var(--pine);border:1px solid #B9C4D8;text-shadow:0 1px 0 rgba(255,255,255,.8);
    background:linear-gradient(180deg,#FFFFFF 0%,#EDF1F8 48%,#DCE3EF 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 4px rgba(34,53,92,.10),
      0 2px 5px rgba(34,53,92,.14)}
  .btn.danger{color:#8E3826;border-color:#D9B3A9;text-shadow:0 1px 0 rgba(255,255,255,.7);
    background:linear-gradient(180deg,#FFFFFF 0%,#FBEDE9 48%,#F2DAD2 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 4px rgba(142,56,38,.10),
      0 2px 5px rgba(142,56,38,.14)}
  .btn.sm{padding:5px 12px;font-size:13.5px;border-radius:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .field label{font-weight:600;font-size:13.5px;color:var(--pine-deep)}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 16px}

  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
    border:1px solid rgba(34,53,92,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(34,53,92,.10)}
  .chip.pos{background:var(--pine-soft);color:var(--pine-deep)}
  .chip.now{background:var(--gold-soft);color:#7A5E14}
  .chip.past{background:#EEECE3;color:var(--muted)}
  .chip.open{background:var(--clay-soft);color:var(--clay)}
  .chip.ans{background:var(--pine-soft);color:var(--pine)}
  .chip.admin{background:var(--gold-soft);color:#7A5E14}
  .chip.editor{background:var(--pine-soft);color:var(--pine-deep)}
  .chip.pending{background:var(--clay-soft);color:var(--clay)}
  .chip.viewer{background:#E2E9F2;color:#3D5A80}

  .mem-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:6px}
  .mem-card{border:1px solid #BAC5D9;border-radius:13px;padding:8px 10px;text-align:left;

const {useState, useEffect, useMemo, useRef, useCallback} = React;

/* ───────── 공통 ───────── */
const CFG_KEY = "church-app-server-config";

// ▼▼ 아래 두 줄에 서버 정보를 넣으면 '처음 설정' 화면 없이 링크만으로 접속됩니다 ▼▼

/* 가져오기(합치기)에서 빈 값이 기존 값을 덮어쓰지 않도록 필드 단위로 병합 */
const isEmptyVal = v => v===undefined || v===null || v==="" || (Array.isArray(v) && v.length===0);
const mergeMember = (ex, im) => { const out={...ex}; for(const k in im){ if(!isEmptyVal(im[k])) out[k]=im[k]; } return out; };

/* 교인 사진: 선택한 이미지 파일을 작게 압축해 base64 문자열로 변환 */
const readPhoto = (file) => new Promise((resolve, reject)=>{
  const r = new FileReader();
  r.onerror = () => reject(new Error("read"));
  r.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("img"));
    img.onload = () => {
      const max = 480;
      let w = img.width, h = img.height;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowLocal = () => { const d = new Date(); return `${todayStr()}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WEEKDAYS = ["일","월","화","수","목","금","토"];
const weekdayOf = ds => { const d = new Date(ds + "T00:00:00"); return isNaN(d) ? "" : WEEKDAYS[d.getDay()]; };
const lastWeekday = (dow) => {
  const d = new Date(); const diff = (d.getDay() - dow + 7) % 7;
  d.setDate(d.getDate() - diff);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const koAge = birth => {
  if (!birth) return null;
  const y = parseInt(String(birth).slice(0,4), 10);
  if (!y) return null;
  return new Date().getFullYear() - y + 1;
};
const calcAge = birth => {
  if (!birth) return null;
  const b = new Date(birth + "T00:00:00"); if (isNaN(b)) return null;
  const t = new Date(); let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a;
};
const fmtDT = v => {
  if (!v) return "";
  const [d, t] = v.split("T");
  return t ? `${d} (${weekdayOf(d)}) ${t}` : `${d} (${weekdayOf(d)})`;
};
const koSort = (a, b) => (a.name || "").localeCompare(b.name || "", "ko");
const errMsg = e => (e && e.message) ? e.message : "알 수 없는 오류";

/* ═══ 교회마다 다를 수 있는 값들 — 설정 화면에서 바꿉니다 ═══ */
let SERVICES = [
  {key:"sun", label:"주일예배", dow:0},

const isDeceased = m => (m && m.position) === "소천" || /소천/.test((m && m.memo) || "");
const PURPOSES = ["정기심방","새가족심방","환우심방","경조사","상담","전도","기도","기타"];
const RELATIONS = ["남편","아내","배우자","아들","딸","자녀","며느리","사위","손자","손녀","외손자","외손녀","조카","아버지","어머니","할아버지","할머니","형","오빠","누나","언니","남동생","여동생","형제","자매","삼촌","고모","이모","외삼촌","기타"];

/* 속회(선교회) 배정: 메모의 선교회 기록 우선, 없으면 성별+출생연도로 자동 */
/* 교회학교 반 편성 기본값 — 화면에서 이름을 고치거나 반을 더할 수 있음 */
const DEFAULT_CLASSES = {
  child: ["번개반", "기도반", "키즈쉐프반"],
};
const uid2 = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* 부서·속별 색과 아이콘 */
const DEPT_STYLE = {
  kinder: {bg:"linear-gradient(135deg,#E8913C,#D9762A)", ico:"🧸"},

const SOK_STYLE = {
  "남1":{bg:"linear-gradient(135deg,#22355C,#16223D)"},
  "남2":{bg:"linear-gradient(135deg,#2C4674,#1D2F52)"},
  "남3":{bg:"linear-gradient(135deg,#375788,#22355C)"},
  "여1":{bg:"linear-gradient(135deg,#A8442F,#7E2F20)"},
  "여2":{bg:"linear-gradient(135deg,#B4553C,#8A3A28)"},
  "여3":{bg:"linear-gradient(135deg,#BE6647,#95462F)"},
  "여4":{bg:"linear-gradient(135deg,#C29B3C,#9A7828)"},
  "여5":{bg:"linear-gradient(135deg,#B98A46,#8F6A2F)"},
  "여6":{bg:"linear-gradient(135deg,#A87E52,#7E5C38)"},

};
const headStyle = key => {
  if(!key) return {background:"linear-gradient(135deg,#7A869C,#59637A)", ico:"•"};
  const k = String(key);
  if(k === "MIN") return {background:"linear-gradient(135deg,#B8912F,#8C6C1E)", ico:"✝"};
  if(k === "SAMO") return {background:"linear-gradient(135deg,#9C7BA6,#75577F)", ico:"❦"};
  if(k === "GUEST") return {background:"linear-gradient(135deg,#7A869C,#59637A)", ico:"✦"};
  if(k.indexOf("S_")===0){
    const dep = k.slice(2).split("_")[0];
    const s = DEPT_STYLE[dep] || {};
    return {background: s.bg || "linear-gradient(135deg,#3F7FA8,#2C5E80)", ico: s.ico || "🎒"};
  }

  if(s) return {background:s.bg, ico: k[0]==="남" ? "♦" : "❀"};
  if(k[0]==="남" || k[0]==="여"){
    const n = Number(k.slice(1)) || 1;

    const step = k[0]==="남" ? 14 : 10;

let SOK_MODE = "age";
/* 직접 지정·주소 방식일 때 쓰는 속 목록 [{id, name, areas:["화곡1동","화곡2동"]}] */
let SOK_LIST = [];

let SOK_F = [[1948,1],[1954,2],[1958,3],[1962,4],[1968,5],[1973,6],[9999,7]];

};

/* 설정된 속 개수에 맞춘 키 목록: 남1..남n, 여1..여m */

  ? SOK_LIST.map(s=>s.id)
  : [ ...SOK_M.map((_,i)=>"남"+(i+1)), ...SOK_F.map((_,i)=>"여"+(i+1)) ];
/* 키 하나의 이름표 */
const sokKeyLabel = k => SOK_MODE === "manual"
  ? ((SOK_LIST.find(s=>s.id===k)||{}).name || "속 미지정")
  : sokLabel({g:k[0], n:Number(k.slice(1))});
function sokOf(m){
  if(isMinister(m) || isSamo(m) || isYoungAdult(m)) return null;   /* 교역자·사모·청년은 속 편성 제외 */

  if(SOK_MODE === "manual" || SOK_MODE === "area"){
    /* 사람에게 직접 지정한 속이 있으면 그것이 우선 */
    const id = m && m.sok;
    if(id && SOK_LIST.some(s=>s.id===id)) return {id};
    /* 주소 방식이면 주소에 든 지역 이름으로 찾음 */
    if(SOK_MODE === "area"){
      const addr = normArea(m && m.address);
      if(addr){
        for(const s of SOK_LIST){
          for(const a of (s.areas||[])){
            const key = normArea(a);
            if(key && addr.indexOf(key) >= 0) return {id:s.id};
          }
        }
      }
    }
    return null;
  }

  const memo = m.memo || "";
  let t = memo.match(/([0-9])\s*여선교회/); if(t) return {g:"여", n:Number(t[1])};
  t = memo.match(/([0-9])\s*남선교회/); if(t) return {g:"남", n:Number(t[1])};
  const y = m.birth ? Number(m.birth.slice(0,4)) : 0;
  if(y){
    const ka = koAge(m.birth);
    if(ka !== null && ka <= schoolMaxAge()) return null;   /* 교회학교(유치부~청년부) 대상은 속 편성 제외 */
    if(m.gender==="여"){ for(const p of SOK_F){ if(y<=p[0]) return {g:"여", n:p[1]}; } }
    if(m.gender==="남"){ for(const p of SOK_M){ if(y<=p[0]) return {g:"남", n:p[1]}; } }
  }
  return null;
}
/* 주소 비교용으로 정리: 공백 제거, '화곡제1동' → '화곡1동' 같은 표기 차이 흡수 */
const normArea = t => {
  if(!t) return "";
  return String(t)
    .replace(/\s+/g, "")
    .replace(/제([0-9]+)(동|가|구역)/g, "$1$2")
    .toLowerCase();
};
const sokLabel = s => {
  if(!s) return "속 미지정";
  if(s.id){ const f = SOK_LIST.find(x=>x.id===s.id); return f ? f.name : "속 미지정"; }
  return `${s.g}자 ${s.n}속 (${s.n}${s.g}선교회)`;
};
/* 현재 나이로 교회학교 부서 찾기 */
/* 한 사람이 속한 편성 구분: 남1~3, 여1~7, 교회학교 부서, 그 외 */
const scopeKeyOf = m => {
  if(isMinister(m)) return "MIN";
  if(isSamo(m)) return "SAMO";
  const s = sokOf(m);
  if(s) return s.id ? s.id : s.g + s.n;
  const d = schoolDeptOf(m);
  if(d) return "S_" + d.key;
  return "zz";
};
/* 미소속 방문자 자리 — 등록하지 않은 분이 예배에 오셨을 때 인원만 세기 위한 칸 */
const GUESTS = Array.from({length:10}, (_,i)=>({
  id: "guest-" + (i+1), name: "무명" + (i+1), position: "방문", birth: "", gender: "",
  memo: "", photo: "", family: [], depts: [], visits: [], prayers: [], guest: true
}));

const ATT_ONLY = "ATT_ONLY";   /* 예배 출석 체크만 (성도 전체 · 교회학교 제외) */
const SCOPE_LIST = () => [
  [ATT_ONLY, "예배 출석 체크만 (성도 전체 · 교회학교 제외)"],
  ["MIN", "교역자"],
  ["SAMO", "사모"],
  ["SOK_ALL", "속 전체 (남·여 모든 속)"],
  ...sokKeys()
      .map(k=>[k, sokKeyLabel(k)]),
  ["S_ALL", "교회학교 전체 (유치부~청년부)"],
  ...SCHOOL_DEPTS.map(s=>["S_"+s.key, "교회학교 · "+s.label]),
];
const scopeLabel = k => { const f = SCOPE_LIST().find(x=>x[0]===k); return f ? f[1] : "편성 없음"; };
/* 한 사람의 담당 목록 (예전 방식인 문자열 하나도 그대로 읽힘) */
const scopesOf = (leaders, id) => {
  const v = (leaders||{})[id];
  if(!v) return [];
  return Array.isArray(v) ? v.filter(Boolean) : [v];
};
/* 담당 범위에 드는 사람인지 */
const inScope = (m, k) => {
  const sk = scopeKeyOf(m);
  if(k === ATT_ONLY)  return sk.indexOf("S_") !== 0;                  /* 교역자·어른 전부, 교회학교 제외 */
  if(k === "SOK_ALL") return sk === "MIN" || sk === "SAMO" || (sk !== "zz" && sk.indexOf("S_") !== 0);
  if(k === "S_ALL")   return sk.indexOf("S_") === 0;                  /* 교회학교 전부 */
  return sk === k;
};

const schoolDeptOf = m => {
  if(isMinister(m) || isSamo(m)) return null;
  if(isYoungAdult(m)) return SCHOOL_DEPTS.find(s => s.key === "young") || null;
  const a = koAge(m.birth);
  if(a === null) return null;
  return SCHOOL_DEPTS.find(s => a >= s.min && a <= s.max) || null;
};

/* ───────── 로그인 / 회원가입 ───────── */
function Auth({sb, resetServer, embedded}){
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true); setMsg("");
    try{
      if(mode === "login"){
        const {error} = await sb.auth.signInWithPassword({email, password:pw});
        if(error) setMsg("로그인 실패 — " + errMsg(error));
      }else{
        const {data, error} = await sb.auth.signUp({email, password:pw, options:{data:{name}}});
        if(error) setMsg("가입 실패 — " + errMsg(error));
        else if(!data.session) setMsg("가입 신청이 접수되었습니다. 이메일 확인이 켜져 있는 서버라면 받은 메일의 확인 버튼을 누른 뒤 로그인해 주세요.");
      }
    }catch(e){ setMsg(errMsg(e)); }
    setBusy(false);
  };

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교인 관리</div>
        <div className="auth-tabs">
          <button className={mode==="login"?"on":""} onClick={()=>{setMode("login");setMsg("");}}>로그인</button>
          <button className={mode==="signup"?"on":""} onClick={()=>{setMode("signup");setMsg("");}}>가입 신청</button>
        </div>
        {mode==="signup" &&
          <div className="field"><label>이름</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="실명을 입력해 주세요"/></div>}
        <div className="field"><label>이메일</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></div>
        <div className="field"><label>비밀번호</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="6자 이상"
            onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/></div>
        {msg && <div className="err-banner">{msg}</div>}
        <button className="btn" style={{width:"100%"}} disabled={busy || !email || pw.length<6 || (mode==="signup" && !name.trim())}
          onClick={submit}>{busy ? "처리 중…" : (mode==="login" ? "로그인" : "가입 신청")}</button>
        {mode==="signup" &&
          <p className="small muted" style={{marginBottom:0}}>가입 후에는 <b>관리자(담임목사)의 승인</b>이 있어야 교인 기록을 볼 수 있습니다.</p>}
        {!embedded && <React.Fragment>
          <hr className="divider"/>
          <button className="btn sm ghost" onClick={resetServer}>서버 주소 다시 설정</button>
        </React.Fragment>}
      </div>
    </div>
  );
}

/* ───────── 교회 고르기 · 만들기 · 가입 신청 ───────── */
function ChurchPicker({sb, session, logout, onPick}){
  const [rows, setRows] = useState(null);      /* 내가 속한/신청한 교회들 */
  const [mode, setMode] = useState("");        /* "" | "new" | "join" */
  const [name, setName] = useState("");
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const load = useCallback(async ()=>{
    setErr("");
    const {data, error} = await sb.from("church_users")
      .select("church_id, role, churches(name, join_code)")
      .eq("user_id", session.user.id);
    if(error){ setErr(errMsg(error)); setRows([]); return; }
    setRows((data||[]).map(r=>({
      id: r.church_id, role: r.role,
      name: (r.churches && r.churches.name) || "이름 없는 교회",
      code: (r.churches && r.churches.join_code) || "",
    })));
  }, [sb, session]);
  useEffect(()=>{ load(); }, [load]);

  const makeChurch = async ()=>{
    if(!name.trim()) return;
    setBusy(true); setErr("");
    const {data, error} = await sb.rpc("create_church", {p_name: name.trim()});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    onPick(data);
  };
  const joinChurch = async ()=>{
    if(!code.trim()) return;
    setBusy(true); setErr("");
    const {error} = await sb.rpc("join_church", {p_code: code.trim().toUpperCase()});
    setBusy(false);
    if(error){ setErr(errMsg(error)); return; }
    setMode(""); setCode(""); load();
  };

  if(rows === null)
    return <div className="center-box"><div className="panel empty">교회를 확인하는 중…</div></div>;

  return (
    <div className="center-box">
      <div className="panel">
        <div className="logo-line"><Logo/> 교인 관리</div>
        <p className="small muted" style={{marginTop:0}}>
          {session.user.email} 님으로 접속했습니다.</p>
        {err && <p style={{color:"var(--clay)"}}>{err}</p>}

        {rows.length > 0 && <React.Fragment>
          <h2>내 교회</h2>
          {rows.map(r=>(
            <div className="ch-row" key={r.id}>
              <div style={{flex:1}}>
                <b>{r.name}</b>
                {r.role === "pending"
                  ? <div className="muted small">승인을 기다리는 중입니다</div>
                  : <div className="muted small">{ROLE_LABEL[r.role] || r.role}
                      {r.role==="admin" && r.code && ` · 가입 코드 ${r.code}`}</div>}
              </div>
              {r.role === "pending"
                ? <button className="btn sm ghost" onClick={load}>승인 확인</button>
                : <button className="btn sm" onClick={()=>onPick(r.id)}>들어가기</button>}
            </div>))}
        </React.Fragment>}

        {mode === "" && <div className="row" style={{marginTop:16}}>
          <button className="btn" onClick={()=>setMode("new")}>+ 우리 교회 만들기</button>
          <button className="btn ghost" onClick={()=>setMode("join")}>가입 코드로 신청</button>
          <button className="btn ghost" style={{marginLeft:"auto"}} onClick={logout}>로그아웃</button>
        </div>}

        {mode === "new" && <div style={{marginTop:16}}>
          <h2>우리 교회 만들기</h2>
          <p className="small muted" style={{marginTop:0}}>
            교회를 만든 분이 <b>관리자</b>가 됩니다. 만들고 나면 <b>가입 코드</b>가 생기는데,
            그 코드를 교역자·속장님께 알려 주면 각자 가입 신청을 할 수 있습니다.</p>
          <div className="field"><label>교회 이름</label>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="예) 한빛교회" onKeyDown={e=>e.key==="Enter"&&makeChurch()}/></div>
          <div className="row">
            <button className="btn" disabled={busy || !name.trim()} onClick={makeChurch}>
              {busy ? "만드는 중…" : "만들기"}</button>
            <button className="btn ghost" onClick={()=>setMode("")}>취소</button>
          </div>
        </div>}

        {mode === "join" && <div style={{marginTop:16}}>
          <h2>가입 코드로 신청</h2>
          <p className="small muted" style={{marginTop:0}}>
            교회 관리자에게 받은 <b>6자리 코드</b>를 넣어 주세요. 신청 뒤 관리자가 승인하면 들어갈 수 있습니다.</p>
          <div className="field"><label>가입 코드</label>
            <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())}
              placeholder="ABC123" maxLength={6}
              style={{letterSpacing:"4px", fontSize:"18px", fontWeight:700, textAlign:"center"}}
              onKeyDown={e=>e.key==="Enter"&&joinChurch()}/></div>
          <div className="row">
            <button className="btn" disabled={busy || code.length<4} onClick={joinChurch}>
              {busy ? "신청 중…" : "신청하기"}</button>
            <button className="btn ghost" onClick={()=>setMode("")}>취소</button>
          </div>
        </div>}
      </div>
    </div>
  );
}

  const [cfg, setCfg] = useState(()=>{

    return null;
  });
  const sb = useMemo(()=> cfg ? supabase.createClient(cfg.url, cfg.key) : null, [cfg]);
  const [session, setSession] = useState(undefined); // undefined=확인 중
  const [profile, setProfile] = useState(undefined);

  useEffect(()=>{
    if(!sb){ setSession(null); return; }
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub} = sb.auth.onAuthStateChange((_e, s)=>setSession(s||null));
    return ()=>sub.subscription.unsubscribe();
  }, [sb]);

  /* 고른 교회 */
  const [churchId, setChurchId] = useState(()=>{
    try{ return localStorage.getItem(PICK_KEY) || ""; }catch(_){ return ""; }
  });
  const pickChurch = id => { try{ localStorage.setItem(PICK_KEY, id); }catch(_){} setChurchId(id); };
  const leaveChurch = () => { try{ localStorage.removeItem(PICK_KEY); }catch(_){} setChurchId(""); setProfile(undefined); };

  const loadProfile = useCallback(async ()=>{
    if(!sb || !session || !churchId){ setProfile(undefined); return; }
    const {data, error} = await sb.from("church_users")
      .select("role,name,email").eq("church_id", churchId).eq("user_id", session.user.id).maybeSingle();
    if(error || !data){ setProfile(null); return; }   /* 그 교회 소속이 아님 */
    setProfile({id:session.user.id, email:data.email || session.user.email,
                name:data.name || "", role:data.role});
  }, [sb, session, churchId]);

  useEffect(()=>{ if(session && churchId) loadProfile(); }, [session, churchId, loadProfile]);

  const [lastCfg, setLastCfg] = useState(null);
  const saveCfg = c => { localStorage.setItem(CFG_KEY, JSON.stringify(c)); setCfg(c); };
  const resetServer = () => { setLastCfg(cfg); localStorage.removeItem(CFG_KEY); setCfg(null); };
  const logout = async () => { await sb.auth.signOut(); setProfile(undefined); };

  if(!cfg) return <Setup onSave={saveCfg} initial={lastCfg}/>;
  if(session === undefined) return <div className="center-box"><div className="panel empty">서버에 연결하는 중…</div></div>;
  if(!session) return <Auth sb={sb} resetServer={resetServer} embedded={embedded}/>;
  if(!churchId) return <ChurchPicker sb={sb} session={session} logout={logout} onPick={pickChurch}/>;
  if(profile === undefined) return <div className="center-box"><div className="panel empty">사용자 정보를 확인하는 중…</div></div>;
  if(profile === null){ leaveChurch(); return <div className="center-box"><div className="panel empty">교회를 다시 고르는 중…</div></div>; }
  if(profile.role === "pending") return <Pending profile={profile} logout={logout} refresh={loadProfile} back={leaveChurch}/>;
  return <App sb={sb} profile={profile} logout={logout} churchId={churchId} leaveChurch={leaveChurch}/>;
}

/* ───────── 앱 본체 ───────── */
function App({sb, profile, logout, churchId, leaveChurch}){
  const [churchName, setChurchName] = useState("우리교회");
  const [members, setMembers] = useState([]);
  const [att, setAtt] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [err, setErr] = useState("");
  const [entered, setEntered] = useState(false);   /* 시작 화면 → 들어가기 */
  const [view, setView] = useState("home");
  const [memView, setMemView] = useState({mode:"list"});
  const fileRef = useRef(null);
  const [leaders, setLeaders] = useState({});   /* {사용자ID: "여3"} 담당 속 */
  /* 교회학교 반: {부서키: {classes:[{id,name}], of:{교인ID:반ID}}} */
  const [schoolClasses, setSchoolClasses] = useState({});
  const [events, setEvents] = useState([]);   /* 교회 행사 [{id,date,endDate,title,place,note,kind}] */
  const [specials, setSpecials] = useState([]);  /* 특별예배 [{key,label,from,to}] */
  const [joinCode, setJoinCode] = useState("");
  const [cfgVer, setCfgVer] = useState(0);       /* 설정이 바뀌면 화면 다시 그리기 */
  const isAdmin = profile.role === "admin";
  const myScopes = scopesOf(leaders, profile.id);
  const isLeader = !isAdmin && myScopes.length > 0;             /* 속장 · 교회학교 교사 */
  /* 명단에서 볼 수 있는 범위 — '예배 출석 체크만'은 명단 권한이 아니므로 뺀다 */
  const listScopes = myScopes.filter(k => k !== ATT_ONLY);
  const canEdit = !isLeader && (profile.role === "admin" || profile.role === "editor");
  const canCheckAtt = canEdit || isLeader;                      /* 출석 체크 가능 */
  /* 교회학교 담당 교사인지 (부서 하나 이상 맡은 경우) */
  const isSchoolTeacher = isLeader && listScopes.some(k => k === "S_ALL" || k.indexOf("S_") === 0);
  /* 출석 체크만 맡은 분 — 다른 담당이 함께 있으면 명부도 볼 수 있음 */
  const attOnly = isLeader && listScopes.length === 0;   /* 명단 권한 없이 출석만 맡은 분 */
  /* 이 사람의 정보를 고칠 수 있는가 — 교사는 자기 담당 학생만 */
  const canEditMember = (m) => {
    if(canEdit) return true;
    if(!m || !isSchoolTeacher) return false;
    if(!schoolDeptOf(m)) return false;                          /* 어른은 못 고침 */
    return listScopes.some(k => inScope(m, k));                 /* 담당 부서 학생만 */
  };
  /* 속장은 자기 속(또는 담당 부서) 사람만 보임 */
  const myMembers = isLeader
    ? members.filter(m => listScopes.some(k => inScope(m, k)))
    : members;
  /* 출석 체크에서 볼 수 있는 범위 — 담당 전부 (출석 체크만 포함) */
  const attMembers = isLeader
    ? members.filter(m => myScopes.some(k => inScope(m, k)))
    : members;
  /* 속장·교사가 담당 범위 밖이라도 볼 수 있는 사람: 담당 교인과 가족으로 이어진 분 (한 다리까지) */
  const viewMembers = useMemo(()=>{
    if(!isLeader) return members;
    const mine = myMembers;
    const mineIds = new Set(mine.map(x=>x.id));
    const nm = s => (s||"").trim();
    const famNames = new Set();
    mine.forEach(x => (x.family||[]).forEach(f => { if(nm(f.name)) famNames.add(nm(f.name)); }));
    const myNames = new Set(mine.map(x=>nm(x.name)).filter(Boolean));
    const extra = members.filter(x =>
      !mineIds.has(x.id) && (
        famNames.has(nm(x.name)) ||                                   /* 담당 교인의 가족란에 있는 분 */
        (x.family||[]).some(f => myNames.has(nm(f.name)))             /* 그분의 가족란에 담당 교인이 있는 경우 */
      ));
    return [...mine, ...extra];
  }, [isLeader, members, myMembers]);

  const fail = e => setErr("저장/불러오기에 실패했습니다 — 원인: " + errMsg(e) + " · 이 문구를 Claude에게 보여주시면 해결할 수 있습니다.");

  const loadAll = useCallback(async ()=>{
    setErr("");
    const ch = await sb.from("churches").select("name,join_code").eq("id", churchId).maybeSingle();
    if(ch.data){ setChurchName(ch.data.name || "우리교회"); setJoinCode(ch.data.join_code || ""); }
    const [m, a, s] = await Promise.all([
      sb.from("members").select("id,data").eq("church_id", churchId),
      sb.from("attendance").select("date,service,ids").eq("church_id", churchId),
      sb.from("settings").select("key,value").eq("church_id", churchId),
    ]);
    if(m.error) return fail(m.error);
    if(a.error) return fail(a.error);
    setMembers((m.data||[]).map(r=>r.data));
    const na = {};
    (a.data||[]).forEach(r=>{ na[r.date] = na[r.date]||{}; na[r.date][r.service] = r.ids||[]; });
    setAtt(na);
    if(!s.error){
      const cc = (s.data||[]).find(r=>r.key==="churchConfig");
      if(cc && cc.value){ try{ applyChurchConfig(JSON.parse(cc.value)); setCfgVer(v=>v+1); }catch(_){} }
      const sp = (s.data||[]).find(r=>r.key==="specialServices");
      if(sp && sp.value){ try{ setSpecials(JSON.parse(sp.value)||[]); }catch(_){ setSpecials([]); } }
      else setSpecials([]);
      const ev = (s.data||[]).find(r=>r.key==="events");
      if(ev && ev.value){ try{ setEvents(JSON.parse(ev.value)||[]); }catch(_){ setEvents([]); } }
      else setEvents([]);
      const sc = (s.data||[]).find(r=>r.key==="schoolClasses");
      if(sc && sc.value){ try{ setSchoolClasses(JSON.parse(sc.value)||{}); }catch(_){ setSchoolClasses({}); } }
      const ld = (s.data||[]).find(r=>r.key==="leaders");
      if(ld && ld.value){ try{ setLeaders(JSON.parse(ld.value)||{}); }catch(_){ setLeaders({}); } }
      else setLeaders({});
    }
    setLoaded(true);
  }, [sb, churchId]);

  useEffect(()=>{ if(churchId) loadAll(); }, [loadAll, churchId]);

  /* ── 서버 쓰기 ── */
  const saveMemberRow = async (m) => {
    setMembers(ms => ms.some(x=>x.id===m.id) ? ms.map(x=>x.id===m.id?m:x) : [...ms, m]);
    const {error} = await sb.from("members")
      .upsert({church_id:churchId, id:m.id, data:m});
    if(error){ fail(error); loadAll(); }
  };
  const updateMember = (id, fn) => {
    const cur = members.find(x=>x.id===id); if(!cur) return;
    saveMemberRow(fn(cur));
  };
  const removeMember = async (id) => {
    setMembers(ms=>ms.filter(x=>x.id!==id));
    const {error} = await sb.from("members").delete().eq("church_id", churchId).eq("id", id);
    if(error){ fail(error); loadAll(); return; }
    // 출석 기록에서도 제거
    const updates = [];
    const na = {};
    for(const d in att){
      na[d] = {};
      for(const s in att[d]){
        const ids = att[d][s];
        if(ids.includes(id)){
          const nids = ids.filter(x=>x!==id);
          na[d][s] = nids;
          updates.push({church_id:churchId, date:d, service:s, ids:nids});
        }else na[d][s] = ids;
      }
    }
    setAtt(na);
    if(updates.length){
      const {error:e2} = await sb.from("attendance").upsert(updates);
      if(e2){ fail(e2); loadAll(); }
    }
  };
  const saveAtt = async (date, service, ids) => {
    setAtt(a=>({...a, [date]:{...(a[date]||{}), [service]:ids}}));
    const {error} = await sb.from("attendance")
      .upsert({church_id:churchId, date, service, ids});
    if(error){ fail(error); loadAll(); }
  };
  const renameChurch = async () => {
    const n = prompt("교회 이름을 입력하세요", churchName);
    if(!n || !n.trim()) return;
    setChurchName(n.trim());
    const {error} = await sb.from("churches").update({name:n.trim()}).eq("id", churchId);
    if(error) fail(error);
  };

  /* ── 백업 ── */
  const doExport = () => {
    const blob = new Blob([JSON.stringify({version:1, exportedAt:new Date().toISOString(), churchName, members, att}, null, 2)],
      {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `교인관리_백업_${todayStr()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  const [pendingImport, setPendingImport] = useState(null);
  const doImport = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.members)) throw new Error("형식 오류");
        setPendingImport(d);
      }catch(e){ alert("백업 파일을 읽지 못했습니다. 이 프로그램에서 내보낸 JSON 파일인지 확인해 주세요."); }
    };
    r.readAsText(file);
  };
  const runImport = async (mode) => {
    const d = pendingImport;
    setPendingImport(null);
    setErr("");
    let e;
    if(mode === "replace"){
      ({error:e} = await sb.from("members").delete().eq("church_id", churchId)); if(e) return fail(e);
      ({error:e} = await sb.from("attendance").delete().eq("church_id", churchId)); if(e) return fail(e);
    }
    const curById = {};
    if(mode === "merge") members.forEach(x=>{ curById[x.id] = x; });
    const rows = (d.members||[]).map(im=>{
      const data = (mode === "merge" && im.id && curById[im.id]) ? mergeMember(curById[im.id], im) : im;
      return {church_id:churchId, id:im.id||uid(), data};
    });
    for(let i=0;i<rows.length;i+=100){
      ({error:e} = await sb.from("members").upsert(rows.slice(i,i+100))); if(e) return fail(e);
    }
    const attIn = d.att||{};
    const arows = [];
    for(const dt in attIn) for(const s in attIn[dt]){
      let ids = attIn[dt][s]||[];
      if(mode === "merge"){
        const cur = (att[dt] && att[dt][s]) || [];
        ids = Array.from(new Set([...cur, ...ids]));
      }
      if(ids.length) arows.push({church_id:churchId, date:dt, service:s, ids});
    }
    for(let i=0;i<arows.length;i+=100){
      ({error:e} = await sb.from("attendance").upsert(arows.slice(i,i+100))); if(e) return fail(e);
    }
    await loadAll();
    alert(mode === "merge" ? "명단을 합쳐 넣었습니다." : "가져오기(전체 교체)가 완료되었습니다.");
  };

  const saveConfig = async (next) => {
    applyChurchConfig(next); setCfgVer(v=>v+1);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"churchConfig", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveSpecials = async (next) => {
    setSpecials(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"specialServices", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveEvents = async (next) => {
    setEvents(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"events", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveClasses = async (next) => {
    setSchoolClasses(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"schoolClasses", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const saveLeaders = async (next) => {
    setLeaders(next);
    const {error} = await sb.from("settings").upsert({church_id:churchId, key:"leaders", value:JSON.stringify(next)});
    if(error){ fail(error); loadAll(); }
  };

  const byId = id => members.find(m => m.id === id);
  
  /* 뒤로 가기: 지나온 화면을 쌓아 두었다가 한 걸음씩 되돌아감 */
  const histRef = useRef([]);
  const [histLen, setHistLen] = useState(0);
  const nowScreen = useRef({view:"home", memView:{mode:"list"}});
  nowScreen.current = {view, memView};

  const pushHistory = (from) => {
    const cur = from || nowScreen.current;
    const last = histRef.current[histRef.current.length-1];
    /* 같은 화면이면 쌓지 않음 */
    if(last && last.view===cur.view &&
       (last.memView||{}).mode===(cur.memView||{}).mode &&
       (last.memView||{}).id===(cur.memView||{}).id) return;
    histRef.current = [...histRef.current.slice(-29), cur];
    setHistLen(histRef.current.length);
  };
  const goBack = () => {
    if(!histRef.current.length) return;
    const prev = histRef.current[histRef.current.length-1];
    histRef.current = histRef.current.slice(0, -1);
    setHistLen(histRef.current.length);
    setView(prev.view);
    setMemView(prev.memView || {mode:"list"});
    window.scrollTo(0,0);
  };

  const go = v => {
    if(isLeader && (v==="visit" || v==="pray" || v==="team")) return;
    if(attOnly && v!=="home" && v!=="att" && v!=="cal") return;
    if(v !== view) pushHistory();
    setView(v); if(v==="members") setMemView({mode:"list"}); window.scrollTo(0,0);
  };
  const openMember = id => {
    if(attOnly) return;
    if(isLeader && !viewMembers.some(m=>m.id===id)) return;
    pushHistory();
    setView("members"); setMemView({mode:"detail", id}); window.scrollTo(0,0);
  };

  const navItems = attOnly
    ? [["home","홈"],["att","예배 출석 체크"]]
    : isLeader
    ? [["home","홈"],
       ["members", listScopes.every(k=>k.indexOf("S_")===0) ? "우리 부서"
                 : listScopes.some(k=>k.indexOf("S_")===0) ? "담당 교인" : "우리 속 교인"],
       ["att","출석 체크"],["cal","달력"]]
    : [["home","홈"],["members","교인"],["att","출석"],["cal","달력"],["visit","심방"],["pray","중보기도"]];
  if(isAdmin){ navItems.push(["team","사용자"]); navItems.push(["cfg","설정"]); }

  if(!entered) return <Gate churchName={churchName} onEnter={()=>setEntered(true)}/>;

  return (
    <div>
      {pendingImport && (
        <div className="modal-back" onClick={()=>setPendingImport(null)}>
          <div className="panel" onClick={e=>e.stopPropagation()}>
            <h2>명단 가져오기</h2>
            <p className="small">파일에 교인 <b>{pendingImport.members.length}명</b>의 기록이 있습니다. 어떻게 넣을까요?</p>
            <button className="btn" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("merge")}>
              추가하기 — 기존 기록은 그대로 두고 합침 (권장)</button>
            <button className="btn danger" style={{width:"100%",marginBottom:8}} onClick={()=>runImport("replace")}>
              전체 교체 — 기존 교인·출석 기록을 지우고 이 파일로 바꿈</button>
            <button className="btn ghost" style={{width:"100%"}} onClick={()=>setPendingImport(null)}>취소</button>
            <p className="muted small" style={{marginTop:10,marginBottom:0}}>
              추가하기를 누르면 새 교인은 추가되고, 같은 교인(같은 고유번호)은 파일 내용으로 갱신됩니다. 모든 사용자에게 함께 적용됩니다.</p>
          </div>
        </div>
      )}
      <header className="top">
        <div className="top-in">
          <div className="brand">
            <button className="logo-btn" onClick={()=>{ setEntered(false); window.scrollTo(0,0); }}
              title="시작 화면으로">
              <Logo/>
            </button>
            <button onClick={isAdmin ? renameChurch : undefined} title={isAdmin?"교회 이름 바꾸기":""}>{churchName} 교인 관리</button>
          </div>
          <button className={"back-btn"+(histLen>0?"":" off")} onClick={goBack}
            title="이전 화면으로" aria-hidden={histLen===0} tabIndex={histLen>0?0:-1}>‹ 뒤로</button>
          <nav>
            {navItems.map(([k,l])=>(
              <button key={k} className={view===k?"on":""} onClick={()=>go(k)}>{l}</button>
            ))}
          </nav>
          <div className="top-right">
            {canEdit && !isLeader && <button className="backup-btn" onClick={doExport}>백업</button>}
            {isAdmin && <button className="backup-btn" onClick={()=>fileRef.current.click()}>가져오기</button>}
            {leaveChurch && <button className="backup-btn" onClick={leaveChurch} title="다른 교회로">교회 바꾸기</button>}
            <button className="backup-btn" onClick={logout}>{profile.name || "나"} · 로그아웃</button>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}}
              onChange={e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=""; }}/>
          </div>
        </div>
      </header>

      <div className="wrap">
        {err && <div className="err-banner">{err} <button className="btn sm ghost" onClick={loadAll}>다시 불러오기</button></div>}
        {!loaded ? <div className="panel empty">기록을 불러오는 중…</div> : <React.Fragment>
        {isLeader && <div className="panel" style={{padding:"12px 16px",marginBottom:12}}>
          <b>{myScopes.map(scopeLabel).join(" · ")}</b> 담당으로 접속 중입니다.
          <span className="muted small">
            {attOnly
              ? ` · 성도 ${attMembers.length}명의 예배 출석만 체크하실 수 있습니다. 교인 신상은 보이지 않습니다.`
              : myScopes.includes(ATT_ONLY)
              ? ` · 예배 출석은 ${attMembers.length}명 전체를 체크하시고, 교인 명단은 담당 ${myMembers.length}명만 보입니다.`
              : ` · ${myMembers.length}명의 신상을 보고 출석을 체크하실 수 있습니다.`}
            {isSchoolTeacher && " 담당 부서 학생의 정보는 직접 수정하실 수 있습니다."}</span>
        </div>}
        {view==="home" && <Home churchName={churchName} members={attOnly ? [] : myMembers} att={att} go={go} openMember={openMember}/>}
        {view==="members" && attOnly &&
          <p className="empty">예배 출석 체크만 맡으셨습니다. 교인 명부는 볼 수 없습니다.</p>}
        {view==="members" && !attOnly && (
          memView.mode==="list" ? <MemberList members={myMembers}
            setMemView={v=>{ pushHistory({view:"members", memView:{mode:"list"}}); setMemView(v); }} canEdit={canEdit}
            schoolClasses={schoolClasses} saveClasses={saveClasses}
            canEditClass={(deptKey)=> canEdit ||
              (isSchoolTeacher && listScopes.some(k => k==="S_ALL" || k==="S_"+deptKey))}/> :
          memView.mode==="form" && memView.id && !canEditMember(byId(memView.id))
            ? <div className="panel empty">이 교인의 정보는 수정할 수 없습니다.
                <div style={{marginTop:10}}><button className="btn sm" onClick={()=>setMemView({mode:"detail", id:memView.id})}>돌아가기</button></div>
              </div> :
          memView.mode==="form" && !memView.id && !canEdit
            ? <div className="panel empty">새 교인 등록은 관리자와 수정 권한이 있는 분만 할 수 있습니다.
                <div style={{marginTop:10}}><button className="btn sm" onClick={()=>setMemView({mode:"list"})}>돌아가기</button></div>
              </div> :
          memView.mode==="form" ? <MemberForm init={memView.id ? byId(memView.id) : null}
              onCancel={()=>setMemView(memView.id ? {mode:"detail", id:memView.id} : {mode:"list"})}
              onSave={(m)=>{ saveMemberRow(m); setMemView({mode:"detail", id:m.id}); }}/> :
          <MemberDetail m={viewMembers.find(x=>x.id===memView.id)} att={att} specials={specials}
            setMemView={v=>{ pushHistory({view:"members", memView}); setMemView(v); }}
            canEdit={canEdit || canEditMember(viewMembers.find(x=>x.id===memView.id))}
            canDelete={canEdit}
            allMembers={viewMembers} openMember={openMember} limited={isLeader}
            canPray={isLeader && !attOnly && myMembers.some(x=>x.id===memView.id)}
            meName={profile.name || profile.email} meId={profile.id}
            outside={isLeader && !myMembers.some(x=>x.id===memView.id)}
            update={fn=>updateMember(memView.id, fn)}
            remove={()=>{
              const m = byId(memView.id);
              if(confirm(`'${m.name}' 님의 모든 기록(가족·심방·기도 포함)을 삭제할까요?\n모든 사용자에게 함께 적용되며, 되돌릴 수 없습니다.`)){
                removeMember(memView.id);
                setMemView({mode:"list"});
              }
            }}/>
        )}
        {view==="att" && <Attendance members={attMembers} att={att} saveAtt={saveAtt} canEdit={canCheckAtt}
          schoolClasses={schoolClasses} specials={specials} saveSpecials={saveSpecials} isAdmin={isAdmin || canEdit}/>}
        {view==="visit" && (isLeader
          ? <p className="empty">심방 기록은 목회자와 관리자만 볼 수 있습니다.</p>
          : <Visits members={members} update={updateMember} openMember={openMember} canEdit={canEdit}
              meName={profile.name || profile.email} meId={profile.id}/>)}
        {view==="cal" && <Calendar members={members} events={events} saveEvents={saveEvents}
          canEdit={canEdit} openMember={openMember}/>}
        {view==="pray" && (isLeader
          ? <p className="empty">중보기도 전체 목록은 목회자와 관리자만 볼 수 있습니다. 담당 교인의 기도 제목은 그 교인 화면에서 보실 수 있습니다.</p>
          : <Prayers members={members} update={updateMember} openMember={openMember} canEdit={canEdit}
              meName={profile.name || profile.email} meId={profile.id}/>)}
        {view==="team" && isAdmin && <Team sb={sb} me={profile} leaders={leaders} saveLeaders={saveLeaders}
          churchId={churchId} joinCode={joinCode}/>}
        {view==="cfg" && isAdmin && <ChurchConfig key={cfgVer} saveConfig={saveConfig}/>}
        </React.Fragment>}

/* ───────── 사용자(승인) 관리 ───────── */
function Team({sb, me, leaders, saveLeaders, churchId, joinCode}){
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState("");

  const load = useCallback(async ()=>{
    const {data, error} = await sb.from("church_users")
      .select("user_id,role,name,email,created_at").eq("church_id", churchId).order("created_at");
    if(!error) data.forEach(r=>{ r.id = r.user_id; });
    if(error) setErr(errMsg(error)); else { setRows(data||[]); setErr(""); }
  }, [sb, churchId]);
  useEffect(()=>{ load(); }, [load]);

  const setRole = async (id, role) => {
    const {error} = await sb.from("church_users").update({role})
      .eq("church_id", churchId).eq("user_id", id);
    if(error) setErr(errMsg(error)); else load();
  };
  const removeUser = async (r) => {
    if(!confirm(`${r.name || r.email} 님을 목록에서 지울까요?\n\n이 프로그램의 권한만 사라집니다. 그 사람이 다시 들어오면 승인 대기로 다시 올라옵니다.`)) return;
    const {error} = await sb.from("church_users").delete()
      .eq("church_id", churchId).eq("user_id", r.id);
    if(error) setErr(errMsg(error)); else load();
  };

  const pending = (rows||[]).filter(r=>r.role==="pending");
  const active = (rows||[]).filter(r=>r.role!=="pending");

  return (
    <div>
      <div className="panel">
        {joinCode && <div className="join-code">
          <div>
            <span className="muted small">우리 교회 가입 코드</span>
            <b>{joinCode}</b>
          </div>
          <span className="muted small" style={{flex:"1 1 220px"}}>
            교역자·속장님께 이 코드를 알려 주세요. 주소로 들어와 <b>가입 코드로 신청</b>에 넣으면 아래 승인 대기에 올라옵니다.</span>
          <button className="btn sm ghost" onClick={()=>{
            try{ navigator.clipboard.writeText(joinCode); alert("가입 코드를 복사했습니다."); }
            catch(_){ alert("가입 코드: " + joinCode); }
          }}>복사</button>
        </div>}
        <h2>승인 대기 <span className="muted small">{pending.length}명</span></h2>
        <p className="small muted"><b>우리 교회 가입 코드</b>를 넣고 신청한 분만 여기 올라옵니다.
          모르는 사람이면 <b>거절</b>로 지우세요. 속장·교사는 출석을 저장해야 하므로
          <b>수정 허용</b>으로 승인한 뒤, 아래 표에서 <b>담당</b>을 정해 주세요.</p>
        {err && <div className="err-banner">{err}</div>}
        {rows===null ? <p className="empty">불러오는 중…</p> :
         pending.length===0 ? <p className="empty">승인을 기다리는 사람이 없습니다.</p> :
          <div className="tbl-wrap"><table>
            <thead><tr><th>이름</th><th>이메일</th><th>신청일</th><th></th></tr></thead>
            <tbody>{pending.map(r=>(
              <tr key={r.id}>
                <td>{r.name || <span className="muted">이름 없음</span>}</td>
                <td>{r.email}</td>
                <td>{(r.created_at||"").slice(0,10)}</td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn sm ghost" onClick={()=>setRole(r.id,"viewer")}>열람 허용</button>{" "}
                  <button className="btn sm gold" onClick={()=>setRole(r.id,"editor")}>수정 허용</button>{" "}
                  <button className="btn sm danger" onClick={()=>removeUser(r)}>거절</button>
                </td>
              </tr>))}
            </tbody></table></div>}
      </div>

      <div className="panel">
        <h2>사용 중인 구성원 <span className="muted small">{active.length}명</span></h2>
        <p className="small muted"><b>담당</b>을 정하면 그분은 그 범위만 보게 됩니다. <b>없음</b>이면 전체를 봅니다.<br/>
          · <b>속 하나</b> — 그 속 교인의 신상 보기와 출석 체크 (다른 속·심방은 안 보임)<br/>
          · <b>속 전체 / 교회학교 전체</b> — 어른 전부 또는 유치부~청년부 전부. 속회장·교회학교 부장께 알맞습니다<br/>
          · <b>교회학교 부서</b> — 담당 부서 학생의 정보는 직접 수정도 됩니다<br/>
          · <b>예배 출석 체크만</b> — 출석만 체크하고 교인 신상은 전혀 못 봅니다. 예배 안내위원께 알맞습니다<br/>
          한 사람에게 <b>여러 담당</b>을 줄 수도 있습니다(예: 중고등부 + 여자 7속).</p>
        {rows!==null &&
          <div className="tbl-wrap"><table>
            <thead><tr><th>이름</th><th>이메일</th><th>권한</th><th>담당 속(속장)</th><th></th></tr></thead>
            <tbody>{active.map(r=>(
              <tr key={r.id}>
                <td className="nw">{r.name || <span className="muted">이름 없음</span>}{r.id===me.id && " (나)"}</td>
                <td className="nw">{r.email}</td>
                <td className="nw"><span className={"chip "+r.role}>{ROLE_LABEL[r.role]||r.role}</span>
                  {scopesOf(leaders, r.id).length>0 && r.role!=="admin" && <span className="chip editor" style={{marginLeft:4}}>속장·교사</span>}</td>
                <td className="scope-col">
                  {r.role==="admin" ? <span className="muted small">관리자는 전체를 봅니다</span> :
                    <React.Fragment>
                      {scopesOf(leaders, r.id).map(k=>(
                        <span key={k} className="scope-row">
                          <span className="chip editor">{scopeLabel(k)}</span>
                          <button className="btn sm ghost" style={{padding:"0 7px"}}
                            title="이 담당 빼기"
                            onClick={()=>{
                              const next = {...(leaders||{})};
                              const left = scopesOf(leaders, r.id).filter(x=>x!==k);
                              if(left.length) next[r.id] = left; else delete next[r.id];
                              saveLeaders(next);
                            }}>✕</button>
                        </span>))}
                      <select value="" onChange={e=>{
                        if(!e.target.value) return;
                        const cur = scopesOf(leaders, r.id);
                        if(cur.includes(e.target.value)) return;
                        saveLeaders({...(leaders||{}), [r.id]: [...cur, e.target.value]});
                      }}>
                        <option value="">＋ 담당 추가…</option>
                        {SCOPE_LIST().filter(([k])=>!scopesOf(leaders, r.id).includes(k))
                          .map(([k,l])=><option key={k} value={k}>{l}</option>)}
                      </select>
                      {scopesOf(leaders, r.id).length===0 &&
                        <div className="muted small">담당 없음 — 전체를 봅니다</div>}
                    </React.Fragment>}
                </td>
                <td style={{whiteSpace:"nowrap"}}>
                  {r.id!==me.id && <React.Fragment>
                    {r.role!=="viewer" &&
                      <button className="btn sm ghost" onClick={()=>setRole(r.id,"viewer")}>열람만</button>}{" "}
                    {r.role!=="editor" &&
                      <button className="btn sm ghost" onClick={()=>setRole(r.id,"editor")}>수정 가능</button>}{" "}
                    {r.role!=="admin" &&
                      <button className="btn sm ghost" onClick={()=>{
                        if(confirm(`${r.name||r.email} 님을 관리자로 지정할까요? 관리자는 사용자 승인 권한도 갖게 됩니다.`)) setRole(r.id,"admin");
                      }}>관리자로</button>}{" "}
                    <button className="btn sm danger" onClick={()=>{
                      if(confirm(`${r.name||r.email} 님의 접근 권한을 해제할까요? 다시 승인하기 전까지 교인 기록을 볼 수 없게 됩니다.`)) setRole(r.id,"pending");
                    }}>권한 해제</button>{" "}
                    <button className="btn sm danger" onClick={()=>removeUser(r)}>목록에서 지우기</button>
                  </React.Fragment>}
                  {r.id===me.id && <span className="muted small">본인 권한은 바꿀 수 없습니다</span>}
                </td>
              </tr>))}
            </tbody></table></div>}
      </div>
    </div>
  );
}

/* ───────── 대문 ───────── */
function Home({churchName, members, att, go, openMember}){
  const thisMonth = new Date().getMonth()+1;
  const birthdays = members
    .filter(m => m.birth && Number(m.birth.split("-")[1]) === thisMonth)
    .sort((a,b)=> a.birth.slice(5).localeCompare(b.birth.slice(5)));

  const lastSunday = useMemo(()=>{
    const dates = Object.keys(att).filter(d => (att[d].sun||[]).length).sort();
    return dates.length ? dates[dates.length-1] : null;
  }, [att]);
  const sunCount = lastSunday ? att[lastSunday].sun.length : 0;
